<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Heatmap v1.2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="signos-core.js"></script>

<script src="logic_yard.js"></script>
<script src="logic_acm.js"></script>
<script src="logic_coro.js"></script>
<script src="logic_foam.js"></script>
<script src="logic_decal.js"></script>
<script src="logic_cut.js"></script>
<script src="logic_wrap.js"></script>
<script src="logic_banner.js"></script>
<script src="logic_pvc.js"></script>

<style type="text/tailwindcss">
/* Custom Scrollbars */
.custom-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f8fafc; }
.custom-scroll::-webkit-scrollbar { width: 6px; height: 8px; }
.custom-scroll::-webkit-scrollbar-track { background: #f8fafc; }
.custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

/* Sticky Left Column */
.sticky-col { position: sticky; left: 0; z-index: 10; background-color: #f8fafc; border-right: 2px solid #e5e7eb; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
.sticky-header { position: sticky; top: 0; z-index: 20; background-color: #f1f5f9; border-bottom: 2px solid #e5e7eb; }
.z-30-corner { z-index: 30 !important; }

/* Segmented Control */
.seg-btn { @apply flex-1 py-1.5 text-center text-[10px] font-black uppercase tracking-widest cursor-pointer transition-colors duration-300 ease-out select-none z-10 flex items-center justify-center; }
.seg-active { @apply text-blue-700; }
.seg-inactive { @apply text-slate-500 hover:text-slate-800; }
</style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans overflow-hidden">

<div id="main-card" class="flex-1 flex flex-col min-h-0 bg-white m-4 rounded-xl shadow-2xl border border-gray-300 overflow-hidden">
    
    <div class="bg-gray-900 px-4 py-3 flex flex-col md:flex-row md:items-center justify-between gap-4 shrink-0 z-40">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-gray-800 p-1 rounded-lg border border-gray-700 shadow-inner">
                <span class="text-[10px] font-bold text-gray-400 uppercase ml-2 tracking-widest">Product:</span>
                <select id="sim-module" class="bg-gray-900 text-white border border-gray-600 rounded p-1 text-xs font-bold outline-none cursor-pointer focus:border-blue-500 transition" onchange="loadModuleData()">
                    <option value="YARD">Yard Signs</option>
                    <option value="CORO">Custom Coroplast</option>
                    <option value="ACM">ACM Signs</option>
                    <option value="PVC">PVC Signs</option>
                    <option value="FOAM">Foam Core</option>
                </select>
            </div>
            <div id="loader" class="hidden items-center gap-2 text-yellow-400 text-[10px] font-bold uppercase tracking-widest animate-pulse">
                <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Processing Loop...
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="relative flex bg-gray-800 p-1 rounded-lg border border-gray-700 shadow-inner w-full sm:w-60 shrink-0 overflow-hidden">
                <div id="slider-pill" class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-white rounded shadow border border-slate-200/50 transition-transform duration-300 ease-out z-0 translate-x-0"></div>
                <div onclick="setViewMode('margin')" id="btn-mode-margin" class="seg-btn seg-active">Margin %</div>
                <div onclick="setViewMode('profit')" id="btn-mode-profit" class="seg-btn seg-inactive">Unit Profit $</div>
            </div>
            
            <button onclick="runAnalysis()" id="btn-run" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-1.5 rounded shadow transition text-[10px] uppercase tracking-widest">
                Run Analysis
            </button>
        </div>
    </div>

    <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex flex-wrap justify-center sm:justify-start gap-4 text-[9px] font-bold text-gray-500 uppercase tracking-widest shrink-0 shadow-sm z-30">
        <span class="mr-2 text-gray-400">HEATMAP SCALE:</span>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-red-600 rounded-sm shadow-inner"></span> Loss (&lt; 0%)</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-red-400 rounded-sm shadow-inner"></span> Danger (0 - 49%)</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-yellow-400 rounded-sm shadow-inner"></span> Warning (50 - 64%)</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-green-400 rounded-sm shadow-inner"></span> Target (65 - 74%)</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-green-600 rounded-sm shadow-inner"></span> Optimal (75%+)</div>
    </div>

    <div id="insights-panel" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-slate-50 border-b border-gray-200 shrink-0 z-20">
        <div class="bg-white p-3 rounded-lg shadow-sm border border-green-200 flex flex-col justify-center">
            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Highest Margin Sweet Spot</span>
            <div id="insight-best" class="text-sm font-black text-green-700 leading-tight">--</div>
            <div id="insight-best-sub" class="text-xs text-gray-500 mt-1">--</div>
        </div>
        <div class="bg-white p-3 rounded-lg shadow-sm border border-red-200 flex flex-col justify-center">
            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Danger Zone (Lowest Margin)</span>
            <div id="insight-worst" class="text-sm font-black text-red-600 leading-tight">--</div>
            <div id="insight-worst-sub" class="text-xs text-gray-500 mt-1">--</div>
        </div>
        <div class="bg-white p-3 rounded-lg shadow-sm border border-orange-200 flex flex-col justify-center">
            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Steepest Pricing Cliff</span>
            <div id="insight-cliff" class="text-sm font-black text-orange-600 leading-tight">--</div>
            <div id="insight-cliff-sub" class="text-xs text-gray-500 mt-1">--</div>
        </div>
    </div>

    <div class="flex-1 overflow-auto custom-scroll relative bg-white pb-10">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr id="heatmap-header"></tr>
            </thead>
            <tbody id="heatmap-body" class="divide-y divide-gray-100"></tbody>
        </table>
        
        <div id="empty-state" class="absolute inset-0 flex items-center justify-center bg-white z-10">
            <div class="text-center text-gray-400 text-sm font-bold uppercase tracking-widest opacity-50">Select a product to begin analysis</div>
        </div>
    </div>

</div>

<script>
let currentBackend = {};
let currentViewMode = 'margin'; 
let analysisData = []; 

// THE X-AXIS: Realistic Production Quantities to test profit cliffs
const TEST_QUANTITIES = [1, 5, 10, 25, 50, 100, 250, 500];

// THE Y-AXIS: Product Configurations to recursively test
const MODULE_MATRICES = {
    'YARD': {
        tab: 'PROD_Yard_Signs',
        engine: typeof calculateYardSign !== 'undefined' ? calculateYardSign : null,
        configs: [
            { label: '24x18 Single Sided (No Stakes)', inputs: { sides: 1, hasStakes: false } },
            { label: '24x18 Single Sided (w/ Stakes)', inputs: { sides: 1, hasStakes: true } },
            { label: '24x18 Double Sided (No Stakes)', inputs: { sides: 2, hasStakes: false } },
            { label: '24x18 Double Sided (w/ Stakes)', inputs: { sides: 2, hasStakes: true } }
        ]
    },
    'CORO': {
        tab: 'PROD_Coroplast_Signs',
        engine: typeof calculateCoro !== 'undefined' ? calculateCoro : null,
        configs: [
            { label: '18x12 4mm Single Sided', inputs: { w: 18, h: 12, thickness: '4mm', sides: 1 } },
            { label: '24x18 4mm Single Sided', inputs: { w: 24, h: 18, thickness: '4mm', sides: 1 } },
            { label: '24x18 4mm Double Sided', inputs: { w: 24, h: 18, thickness: '4mm', sides: 2 } },
            { label: '36x24 4mm Single Sided', inputs: { w: 36, h: 24, thickness: '4mm', sides: 1 } },
            { label: '96x48 4mm Single Sided (Full Sht)', inputs: { w: 96, h: 48, thickness: '4mm', sides: 1 } },
            { label: '96x48 10mm Single Sided (Full Sht)', inputs: { w: 96, h: 48, thickness: '10mm', sides: 1 } },
            { label: '96x48 10mm Double Sided', inputs: { w: 96, h: 48, thickness: '10mm', sides: 2 } }
        ]
    },
    'ACM': {
        tab: 'PROD_ACM_Signs',
        engine: typeof calculateACM !== 'undefined' ? calculateACM : null,
        configs: [
            { label: '18x12 3mm White (Shear)', inputs: { w: 18, h: 12, thickness: '3mm', sides: 1, color: 'White', shape: 'Rectangle', rounded: false, files: 1, incDesign: false, setupPerFile: false } },
            { label: '24x18 3mm White (Shear)', inputs: { w: 24, h: 18, thickness: '3mm', sides: 1, color: 'White', shape: 'Rectangle', rounded: false, files: 1, incDesign: false, setupPerFile: false } },
            { label: '36x24 3mm White (CNC Contour)', inputs: { w: 36, h: 24, thickness: '3mm', sides: 1, color: 'White', shape: 'Complex', rounded: false, files: 1, incDesign: false, setupPerFile: false } },
            { label: '96x48 3mm White (Shear)', inputs: { w: 96, h: 48, thickness: '3mm', sides: 1, color: 'White', shape: 'Rectangle', rounded: false, files: 1, incDesign: false, setupPerFile: false } },
            { label: '96x48 3mm Double Sided', inputs: { w: 96, h: 48, thickness: '3mm', sides: 2, color: 'White', shape: 'Rectangle', rounded: false, files: 1, incDesign: false, setupPerFile: false } },
            { label: '96x48 6mm Heavy Duty', inputs: { w: 96, h: 48, thickness: '6mm', sides: 1, color: 'White', shape: 'Rectangle', rounded: false, files: 1, incDesign: false, setupPerFile: false } }
        ]
    },
    'PVC': {
        tab: 'PROD_PVC_Signs',
        engine: typeof calculatePVC !== 'undefined' ? calculatePVC : null,
        configs: [
            { label: '24x18 3mm Single Sided', inputs: { w: 24, h: 18, thickness: '3mm', sides: 1, shape: 'Rectangle', rounded: false, files: 1, incDesign: false } },
            { label: '36x24 3mm CNC Contour', inputs: { w: 36, h: 24, thickness: '3mm', sides: 1, shape: 'Complex', rounded: false, files: 1, incDesign: false } },
            { label: '96x48 6mm Single Sided', inputs: { w: 96, h: 48, thickness: '6mm', sides: 1, shape: 'Rectangle', rounded: false, files: 1, incDesign: false } }
        ]
    },
    'FOAM': {
        tab: 'PROD_Foam_Signs',
        engine: typeof calculateFoam !== 'undefined' ? calculateFoam : null,
        configs: [
            { label: '24x18 3/16" Single Sided', inputs: { w: 24, h: 18, sides: 1, files: 1, incDesign: false } },
            { label: '36x24 3/16" Single Sided', inputs: { w: 36, h: 24, sides: 1, files: 1, incDesign: false } },
            { label: '96x48 3/16" Double Sided', inputs: { w: 96, h: 48, sides: 2, files: 1, incDesign: false } }
        ]
    }
};

window.onload = function() {
    if(typeof injectHeader === 'function') injectHeader("Profit Heatmap Analytics", false);
    loadModuleData(); 
};

function setViewMode(mode) {
    currentViewMode = mode;
    const btnMargin = document.getElementById('btn-mode-margin');
    const btnProfit = document.getElementById('btn-mode-profit');
    const pill = document.getElementById('slider-pill');

    const activeClass = "flex-1 py-1.5 text-center text-[10px] font-black uppercase tracking-widest cursor-pointer transition-colors duration-300 ease-out select-none z-10 flex items-center justify-center text-blue-700";
    const inactiveClass = "flex-1 py-1.5 text-center text-[10px] font-black uppercase tracking-widest cursor-pointer transition-colors duration-300 ease-out select-none z-10 flex items-center justify-center text-slate-500 hover:text-slate-800";

    if (mode === 'margin') {
        btnMargin.className = activeClass;
        btnProfit.className = inactiveClass;
        pill.style.transform = "translateX(0)";
    } else {
        btnProfit.className = activeClass;
        btnMargin.className = inactiveClass;
        pill.style.transform = "translateX(100%)";
    }
    
    if (analysisData.length > 0) renderHeatmap();
}

async function loadModuleData() {
    const modKey = document.getElementById('sim-module').value;
    const matrixDef = MODULE_MATRICES[modKey];
    if (!matrixDef) return;

    document.getElementById('empty-state').classList.add('hidden');
    document.getElementById('loader').classList.replace('hidden', 'flex');
    document.getElementById('btn-run').disabled = true;

    try {
        const apiUrl = typeof SCRIPT_URL !== 'undefined' ? SCRIPT_URL : "https://script.google.com/macros/s/AKfycbzEEf1lQ4xkXdSqcLgfLJ3FmNbLGUyElTzmac7U-t1msxLvJL8iSZ30R3bm5dCpmlKqPA/exec";
        const u = sessionStorage.getItem('signos_user') || 'Admin';
        
        const res = await fetch(`${apiUrl}?req=view_module&tab=${matrixDef.tab}&user=${u}`);
        const data = await res.json();
        
        if(data.error) throw new Error(data.error);
        currentBackend = data;

        const statusText = document.getElementById("status-text");
        const statusDot = document.getElementById("status-dot");
        if(statusText) {
            statusText.innerText = "ONLINE";
            statusText.className = "text-xs font-bold text-green-500";
        }
        if(statusDot) {
            statusDot.className = "w-2 h-2 rounded-full bg-green-500";
            statusDot.classList.remove("animate-pulse");
        }

        runAnalysis();

    } catch (e) {
        console.error(e);
        alert("Load Error: " + e.message);
        document.getElementById('loader').classList.replace('flex', 'hidden');

        const statusText = document.getElementById("status-text");
        const statusDot = document.getElementById("status-dot");
        if(statusText) {
            statusText.innerText = "OFFLINE";
            statusText.className = "text-xs font-bold text-red-500";
        }
        if(statusDot) statusDot.className = "w-2 h-2 rounded-full bg-red-500";
    }
}

function runAnalysis() {
    const modKey = document.getElementById('sim-module').value;
    const matrixDef = MODULE_MATRICES[modKey];
    
    document.getElementById('loader').classList.replace('hidden', 'flex');
    analysisData = [];

    if(!matrixDef.engine) {
        alert(`Error: The logic engine for ${modKey} could not be found. Check your <script> tags.`);
        document.getElementById('loader').classList.replace('flex', 'hidden');
        return;
    }

    setTimeout(() => {
        matrixDef.configs.forEach(config => {
            const rowResults = { label: config.label, data: {} };
            
            TEST_QUANTITIES.forEach(q => {
                let inputs = { ...config.inputs, qty: q };
                
                try {
                    const result = matrixDef.engine(inputs, currentBackend);
                    
                    const r = result.retail;
                    const c = result.cost || result.inHouse;
                    const retailTotal = typeof r === 'number' ? r : (r?.grandTotal || r?.quoteTotal || r?.total || r?.printBase || 0);
                    const costTotal = typeof c === 'number' ? c : (c?.grandTotal || c?.total || c?.quoteTotal || c?.printBase || 0);
                    
                    const uRet = retailTotal / q;
                    const uCost = costTotal / q;
                    const margin = uRet > 0 ? ((uRet - uCost) / uRet) * 100 : 0;
                    const profit = uRet - uCost;
                    
                    rowResults.data[q] = { margin: margin, profit: profit, retail: uRet, cost: uCost };

                } catch (e) {
                    console.error("Engine Error: ", e);
                    rowResults.data[q] = { margin: 0, profit: 0, retail: 0, cost: 0, error: true };
                }
            });
            analysisData.push(rowResults);
        });

        renderHeatmap();
        generateInsights(); // <--- Automated Insights Triggered Here
        document.getElementById('loader').classList.replace('flex', 'hidden');
        document.getElementById('btn-run').disabled = false;
    }, 100);
}

function getHeatmapColor(marginPct) {
    if (marginPct < 0) return "bg-red-600 text-white font-bold border-red-700";
    if (marginPct < 50) return "bg-red-400 text-white font-bold border-red-500";
    if (marginPct < 65) return "bg-yellow-400 text-yellow-900 font-bold border-yellow-500";
    if (marginPct < 75) return "bg-green-400 text-green-900 font-bold border-green-500";
    return "bg-green-600 text-white font-black border-green-700";
}

function renderHeatmap() {
    const thead = document.getElementById('heatmap-header');
    const tbody = document.getElementById('heatmap-body');
    
    let headHTML = `<th class="p-4 sticky-col z-30-corner bg-slate-100 text-slate-700 w-64 border-b border-slate-200">Configuration</th>`;
    TEST_QUANTITIES.forEach(q => {
        headHTML += `<th class="p-4 sticky-header text-center w-24 border-l border-slate-200">Qty ${q}</th>`;
    });
    thead.innerHTML = headHTML;

    let bodyHTML = "";
    analysisData.forEach(row => {
        bodyHTML += `<tr>`;
        bodyHTML += `<td class="p-3 sticky-col bg-white text-xs font-bold text-gray-800 border-r border-slate-200 shadow-[2px_0_4px_rgba(0,0,0,0.02)] whitespace-nowrap">${row.label}</td>`;
        
        TEST_QUANTITIES.forEach(q => {
            const cell = row.data[q];
            
            if (cell.error) {
                bodyHTML += `<td class="p-3 text-center border-l border-white bg-gray-200 text-gray-400 text-[10px]">ERR</td>`;
                return;
            }

            const isMargin = currentViewMode === 'margin';
            const displayVal = isMargin ? `${cell.margin.toFixed(0)}%` : `$${cell.profit.toFixed(2)}`;
            const colorClass = getHeatmapColor(cell.margin); 
            
            const subText = isMargin ? `$${cell.retail.toFixed(2)} ea` : `${cell.margin.toFixed(0)}%`;

            bodyHTML += `
                <td class="p-2 border-l border-white ${colorClass} transition-opacity hover:opacity-80 cursor-default" title="Retail: $${cell.retail.toFixed(2)} | Cost: $${cell.cost.toFixed(2)}">
                    <div class="flex flex-col items-center justify-center">
                        <span class="text-sm tracking-tight">${displayVal}</span>
                        <span class="text-[9px] opacity-80 font-normal mt-0.5">${subText}</span>
                    </div>
                </td>`;
        });
        bodyHTML += `</tr>`;
    });
    
    tbody.innerHTML = bodyHTML;
}

function generateInsights() {
    if (analysisData.length === 0) return;

    let bestCell = { margin: -Infinity, label: '', qty: 0 };
    let worstCell = { margin: Infinity, label: '', qty: 0 };
    let maxCliff = { drop: 0, label: '', fromQty: 0, toQty: 0 };

    analysisData.forEach(row => {
        let prevMargin = null;
        let prevQty = null;

        TEST_QUANTITIES.forEach(q => {
            const cell = row.data[q];
            if (!cell || cell.error) return;

            // Track Best Margin
            if (cell.margin > bestCell.margin) {
                bestCell = { margin: cell.margin, label: row.label, qty: q, profit: cell.profit };
            }

            // Track Worst Margin
            if (cell.margin < worstCell.margin) {
                worstCell = { margin: cell.margin, label: row.label, qty: q, profit: cell.profit };
            }

            // Track Pricing Cliffs
            if (prevMargin !== null) {
                const drop = prevMargin - cell.margin;
                if (drop > maxCliff.drop) {
                    maxCliff = { drop: drop, label: row.label, fromQty: prevQty, toQty: q };
                }
            }
            
            prevMargin = cell.margin;
            prevQty = q;
        });
    });

    document.getElementById('insights-panel').classList.remove('hidden');
    document.getElementById('insight-best').innerText = `${bestCell.label} (Qty ${bestCell.qty})`;
    document.getElementById('insight-best-sub').innerText = `${bestCell.margin.toFixed(1)}% Margin | $${bestCell.profit.toFixed(2)} Profit/Ea`;
    document.getElementById('insight-worst').innerText = `${worstCell.label} (Qty ${worstCell.qty})`;
    document.getElementById('insight-worst-sub').innerText = `${worstCell.margin.toFixed(1)}% Margin | $${worstCell.profit.toFixed(2)} Profit/Ea`;

    if (maxCliff.drop > 0) {
        document.getElementById('insight-cliff').innerText = `${maxCliff.label}`;
        document.getElementById('insight-cliff-sub').innerText = `Drops ${maxCliff.drop.toFixed(1)}% when moving from Qty ${maxCliff.fromQty} to ${maxCliff.toQty}`;
    } else {
        document.getElementById('insight-cliff').innerText = "No significant cliffs detected.";
        document.getElementById('insight-cliff-sub').innerText = "Margins scale linearly.";
    }
}
</script>
</body>
</html>
