<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Heatmap v4.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>

    <!-- LOAD ALL PHYSICS ENGINES -->
    <script src="cost_yard.js"></script>
    <script src="cost_coro.js"></script>
    <script src="cost_pvc.js"></script>
    <script src="cost_foam.js"></script>
    <script src="cost_banner.js"></script>
    <script src="cost_acm.js"></script>
    <script src="cost_acrylic.js"></script>
    <script src="cost_cut.js"></script>
    <script src="cost_decal.js"></script>
    <script src="cost_wrap.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

<div class="w-full max-w-5xl mx-auto px-4 py-6">
    <div class="mb-6 flex flex-col md:flex-row justify-between items-end gap-4">
        <div>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">Profit <span class="text-orange-500">Heatmap</span></h1>
            <p class="text-gray-400 text-xs font-bold uppercase tracking-wide mt-1">Recursive Recursive Engine Tester</p>
        </div>
        <div class="w-full md:w-64">
            <select id="module-selector" onchange="runHeatmap()" class="w-full border-2 border-orange-200 p-2 rounded-lg bg-white font-bold text-orange-800 shadow-sm focus:outline-none focus:border-orange-500 cursor-pointer">
                <option value="">Select a Module to Analyze...</option>
            </select>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden flex flex-col">
        <div class="bg-gray-900 text-white p-3 border-b border-gray-800 flex justify-between items-center">
            <h3 class="text-xs font-black uppercase tracking-widest">Pricing Matrix (70% Target Margin)</h3>
            <div class="flex gap-4 text-[10px] font-bold">
                <span class="flex items-center gap-1"><span class="w-3 h-3 bg-green-100 border border-green-300 rounded inline-block"></span> Healthy</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 bg-red-100 border border-red-300 rounded inline-block"></span> Loss Alert</span>
            </div>
        </div>
        
        <div class="p-6 overflow-x-auto" id="heatmap-container">
            <div class="text-center py-20 text-gray-300 font-bold uppercase tracking-widest text-xs">
                Select a module to run millions of recursive combinations.
            </div>
        </div>
        
        <div class="bg-gray-50 border-t border-gray-200 p-3 text-[10px] text-gray-400 font-bold uppercase tracking-widest text-center">
            Top Number = Margin % | Bottom Number = Unit Retail Price
        </div>
    </div>
</div>

<script>
    const ALL_MODULES = [
        { id: 'yard', name: 'Yard Signs', config: window.YARD_CONFIG },
        { id: 'coro', name: 'Custom Coroplast', config: window.CORO_CONFIG },
        { id: 'pvc', name: 'PVC Signs', config: window.PVC_CONFIG },
        { id: 'foam', name: 'Foam Core', config: window.FOAM_CONFIG },
        { id: 'acm', name: 'ACM Signs', config: window.ACM_CONFIG },
        { id: 'acrylic', name: 'Acrylic Signs', config: window.ACRYLIC_CONFIG },
        { id: 'banner', name: 'Vinyl Banners', config: window.BANNER_CONFIG },
        { id: 'cut', name: 'Cut Vinyl', config: window.CUT_CONFIG },
        { id: 'decal', name: 'Decals & Stickers', config: window.DECAL_CONFIG },
        { id: 'wrap', name: 'Vehicle Wraps', config: window.WRAP_CONFIG }
    ];
    
    const MODULES = ALL_MODULES.filter(m => m.config);
    
    // Matrix Axes
    const SIZES = [
        { w:12, h:18, l:"12 x 18" },
        { w:18, h:24, l:"18 x 24" },
        { w:24, h:24, l:"24 x 24" },
        { w:24, h:36, l:"24 x 36" },
        { w:48, h:48, l:"48 x 48" },
        { w:48, h:96, l:"48 x 96" }
    ];
    const QTYS = [1-8];

    window.onload = () => {
        injectHeader("Profit Heatmap");
        const sel = document.getElementById('module-selector');
        MODULES.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id; opt.innerText = m.name;
            sel.appendChild(opt);
        });
    };

    function runHeatmap() {
        const val = document.getElementById('module-selector').value;
        if(!val) return;
        
        const activeConfig = MODULES.find(m => m.id === val).config;
        
        // Pass empty data so the physics engine triggers its hardcoded 
        // internal fallback defaults (`||`) for a rapid baseline test
        const mockBackend = {}; 

        let html = '<table class="w-full border-collapse border border-gray-200"><thead class="bg-gray-100"><tr><th class="p-3 border border-gray-200 text-[10px] font-black text-gray-500 uppercase tracking-widest text-left">Size \\ Qty</th>';
        QTYS.forEach(q => html += `<th class="p-3 border border-gray-200 text-xs font-black text-gray-800 text-center">${q}</th>`);
        html += '</tr></thead><tbody>';

        SIZES.forEach(size => {
            html += `<tr><td class="p-3 border border-gray-200 text-[10px] font-black text-gray-700 bg-gray-50 whitespace-nowrap uppercase tracking-widest">${size.l}</td>`;
            
            QTYS.forEach(q => {
                let inputs = { w: size.w, h: size.h, qty: q };
                
                // Pre-fill required inputs with standard Config defaults
                if (activeConfig.controls) {
                    activeConfig.controls.forEach(c => {
                        if (inputs[c.id] === undefined && c.def !== undefined) {
                            inputs[c.id] = c.def;
                        }
                    });
                }
                
                if (typeof activeConfig.dynamicUI === 'function') inputs = activeConfig.dynamicUI(inputs);

                // Run the math!
                const res = activeConfig.engine(inputs, mockBackend);
                
                if (!res || !res.retail) {
                    html += `<td class="p-2 border border-gray-200 text-center bg-gray-100 text-gray-400 text-[8px] font-bold">N/A</td>`;
                    return;
                }

                const margin = res.metrics ? res.metrics.margin : 0;
                const mPct = (margin * 100).toFixed(1) + '%';
                const unit = res.retail ? res.retail.unitPrice.toFixed(2) : 0;
                
                const isFail = margin < 0.70; // 70% Target Margin limit
                const bgClass = isFail ? 'bg-red-50 text-red-700 hover:bg-red-100' : 'bg-green-50 text-green-700 hover:bg-green-100';

                html += `<td class="p-2 border border-gray-200 text-center cursor-crosshair transition ${bgClass}" title="Total Cost: $${(res.cost.total/q).toFixed(2)} ea">
                    <div class="text-[11px] font-black">${mPct}</div>
                    <div class="text-[9px] text-gray-500 font-mono opacity-80">$${unit}</div>
                </td>`;
            });
            html += '</tr>';
        });
        
        html += '</tbody></table>';
        document.getElementById('heatmap-container').innerHTML = html;
    }
</script>
</body>
</html>
