<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Wraps Retail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="logic_wrap.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .panel-scroll::-webkit-scrollbar { width: 4px; }
        .panel-scroll::-webkit-scrollbar-track { background: #f8fafc; }
        .panel-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

<!-- Main Card: Island Mode -->
<div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">

    <!-- INPUTS -->
    <div class="p-6 space-y-4">
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Fleet Qty</label>
                <input type="number" id="qty" value="1" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none" oninput="runCalc()">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Include Installation?</label>
                <select id="install" class="w-full border p-2 rounded bg-white font-bold text-sm h-[46px] focus:border-blue-500 outline-none" onchange="runCalc()">
                    <option value="No">No (Print Only)</option>
                    <option value="Yes">Yes (Add Labor)</option>
                </select>
            </div>
        </div>

        <div class="border-t border-gray-200 my-2"></div>

        <!-- DYNAMIC PANEL BUILDER -->
        <div>
            <div class="flex justify-between items-end mb-2">
                <label class="block text-[10px] font-black text-gray-600 uppercase tracking-widest">Vehicle Areas</label>
                <button onclick="addPanel()" class="text-[10px] font-bold bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded hover:bg-blue-600 hover:text-white transition">+ ADD AREA</button>
            </div>
            
            <div id="panel-container" class="space-y-3 max-h-64 overflow-y-auto panel-scroll pr-1">
                <!-- Panels injected here -->
            </div>
        </div>
    </div>

    <!-- RESULTS -->
    <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
        <div class="flex justify-between items-end mb-2">
            <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
            <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
        </div>
        
        <div class="border-t border-blue-200/50 my-3"></div>

        <!-- LINE ITEMS -->
        <div class="space-y-1 text-xs text-blue-900/70 pt-1">
            <div class="flex justify-between"><span>Printed Graphics (<span id="lbl-sqft">0</span> sqft):</span><span id="ui-print" class="font-bold">$0.00</span></div>
            <div class="flex justify-between text-orange-700 hidden" id="row-install"><span>Installation Labor:</span><span id="ui-install" class="font-bold">$0.00</span></div>
        </div>

        <div class="flex justify-between items-end border-t-2 border-blue-800 my-3 pt-2">
            <div>
                <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Minimum: $150</span>
                <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
            </div>
            <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
        </div>
    </div>

    <!-- DESCRIPTION GENERATOR -->
    <div class="bg-gray-50 p-4 border-t border-gray-200">
        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
        <textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-24 text-gray-600 font-mono outline-none" readonly></textarea>
    </div>

</div>

<script>
let backendData = {};

// DYNAMIC PANEL STATE
let panels = [
    { id: Date.now(), label: 'Driver Side', w: 120, h: 60, material: 'wrap', included: false }
];

function renderPanels() {
    const container = document.getElementById('panel-container');
    container.innerHTML = '';
    
    panels.forEach((p, index) => {
        const isOnly = panels.length === 1;
        const isPerf = p.material === 'perf';
        
        container.innerHTML += `
        <div class="flex flex-col gap-2 bg-white p-2 rounded shadow-sm border ${isPerf ? 'border-indigo-200 bg-indigo-50/30' : 'border-gray-200'}">
            <div class="flex items-end gap-2">
                <div class="flex-1">
                    <label class="block text-[8px] font-bold text-gray-400 uppercase mb-0.5">Area Name</label>
                    <input type="text" value="${p.label}" onchange="updatePanel(${p.id}, 'label', this.value)" class="w-full border-b border-gray-200 bg-transparent text-xs font-bold text-gray-700 outline-none focus:border-blue-500 pb-1">
                </div>
                <div class="w-14">
                    <label class="block text-[8px] font-bold text-gray-400 uppercase mb-0.5 text-center">W (in)</label>
                    <input type="number" value="${p.w}" oninput="updatePanel(${p.id}, 'w', this.value)" class="w-full border p-1 rounded text-xs font-bold text-gray-700 outline-none text-center focus:border-blue-500 bg-gray-50">
                </div>
                <div class="w-14">
                    <label class="block text-[8px] font-bold text-gray-400 uppercase mb-0.5 text-center">H (in)</label>
                    <input type="number" value="${p.h}" oninput="updatePanel(${p.id}, 'h', this.value)" class="w-full border p-1 rounded text-xs font-bold text-gray-700 outline-none text-center focus:border-blue-500 bg-gray-50">
                </div>
                
                <div class="flex gap-1 ml-1">
                    <button onclick="duplicatePanel(${p.id})" title="Duplicate" class="h-[26px] w-7 flex items-center justify-center bg-gray-100 text-gray-500 border border-gray-200 rounded hover:bg-gray-200 transition"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg></button>
                    ${!isOnly ? `<button onclick="removePanel(${p.id})" title="Remove" class="h-[26px] w-7 flex items-center justify-center bg-red-50 text-red-500 border border-red-100 rounded hover:bg-red-500 hover:text-white transition"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>` : `<div class="w-7"></div>`}
                </div>
            </div>
            
            <div class="flex items-center gap-3 border-t border-gray-100 pt-1.5">
                <div class="w-1/2">
                     <select onchange="updatePanel(${p.id}, 'material', this.value)" class="w-full border border-gray-200 p-1 rounded text-xs font-bold ${isPerf ? 'text-indigo-700 bg-indigo-50' : 'text-gray-600 bg-gray-50'} outline-none focus:border-blue-500">
                         <option value="wrap" ${p.material === 'wrap' ? 'selected' : ''}>Premium Cast Wrap</option>
                         <option value="perf" ${p.material === 'perf' ? 'selected' : ''}>Window Perf (60/40)</option>
                     </select>
                </div>
                <div class="w-1/2 flex items-center ${isPerf ? '' : 'opacity-30 pointer-events-none'}">
                     <label class="flex items-center gap-1.5 text-[9px] font-bold ${isPerf && p.included ? 'text-green-600' : 'text-gray-500'} cursor-pointer">
                         <input type="checkbox" onchange="updatePanel(${p.id}, 'included', this.checked)" ${p.included ? 'checked' : ''} class="w-3 h-3 rounded text-blue-600">
                         Included in larger wrap
                     </label>
                </div>
            </div>
        </div>`;
    });
    
    runCalc();
}

function updatePanel(id, field, val) {
    const p = panels.find(x => x.id === id);
    if(p) {
        if(field === 'label' || field === 'material') p[field] = val;
        else if (field === 'included') p[field] = val;
        else p[field] = parseFloat(val) || 0;
        
        // Safety: Uncheck inclusion if they switch back to cast
        if (field === 'material' && val === 'wrap') p.included = false; 
        
        renderPanels(); // Re-render to show color changes
    }
}

function addPanel() {
    panels.push({ id: Date.now(), label: `Area ${panels.length + 1}`, w: 120, h: 60, material: 'wrap', included: false });
    renderPanels();
}

function duplicatePanel(id) {
    const p = panels.find(x => x.id === id);
    if(p) {
         panels.push({ id: Date.now(), label: p.label + ' (Copy)', w: p.w, h: p.h, material: p.material, included: p.included });
         renderPanels();
    }
}

function removePanel(id) {
    panels = panels.filter(x => x.id !== id);
    renderPanels();
}

function runCalc() {
    if(!backendData.Retail_Min_Order) return;

    try {
        const inputs = {
            qty: parseFloat(document.getElementById('qty').value) || 1,
            panels: panels,
            install: document.getElementById('install').value
        };

        const result = calculateWrap(inputs, backendData);
        if (!result || !result.retail) return;

        const ret = result.retail;
        const fmt = (n) => "$" + (n || 0).toFixed(2);

        document.getElementById('lbl-sqft').innerText = ret.displaySqFt.toFixed(1);
        document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
        document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
        document.getElementById('ui-print').innerText = fmt(ret.printTotal);

        if (ret.installTotal > 0) {
            document.getElementById('row-install').classList.remove('hidden');
            document.getElementById('ui-install').innerText = fmt(ret.installTotal);
        } else {
            document.getElementById('row-install').classList.add('hidden');
        }

        const minOrder = parseFloat(backendData.Retail_Min_Order || 150);
        document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
        document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

        const instTxt = inputs.install === 'Yes' ? 'Installation Labor Included.' : 'Print Only (No Install).';
        
        const panelTxt = panels.map(p => {
            let matName = p.material === 'perf' ? 'Window Perf' : 'Cast Wrap';
            let incName = (p.material === 'perf' && p.included) ? ' (Cost Included)' : '';
            return ` - ${p.label}: ${p.w}" x ${p.h}" [${matName}]${incName}`;
        }).join('\n');
        
        document.getElementById('job-desc').value = `(x${inputs.qty}) Vehicle Graphics Package.\nAreas:\n${panelTxt}\n\n${instTxt}`;

    } catch(e) {
        console.error(e);
    }
}

// API FETCH & NATIVE STATUS BAR UPDATER
window.addEventListener('load', async () => {
    if (typeof injectHeader === 'function') injectHeader("Vehicle Wraps");
    
    renderPanels(); // Initialize dynamic UI

    const statusText = document.getElementById("status-text");
    const statusDot = document.getElementById("status-dot");

    try {
        const req = await fetch(`${SCRIPT_URL}?req=view_module&tab=PROD_Vinyl_Wraps`);
        backendData = await req.json();
        
        if(backendData.error) throw new Error(backendData.error);
        
        if(statusText) {
            statusText.innerText = "ONLINE";
            statusText.className = "font-bold text-green-500";
            if(statusDot) {
                statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                statusDot.classList.remove("animate-pulse");
            }
        }
        
        runCalc(); 
    } catch(e) {
        if(statusText) {
            statusText.innerText = "OFFLINE";
            statusText.className = "font-bold text-red-500";
        }
        console.error(e);
    }
});
</script>
</body>
</html>
