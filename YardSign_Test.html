<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yard Signs (Modular Test)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <!-- IMPORT THE NEW PHYSICS ENGINE -->
    <script src="logic_yard_test.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans p-8">

    <div class="max-w-md mx-auto bg-white shadow-xl rounded-xl border border-gray-200 overflow-hidden">
        
        <!-- HEADER -->
        <div class="bg-purple-900 text-white p-4 text-center">
            <h1 class="text-xl font-black">🧪 TEST LAB: Yard Signs</h1>
            <p class="text-[10px] uppercase opacity-75">Running on Modular Physics Engine</p>
        </div>

        <!-- INPUTS -->
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="font-bold text-xs">Qty</label><input type="number" id="qty" value="10" class="w-full border p-2 font-bold text-lg" oninput="runCalc()"></div>
                <div><label class="font-bold text-xs">Sides</label><select id="sides" class="w-full border p-2 font-bold" onchange="runCalc()"><option value="1">Single</option><option value="2">Double</option></select></div>
            </div>
            
            <div><label class="font-bold text-xs">Files</label><input type="number" id="files" value="1" class="w-full border p-2 font-bold text-lg" oninput="runCalc()"></div>

            <div class="flex items-center gap-2 p-2 bg-gray-50 rounded border">
                <input type="checkbox" id="stakes" checked onchange="runCalc()"> <label class="font-bold text-xs">Include Stakes</label>
            </div>
            
            <div class="flex items-center gap-2 p-2 bg-purple-50 rounded border border-purple-100">
                <input type="checkbox" id="design" checked onchange="runCalc()"> <label class="font-bold text-xs text-purple-900">Include Design Fee</label>
            </div>
        </div>

        <!-- RESULTS (Read-Only) -->
        <div class="bg-gray-50 p-6 border-t border-gray-200">
            <div class="flex justify-between items-end mb-2">
                <span class="text-xs font-bold text-gray-400">UNIT PRICE</span>
                <span class="text-xl font-bold text-gray-800" id="ui-unit">---</span>
            </div>
            <div class="flex justify-between items-end mb-4">
                <span class="text-xs font-bold text-gray-400">TOTAL</span>
                <span class="text-3xl font-black text-blue-600" id="ui-total">---</span>
            </div>

            <div class="border-t border-gray-200 pt-4 text-xs space-y-1 text-gray-500">
                <div class="flex justify-between"><span>Internal Cost:</span><span class="font-bold text-gray-700" id="ui-cost">---</span></div>
                <div class="flex justify-between"><span>Margin:</span><span class="font-bold text-green-600" id="ui-margin">---</span></div>
            </div>
        </div>

    </div>

<script>
    let backendData = {};

    window.onload = async function() {
        // Fetch the TEST TAB from Backend
        try {
            const res = await fetch(`${SCRIPT_URL}?tab=TEST_Yard_Logic&ip=${clientIP}&user=TEST&role=ADMIN&req=view_module`);
            backendData = await res.json();
            runCalc();
        } catch(e) { alert("Backend Error: " + e.message); }
    };

    function runCalc() {
        if(!backendData.Item_Name) return;

        // 1. Scrape Inputs
        const inputs = {
            qty: parseFloat(document.getElementById('qty').value) || 1,
            sides: parseInt(document.getElementById('sides').value),
            files: parseFloat(document.getElementById('files').value) || 1,
            hasStakes: document.getElementById('stakes').checked,
            incDesign: document.getElementById('design').checked,
            setupPerFile: false // Hardcoded for test simplicity
        };

        // 2. RUN ENGINE (Imported from logic_yard_test.js)
        const result = calculateYardSign(inputs, backendData);

        // 3. Update UI
        const fmt = (n) => "$" + n.toFixed(2);
        
        document.getElementById('ui-unit').innerText = fmt(result.retail.unitPrice);
        document.getElementById('ui-total').innerText = fmt(result.retail.grandTotal);
        document.getElementById('ui-cost').innerText = fmt(result.cost.total);
        document.getElementById('ui-margin').innerText = (result.metrics.margin * 100).toFixed(1) + "%";
    }
</script>
</body>
</html>
