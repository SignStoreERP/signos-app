<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignOS ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // *** SECURITY BOUNCER ***
        const user = sessionStorage.getItem('signos_user');
        if (!user) window.location.href = 'index.html';
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans hidden" id="main-body">

    <!-- AUTH HEADER -->
    <div class="bg-gray-800 text-white px-6 py-2 flex justify-between items-center text-xs shadow-md">
        <div class="flex gap-4">
            <span class="tracking-wide">USER: <span class="font-bold text-gray-200 uppercase" id="auth-user">---</span></span>
            <span class="tracking-wide">ROLE: <span class="font-bold text-blue-400 uppercase" id="auth-role">---</span></span>
        </div>
        <button onclick="logout()" class="font-bold text-red-400 hover:text-white uppercase tracking-wider text-[10px]">Logout</button>
    </div>

    <div class="max-w-6xl mx-auto p-8">
        <!-- SYSTEM HEADER -->
        <div class="mb-8 flex justify-between items-end bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-3xl font-black text-gray-900 tracking-tight">SignOS ERP</h1>
                <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">Production Management System</p>
            </div>
            <div class="text-right">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                    <span class="w-2 h-2 mr-2 bg-green-500 rounded-full animate-pulse"></span> v3.4 Online
                </span>
                <div class="mt-2 text-[10px]"><a href="docs.html" class="text-blue-400 hover:text-blue-600 underline">View Documentation</a></div>
            </div>
        </div>

        <div class="space-y-10">
            <!-- STANDARD ESTIMATORS (Existing Links) -->
            <section>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 border-b border-gray-200 pb-2">Quick Estimators</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <a href="YardSign_Calculator.html" class="nav-link block bg-white p-5 rounded-xl shadow-sm border border-gray-200 hover:border-blue-500 hover:shadow-md transition group">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                            </div>
                            <div><h3 class="font-bold text-gray-900 group-hover:text-blue-600 text-sm">Yard Signs</h3><p class="text-[10px] text-gray-500 uppercase">Calculator Only</p></div>
                        </div>
                    </a>
                    <!-- Other calculators (Coro, ACM, etc) would go here -->
                </div>
            </section>

            <!-- ADMIN WORKFLOW BUTTON (Hidden by default) -->
            <div id="admin-workflow" class="hidden border-t-2 border-dashed border-gray-300 pt-8 mt-8">
                <a href="order_menu.html" class="block w-full bg-gradient-to-r from-gray-900 to-gray-800 hover:from-blue-900 hover:to-blue-800 text-white rounded-xl p-6 shadow-xl transform hover:scale-[1.01] transition-all group">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-white/10 rounded-lg">
                                <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold tracking-tight">Launch Order Workflow</h3>
                                <p class="text-xs text-gray-400 font-medium">Full E-Commerce Suite: Quote → Design 3D → Cart → Work Order</p>
                            </div>
                        </div>
                        <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full group-hover:bg-white group-hover:text-blue-900 transition">START NEW ORDER →</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode') || 'sales';
            const user = sessionStorage.getItem('signos_user');
            
            if (!user) { window.location.href = 'index.html'; return; }

            document.getElementById('main-body').classList.remove('hidden');
            const role = sessionStorage.getItem('signos_role') || mode.toUpperCase();

            document.getElementById('auth-user').innerText = user;
            document.getElementById('auth-role').innerText = role;

            // Logic to Reveal Admin Workflow
            if (role === 'ADMIN') {
                document.getElementById('admin-workflow').classList.remove('hidden');
            }

            document.querySelectorAll('.nav-link').forEach(link => {
                const currentHref = link.getAttribute('href');
                if (!currentHref.includes('?mode=')) link.setAttribute('href', `${currentHref}?mode=${mode}`);
            });
        };

        function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
