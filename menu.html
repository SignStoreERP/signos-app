<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignOS ERP | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // *** SECURITY BOUNCER ***
        const user = sessionStorage.getItem('signos_user');
        if (!user) window.location.href = 'index.html';
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 1. AUTH HEADER -->
    <div class="bg-gray-800 text-white px-6 py-2 flex justify-between items-center text-xs shadow-md">
        <div class="flex gap-4">
            <span class="tracking-wide">USER: <span class="font-bold text-gray-200 uppercase" id="auth-user">---</span></span>
            <span class="tracking-wide">ROLE: <span class="font-bold text-blue-400 uppercase" id="auth-role">---</span></span>
        </div>
        <button onclick="logout()" class="font-bold text-red-400 hover:text-white uppercase tracking-wider text-[10px] border border-red-900/50 hover:bg-red-900/50 px-2 py-1 rounded transition">Logout</button>
    </div>

    <div class="max-w-6xl mx-auto p-8">
        
        <!-- SYSTEM HEADER -->
        <div class="mb-8 flex justify-between items-end bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-3xl font-black text-gray-900 tracking-tight">SignOS ERP</h1>
                <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">Production Management System</p>
            </div>
            <div class="text-right">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                    <span class="w-2 h-2 mr-2 bg-green-500 rounded-full animate-pulse"></span> System v3.6
                </span>
                <div class="mt-2 text-[10px]">
                    <a href="docs.html" class="text-blue-400 hover:text-blue-600 underline font-bold">View Documentation</a>
                </div>
            </div>
        </div>

        <!-- DYNAMIC GRID CONTAINER -->
        <div id="app-container" class="space-y-10">
            <!-- Content injected by JS -->
        </div>

        <!-- ADMIN WORKFLOW (Hidden by default) -->
        <div id="admin-workflow" class="hidden border-t-2 border-dashed border-gray-300 pt-8 mt-8">
            <a href="order_menu.html" class="block w-full bg-gradient-to-r from-gray-900 to-gray-800 hover:from-blue-900 hover:to-blue-800 text-white rounded-xl p-6 shadow-xl transform hover:scale-[1.01] transition-all group">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-white/10 rounded-lg">
                            <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold tracking-tight">Order Workflow (Beta)</h3>
                            <p class="text-xs text-gray-400 font-medium">Quote → 3D Design → Cart → Work Order</p>
                        </div>
                    </div>
                    <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full group-hover:bg-white group-hover:text-blue-900 transition">LAUNCH →</span>
                </div>
            </a>
        </div>

    </div>

<script>
    // --- THE REGISTRY (Manual Sync with SYS_Modules) ---
    // Update this array when SYS_Modules in Backend changes.
    const modules = [
        // RIGID
        { id: 'PROD_Yard', cat: 'Rigid Signs', name: 'Yard Signs', file: 'YardSign_Calculator.html', ver: 'v21.6', status: 'active', icon: 'blue' },
        { id: 'PROD_Coro', cat: 'Rigid Signs', name: 'Custom Coroplast', file: 'Coro_Calculator.html', ver: 'v7.3', status: 'active', icon: 'purple' },
        { id: 'PROD_ACM', cat: 'Rigid Signs', name: 'ACM Signs', file: 'ACM_Calculator.html', ver: 'v5.7', status: 'active', icon: 'slate' },
        { id: 'PROD_Acr', cat: 'Rigid Signs', name: 'Acrylic Signs', file: 'Acrylic_Calculator.html', ver: 'v3.2', status: 'active', icon: 'teal' },
        
        // ROLL
        { id: 'PROD_Ban', cat: 'Roll Media (Wide Format)', name: 'Vinyl Banners', file: 'Banner_Calculator.html', ver: 'v9.2', status: 'active', icon: 'indigo' },
        { id: 'PROD_Dec', cat: 'Roll Media (Wide Format)', name: 'Decals & Stickers', file: 'Decal_Calculator.html', ver: 'v3.0', status: 'active', icon: 'pink' },
        { id: 'PROD_Wrap', cat: 'Roll Media (Wide Format)', name: 'Vehicle Wraps', file: 'Wrap_Calculator.html', ver: 'v5.6', status: 'active', icon: 'blue' },
        { id: 'PROD_Cut', cat: 'Roll Media (Wide Format)', name: 'Cut Vinyl', file: 'CutVinyl_Calculator.html', ver: 'v3.3', status: 'active', icon: 'yellow' },

        // BETA / DRAFT (Hidden from Live Menu if status != active)
        { id: 'PROD_3D', cat: 'Beta', name: '3D Designer', file: 'YardSign_Order.html', ver: 'v1.0', status: 'draft', icon: 'gray' }
    ];

    window.onload = function() {
        // 1. Auth Setup
        const user = sessionStorage.getItem('signos_user');
        const role = sessionStorage.getItem('signos_role');
        document.getElementById('auth-user').innerText = user;
        document.getElementById('auth-role').innerText = role;

        if (role === 'ADMIN') document.getElementById('admin-workflow').classList.remove('hidden');

        // 2. Render Menu
        renderMenu();
    };

    function renderMenu() {
        const container = document.getElementById('app-container');
        container.innerHTML = '';

        // Group by Category
        const categories = {};
        modules.forEach(mod => {
            if (mod.status !== 'active') return; // FILTER: Only show Active
            if (!categories[mod.cat]) categories[mod.cat] = [];
            categories[mod.cat].push(mod);
        });

        // Build HTML
        for (const [catName, mods] of Object.entries(categories)) {
            // Section Header
            const section = document.createElement('section');
            section.innerHTML = `<h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 border-b border-gray-200 pb-2">${catName}</h2>`;
            
            // Grid
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4";

            mods.forEach(mod => {
                const link = document.createElement('a');
                // Pass Version & Mode to the Calculator (Mode=Live forces Green Badge)
                link.href = `${mod.file}?mode=live&ver=${mod.ver}`;
                link.className = "block bg-white p-5 rounded-xl shadow-sm border border-gray-200 hover:border-blue-500 hover:shadow-md transition group relative";
                
                // Color Logic for Icons
                const colors = {
                    blue: "bg-blue-50 text-blue-600 group-hover:bg-blue-600 group-hover:text-white",
                    purple: "bg-purple-50 text-purple-600 group-hover:bg-purple-600 group-hover:text-white",
                    slate: "bg-slate-50 text-slate-600 group-hover:bg-slate-600 group-hover:text-white",
                    teal: "bg-teal-50 text-teal-600 group-hover:bg-teal-600 group-hover:text-white",
                    indigo: "bg-indigo-50 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white",
                    pink: "bg-pink-50 text-pink-600 group-hover:bg-pink-600 group-hover:text-white",
                    yellow: "bg-yellow-50 text-yellow-600 group-hover:bg-yellow-500 group-hover:text-white",
                };
                const iconClass = colors[mod.icon] || colors.blue;

                link.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center transition ${iconClass}">
                            <!-- Generic Icon -->
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900 group-hover:text-blue-600 text-sm">${mod.name}</h3>
                            <span class="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded font-mono">${mod.ver}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(link);
            });

            section.appendChild(grid);
            container.appendChild(section);
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
