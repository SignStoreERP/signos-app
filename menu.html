<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SignOS Menu v6.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="signos-core.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col pb-10">

<div class="bg-gray-900 text-white px-4 py-3 flex justify-between items-center text-xs shadow-md shrink-0 sticky top-0 z-50">
    <div class="flex items-center gap-2">
        <span class="font-bold text-gray-200 uppercase" id="auth-user">---</span>
        <span class="bg-gray-800 text-blue-400 px-2 py-0.5 rounded border border-gray-700 font-bold uppercase" id="auth-role">---</span>
        <span id="super-badge" class="hidden bg-red-600 text-white px-1.5 py-0.5 rounded font-black text-[9px] uppercase tracking-widest ml-1">SUPER</span>
    </div>
    <div class="flex gap-3 items-center">
        <button onclick="location.reload()" class="text-gray-400 hover:text-white transition" title="Refresh Dash">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
        <button onclick="logout()" class="text-red-400 hover:text-white font-bold uppercase tracking-wider transition">Logout</button>
    </div>
</div>

<div class="w-full max-w-3xl mx-auto px-4 py-6 flex-1">
    <div class="mb-6 bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500 flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">SignOS <span class="text-blue-500">Core</span></h1>
            <p class="text-gray-400 text-xs font-bold uppercase tracking-wide mt-1">Production Portal</p>
        </div>
        <div class="md:text-right">
            <span id="env-badge" class="inline-block bg-gray-100 text-gray-600 text-[10px] font-bold px-3 py-1.5 rounded-full border border-gray-200 w-full text-center md:w-auto">
                Loading...
            </span>
        </div>
    </div>

    <div id="loader" class="text-center py-20 text-gray-400 animate-pulse tracking-widest text-xs font-bold">
        CONNECTING TO BACKEND...
    </div>

    <!-- MAIN PRODUCT GRID -->
    <div id="menu-container" class="space-y-8 hidden"></div>

    <!-- ADMIN UTILITIES -->
    <div id="admin-workflow" class="mt-12 hidden">
        <div class="flex items-center gap-3 mb-4">
            <div class="h-px bg-gray-200 flex-1"></div>
            <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Admin Utilities</h2>
            <div class="h-px bg-gray-200 flex-1"></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <a href="admin_roadmap.html" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-orange-500 active:scale-95 transition flex flex-col items-center text-center gap-2">
                <span class="text-2xl">🚧</span>
                <span class="text-xs font-bold text-gray-700">Roadmap</span>
            </a>
            <a href="admin_viewer.html" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-blue-500 active:scale-95 transition flex flex-col items-center text-center gap-2">
                <span class="text-2xl">⚙️</span>
                <span class="text-xs font-bold text-gray-700">Logs</span>
            </a>
            <a id="btn-backup" href="admin_backup.html" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-green-500 active:scale-95 transition flex flex-col items-center text-center gap-2">
                <span class="text-2xl">💾</span>
                <span class="text-xs font-bold text-gray-700">Backup</span>
            </a>
            <a href="admin_changelog.html" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-purple-500 active:scale-95 transition flex flex-col items-center text-center gap-2">
                <span class="text-2xl">📜</span>
                <span class="text-xs font-bold text-gray-700">History</span>
            </a>
            <a href="dev_dashboard.html" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-red-500 active:scale-95 transition flex flex-col items-center text-center gap-2">
                <span class="text-2xl">🚀</span>
                <span class="text-xs font-bold text-gray-700">Mission Ctrl</span>
            </a>
            <a href="admin_cost_matrix.html" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-indigo-500 active:scale-95 transition flex flex-col items-center text-center gap-2">
                <span class="text-2xl">🧱</span>
                <span class="text-xs font-bold text-gray-700">Cost Matrix</span>
            </a>
            <a href="admin_retail_matrix.html" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-pink-500 active:scale-95 transition flex flex-col items-center text-center gap-2">
                <span class="text-2xl">💳</span>
                <span class="text-xs font-bold text-gray-700">Retail Matrix</span>
            </a>
            <a href="admin_analytics.html" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-teal-500 active:scale-95 transition flex flex-col items-center text-center gap-2">
                <span class="text-2xl">📈</span>
                <span class="text-xs font-bold text-gray-700">Heatmap</span>
            </a>
        </div>
    </div>
</div>

<script>
function val(obj, key) {
    if (!obj) return "";
    return obj[key] || obj[key.toUpperCase()] || obj[key.toLowerCase()] || "";
}

window.onload = async function() {
    const user = sessionStorage.getItem('signos_user') || 'Guest';
    const rawRole = sessionStorage.getItem('signos_role') || 'VIEW';
    const role = rawRole === 'SUPER' ? 'ADMIN' : rawRole; // SUPER assumes ADMIN clearance for standard grid

    document.getElementById('auth-user').innerText = user;
    document.getElementById('auth-role').innerText = rawRole;

    const envEl = document.getElementById('env-badge');
    const ipWatcher = setInterval(() => {
        if (clientIP !== 'Unknown') {
            if (IS_DEV_ENV) {
                envEl.innerHTML = `<span class="text-orange-600 font-bold">⚠️ DEV MODE</span> <span class="text-gray-300 mx-1">|</span> <span class="text-gray-400">${clientIP}</span>`;
            } else {
                envEl.innerHTML = `<span class="text-green-600 font-bold">● LIVE</span> <span class="text-gray-300 mx-1">|</span> <span class="text-gray-400">${clientIP}</span>`;
            }
            clearInterval(ipWatcher);
        }
    }, 100);
    setTimeout(() => clearInterval(ipWatcher), 5000);

    // Admin Tools Visibility
    if (rawRole === 'ADMIN' || rawRole === 'SUPER') {
        document.getElementById('admin-workflow').classList.remove('hidden');
    }
    if (rawRole === 'SUPER') document.getElementById('super-badge').classList.remove('hidden');

    const perms = JSON.parse(sessionStorage.getItem('signos_perms') || '{}');
    const btnBackup = document.getElementById('btn-backup');
    if (rawRole !== 'SUPER' && perms.backup !== 'Run' && perms.backup !== 'Full') {
        btnBackup.classList.add('hidden');
    }

    // Fetch Modules List
    try {
        const response = await fetch(`${SCRIPT_URL}?tab=SYS_Modules&ip=${clientIP}&user=${user}&role=${rawRole}&req=table`);
        const data = await response.json();

        if (data.error) throw new Error(data.error);
        if (!Array.isArray(data)) throw new Error("Invalid Data Format");

        document.getElementById('loader').classList.add('hidden');
        document.getElementById('menu-container').classList.remove('hidden');

        renderMenu(data, rawRole, role);

    } catch (e) {
        console.error(e);
        document.getElementById('loader').innerHTML = `<span class="text-red-500">API ERROR: CHECK CONNECTION</span>`;
    }
};

function renderMenu(data, rawRole, mappedRole) {
    const container = document.getElementById('menu-container');
    const groups = {};

    // Do not render these tools inside the main grid, as they have their own section at the bottom
    const excludedAdminTools = ['SYS_Roadmap', 'SYS_Changelog', 'SYS_Log_Analyzer', 'SYS_Log_Backup', 'SYS_Health', 'SYS_Dev_Dash', 'SYS_Matrix', 'SYS_Ret_Matrix', 'SYS_Sim', 'SYS_Analytics'];

    data.forEach(mod => {
        const modId = val(mod, 'Module_ID');
        if (!modId || excludedAdminTools.includes(modId)) return;

        // Permissions Check
        const roleCol = IS_DEV_ENV ? `Dev_${mappedRole}` : `Live_${mappedRole}`;
        const isAllowed = String(val(mod, roleCol)).toUpperCase() === 'TRUE';
        if (!isAllowed && rawRole !== 'SUPER') return;

        // Versioning Logic
        const liveVer = val(mod, 'Live_Ver');
        const devVer = val(mod, 'Dev_Ver');
        let verText = "";
        let verClass = "";

        if (IS_DEV_ENV) {
            if (!devVer || devVer === '') return;
            verText = `DEV ${devVer}`;
            verClass = "bg-orange-100 text-orange-800 border-orange-200";
        } else {
            if (!liveVer || liveVer === '') return;
            verText = `${liveVer}`;
            verClass = "bg-green-100 text-green-800 border-green-200";
        }

        const cat = val(mod, 'Category') || 'Other';
        if (!groups[cat]) groups[cat] = [];
        
        mod._verText = verText;
        mod._verClass = verClass;
        groups[cat].push(mod);
    });

    // Build the grid
    Object.keys(groups).forEach(category => {
        const catDiv = document.createElement('div');
        
        let gridHtml = `
        <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3 border-b border-gray-200 pb-1">${category}</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        `;

        groups[category].forEach(mod => {
            const iconPath = val(mod, 'Icon_Path');
            const iconColor = val(mod, 'Icon') || 'gray';
            let iconContent = iconPath 
                ? `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}"></path></svg>`
                : `<span class="w-4 h-4 rounded-full bg-${iconColor}-500 inline-block"></span>`;

            let healthHTML = "";
            if (val(mod, 'Module_ID').startsWith('PROD_')) {
                healthHTML = `
                <span id="health-text-${val(mod, 'Module_ID')}" class="text-[8px] font-bold text-gray-400 flex items-center gap-1 tracking-wider ml-2 border-l border-gray-200 pl-2">
                    <span id="health-dot-${val(mod, 'Module_ID')}" class="w-1.5 h-1.5 rounded-full bg-gray-300 animate-pulse"></span> PINGING
                </span>`;
            }

            gridHtml += `
            <a href="${val(mod, 'File_Link')}" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:border-blue-500 active:scale-95 transition flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-${iconColor}-50 text-${iconColor}-600 rounded-lg group-hover:bg-${iconColor}-600 group-hover:text-white transition shrink-0">
                        ${iconContent}
                    </div>
                    <div class="min-w-0">
                        <h3 class="font-bold text-gray-800 text-sm group-hover:text-blue-600 transition truncate">${val(mod, 'Display_Name')}</h3>
                        <div class="flex items-center mt-1">
                            <span class="text-[9px] font-mono px-1.5 py-0.5 rounded font-bold ${mod._verClass}">${mod._verText}</span>
                            ${healthHTML}
                        </div>
                    </div>
                </div>
                <div class="text-gray-300 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </a>
            `;
        });

        gridHtml += `</div>`;
        catDiv.innerHTML = gridHtml;
        container.appendChild(catDiv);
    });

    // Start Health Checks with a Staggered Delay (Every 500ms)
    let delay = 0;
    data.forEach(mod => {
        if(val(mod, 'Module_ID').startsWith('PROD_') && val(mod, 'File_Link')) {
            setTimeout(() => testModuleHealth(mod), delay);
            delay += 500;
        }
    });
}

// --- DYNAMIC HEALTH MONITOR ---
function testModuleHealth(mod) {
    const modId = val(mod, 'Module_ID');
    const fileLink = val(mod, 'File_Link');

    if (!fileLink || !fileLink.endsWith('.html')) {
        updateHealthUI(modId, 'HIDE');
        return;
    }

    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = `${fileLink}?t=${Date.now()}`;

    iframe.onload = function() {
        let attempts = 0;
        const maxAttempts = 20; // 10 sec timeout

        const checkInterval = setInterval(() => {
            attempts++;
            try {
                const innerDoc = iframe.contentDocument || iframe.contentWindow.document;
                const statusEl = innerDoc.getElementById('status-text');

                if (statusEl && statusEl.innerText === 'ONLINE') {
                    clearInterval(checkInterval);
                    updateHealthUI(modId, 'PASS');
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }
                else if (statusEl && statusEl.innerText === 'OFFLINE') {
                    throw new Error("Backend Offline");
                }
                else if (attempts >= maxAttempts) {
                    throw new Error("Timeout");
                }
            } catch(e) {
                if (e.message === "Timeout" || e.message === "Backend Offline" || attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    updateHealthUI(modId, 'ERR');
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }
            }
        }, 500);
    };

    iframe.onerror = function() {
        updateHealthUI(modId, '404');
        if (document.body.contains(iframe)) document.body.removeChild(iframe);
    };

    document.body.appendChild(iframe);
}

function updateHealthUI(modId, state) {
    const dot = document.getElementById(`health-dot-${modId}`);
    const txt = document.getElementById(`health-text-${modId}`);
    if(!dot || !txt) return;

    if (state === 'PASS') {
        dot.className = "w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_4px_rgba(34,197,94,0.6)]";
        txt.innerHTML = dot.outerHTML + " PASS";
        txt.classList.replace('text-gray-400', 'text-green-600');
    } else if (state === 'ERR') {
        dot.className = "w-1.5 h-1.5 rounded-full bg-red-600 shadow-[0_0_4px_rgba(220,38,38,0.6)] animate-pulse";
        txt.innerHTML = dot.outerHTML + " CRASH";
        txt.classList.replace('text-gray-400', 'text-red-600');
    } else if (state === '404') {
        dot.className = "w-1.5 h-1.5 rounded-full bg-gray-800";
        txt.innerHTML = dot.outerHTML + " 404";
        txt.classList.replace('text-gray-400', 'text-gray-800');
    } else if (state === 'HIDE') {
        txt.style.display = 'none';
    }
}
</script>
</body>
</html>
