<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignOS ERP | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // *** SECURITY BOUNCER ***
        const user = sessionStorage.getItem('signos_user');
        if (!user) window.location.href = 'index.html';
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 1. AUTH HEADER -->
    <div class="bg-gray-800 text-white px-6 py-2 flex justify-between items-center text-xs shadow-md">
        <div class="flex gap-4">
            <span class="tracking-wide">USER: <span class="font-bold text-gray-200 uppercase" id="auth-user">---</span></span>
            <span class="tracking-wide">ROLE: <span class="font-bold text-blue-400 uppercase" id="auth-role">---</span></span>
        </div>
        <button onclick="logout()" class="font-bold text-red-400 hover:text-white uppercase tracking-wider text-[10px] border border-red-900/50 hover:bg-red-900/50 px-2 py-1 rounded transition">Logout</button>
    </div>

    <div class="max-w-6xl mx-auto p-8">
        
        <!-- SYSTEM HEADER -->
        <div class="mb-8 flex justify-between items-end bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-3xl font-black text-gray-900 tracking-tight">SignOS ERP</h1>
                <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">Production Management System</p>
            </div>
            <div class="text-right">
                <!-- MENU VERSION TRACKER -->
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800 border border-gray-200" id="sys-badge">
                    <span class="w-2 h-2 mr-2 bg-green-500 rounded-full animate-pulse" id="sys-dot"></span> 
                    <span id="sys-ver">System v3.7</span>
                </span>
                <div class="mt-2 text-[10px]">
                    <a href="docs.html" class="text-blue-400 hover:text-blue-600 underline font-bold">View Documentation</a>
                </div>
            </div>
        </div>

        <!-- DYNAMIC GRID CONTAINER -->
        <div id="app-container" class="space-y-10">
            <!-- Content injected by JS -->
        </div>

        <!-- ADMIN WORKFLOW (Restricted Access) -->
        <div id="admin-workflow" class="hidden border-t-2 border-dashed border-gray-300 pt-8 mt-8">
            <div class="flex items-center gap-2 mb-4">
                <span class="bg-red-100 text-red-800 text-[10px] font-bold px-2 py-1 rounded uppercase">Admin Only</span>
                <span class="text-xs text-gray-400">Beta Workflows</span>
            </div>
            <a href="order_menu.html" class="block w-full bg-gradient-to-r from-gray-900 to-gray-800 hover:from-blue-900 hover:to-blue-800 text-white rounded-xl p-6 shadow-xl transform hover:scale-[1.01] transition-all group">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-white/10 rounded-lg">
                            <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold tracking-tight">Order Workflow (Beta)</h3>
                            <p class="text-xs text-gray-400 font-medium">Quote → 3D Design → Cart → Work Order</p>
                        </div>
                    </div>
                    <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full group-hover:bg-white group-hover:text-blue-900 transition">LAUNCH →</span>
                </div>
            </a>
        </div>

    </div>

<script>
    // --- THE REGISTRY (Synced with SYS_Modules in Backend) ---
    // Contains both LIVE and DEV version numbers for routing.
    const modules = [
        // RIGID
        { id: 'PROD_Yard', cat: 'Rigid Signs', name: 'Yard Signs', file: 'YardSign_Calculator.html', live: 'v21.6', dev: 'v22.0-beta', status: 'active', icon: 'blue' },
        { id: 'PROD_Coro', cat: 'Rigid Signs', name: 'Custom Coroplast', file: 'Coro_Calculator.html', live: 'v7.3', dev: 'v7.4', status: 'active', icon: 'purple' },
        { id: 'PROD_ACM', cat: 'Rigid Signs', name: 'ACM Signs', file: 'ACM_Calculator.html', live: 'v5.7', dev: 'v5.8', status: 'active', icon: 'slate' },
        { id: 'PROD_Acr', cat: 'Rigid Signs', name: 'Acrylic Signs', file: 'Acrylic_Calculator.html', live: 'v3.2', dev: 'v3.3', status: 'active', icon: 'teal' },
        
        // ROLL
        { id: 'PROD_Ban', cat: 'Roll Media (Wide Format)', name: 'Vinyl Banners', file: 'Banner_Calculator.html', live: 'v9.2', dev: 'v9.3', status: 'active', icon: 'indigo' },
        { id: 'PROD_Dec', cat: 'Roll Media (Wide Format)', name: 'Decals & Stickers', file: 'Decal_Calculator.html', live: 'v3.0', dev: 'v3.1', status: 'active', icon: 'pink' },
        { id: 'PROD_Wrap', cat: 'Roll Media (Wide Format)', name: 'Vehicle Wraps', file: 'Wrap_Calculator.html', live: 'v5.6', dev: 'v5.7', status: 'active', icon: 'blue' },
        { id: 'PROD_Cut', cat: 'Roll Media (Wide Format)', name: 'Cut Vinyl', file: 'CutVinyl_Calculator.html', live: 'v3.3', dev: 'v3.4', status: 'active', icon: 'yellow' },

        // BETA / DRAFT (Hidden unless Admin)
        { id: 'PROD_3D', cat: 'Beta', name: '3D Designer', file: 'YardSign_Order.html', live: 'v1.0', dev: 'v1.1', status: 'draft', icon: 'gray' }
    ];

    window.onload = function() {
        // 1. Auth Setup
        const user = sessionStorage.getItem('signos_user');
        const role = sessionStorage.getItem('signos_role');
        document.getElementById('auth-user').innerText = user;
        document.getElementById('auth-role').innerText = role;

        // 2. Admin Logic
        if (role === 'ADMIN') {
            document.getElementById('admin-workflow').classList.remove('hidden');
            
            // Visual feedback for Admin/Dev Mode
            const badge = document.getElementById('sys-badge');
            badge.classList.remove('bg-gray-100', 'text-gray-800');
            badge.classList.add('bg-orange-100', 'text-orange-800', 'border-orange-200');
            document.getElementById('sys-dot').classList.replace('bg-green-500', 'bg-orange-500');
            document.getElementById('sys-ver').innerText = "System v3.7 (DEV ACCESS)";
        }

        // 3. Render Menu
        renderMenu(role);
    };

    function renderMenu(role) {
        const container = document.getElementById('app-container');
        container.innerHTML = '';

        // Group by Category
        const categories = {};
        modules.forEach(mod => {
            // Filter: If not active, hide (unless Admin wants to see drafts)
            if (mod.status !== 'active' && role !== 'ADMIN') return;
            
            if (!categories[mod.cat]) categories[mod.cat] = [];
            categories[mod.cat].push(mod);
        });

        // Build HTML
        for (const [catName, mods] of Object.entries(categories)) {
            // Section Header
            const section = document.createElement('section');
            section.innerHTML = `<h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 border-b border-gray-200 pb-2">${catName}</h2>`;
            
            // Grid
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4";

            mods.forEach(mod => {
                const link = document.createElement('a');
                
                // *** SMART ROUTING LOGIC ***
                // ADMIN -> DEV Mode (Orange Badge, Beta logic)
                // PROD  -> PRODUCTION Mode (Live Version, Cost Tab Default)
                // SALES -> SALES Mode (Live Version, Retail Tab Default)
                
                let targetMode = 'sales';
                let targetVer = mod.live;

                if (role === 'ADMIN') {
                    targetMode = 'dev';
                    targetVer = mod.dev; // Use Beta Version
                } else if (role === 'PROD') {
                    targetMode = 'production';
                }

                link.href = `${mod.file}?mode=${targetMode}`;
                
                // Styles
                link.className = "block bg-white p-5 rounded-xl shadow-sm border border-gray-200 hover:border-blue-500 hover:shadow-md transition group relative";
                
                // Color Logic for Icons
                const colors = {
                    blue: "bg-blue-50 text-blue-600 group-hover:bg-blue-600 group-hover:text-white",
                    purple: "bg-purple-50 text-purple-600 group-hover:bg-purple-600 group-hover:text-white",
                    slate: "bg-slate-50 text-slate-600 group-hover:bg-slate-600 group-hover:text-white",
                    teal: "bg-teal-50 text-teal-600 group-hover:bg-teal-600 group-hover:text-white",
                    indigo: "bg-indigo-50 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white",
                    pink: "bg-pink-50 text-pink-600 group-hover:bg-pink-600 group-hover:text-white",
                    yellow: "bg-yellow-50 text-yellow-600 group-hover:bg-yellow-500 group-hover:text-white",
                    gray: "bg-gray-100 text-gray-600 group-hover:bg-gray-600 group-hover:text-white"
                };
                const iconClass = colors[mod.icon] || colors.blue;

                // Version Badge Color (Orange for Dev, Gray for Live)
                const verBg = role === 'ADMIN' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-500';

                link.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center transition ${iconClass}">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900 group-hover:text-blue-600 text-sm">${mod.name}</h3>
                            <span class="text-[10px] ${verBg} px-1.5 py-0.5 rounded font-mono">${targetVer}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(link);
            });

            section.appendChild(grid);
            container.appendChild(section);
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
