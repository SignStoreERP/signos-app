<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interior Wall Wraps v1.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="signos-core.js"></script>

<!-- UNIFIED DUAL-TRACK LOGIC ENGINE -->
<script src="logic_wall.js"></script>

<style>
.toggle-checkbox:checked { right: 0; border-color: #2563EB; }
.toggle-checkbox:checked + .toggle-label { background-color: #2563EB; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col">

<!-- Main Card -->
<div id="main-card" class="max-w-xl mx-auto my-4 sm:my-10 w-[calc(100%-2rem)] sm:w-full bg-white shadow-2xl overflow-hidden rounded-xl border border-gray-200">

    <!-- GLOBAL INPUTS -->
    <div class="p-6 bg-gray-50 border-b border-gray-200 space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Locations / Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border border-gray-300 p-2 rounded font-bold text-gray-800 text-lg text-center bg-white shadow-inner" oninput="runCalc()"></div>
            <div class="flex items-center gap-2 mt-4"><label class="block text-[10px] font-bold text-gray-400 uppercase">Total Files:</label><input type="number" id="files" value="1" min="1" class="w-full border border-gray-300 rounded p-2 text-center text-lg font-bold bg-white shadow-inner" oninput="runCalc()"></div>
        </div>
        
        <div class="flex justify-between items-center bg-purple-50 border border-purple-200 p-3 rounded">
            <label class="flex items-center gap-2 text-xs font-bold text-purple-800 cursor-pointer transition"><input type="checkbox" id="inc-design" onchange="runCalc()" class="w-5 h-5 text-purple-600 rounded"> Include Graphic Design Fee</label>
        </div>
    </div>

    <!-- DYNAMIC PANEL SECTIONS -->
    <div class="p-6">
        <div class="flex justify-between items-end mb-3">
            <h3 class="text-xs font-black text-gray-800 uppercase tracking-widest">Architectural Sections</h3>
            <button onclick="addPanel()" class="text-[10px] font-bold bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded transition shadow-sm">+ ADD WALL</button>
        </div>
        
        <div id="panel-container" class="space-y-3">
            <!-- Panels injected here -->
        </div>
    </div>

    <!-- RESULTS -->
    <div class="bg-white p-6 border-t border-gray-200">
        <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-gray-400 uppercase tracking-wide">Base Location Price</span>
            <span class="text-2xl font-bold text-gray-900" id="ui-unit">---</span>
        </div>

        <div class="border-t border-gray-100 my-3"></div>

        <!-- LINE ITEMS -->
        <div class="space-y-1 text-xs text-gray-600 border-t border-dashed border-gray-200 pt-3">
            <div class="flex justify-between"><span>Printed Wallmark & Lam (<span id="lbl-sqft">0</span> sqft):</span><span id="ui-print" class="font-bold">$0.00</span></div>
            <div class="flex justify-between text-blue-700"><span>Installation Labor:</span><span id="ui-install" class="font-bold">$0.00</span></div>
            <div class="flex justify-between text-purple-700 hidden" id="row-design"><span>Design Fee:</span><span id="ui-design" class="font-bold">$0.00</span></div>
        </div>

        <div class="flex justify-between items-end border-t-2 border-gray-800 my-3 pt-2">
            <div>
                <span class="text-xs font-bold text-gray-400 uppercase block">Total Quote</span>
                <span class="text-[9px] font-bold text-gray-400 uppercase block mt-1" id="ui-min-text">Shop Minimum: $150</span>
                <div id="min-badge" class="hidden bg-red-100 text-red-600 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
            </div>
            <span class="text-3xl font-black text-blue-600" id="ui-total">---</span>
        </div>
    </div>

    <!-- DESCRIPTION GENERATOR -->
    <div class="bg-gray-50 p-4 border-t border-gray-200">
        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
        <textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-24 text-gray-600 font-mono outline-none" readonly></textarea>
    </div>
</div>

<script>
let backendData = {};
let panelIdCounter = 0;

window.onload = async function() {
    injectHeader("Interior Wall Wraps");

    const u = sessionStorage.getItem('signos_user') || 'Guest';
    const r = sessionStorage.getItem('signos_role') || 'VIEW';

    const statusText = document.getElementById("status-text");
    const statusDot = document.getElementById("status-dot");
    const verDisplay = document.getElementById("version-display");

    try {
        // Fetching the Wraps tab since the wall costs were merged there
        const res = await fetch(`${SCRIPT_URL}?tab=PROD_Vinyl_Wraps&ip=${clientIP}&user=${u}&role=${r}&req=view_module`);
        const data = await res.json();

        if(data.error) throw new Error(data.error);
        backendData = data;

        if(statusText) {
            statusText.innerText = "ONLINE";
            statusText.className = "font-bold text-green-500";
            statusDot.className = "w-2 h-2 rounded-full bg-green-500";
            statusDot.classList.remove("animate-pulse");
        }

        if(verDisplay) {
            verDisplay.innerText = `(v1.0)`;
            verDisplay.classList.remove('hidden');
        }

        // Initialize with one default wall panel
        addPanel("Lobby Main Wall", 120, 96);

    } catch(e) {
        if(statusText) {
            statusText.innerText = "OFFLINE";
            statusText.className = "font-bold text-red-500";
        }
        console.error(e);
    }
};

function addPanel(defLabel = "", defW = 0, defH = 0) {
    const id = panelIdCounter++;
    const container = document.getElementById('panel-container');
    
    const div = document.createElement('div');
    div.className = "panel-row bg-white border border-gray-200 rounded p-3 shadow-sm relative group";
    div.id = `panel-${id}`;
    
    div.innerHTML = `
        <button onclick="removePanel(${id})" class="absolute -top-2 -right-2 bg-red-100 text-red-600 hover:bg-red-500 hover:text-white w-6 h-6 rounded-full text-xs font-bold shadow opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center">✕</button>
        
        <div class="mb-2">
            <label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Wall Identifier</label>
            <input type="text" id="lbl-${id}" value="${defLabel}" placeholder="e.g. North Conference Room" class="w-full border border-gray-300 rounded p-1.5 text-xs font-bold text-gray-700 outline-none focus:border-blue-500" oninput="runCalc()">
        </div>

        <div class="grid grid-cols-2 gap-3 items-end">
            <div><label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Total Width (in)</label><input type="number" id="w-${id}" value="${defW || ''}" class="w-full border border-gray-300 rounded p-1.5 text-xs font-bold text-center outline-none" oninput="runCalc()"></div>
            <div><label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Total Height (in)</label><input type="number" id="h-${id}" value="${defH || ''}" class="w-full border border-gray-300 rounded p-1.5 text-xs font-bold text-center outline-none" oninput="runCalc()"></div>
        </div>
        
        <div id="seam-${id}" class="mt-3 text-[9px] font-bold uppercase tracking-widest text-gray-400 text-center bg-gray-50 py-1.5 rounded">Awaiting Dimensions...</div>
    `;
    
    container.appendChild(div);
    runCalc();
}

function removePanel(id) {
    document.getElementById(`panel-${id}`).remove();
    runCalc();
}

function runCalc() {
    if(!backendData.Item_Name) return;

    const panels = [];
    document.querySelectorAll('.panel-row').forEach(row => {
        const id = row.id.split('-')[1];
        const w = parseFloat(document.getElementById(`w-${id}`).value) || 0;
        const h = parseFloat(document.getElementById(`h-${id}`).value) || 0;
        const shortEdge = Math.min(w, h);
        const longEdge = Math.max(w, h);
        const seamEl = document.getElementById(`seam-${id}`);
        
        // Seam UI Logic based on 54" (52" printable) Roll limit and 1200" (100') length
        if (w === 0 || h === 0) {
            seamEl.innerText = "Awaiting Dimensions...";
            seamEl.className = "mt-3 text-[9px] font-bold uppercase tracking-widest text-gray-400 text-center bg-gray-50 py-1.5 rounded border border-transparent";
        } else if (longEdge > 1200) {
             seamEl.innerText = `⚠️ OVERSIZED: Exceeds 100ft roll length`;
            seamEl.className = "mt-3 text-[9px] font-bold uppercase tracking-widest text-white text-center bg-red-600 py-1.5 rounded shadow-inner";
        } else if (shortEdge > 52) {
            const pCount = Math.ceil((shortEdge - 1) / 51);
            seamEl.innerText = `⚠️ Tiled: Produces ${pCount} Vertical Panels`;
            seamEl.className = "mt-3 text-[9px] font-bold uppercase tracking-widest text-orange-700 text-center bg-orange-100 py-1.5 rounded border border-orange-200";
        } else {
            seamEl.innerText = "Produces 1 Panel (Seamless)";
            seamEl.className = "mt-3 text-[9px] font-bold uppercase tracking-widest text-green-700 text-center bg-green-50 py-1.5 rounded border border-green-200";
        }

        panels.push({
            label: document.getElementById(`lbl-${id}`).value || 'Unnamed Wall',
            w: w,
            h: h
        });
    });

    const inputs = {
        qty: parseFloat(document.getElementById('qty').value) || 1,
        panels: panels,
        files: parseFloat(document.getElementById('files').value) || 1,
        incDesign: document.getElementById('inc-design').checked
    };

    const result = calculateWall(inputs, backendData);
    const ret = result.retail;
    const fmt = (n) => "$" + n.toFixed(2);

    let totalArea = 0;
    panels.forEach(p => totalArea += ((p.w * p.h) / 144));
    document.getElementById('lbl-sqft').innerText = (totalArea * inputs.qty).toFixed(1);

    document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
    document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
    document.getElementById('ui-print').innerText = fmt(ret.printTotal);
    document.getElementById('ui-install').innerText = fmt(ret.installTotal);

    if (ret.designFee > 0) {
        document.getElementById('row-design').classList.remove('hidden');
        document.getElementById('ui-design').innerText = fmt(ret.designFee);
    } else {
        document.getElementById('row-design').classList.add('hidden');
    }

    const minOrder = parseFloat(backendData.Retail_Min_Order || 150);
    document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
    document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

    // Generate Text
    let descLines = [];
    descLines.push(`(x${inputs.qty}) Location(s) - Architectural Wall Wraps`);
    panels.forEach(p => {
        if(p.w > 0 && p.h > 0) descLines.push(` - ${p.label}: ${p.w}" x ${p.h}"`);
    });
    descLines.push(`Material: GF 226 WallMark w/ Matte Lam. Printed and installed.`);
    document.getElementById('job-desc').value = descLines.join('\n');
}
</script>
</body>
</html>
