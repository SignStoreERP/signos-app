<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Wall Wraps Retail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="logic_wall.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .panel-scroll::-webkit-scrollbar { width: 4px; }
        .panel-scroll::-webkit-scrollbar-track { background: #f8fafc; }
        .panel-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

<!-- Main Card: Island Mode -->
<div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">

    <!-- INPUTS -->
    <div class="p-6 space-y-4">
        
        <!-- Global Qty & Material Lock -->
        <div class="flex gap-3">
            <div class="w-1/3">
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Fleet Qty</label>
                <input type="number" id="qty" value="1" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none" oninput="runCalc()">
            </div>
            <div class="w-2/3">
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Material</label>
                <div class="w-full border p-2 rounded bg-gray-100 text-gray-500 font-bold text-sm h-[46px] flex items-center">
                    GF 226 WallMark (Cal)
                </div>
            </div>
        </div>

        <div class="border-t border-gray-200 my-2"></div>

        <!-- DYNAMIC PANEL BUILDER -->
        <div>
            <div class="flex justify-between items-end mb-2">
                <label class="block text-[10px] font-black text-gray-600 uppercase tracking-widest">Wall Sections</label>
                <button onclick="addPanel()" class="text-[10px] font-bold bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded hover:bg-blue-600 hover:text-white transition">+ ADD SECTION</button>
            </div>
            
            <div id="panel-container" class="space-y-2 max-h-48 overflow-y-auto panel-scroll pr-1">
                <!-- Panels injected here -->
            </div>
        </div>

        <div class="border-t border-gray-200 my-2"></div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Laminate</label>
                <select id="laminate" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none" onchange="runCalc()">
                    <option value="Matte">Matte Laminate</option>
                    <option value="Gloss">Gloss Laminate</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Installation</label>
                <select id="install" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none" onchange="runCalc()">
                    <option value="No">No (Print Only)</option>
                    <option value="Yes">Yes (Add Labor)</option>
                </select>
            </div>
        </div>

    </div>

    <!-- RESULTS -->
    <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
        <div class="flex justify-between items-end mb-2">
            <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
            <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
        </div>
        
        <div class="border-t border-blue-200/50 my-3"></div>

        <!-- LINE ITEMS -->
        <div class="space-y-1 text-xs text-blue-900/70 pt-1">
            <div class="flex justify-between"><span>Printed Wall Wrap (<span id="lbl-sqft">0</span> sqft):</span><span id="ui-print" class="font-bold">$0.00</span></div>
            <div class="flex justify-between text-orange-700 hidden" id="row-install"><span>Installation Labor:</span><span id="ui-install" class="font-bold">$0.00</span></div>
        </div>

        <div class="flex justify-between items-end border-t-2 border-blue-800 my-3 pt-2">
            <div>
                <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Minimum: $150</span>
                <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
            </div>
            <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
        </div>
    </div>

    <!-- DESCRIPTION GENERATOR -->
    <div class="bg-gray-50 p-4 border-t border-gray-200">
        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
        <textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-24 text-gray-600 font-mono outline-none" readonly></textarea>
    </div>

</div>

<script>
let backendData = {};

// DYNAMIC PANEL STATE
let panels = [
    { id: Date.now(), label: 'Main Wall', w: 120, h: 96 }
];

function renderPanels() {
    const container = document.getElementById('panel-container');
    container.innerHTML = '';
    
    panels.forEach((p, index) => {
        const isOnly = panels.length === 1;
        container.innerHTML += `
        <div class="flex items-end gap-2 bg-white p-2 rounded shadow-sm border border-gray-200">
            <div class="flex-1">
                <label class="block text-[8px] font-bold text-gray-400 uppercase mb-0.5">Name</label>
                <input type="text" value="${p.label}" onchange="updatePanel(${p.id}, 'label', this.value)" class="w-full border-b border-gray-200 bg-transparent text-xs font-bold text-gray-700 outline-none focus:border-blue-500 pb-1">
            </div>
            <div class="w-16">
                <label class="block text-[8px] font-bold text-gray-400 uppercase mb-0.5 text-center">W (in)</label>
                <input type="number" value="${p.w}" oninput="updatePanel(${p.id}, 'w', this.value)" class="w-full border p-1 rounded text-xs font-bold text-gray-700 outline-none text-center focus:border-blue-500 bg-gray-50">
            </div>
            <div class="w-16">
                <label class="block text-[8px] font-bold text-gray-400 uppercase mb-0.5 text-center">H (in)</label>
                <input type="number" value="${p.h}" oninput="updatePanel(${p.id}, 'h', this.value)" class="w-full border p-1 rounded text-xs font-bold text-gray-700 outline-none text-center focus:border-blue-500 bg-gray-50">
            </div>
            ${!isOnly ? `<button onclick="removePanel(${p.id})" class="h-[26px] w-7 flex items-center justify-center bg-red-50 text-red-500 border border-red-100 rounded hover:bg-red-500 hover:text-white transition"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>` : `<div class="w-7"></div>`}
        </div>`;
    });
    
    runCalc();
}

function updatePanel(id, field, val) {
    const p = panels.find(x => x.id === id);
    if(p) {
        if(field === 'label') p[field] = val;
        else p[field] = parseFloat(val) || 0;
        runCalc();
    }
}

function addPanel() {
    panels.push({ id: Date.now(), label: `Wall ${panels.length + 1}`, w: 120, h: 96 });
    renderPanels();
}

function removePanel(id) {
    panels = panels.filter(x => x.id !== id);
    renderPanels();
}

function runCalc() {
    if(!backendData.Retail_Min_Order) return;

    try {
        const inputs = {
            qty: parseFloat(document.getElementById('qty').value) || 1,
            panels: panels,
            laminate: document.getElementById('laminate').value, 
            install: document.getElementById('install').value
        };

        const result = calculateWall(inputs, backendData);
        if (!result || !result.retail) return;

        const ret = result.retail;
        const fmt = (n) => "$" + (n || 0).toFixed(2);
        
        // Calculate total sqft for UI display
        let totalSqFt = 0;
        panels.forEach(p => totalSqFt += (p.w * p.h) / 144);
        totalSqFt *= inputs.qty;

        document.getElementById('lbl-sqft').innerText = totalSqFt.toFixed(1);
        document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
        document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
        document.getElementById('ui-print').innerText = fmt(ret.printTotal);

        if (ret.installTotal > 0) {
            document.getElementById('row-install').classList.remove('hidden');
            document.getElementById('ui-install').innerText = fmt(ret.installTotal);
        } else {
            document.getElementById('row-install').classList.add('hidden');
        }

        const minOrder = parseFloat(backendData.Retail_Min_Order || 150);
        document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
        document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

        const instTxt = inputs.install === 'Yes' ? 'Installation Labor Included.' : 'Print Only (No Install).';
        const panelTxt = panels.map(p => ` - ${p.label}: ${p.w}" x ${p.h}"`).join('\n');
        
        document.getElementById('job-desc').value = `(x${inputs.qty}) Interior Wall Wrap. \nMaterial: GF 226 WallMark w/ ${inputs.laminate} Lam.\nSections:\n${panelTxt}\n${instTxt}`;

    } catch(e) {
        console.error(e);
    }
}

// API FETCH & NATIVE STATUS BAR UPDATER
window.addEventListener('load', async () => {
    if (typeof injectHeader === 'function') injectHeader("Interior Wall Wraps");
    
    renderPanels(); // Initialize dynamic UI

    const statusText = document.getElementById("status-text");
    const statusDot = document.getElementById("status-dot");

    try {
        const req = await fetch(`${SCRIPT_URL}?req=view_module&tab=PROD_Vinyl_Wraps`);
        backendData = await req.json();
        
        if(backendData.error) throw new Error(backendData.error);
        
        if(statusText) {
            statusText.innerText = "ONLINE";
            statusText.className = "font-bold text-green-500";
            if(statusDot) {
                statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                statusDot.classList.remove("animate-pulse");
            }
        }
        
        runCalc(); 
    } catch(e) {
        if(statusText) {
            statusText.innerText = "OFFLINE";
            statusText.className = "font-bold text-red-500";
        }
        console.error(e);
    }
});
</script>
</body>
</html>
