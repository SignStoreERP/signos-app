<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Matrix v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <style>
        .matrix-cell { transition: all 0.1s; }
        .matrix-cell:hover { background-color: #f3f4f6; }
        /* Freeze Header and First Column */
        .sticky-col { position: sticky; left: 0; z-index: 10; background-color: white; border-right: 2px solid #e5e7eb; }
        .sticky-header { position: sticky; top: 0; z-index: 20; background-color: #f9fafb; border-bottom: 2px solid #e5e7eb; }
        .z-30-corner { z-index: 30 !important; } /* Top Left Corner */
        
        .toggle-checkbox:checked { right: 0; border-color: #2563EB; }
        .toggle-checkbox:checked + .toggle-label { background-color: #2563EB; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- HEADER INJECTED HERE -->
    <div id="main-card" class="flex-1 flex flex-col min-h-0 bg-white shadow-xl m-4 rounded-xl border border-gray-200 overflow-hidden">
        
        <!-- TOOLBAR -->
        <div class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shrink-0">
            <div>
                <h2 class="text-lg font-bold text-gray-800">Production Cost Matrix</h2>
                <p class="text-xs text-gray-500">Toggle active cost variables per product line.</p>
            </div>
            <div class="flex items-center gap-2">
                <div id="save-indicator" class="hidden text-xs font-bold text-green-600 flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> SAVED
                </div>
                <button onclick="loadData()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded text-xs font-bold border border-gray-200 transition">REFRESH</button>
            </div>
        </div>

        <!-- MATRIX GRID -->
        <div class="flex-1 overflow-auto relative">
            <table class="w-full text-left border-collapse">
                <thead class="text-xs text-gray-500 font-bold uppercase bg-gray-50">
                    <tr id="matrix-header">
                        <!-- Header injected via JS -->
                    </tr>
                </thead>
                <tbody id="matrix-body" class="text-xs font-medium text-gray-700 divide-y divide-gray-100">
                    <!-- Body injected via JS -->
                </tbody>
            </table>
            <div id="loader" class="absolute inset-0 flex items-center justify-center bg-white/80 z-50">
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-xs font-bold text-gray-400 mt-2 tracking-widest">LOADING MATRIX...</span>
                </div>
            </div>
        </div>

    </div>

<script>
    let definitions = [];
    let matrix = [];
    
    // --- 1. SETUP ---
    window.onload = function() {
        injectHeader("Cost Matrix");
        loadData();
    };

    // --- 2. FETCH DATA ---
    async function loadData() {
        document.getElementById('loader').classList.remove('hidden');
        
        // Status Indicators
        const statusText = document.getElementById("status-text");
        const statusDot = document.getElementById("status-dot");

        try {
            // Parallel Fetch: Definitions AND Matrix
            const [defRes, matRes] = await Promise.all([
                fetch(`${SCRIPT_URL}?req=table&tab=REF_Cost_Definitions`),
                fetch(`${SCRIPT_URL}?req=table&tab=SYS_Cost_Matrix`)
            ]);

            const defData = await defRes.json();
            const matData = await matRes.json();

            if(defData.error) throw new Error(defData.error);
            if(matData.error) throw new Error(matData.error);

            definitions = defData;
            matrix = matData;
            
            renderMatrix();
            document.getElementById('loader').classList.add('hidden');

            // UPDATE HEADER TO ONLINE
            if(statusText) {
                statusText.innerText = "ONLINE";
                statusText.className = "font-bold text-green-500";
                statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                statusDot.classList.remove("animate-pulse");
            }

        } catch(e) {
            console.error(e);
            alert("Error loading matrix: " + e.message);
            document.getElementById('loader').classList.add('hidden');
            
            // UPDATE HEADER TO OFFLINE
            if(statusText) {
                statusText.innerText = "OFFLINE";
                statusText.className = "font-bold text-red-500";
                statusDot.className = "w-2 h-2 rounded-full bg-red-500";
            }
        }
    }

    // --- 3. RENDER LOGIC ---
    function renderMatrix() {
        const thead = document.getElementById('matrix-header');
        const tbody = document.getElementById('matrix-body');
        
        // A. Build Headers (Products)
        // Get keys from first matrix row, ignoring 'Cost_ID'
        if(matrix.length === 0) return;
        const products = Object.keys(matrix).filter(k => k !== 'Cost_ID');
        
        let headerHTML = `<th class="p-4 sticky-col z-30-corner min-w-[200px] border-b border-r border-gray-200 bg-gray-50">COST VARIABLE</th>`;
        products.forEach(prod => {
            headerHTML += `<th class="p-4 sticky-header min-w-[100px] text-center border-l border-gray-200">${prod.replace('PROD_', '')}</th>`;
        });
        thead.innerHTML = headerHTML;

        // B. Build Rows (Costs)
        tbody.innerHTML = "";
        
        // Loop through Definitions to preserve "Master" order/categories
        definitions.forEach(def => {
            const costID = def.Cost_ID;
            // Find this row in the Matrix data
            const matrixRow = matrix.find(r => r.Cost_ID === costID);
            
            if(!matrixRow) return; // Skip if not in matrix yet

            let rowHTML = `
                <td class="p-3 sticky-col bg-white border-r border-gray-100 group">
                    <div class="font-bold text-gray-800">${def.Display_Name}</div>
                    <div class="text-[9px] text-gray-400 font-mono group-hover:text-blue-500">${costID}</div>
                </td>`;

            products.forEach(prod => {
                const val = matrixRow[prod]; // TRUE, FALSE, or Number
                rowHTML += renderCell(prod, costID, val);
            });

            const tr = document.createElement('tr');
            tr.innerHTML = rowHTML;
            tr.className = "hover:bg-gray-50";
            tbody.appendChild(tr);
        });
    }

    function renderCell(prod, cost, val) {
        let content = "";
        const isBool = (val === true || val === false || val === 'TRUE' || val === 'FALSE');
        
        if(isBool) {
            // Render Toggle
            const checked = (val === true || val === 'TRUE') ? 'checked' : '';
            content = `
                <div class="flex justify-center">
                    <div class="relative inline-block w-8 align-middle select-none">
                        <input type="checkbox" ${checked} onchange="updateCell('${prod}', '${cost}', this.checked)" 
                            class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300"/>
                        <label class="toggle-label block overflow-hidden h-4 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>`;
        } else {
            // Render Input (Override)
            content = `
                <div class="flex justify-center">
                    <input type="number" value="${val}" onchange="updateCell('${prod}', '${cost}', this.value)"
                        class="w-16 text-center border border-gray-200 rounded text-xs py-1 font-bold text-blue-600 focus:border-blue-500 outline-none bg-blue-50/50">
                </div>`;
        }

        return `<td class="p-3 border-l border-gray-100 matrix-cell">${content}</td>`;
    }

    // --- 4. UPDATE LOGIC ---
    async function updateCell(prod, cost, value) {
        const u = sessionStorage.getItem('signos_user') || 'Admin';
        
        // Optimistic UI Update (Already handled by input change)
        showSaving(true);

        try {
            const url = `${SCRIPT_URL}?req=update_matrix&product_id=${prod}&cost_id=${cost}&value=${value}&user=${u}`;
            const res = await fetch(url);
            const data = await res.json();
            
            if(data.status === 'success') {
                showSaving(false);
            } else {
                throw new Error(data.message);
            }
        } catch(e) {
            alert("Update Failed: " + e.message);
            showSaving(false); // Should probably revert UI here in V2
        }
    }

    function showSaving(isSaving) {
        const ind = document.getElementById('save-indicator');
        if(isSaving) {
            ind.innerHTML = `<div class="w-3 h-3 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div> SAVING...`;
            ind.className = "text-xs font-bold text-blue-600 flex items-center gap-1";
            ind.classList.remove('hidden');
        } else {
            ind.innerHTML = `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> SAVED`;
            ind.className = "text-xs font-bold text-green-600 flex items-center gap-1";
            setTimeout(() => ind.classList.add('hidden'), 2000);
        }
    }
</script>
</body>
</html>
