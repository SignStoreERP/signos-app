<!-- ARTIFACT: Coro_Calculator.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coroplast Calculator v6.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; background: #eff6ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .side-btn.selected { background-color: #2563eb; color: white; border-color: #2563eb; }
        .mode-sales #btn-cost, .mode-sales #btn-vend { display: none !important; }
        .mode-prod #btn-retail, .mode-prod #btn-vend { display: none !important; }
        .blur-section { filter: grayscale(100%) opacity(0.5); pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-md mx-auto w-full bg-white shadow-2xl overflow-hidden min-h-screen sm:min-h-0 sm:my-10 sm:rounded-xl border border-gray-200">
        <!-- HEADER -->
        <div class="bg-gray-900 px-6 py-4 text-white flex justify-between items-center">
            <a href="#" onclick="goBack()" class="text-gray-400 hover:text-white text-xs font-bold uppercase flex items-center gap-1">MENU</a>
            <h2 class="text-lg font-bold" id="product-label">Custom Coroplast</h2>
            <button onclick="location.reload()" class="text-gray-400 hover:text-white">↺</button>
        </div>

        <!-- WARNINGS -->
        <div id="size-warn" class="hidden bg-orange-500 text-white text-center py-2 px-4 text-xs font-bold uppercase">⚠️ Oversized: Exceeds 48" x 96" Sheet</div>
        <div id="profit-warn" class="hidden bg-red-600 text-white text-center py-2 px-4 text-sm font-bold uppercase">🛑 LOSS ALERT</div>

        <!-- INPUTS -->
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Width</label><input type="number" id="width" value="24" class="w-full border p-2 rounded font-bold text-gray-800" oninput="checkDim(); calculate()"></div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Height</label><input type="number" id="height" value="18" class="w-full border p-2 rounded font-bold text-gray-800" oninput="checkDim(); calculate()"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Quantity</label><input type="number" id="qty" value="10" class="w-full border p-2 rounded font-bold text-gray-800" oninput="calculate()"></div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Files</label><input type="number" id="files" value="1" class="w-full border p-2 rounded font-bold text-gray-800" oninput="calculate()"></div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Material</label>
                <select id="material" class="w-full border p-2 rounded font-bold text-sm" onchange="checkMethod(); calculate()">
                    <option value="4mm">4mm Coroplast (Standard)</option>
                    <option value="10mm">10mm Coroplast (Heavy Duty)</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" id="btn-side-1" class="side-btn selected py-2 border rounded font-bold text-sm" onclick="setSides(1)">Single Sided</button>
                <button type="button" id="btn-side-2" class="side-btn py-2 border rounded font-bold text-sm" onclick="setSides(2)">Double Sided</button>
                <input type="hidden" id="sides" value="1">
            </div>
            <!-- Finishing -->
            <div class="border-t border-gray-100 pt-2 space-y-2">
                <div class="flex justify-between items-center"><span class="text-xs font-bold text-gray-700">H-Stakes?</span><select id="stake-type" class="border text-xs p-1 rounded" onchange="calculate()"><option value="None">None</option><option value="Std">Standard</option><option value="HD">Heavy Duty</option></select></div>
                <div class="flex justify-between items-center"><span class="text-xs font-bold text-gray-700">Grommets?</span><input type="checkbox" id="has-grommets" class="toggle-checkbox" onchange="calculate()"></div>
            </div>
        </div>

        <!-- METRICS -->
        <div class="border-t border-gray-200">
            <div class="flex">
                <button onclick="switchTab('retail')" class="flex-1 py-3 text-xs font-bold text-gray-500 bg-gray-50 tab-btn active" id="btn-retail">RETAIL</button>
                <button onclick="switchTab('cost')" class="flex-1 py-3 text-xs font-bold text-gray-500 bg-gray-50 tab-btn" id="btn-cost">IN-HOUSE</button>
                <button onclick="switchTab('vend')" class="flex-1 py-3 text-xs font-bold text-gray-500 bg-gray-50 tab-btn" id="btn-vend">VENDED</button>
            </div>
            
            <div id="tab-retail" class="tab-content active bg-white p-6">
                <div class="flex justify-between items-center mb-4"><span class="text-xs font-bold text-gray-400 uppercase">Unit Price</span><span class="text-2xl font-bold text-gray-900" id="unit-price">$0.00</span></div>
                <div class="flex justify-between items-end border-t pt-4"><div><span class="text-xs font-bold text-gray-400 uppercase">Total</span></div><span class="text-3xl font-black text-blue-600" id="total-price">---</span></div>
            </div>
            
            <div id="tab-cost" class="tab-content bg-yellow-50 p-6"><div class="flex justify-between text-yellow-900 font-bold text-sm"><span>Total Cost:</span> <span id="cost-total">$0.00</span></div></div>
            <div id="tab-vend" class="tab-content bg-indigo-50 p-6"><div class="flex justify-between text-indigo-900 font-bold text-sm"><span>Total Vended:</span> <span id="vend-total">$0.00</span></div></div>
        </div>

        <!-- DESCRIPTION -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-20" readonly></textarea>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypbRuIJmkXqC447Yd1akhlhDrEyRoq0ypfZNHf0dI77KrZWUUeOqvUm5122O2RdzyYEQ/exec";
        let backend = {};
        
        // Simplified Logic for Demo
        function initSession() {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode') || 'sales';
            document.body.classList.add('mode-'+mode);
        }
        function goBack() { window.location.href = `menu.html?mode=${new URLSearchParams(window.location.search).get('mode')}`; }
        function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
        function setSides(n) { document.getElementById('sides').value = n; document.querySelectorAll('.side-btn').forEach(b=>b.classList.remove('selected')); document.getElementById('btn-side-'+n).classList.add('selected'); calculate(); }
        function switchTab(id) { document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+id).classList.add('active'); document.getElementById('btn-'+id).classList.add('active'); }

        window.onload = async function() {
            initSession();
            try {
                const response = await fetch(`${SCRIPT_URL}?tab=PROD_Coroplast_Signs`);
                backend = await response.json();
                document.getElementById('product-label').innerText = "ONLINE";
                calculate();
            } catch(e) { console.log(e); }
        };

        function checkDim() {
            const w = parseFloat(document.getElementById('width').value)||0;
            const h = parseFloat(document.getElementById('height').value)||0;
            const dim1 = Math.min(w,h);
            const dim2 = Math.max(w,h);
            // Logic Fix: Only oversized if SMALL side > 48 OR LARGE side > 96
            if (dim1 > 48 || dim2 > 96) {
                document.getElementById('size-warn').classList.remove('hidden');
                document.getElementById('tab-cost').classList.add('blur-section');
            } else {
                document.getElementById('size-warn').classList.add('hidden');
                document.getElementById('tab-cost').classList.remove('blur-section');
            }
        }

        function calculate() {
            if(!backend.Item_Name) return;
            const w = parseFloat(document.getElementById('width').value)||0;
            const h = parseFloat(document.getElementById('height').value)||0;
            const qty = parseFloat(document.getElementById('qty').value)||1;
            const sides = parseInt(document.getElementById('sides').value);
            const mat = document.getElementById('material').value;
            const stakeType = document.getElementById('stake-type').value;
            const hasGrom = document.getElementById('has-grommets').checked;

            const sqft = (w*h)/144;
            const totalSqFt = sqft * qty;

            // RETAIL
            let baseRate = mat === '4mm' ? 8.00 : 15.00; // Fallback
            if(backend.Retail_Price_4mm_Base) baseRate = (mat==='4mm' ? backend.Retail_Price_4mm_Base : backend.Retail_Price_10mm_Base);
            if(sides===2) baseRate += (mat==='4mm' ? 2.50 : 5.00);

            let price = baseRate * totalSqFt;
            if(stakeType === 'Std') price += (qty * 2.50);
            if(stakeType === 'HD') price += (qty * 4.00);
            if(hasGrom) price += (qty * 4 * 0.25);

            // Min
            if(price < 100) price = 100;

            document.getElementById('unit-price').innerText = "$" + (price/qty).toFixed(2);
            document.getElementById('total-price').innerText = "$" + price.toFixed(2);

            // Generate Description
            const sideTxt = sides === 1 ? "Single-Sided" : "Double-Sided";
            const finishTxt = [];
            if(stakeType !== 'None') finishTxt.push(stakeType + " Stakes");
            if(hasGrom) finishTxt.push("Grommets");
            
            const desc = `(x${qty}) ${w}" x ${h}" ${mat} Coroplast Signs. ${sideTxt} Print. ${finishTxt.length > 0 ? finishTxt.join(', ') : 'No Hardware'}.`;
            document.getElementById('job-desc').value = desc;
        }
    </script>
</body>
</html>
