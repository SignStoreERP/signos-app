<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yard Signs | SignOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Model Viewer for AR -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
    
    <style>
        .checkered-bg {
            background-color: #e5e7eb;
            background-image: linear-gradient(45deg, #f3f4f6 25%, transparent 25%), linear-gradient(-45deg, #f3f4f6 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f3f4f6 75%), linear-gradient(-45deg, transparent 75%, #f3f4f6 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        model-viewer { width: 100%; height: 100%; display: none; }
        .tool-btn { @apply bg-white border border-gray-300 rounded p-1 text-gray-600 hover:bg-blue-50 hover:text-blue-600 transition shadow-sm; }
        @media print { body { display: none; } }
    </style>
    <script>
        const user = sessionStorage.getItem('signos_user');
        if (!user) window.location.href = 'index.html';
    </script>
</head>
<body class="bg-gray-100 h-screen font-sans flex flex-col overflow-hidden">

    <!-- AUTH HEADER -->
    <div class="bg-gray-900 text-white px-4 py-2 flex justify-between items-center text-xs shadow-md z-30 shrink-0">
        <div class="flex items-center gap-2">
            <a href="order_menu.html" class="text-gray-400 hover:text-white font-bold">← EXIT</a>
            <span class="text-gray-600">|</span>
            <span class="font-bold text-gray-200 uppercase" id="auth-user">---</span>
        </div>
        <button onclick="sessionStorage.clear(); window.location.href='index.html'" class="text-red-400 hover:text-white font-bold uppercase tracking-wider">Logout</button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- LEFT PANEL: CONTROLS -->
        <div class="w-full md:w-1/3 min-w-[320px] bg-white border-r border-gray-200 flex flex-col shadow-xl z-20 h-1/2 md:h-full order-2 md:order-1">
            
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <div>
                    <h1 class="text-lg font-black text-gray-900 leading-none">Yard Signs</h1>
                    <p class="text-[10px] text-gray-500 font-bold mt-1">24" x 18" Coroplast</p>
                </div>
                <div class="text-right">
                    <div class="text-xs font-bold text-gray-400">TOTAL</div>
                    <div class="text-2xl font-black text-blue-600 leading-none" id="total-price">---</div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Specs -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label>
                        <input type="number" id="qty" value="10" class="w-full border border-gray-300 p-2 rounded font-bold text-gray-800" oninput="calculate()">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Sides</label>
                        <select id="sides" class="w-full border border-gray-300 p-2 rounded font-bold text-gray-800 bg-white" onchange="calculate(); update3DState()">
                            <option value="1">Single Sided</option>
                            <option value="2">Double Sided</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center p-3 border rounded bg-gray-50">
                    <input type="checkbox" id="stakes" class="w-5 h-5 text-blue-600 rounded" checked onchange="calculate(); update3DState()">
                    <label for="stakes" class="ml-2 text-xs font-bold text-gray-700">Include H-Stakes</label>
                </div>

                <!-- Design Tools -->
                <div class="border-t border-gray-100 pt-4">
                    <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Design Tools</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="openEditor('A')" class="border border-blue-200 bg-blue-50 text-blue-700 font-bold py-3 rounded text-xs hover:bg-blue-100 transition flex items-center justify-center gap-1">
                            <span>🎨 Edit Front</span>
                        </button>
                        <button onclick="openEditor('B')" id="btn-edit-b" class="border border-gray-200 bg-gray-50 text-gray-400 font-bold py-3 rounded text-xs hidden flex items-center justify-center gap-1">
                            <span>🎨 Edit Back</span>
                        </button>
                    </div>
                </div>
                
                <div id="ar-status" class="hidden text-center p-2 bg-blue-50 text-blue-600 text-[10px] font-bold rounded animate-pulse">
                    Preparing AR Experience...
                </div>
            </div>

            <!-- Action Footer -->
            <div class="p-4 border-t border-gray-200 bg-white">
                <button onclick="addToCart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-[1.01] transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    ADD TO CART
                </button>
            </div>
        </div>

        <!-- RIGHT PANEL: 3D VIEW -->
        <div class="w-full md:flex-1 bg-gray-200 relative h-1/2 md:h-full order-1 md:order-2">
            
            <!-- Three.js Canvas -->
            <div id="canvas-container" class="absolute inset-0 cursor-move z-10"></div>
            
            <!-- Hidden Model Viewer for iOS AR Hand-off -->
            <model-viewer id="ar-viewer" src="" ios-src="" ar ar-modes="quick-look" camera-controls></model-viewer>

            <!-- Overlay Controls -->
            <div class="absolute bottom-4 right-4 flex gap-2 z-20">
                <button onclick="fitCamera()" class="bg-white p-2 rounded shadow text-gray-600 hover:text-blue-600" title="Fit to View">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
            </div>

            <!-- AR BUTTON OVERLAY -->
            <div class="absolute bottom-4 left-4 z-20">
                <button id="btn-ar" class="bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold flex items-center gap-2 transition transform hover:scale-105">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"/></svg>
                    View in AR
                </button>
            </div>

            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur rounded px-2 py-1 shadow-sm pointer-events-none z-20">
                <span class="text-[10px] font-bold text-gray-500 tracking-wider">3D PREVIEW</span>
            </div>
        </div>

    </div>

    <!-- FULL DESIGN STUDIO MODAL -->
    <div id="editor-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-2 sm:p-4">
        <div class="bg-white rounded-xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden">
            <div class="bg-gray-900 text-white px-4 py-3 flex justify-between items-center shrink-0">
                <h3 class="font-bold">Design Studio <span id="editor-side-label" class="text-blue-400 ml-2">SIDE A</span></h3>
                <button onclick="closeEditor()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            
            <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                <!-- Toolbar -->
                <div class="w-full md:w-64 bg-gray-50 border-r border-gray-200 p-4 overflow-y-auto flex md:flex-col gap-6 shrink-0">
                    <div>
                        <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Source</h4>
                        <label class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded cursor-pointer text-center text-xs shadow">
                            <input type="file" id="editor-upload" accept="image/*" class="hidden"> 📷 Upload Image
                        </label>
                        <div class="mt-3 flex items-center gap-2">
                            <label class="text-xs text-gray-600 font-bold">Background:</label>
                            <input type="color" id="editor-bg-color" value="#ffffff" class="w-8 h-8 rounded cursor-pointer border border-gray-300">
                        </div>
                    </div>
                    <div>
                        <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Transform</h4>
                        <div class="grid grid-cols-3 gap-2">
                            <button class="tool-btn" title="Rotate 90" onclick="rotateImg()">↻</button>
                            <button class="tool-btn" title="Flip H" onclick="flipImg('h')">↔</button>
                            <button class="tool-btn" title="Flip V" onclick="flipImg('v')">↕</button>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Sizing</h4>
                        <div class="space-y-2">
                            <button class="w-full text-xs bg-white border border-gray-300 rounded py-2 hover:bg-blue-50 font-medium" onclick="setSizing('fit')">Fit (Contain)</button>
                            <button class="w-full text-xs bg-white border border-gray-300 rounded py-2 hover:bg-blue-50 font-medium" onclick="setSizing('fill')">Scale to Fill (Cover)</button>
                            <button class="w-full text-xs bg-white border border-gray-300 rounded py-2 hover:bg-blue-50 font-medium" onclick="setSizing('stretch')">Stretch to Fit</button>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Align</h4>
                        <div class="grid grid-cols-3 gap-2">
                            <div></div><button class="tool-btn text-xs" onclick="alignImg('top')">Top</button><div></div>
                            <button class="tool-btn text-xs" onclick="alignImg('left')">Left</button>
                            <button class="tool-btn text-xs font-bold" onclick="alignImg('center')">+</button>
                            <button class="tool-btn text-xs" onclick="alignImg('right')">Right</button>
                            <div></div><button class="tool-btn text-xs" onclick="alignImg('bottom')">Bot</button><div></div>
                        </div>
                    </div>
                    <button onclick="resetCanvas()" class="text-xs text-red-400 hover:text-red-600 underline mt-auto text-center w-full">Clear / Reset Canvas</button>
                </div>
                <!-- Canvas -->
                <div class="flex-1 bg-gray-200 relative overflow-hidden flex items-center justify-center checkered-bg">
                    <canvas id="editor-canvas" class="shadow-2xl border-4 border-white max-w-[90%] max-h-[90%] cursor-move"></canvas>
                    <div class="absolute bottom-4 left-4 bg-white/80 p-2 rounded text-[10px] text-gray-500 pointer-events-none">Drag to reposition • Use toolbar to adjust</div>
                </div>
            </div>
            <div class="bg-white border-t border-gray-200 px-4 py-3 flex justify-end gap-3 shrink-0">
                <button onclick="closeEditor()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded font-bold">Cancel</button>
                <button id="btn-editor-save" class="px-6 py-2 text-sm bg-blue-600 text-white font-bold rounded shadow hover:bg-blue-700">Save & Apply</button>
            </div>
        </div>
    </div>

    <!-- LOGIC -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

        // --- PRICING ---
        const SCRIPT_URL = "https://script.google.com/a/macros/signstoremacon.com/s/AKfycbzEEf1lQ4xkXdSqcLgfLJ3FmNbLGUyElTzmac7U-t1msxLvJL8iSZ30R3bm5dCpmlKqPA/exec";
        let backend = {};

        window.calculate = function() {
            if(!backend.Item_Name) return;
            const qty = parseFloat(document.getElementById('qty').value)||1;
            const sides = parseInt(document.getElementById('sides').value);
            const hasStakes = document.getElementById('stakes').checked;

            let base = parseFloat(backend.Retail_Price_Sign_SS || 12);
            if(sides===2) base += parseFloat(backend.Retail_Price_Sign_DS || 3);
            
            let disc = 0;
            if(qty>=250) disc=0.1; else if(qty>=100) disc=0.08; else if(qty>=50) disc=0.05; else if(qty>=20) disc=0.02;

            let price = (base * (1-disc)) * qty;
            if(hasStakes) price += (qty * parseFloat(backend.Retail_Price_Stake || 2.50));
            price += parseFloat(backend.Retail_Fee_Setup || 15);
            const min = parseFloat(backend.Retail_Min_Order || 100);
            if(price < min) price = min;

            document.getElementById('total-price').innerText = "$" + price.toFixed(2);
        };

        // --- 3D ENGINE ---
        let scene, camera, renderer, controls, signGroup, matFront, matBack;
        const defaultState = { img: null, imgLoaded: false, x:600, y:450, w:0, h:0, rot:0, flipX:1, flipY:1, bgColor: '#ffffff', canvasW:1200, canvasH:900 };
        const savedStates = { A: { ...defaultState }, B: { ...defaultState } };
        let activeSide = 'A';
        let currentState = savedStates.A;

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe5e7eb);
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 15, 45);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 17, 0);
            
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const dir = new THREE.DirectionalLight(0xffffff, 1.5); dir.position.set(10, 20, 20); dir.castShadow = true; scene.add(dir);

            buildSign(); animate(); fitCamera();
            window.addEventListener('resize', () => { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });
        }

        function buildSign() {
            if(signGroup) scene.remove(signGroup);
            signGroup = new THREE.Group();

            const matWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0 });
            matFront = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0 });
            matBack = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0 });
            
            const blankUrl = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=";
            new THREE.TextureLoader().load(blankUrl, (t) => { matFront.map = t; matBack.map = t; matFront.needsUpdate = true; matBack.needsUpdate = true; });

            // FIX: Rebuilt the board out of separate meshes to prevent iOS USDZ crashing
            const boardThickness = 0.15;
            const boardBase = new THREE.Mesh(new THREE.BoxGeometry(24, 18, boardThickness * 0.98), matWhite);
            boardBase.position.y = 17; boardBase.castShadow = true; boardBase.name = "Sign_Board_Base";
            signGroup.add(boardBase);

            const frontFace = new THREE.Mesh(new THREE.PlaneGeometry(24, 18), matFront);
            frontFace.position.set(0, 17, boardThickness / 2); frontFace.name = "Sign_Board_Front";
            signGroup.add(frontFace);

            const backFace = new THREE.Mesh(new THREE.PlaneGeometry(24, 18), matBack);
            backFace.rotation.y = Math.PI; // Flip it 180 degrees
            backFace.position.set(0, 17, -boardThickness / 2); backFace.name = "Sign_Board_Back";
            signGroup.add(backFace);

            // Wires
            const wireMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.6, roughness: 0.4 });
            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08, 24), wireMat); legL.position.set(-5, 4, 0); legL.name="stake";
            const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08, 24), wireMat); legR.position.set(5, 4, 0); legR.name="stake";
            const bar1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08, 10), wireMat); bar1.rotation.z=1.57; bar1.position.set(0,8,0); bar1.name="stake";
            const bar2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08, 10), wireMat); bar2.rotation.z=1.57; bar2.position.set(0,0,0); bar2.name="stake";
            signGroup.add(legL, legR, bar1, bar2);

            // Grass
            const grass = new THREE.Mesh(new THREE.CircleGeometry(25, 32), new THREE.MeshStandardMaterial({ color: 0x4ade80 }));
            grass.rotation.x = -1.57; grass.position.y = -8; grass.receiveShadow = true; grass.name = "Grass_Plane";
            signGroup.add(grass);

            scene.add(signGroup);
        }

        window.fitCamera = function() { camera.position.set(0, 15, 45); controls.target.set(0, 17, 0); controls.update(); };
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

        window.update3DState = function() {
            const sides = document.getElementById('sides').value;
            const hasStakes = document.getElementById('stakes').checked;
            signGroup.traverse(c => { if(c.name==='stake') c.visible = hasStakes; });
            const btnB = document.getElementById('btn-edit-b');
            if(sides === "2") btnB.classList.remove('hidden');
            else { btnB.classList.add('hidden'); matBack.map=null; matBack.needsUpdate=true; }
        };

        // --- AR EXPORT LOGIC ---
        document.getElementById('btn-ar').addEventListener('click', () => {
            const btn = document.getElementById('btn-ar');
            const status = document.getElementById('ar-status');
            const mv = document.getElementById('ar-viewer');
            
            status.classList.remove('hidden');
            btn.disabled = true;

            const exportScene = new THREE.Scene();
            const sceneClone = signGroup.clone();
            
            // Remove stakes entirely if unselected so they don't hide in the exported file
            if (!document.getElementById('stakes').checked) {
                const toRemove = [];
                sceneClone.traverse(c => { if(c.name==='stake') toRemove.push(c); });
                toRemove.forEach(c => c.parent.remove(c));
            }

            // FIX: Foolproof Scaling. WebXR uses Meters. Our scene is built in Inches. (1 inch = 0.0254 meters)
            // Instead of scaling the group, we map the scale directly into the physical geometry to ensure 100% AR compatibility.
            sceneClone.traverse((child) => {
                if (child.isMesh) {
                    child.geometry = child.geometry.clone();
                    child.geometry.scale(0.0254, 0.0254, 0.0254);
                    child.position.multiplyScalar(0.0254);
                }
            });

            // Shift the whole scene up so the grass (at Y = -8 inches) sits exactly at Y = 0 (the real world AR Floor)
            sceneClone.position.y += (8 * 0.0254);
            
            // Remove Grass for AR
            const grass = sceneClone.getObjectByName("Grass_Plane"); if(grass) grass.parent.remove(grass);

            exportScene.add(sceneClone);

            const exporter = new GLTFExporter();
            exporter.parse(exportScene, async function ( gltf ) {
                const glbBlob = new Blob( [ gltf ], { type: 'application/octet-stream' } );
                const glbUrl = URL.createObjectURL( glbBlob );
                
                try {
                    const usdzExporter = new USDZExporter();
                    const usdzArray = await usdzExporter.parse( exportScene );
                    const usdzBlob = new Blob( [ usdzArray ], { type: 'model/vnd.usdz+zip' } );
                    const usdzUrl = URL.createObjectURL( usdzBlob );

                    mv.src = glbUrl;
                    mv.iosSrc = usdzUrl;
                    
                    setTimeout(() => {
                        mv.activateAR();
                        status.classList.add('hidden');
                        btn.disabled = false;
                    }, 100);
                } catch(err) {
                    console.error("AR Error:", err);
                    alert("Could not generate AR experience.");
                    status.classList.add('hidden');
                    btn.disabled = false;
                }
            }, undefined, { binary: true });
        });

        // --- EDITOR LOGIC ---
        const canvas = document.getElementById('editor-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1200; canvas.height = 900;

        window.openEditor = function(side) {
            activeSide = side;
            currentState = savedStates[side];
            document.getElementById('editor-side-label').innerText = "SIDE " + side;
            document.getElementById('editor-bg-color').value = currentState.bgColor;
            drawEditor();
            document.getElementById('editor-modal').classList.remove('hidden');
        };

        window.closeEditor = function() { document.getElementById('editor-modal').classList.add('hidden'); };
        window.resetCanvas = function() { currentState.img = null; currentState.imgLoaded = false; currentState.bgColor = "#ffffff"; drawEditor(); };

        function drawEditor() {
            ctx.fillStyle = currentState.bgColor; ctx.fillRect(0,0,1200,900);
            if(currentState.img) {
                ctx.save();
                ctx.translate(currentState.x, currentState.y);
                ctx.rotate(currentState.rot * Math.PI/180);
                ctx.scale(currentState.flipX, currentState.flipY);
                ctx.drawImage(currentState.img, -currentState.w/2, -currentState.h/2, currentState.w, currentState.h);
                ctx.restore();
            }
        }

        document.getElementById('editor-upload').addEventListener('change', (e) => {
            const r = new FileReader();
            r.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    currentState.img = img; currentState.imgLoaded = true;
                    const ratio = img.width/img.height;
                    if(ratio > 1.33) { currentState.w=1200; currentState.h=1200/ratio; }
                    else { currentState.h=900; currentState.w=900*ratio; }
                    currentState.x=600; currentState.y=450;
                    drawEditor();
                };
                img.src = evt.target.result;
            };
            // FIX: Replaced `e.target.files` with `e.target.files` so it actually reads the specific image.
            if(e.target.files && e.target.files) r.readAsDataURL(e.target.files);
        });

        document.getElementById('editor-bg-color').addEventListener('input', (e) => { currentState.bgColor = e.target.value; drawEditor(); });

        window.rotateImg = () => { currentState.rot = (currentState.rot+90)%360; drawEditor(); };
        window.flipImg = (ax) => { if(ax==='h') currentState.flipX*=-1; else currentState.flipY*=-1; drawEditor(); };
        window.setSizing = (mode) => {
            if(!currentState.img) return;
            currentState.x=600; currentState.y=450; currentState.rot=0;
            if(mode==='fill') { currentState.w=1200; currentState.h=900; }
            else if(mode==='fit') { const r = currentState.img.width/currentState.img.height; if(r>1.33) { currentState.w=1200; currentState.h=1200/r; } else { currentState.h=900; currentState.w=900*r; } }
            else if(mode==='stretch') { currentState.w=1200; currentState.h=900; }
            drawEditor();
        };
        
        window.alignImg = (pos) => {
            if(!currentState.img) return;
            const cw=1200, ch=900;
            if(pos==='center'){ currentState.x=cw/2; currentState.y=ch/2; }
            else if(pos==='left') currentState.x=currentState.w/2;
            else if(pos==='right') currentState.x=cw-currentState.w/2;
            else if(pos==='top') currentState.y=currentState.h/2;
            else if(pos==='bottom') currentState.y=ch-currentState.h/2;
            drawEditor();
        };

        // Touch/Mouse Drag
        let isDragging = false; let lastX, lastY;
        canvas.addEventListener('mousedown', startDrag); canvas.addEventListener('touchstart', startDrag, {passive:false});
        window.addEventListener('mousemove', doDrag); window.addEventListener('touchmove', doDrag, {passive:false});
        window.addEventListener('mouseup', stopDrag); window.addEventListener('touchend', stopDrag);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches.clientX : e.clientX; // Ensure touch uses the first finger
            const clientY = e.touches ? e.touches.clientY : e.clientY;
            return { x: (clientX - rect.left) * (canvas.width/rect.width), y: (clientY - rect.top) * (canvas.height/rect.height) };
        }
        function startDrag(e) { if(!currentState.img) return; isDragging=true; const p = getPos(e); lastX=p.x; lastY=p.y; }
        function doDrag(e) { if(!isDragging) return; e.preventDefault(); const p = getPos(e); currentState.x += (p.x - lastX); currentState.y += (p.y - lastY); lastX=p.x; lastY=p.y; drawEditor(); }
        function stopDrag() { isDragging=false; }

        document.getElementById('btn-editor-save').addEventListener('click', () => {
            const dataUrl = canvas.toDataURL('image/png');
            savedStates[activeSide].previewUrl = dataUrl;
            new THREE.TextureLoader().load(dataUrl, (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                if(activeSide==='A') { matFront.map=tex; matFront.needsUpdate=true; }
                else { matBack.map=tex; matBack.needsUpdate=true; }
            });
            closeEditor();
        });

        // --- CART ---
        window.addToCart = function() {
            renderer.render(scene, camera);
            const thumb3D = renderer.domElement.toDataURL('image/png');
            const item = {
                id: Date.now(),
                product: "Yard Sign",
                desc: document.getElementById('qty').value + "x Yard Signs. " + (document.getElementById('stakes').checked ? "w/ Stakes" : "Sign Only"),
                qty: document.getElementById('qty').value,
                price: document.getElementById('total-price').innerText,
                img3D: thumb3D,
                imgFront: savedStates.A.previewUrl || null,
                imgBack: savedStates.B.previewUrl || null
            };
            let cart = JSON.parse(sessionStorage.getItem('signos_cart')) || [];
            cart.push(item);
            sessionStorage.setItem('signos_cart', JSON.stringify(cart));
            window.location.href = 'order_menu.html';
        };

        window.onload = async function() {
            document.getElementById('auth-user').innerText = sessionStorage.getItem('signos_user');
            initThree();
            try {
                const r = await fetch(`${SCRIPT_URL}?tab=PROD_Yard_Signs`);
                backend = await r.json();
                calculate();
            } catch(e){}
        };
    </script>
</body>
</html>
