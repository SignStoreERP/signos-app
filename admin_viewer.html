<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer v2.0 | SignOS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <style>
        .log-row:hover { background-color: #f9fafb; }
        .log-auth { color: #2563eb; }
        .log-error { color: #dc2626; font-weight: bold; background-color: #fef2f2; }
        .log-checkout { color: #16a34a; font-weight: bold; background-color: #f0fdf4; }
        .archive-item.active { background-color: #eff6ff; border-left: 4px solid #2563eb; color: #1e40af; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col h-screen overflow-hidden">

    <!-- HEADER -->
    <div class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center shadow-lg shrink-0 z-20">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-black tracking-tight">SignOS Analyzer</h1>
            <span class="bg-blue-600 text-[10px] font-bold px-2 py-0.5 rounded text-white">CLOUD CONNECTED</span>
        </div>
        <div class="flex gap-4 text-xs font-bold items-center">
            <span class="text-gray-400">USER: <span class="text-white uppercase" id="auth-user">---</span></span>
            <span class="text-gray-600">|</span>
            <a href="#" onclick="goBack()" class="text-gray-300 hover:text-white uppercase">Exit</a>
        </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- SIDEBAR: ARCHIVE LIST -->
        <div class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0 z-10 shadow-lg">
            <div class="p-4 border-b border-gray-100 bg-gray-50">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Archive History</h2>
                <button onclick="loadArchiveList()" class="text-[10px] text-blue-500 hover:underline">↻ Refresh List</button>
            </div>
            <div id="archive-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Items Injected Here -->
                <div class="text-center py-8 text-gray-400 text-xs italic">Loading...</div>
            </div>
            <!-- Manual Upload Fallback -->
            <div class="p-3 border-t border-gray-200 bg-gray-50">
                <label class="block w-full text-center border-2 border-dashed border-gray-300 rounded p-2 cursor-pointer hover:border-blue-400 hover:bg-white transition group">
                    <span class="text-[10px] font-bold text-gray-400 group-hover:text-blue-600">Upload Local .txt</span>
                    <input type="file" id="file-input" accept=".txt" class="hidden">
                </label>
            </div>
        </div>

        <!-- MAIN CONTENT: TABLE -->
        <div class="flex-1 flex flex-col bg-gray-100 min-w-0">
            
            <!-- TOOLBAR -->
            <div class="bg-white border-b border-gray-200 p-3 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2 w-1/3">
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="search-box" placeholder="Filter logs (User, Action, IP)..." class="w-full text-sm border-none outline-none font-medium text-gray-600 placeholder-gray-300" onkeyup="filterLogs()">
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Loaded File</p>
                        <p class="text-xs font-bold text-gray-800 truncate max-w-[200px]" id="current-file-name">None Selected</p>
                    </div>
                    <div class="text-right border-l pl-4 border-gray-200">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Events</p>
                        <p class="text-xl font-black text-blue-600 leading-none" id="stat-count">0</p>
                    </div>
                </div>
            </div>

            <!-- SCROLLABLE TABLE -->
            <div class="flex-1 overflow-auto p-4">
                <div class="bg-white shadow-sm border border-gray-200 rounded-lg overflow-hidden min-w-[800px]">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 text-[10px] font-bold text-gray-500 uppercase border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="p-3 w-32 bg-gray-50">Timestamp</th>
                                <th class="p-3 w-32 bg-gray-50">User</th>
                                <th class="p-3 w-24 bg-gray-50">Role</th>
                                <th class="p-3 w-32 bg-gray-50">Action</th>
                                <th class="p-3 w-48 bg-gray-50">Target</th>
                                <th class="p-3 bg-gray-50">IP / Meta</th>
                            </tr>
                        </thead>
                        <tbody id="log-body" class="text-xs font-mono text-gray-600 divide-y divide-gray-100">
                            <tr><td colspan="6" class="p-10 text-center text-gray-400">Select a file from the sidebar to view logs.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loader" class="fixed inset-0 bg-white/80 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="text-center">
            <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-2"></div>
            <p class="text-xs font-bold text-blue-600 animate-pulse">FETCHING DATA...</p>
        </div>
    </div>

<script>
    let logData = [];

    window.onload = function() {
        const u = sessionStorage.getItem('signos_user');
        const r = sessionStorage.getItem('signos_role');
        if (r !== 'ADMIN') { alert("ACCESS DENIED"); window.location.href = 'menu.html'; }
        document.getElementById('auth-user').innerText = u;
        
        loadArchiveList();
    };

    // 1. FETCH LIST FROM API
    async function loadArchiveList() {
        const list = document.getElementById('archive-list');
        list.innerHTML = '<div class="text-center py-4"><div class="w-4 h-4 border-2 border-blue-200 border-t-blue-500 rounded-full animate-spin mx-auto"></div></div>';

        try {
            const response = await fetch(`${SCRIPT_URL}?req=get_archive_index`);
            const data = await response.json();

            list.innerHTML = "";
            if (!data || data.length === 0) {
                list.innerHTML = '<div class="text-center py-4 text-xs text-gray-400">No Archives Found</div>';
                return;
            }

            data.forEach(file => {
                const item = document.createElement('div');
                item.className = "archive-item p-3 border-b border-gray-100 cursor-pointer hover:bg-gray-50 transition";
                
                // Format Date for display
                const d = new Date(file.date);
                const dateStr = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const typeBadge = file.type === 'MANUAL_EXPORT' ? '<span class="text-[9px] text-orange-500 font-bold ml-1">MANUAL</span>' : '';

                item.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-bold text-gray-500">${dateStr}</span>
                        ${typeBadge}
                    </div>
                    <div class="text-xs font-bold text-gray-800 truncate" title="${file.name}">${file.name}</div>
                    <div class="text-[9px] text-gray-400 mt-0.5">${file.count} events</div>
                `;
                
                item.onclick = () => loadCloudFile(file.file_id, file.name, item);
                list.appendChild(item);
            });

        } catch (e) {
            list.innerHTML = `<div class="text-red-500 text-xs p-2">Error: ${e.message}</div>`;
        }
    }

    // 2. FETCH FILE CONTENT
    async function loadCloudFile(fileId, fileName, domElement) {
        // Highlight active
        document.querySelectorAll('.archive-item').forEach(el => el.classList.remove('active'));
        domElement.classList.add('active');
        
        document.getElementById('current-file-name').innerText = fileName;
        document.getElementById('loader').classList.remove('hidden');

        try {
            const response = await fetch(`${SCRIPT_URL}?req=get_log_content&file_id=${fileId}`);
            const data = await response.json();

            if(data.status === 'success') {
                parseLogs(data.content);
            } else {
                alert("Error reading file: " + data.message);
            }
        } catch(e) {
            alert("Network Error: " + e.message);
        } finally {
            document.getElementById('loader').classList.add('hidden');
        }
    }

    // 3. PARSE & RENDER (Shared Logic)
    function parseLogs(text) {
        const lines = text.split('\n');
        logData = [];
        let startIdx = 0;
        if (lines.includes("Timestamp")) startIdx = 2; // Skip headers

        for (let i = startIdx; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const cols = line.split('|').map(c => c.trim());
            
            if (cols.length >= 6) {
                logData.push({
                    time: cols,
                    ip: cols[2],
                    user: cols[1],
                    role: cols[3],
                    action: cols[4],
                    target: cols[5],
                    raw: line.toLowerCase()
                });
            }
        }
        renderTable(logData);
    }

    function renderTable(data) {
        const tbody = document.getElementById('log-body');
        tbody.innerHTML = '';
        document.getElementById('stat-count').innerText = data.length;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-400">File is empty or invalid format.</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.className = "log-row border-b border-gray-50";
            if (row.action === 'PRINT_ORDER') tr.classList.add('log-checkout');
            if (row.user === 'GUEST' && row.action === 'auth') tr.classList.add('log-error');
            if (row.action === 'auth' && row.role !== 'N/A') tr.classList.add('log-auth');

            tr.innerHTML = `
                <td class="p-3 whitespace-nowrap text-gray-400 font-mono text-[10px]">${row.time}</td>
                <td class="p-3 font-bold text-gray-800">${row.user}</td>
                <td class="p-3"><span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px] font-bold">${row.role}</span></td>
                <td class="p-3 font-bold uppercase text-xs">${row.action}</td>
                <td class="p-3 text-gray-500 text-xs">${row.target}</td>
                <td class="p-3 text-gray-400 font-mono text-[10px]">${row.ip}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterLogs() {
        const query = document.getElementById('search-box').value.toLowerCase();
        const filtered = logData.filter(row => row.raw.includes(query));
        renderTable(filtered);
    }

    // Local Upload Handler
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files;
        if (!file) return;
        document.getElementById('current-file-name').innerText = "Local: " + file.name;
        const reader = new FileReader();
        reader.onload = (e) => parseLogs(e.target.result);
        reader.readAsText(file);
    });
</script>
</body>
</html>
