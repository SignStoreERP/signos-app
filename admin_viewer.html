<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log Viewer v2.18 | SignOS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="logic_viewer.js"></script>

    <style>
        /* === UI OVERLAY SCROLLBARS (Mobile Friendly) === */
        .custom-scroll {
            scrollbar-width: thin; /* Firefox */
            scrollbar-color: #cbd5e1 #f1f1f1;
        }
        
        /* Webkit (Chrome/Safari) Styling */
        .custom-scroll::-webkit-scrollbar { 
            height: 8px; 
            width: 8px; 
        }
        .custom-scroll::-webkit-scrollbar-track { 
            background: #f8fafc; 
            border-top: 1px solid #e2e8f0;
        }
        .custom-scroll::-webkit-scrollbar-thumb { 
            background-color: #94a3b8; 
            border-radius: 20px; 
            border: 2px solid #f8fafc; /* Padding effect */
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover { 
            background-color: #64748b; 
        }

        .log-row { cursor: pointer; transition: background-color 0.1s; }
        .log-row:hover { background-color: #eff6ff; }
        
        /* Log Colors */
        .log-auth { color: #2563eb; }
        .log-error { color: #dc2626; font-weight: bold; background-color: #fef2f2; }
        .log-checkout { color: #16a34a; font-weight: bold; background-color: #f0fdf4; }

        .archive-item.active { background-color: #eff6ff; border-left: 4px solid #2563eb; color: #1e40af; }

        .sort-header { cursor: pointer; user-select: none; transition: background-color 0.1s; }
        .sort-header:hover { background-color: #e5e7eb; color: #1f2937; }

        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow: hidden; }

        /* Chips */
        .filter-chip { @apply px-2 py-1 rounded-md text-[10px] font-bold border transition-all duration-200 uppercase tracking-wide cursor-pointer select-none whitespace-nowrap; }
    </style>
</head>
<body class="bg-gray-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <div class="bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center sticky top-0 z-30 shadow-sm shrink-0">
        <div>
            <h1 class="text-lg md:text-xl font-black text-gray-800 tracking-tight flex items-center gap-2">
                <span class="text-blue-600">⚡</span> Log Viewer <span class="text-gray-300 font-normal text-sm">v2.18</span>
            </h1>
            <div class="text-[10px] md:text-xs font-bold text-gray-400 mt-0.5 tracking-wide">
                <span class="text-blue-600" id="auth-user">CHECKING...</span> 
                <span class="hidden md:inline"><span class="mx-1">|</span> SYSTEM ADMIN</span>
            </div>
        </div>
        <button onclick="window.location.href='menu.html'" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs font-bold transition flex items-center gap-1">
            <span>EXIT</span>
        </button>
    </div>

    <div class="md:hidden bg-slate-50 border-b border-gray-200 px-4 py-2 flex gap-2 shrink-0 z-20">
        <button onclick="toggleSidebar()" class="flex-1 bg-white text-blue-600 px-3 py-1.5 rounded border border-blue-200 text-xs font-bold shadow-sm active:bg-blue-50">
            📂 ARCHIVES
        </button>
        <button onclick="toggleFilters()" class="flex-1 bg-white text-slate-600 px-3 py-1.5 rounded border border-slate-300 text-xs font-bold shadow-sm active:bg-slate-50">
            🌪️ FILTERS & SEARCH
        </button>
    </div>

    <div class="flex-1 flex overflow-hidden relative">

        <div id="sidebar-backdrop" onclick="closeSidebar()" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden glass transition-opacity"></div>

        <div id="sidebar" class="absolute md:relative inset-y-0 left-0 w-72 bg-white border-r border-gray-200 flex flex-col z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl md:shadow-none h-full">
            
            <div class="p-3 border-b border-gray-100 bg-gray-50/50">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Select Log File</div>
            </div>

            <div id="archive-list" class="flex-1 overflow-y-auto custom-scroll">
                <div class="p-4 text-center text-gray-400 text-xs animate-pulse">Loading index...</div>
            </div>

            <div class="p-3 border-t border-gray-100 bg-gray-50">
                <label class="flex items-center justify-center w-full px-4 py-2 bg-white border border-dashed border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition group">
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] font-bold text-gray-500 group-hover:text-blue-500">📂 OPEN LOCAL FILE</span>
                    </div>
                    <input id="file-input" type="file" class="hidden" accept=".txt,.csv,.json" />
                </label>
            </div>
        </div>

        <div class="flex-1 flex flex-col min-w-0 bg-gray-100 h-full relative">
            
            <div id="filter-panel" class="hidden md:block border-b border-gray-200 bg-white shadow-sm z-20">
                <div class="p-3">
                    <div class="relative mb-3">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </span>
                        <input type="text" id="filter-search" onkeyup="applyFilters()" placeholder="Search logs (User, Action, IP...)" 
                            class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-4 py-2 text-xs font-bold text-gray-700 focus:outline-none focus:border-blue-500 focus:bg-white transition shadow-inner">
                    </div>

                    <div class="flex flex-nowrap gap-4 overflow-x-auto custom-scroll pb-2">
                        <div class="min-w-[120px]">
                            <div class="text-[9px] font-bold text-gray-400 uppercase mb-1">Users</div>
                            <div id="filter-users" class="flex flex-wrap gap-1"></div>
                        </div>
                        <div class="min-w-[120px]">
                            <div class="text-[9px] font-bold text-gray-400 uppercase mb-1">Actions</div>
                            <div id="filter-actions" class="flex flex-wrap gap-1"></div>
                        </div>
                        <div class="min-w-[100px]">
                            <div class="text-[9px] font-bold text-gray-400 uppercase mb-1">Roles</div>
                            <div id="filter-roles" class="flex flex-wrap gap-1"></div>
                        </div>
                        <div class="min-w-[120px]">
                            <div class="text-[9px] font-bold text-gray-400 uppercase mb-1">Targets</div>
                            <div id="filter-targets" class="flex flex-wrap gap-1"></div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-blue-50 px-4 py-1 border-t border-blue-100 flex justify-between items-center">
                    <h2 id="current-file-name" class="text-[10px] font-bold text-blue-800 uppercase tracking-wide truncate">Loading...</h2>
                    <div class="text-[10px] font-bold text-blue-600 whitespace-nowrap"><span id="stat-count">0</span> ROWS</div>
                </div>
            </div>

            <div class="flex-1 overflow-auto custom-scroll relative bg-gray-50">
                <table class="w-full text-left border-collapse min-w-[800px]"> <thead class="bg-white sticky top-0 z-10 shadow-sm text-xs font-bold text-gray-500 uppercase tracking-wider">
                        <tr>
                            <th onclick="setSort('time')" class="sort-header p-3 border-b border-gray-200 whitespace-nowrap w-32">Time ▾</th>
                            <th onclick="setSort('user')" class="sort-header p-3 border-b border-gray-200 w-24">User</th>
                            <th onclick="setSort('role')" class="sort-header p-3 border-b border-gray-200 w-20">Role</th>
                            <th onclick="setSort('action')" class="sort-header p-3 border-b border-gray-200 w-24">Action</th>
                            <th onclick="setSort('target')" class="sort-header p-3 border-b border-gray-200 w-32">Target</th>
                            <th onclick="setSort('ip')" class="sort-header p-3 border-b border-gray-200 w-28">IP</th>
                            <th class="p-3 border-b border-gray-200">Details</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="bg-white divide-y divide-gray-100 text-xs">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden transform transition-all scale-100">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center shrink-0">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Log Entry Details</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-lg">✕</button>
            </div>
            <div class="p-6 overflow-y-auto custom-scroll">
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Timestamp</span><span id="m-time" class="font-mono text-xs bg-gray-100 px-2 py-1 rounded">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">IP Address</span><span id="m-ip" class="font-mono text-xs text-gray-500">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">User</span><span id="m-user" class="font-bold text-gray-800">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Role</span><span id="m-role" class="bg-white border px-2 py-0.5 rounded text-xs">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Action</span><span id="m-action" class="font-bold text-blue-600">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Target</span><span id="m-target" class="text-gray-600">---</span></div>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Raw Metadata</h3>
                    <div class="bg-slate-800 rounded-lg p-4 shadow-inner overflow-x-auto">
                        <pre id="m-meta" class="text-xs font-mono text-green-400 whitespace-pre-wrap break-all"></pre>
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-right shrink-0">
                <button onclick="closeModal()" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 font-bold py-2 px-6 rounded text-xs shadow-sm transition">Close</button>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('sidebar-backdrop');
            
            const isClosed = sb.classList.contains('-translate-x-full');
            if (isClosed) {
                sb.classList.remove('-translate-x-full');
                bd.classList.remove('hidden');
            } else {
                closeSidebar();
            }
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
        }

        function toggleFilters() {
            const fp = document.getElementById('filter-panel');
            fp.classList.toggle('hidden');
        }
    </script>

</body>
</html>
