<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log Viewer v2.17 | SignOS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="logic_viewer.js"></script>

    <style>
        /* Custom Scrollbar for Desktop */
        .custom-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Hide Scrollbar for clean mobile look where preferred */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .log-row { cursor: pointer; transition: background-color 0.1s; }
        .log-row:hover { background-color: #eff6ff; }
        
        /* Log Colors */
        .log-auth { color: #2563eb; }
        .log-error { color: #dc2626; font-weight: bold; background-color: #fef2f2; }
        .log-checkout { color: #16a34a; font-weight: bold; background-color: #f0fdf4; }

        .archive-item.active { background-color: #eff6ff; border-left: 4px solid #2563eb; color: #1e40af; }

        .sort-header { cursor: pointer; user-select: none; transition: background-color 0.1s; }
        .sort-header:hover { background-color: #e5e7eb; color: #1f2937; }

        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow: hidden; }

        /* Chips */
        .filter-chip { @apply px-2 py-1 rounded-md text-[10px] font-bold border transition-all duration-200 uppercase tracking-wide cursor-pointer select-none whitespace-nowrap; }
    </style>
</head>
<body class="bg-gray-100 text-slate-800 font-sans h-screen flex flex-col md:flex-row overflow-hidden">

    <div class="md:hidden bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center z-20 shadow-sm shrink-0">
        <div class="font-bold text-gray-700 text-sm flex items-center gap-2">
            <span class="text-blue-600">⚡</span> <span id="mobile-title">SignOS Logs</span>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleFilters()" class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded text-xs font-bold border border-slate-200 active:bg-slate-200">
                🌪️ FILTERS
            </button>
            <button onclick="toggleSidebar()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold shadow-sm active:bg-blue-700">
                📂 ARCHIVES
            </button>
        </div>
    </div>

    <div id="sidebar-backdrop" onclick="closeSidebar()" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden glass transition-opacity"></div>

    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white border-r border-gray-200 flex flex-col z-40 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:w-64 shadow-xl md:shadow-none">
        <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
            <div>
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Log Archives</div>
                <div class="text-[10px] text-gray-400 mt-0.5">Select a file to view</div>
            </div>
            <button onclick="closeSidebar()" class="md:hidden text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div id="archive-list" class="flex-1 overflow-y-auto custom-scroll">
            <div class="p-4 text-center text-gray-400 text-xs animate-pulse">Loading index...</div>
        </div>

        <div class="p-4 border-t border-gray-100 bg-gray-50">
            <label class="flex items-center justify-center w-full px-4 py-2 bg-white border border-dashed border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition group">
                <div class="flex flex-col items-center">
                    <span class="text-[10px] font-bold text-gray-500 group-hover:text-blue-500">📂 OPEN LOCAL FILE</span>
                </div>
                <input id="file-input" type="file" class="hidden" accept=".txt,.csv,.json" />
            </label>
            <div class="mt-2 text-center">
                <button onclick="window.location.href='menu.html'" class="text-[10px] font-bold text-gray-400 hover:text-red-500 transition">← EXIT TO MENU</button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col min-w-0 bg-gray-100 h-full relative">
        
        <div class="bg-white border-b border-gray-200 shadow-sm flex flex-col shrink-0 z-10">
            
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="bg-blue-100 text-blue-700 p-1.5 rounded-lg shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <div class="min-w-0">
                        <h1 id="current-file-name" class="text-sm font-bold text-gray-800 truncate">Loading...</h1>
                        <div class="text-[10px] text-gray-400 font-medium"><span id="stat-count">0</span> Records found</div>
                    </div>
                </div>
                <div class="text-right hidden md:block">
                    <div class="text-[10px] font-bold text-gray-400 uppercase">Viewer</div>
                    <div id="auth-user" class="text-xs font-bold text-blue-600">Checking...</div>
                </div>
            </div>

            <div id="filter-panel" class="hidden md:block border-t border-gray-100 bg-slate-50/50">
                <div class="p-3 overflow-x-auto">
                    <div class="mb-3">
                        <input type="text" id="filter-search" onkeyup="applyFilters()" placeholder="🔍 Search logs..." class="w-full bg-white border border-gray-300 rounded px-3 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                    </div>

                    <div class="flex flex-nowrap gap-4 min-w-max pb-2">
                        <div class="w-48 shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase mb-1">Users</div>
                            <div id="filter-users" class="flex flex-wrap gap-1 max-h-20 overflow-y-auto custom-scroll pr-1"></div>
                        </div>
                        <div class="w-48 shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase mb-1">Actions</div>
                            <div id="filter-actions" class="flex flex-wrap gap-1 max-h-20 overflow-y-auto custom-scroll pr-1"></div>
                        </div>
                        <div class="w-32 shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase mb-1">Roles</div>
                            <div id="filter-roles" class="flex flex-wrap gap-1"></div>
                        </div>
                        <div class="w-40 shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase mb-1">Targets</div>
                            <div id="filter-targets" class="flex flex-wrap gap-1 max-h-20 overflow-y-auto custom-scroll"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-auto custom-scroll relative">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <tr>
                        <th onclick="setSort('time')" class="sort-header p-3 border-b border-gray-200 whitespace-nowrap">Time ▾</th>
                        <th onclick="setSort('user')" class="sort-header p-3 border-b border-gray-200">User</th>
                        <th onclick="setSort('role')" class="sort-header p-3 border-b border-gray-200">Role</th>
                        <th onclick="setSort('action')" class="sort-header p-3 border-b border-gray-200">Action</th>
                        <th onclick="setSort('target')" class="sort-header p-3 border-b border-gray-200">Target</th>
                        <th onclick="setSort('ip')" class="sort-header p-3 border-b border-gray-200 hidden sm:table-cell">IP</th>
                        <th class="p-3 border-b border-gray-200 w-full">Details</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="bg-white divide-y divide-gray-100 text-sm">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="detail-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden transform transition-all scale-100">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center shrink-0">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Log Entry Details</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-lg">✕</button>
            </div>
            <div class="p-6 overflow-y-auto custom-scroll">
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Timestamp</span><span id="m-time" class="font-mono text-xs bg-gray-100 px-2 py-1 rounded">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">IP Address</span><span id="m-ip" class="font-mono text-xs text-gray-500">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">User</span><span id="m-user" class="font-bold text-gray-800">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Role</span><span id="m-role" class="bg-white border px-2 py-0.5 rounded text-xs">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Action</span><span id="m-action" class="font-bold text-blue-600">---</span></div>
                    <div><span class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Target</span><span id="m-target" class="text-gray-600">---</span></div>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Raw Metadata</h3>
                    <div class="bg-slate-800 rounded-lg p-4 shadow-inner overflow-x-auto">
                        <pre id="m-meta" class="text-xs font-mono text-green-400 whitespace-pre-wrap break-all"></pre>
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-right shrink-0">
                <button onclick="closeModal()" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 font-bold py-2 px-6 rounded text-xs shadow-sm transition">Close</button>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('sidebar-backdrop');
            
            // Check if it's currently closed (has translate-x-full)
            const isClosed = sb.classList.contains('-translate-x-full');
            
            if (isClosed) {
                sb.classList.remove('-translate-x-full');
                bd.classList.remove('hidden');
            } else {
                closeSidebar();
            }
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
        }

        function toggleFilters() {
            const fp = document.getElementById('filter-panel');
            fp.classList.toggle('hidden');
        }
    </script>

</body>
</html>
