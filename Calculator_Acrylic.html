<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acrylic Signs - SignOS v5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="logic_acrylic.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans pb-10">

    <div id="main-card" class="max-w-md mx-auto mt-6 bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
        
        <!-- Status Badge -->
        <div id="status-bar" class="bg-gray-200 text-gray-500 text-[10px] font-bold text-center py-1 uppercase tracking-widest">
            FETCHING DATA...
        </div>

        <div class="p-5">
            <!-- INPUTS -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="col-span-2 flex flex-col">
                    <label class="text-xs font-bold text-gray-500 uppercase mb-1">Quantity</label>
                    <input type="number" id="qty" value="1" min="1" class="w-full border border-gray-300 rounded p-2 text-lg font-bold bg-gray-50 text-center" onchange="runCalc()" onkeyup="runCalc()">
                </div>
                
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-gray-500 uppercase mb-1">Width (in)</label>
                    <input type="number" id="w" value="24" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50" onchange="runCalc()" onkeyup="runCalc()">
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-gray-500 uppercase mb-1">Height (in)</label>
                    <input type="number" id="h" value="18" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50" onchange="runCalc()" onkeyup="runCalc()">
                </div>

                <div class="col-span-2 flex flex-col">
                    <label class="text-xs font-bold text-gray-500 uppercase mb-1">Thickness</label>
                    <select id="thickness" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50" onchange="runCalc()">
                        <option value="1/4">1/4" Acrylic</option>
                        <option value="1/2">1/2" Acrylic</option>
                        <option value="3/4">3/4" Acrylic</option>
                        <option value="1">1" Acrylic</option>
                    </select>
                </div>

                <div class="col-span-2 flex flex-col">
                    <label class="text-xs font-bold text-gray-500 uppercase mb-1">Color</label>
                    <select id="color" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50" onchange="runCalc()">
                        <option value="White">White</option>
                        <option value="Clear">Clear</option>
                        <option value="Black">Black</option>
                    </select>
                </div>

                <div class="col-span-2 flex flex-col">
                    <label class="text-xs font-bold text-gray-500 uppercase mb-1">Cutting Method</label>
                    <select id="shape" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50" onchange="runCalc()">
                        <option value="Rectangle">Standard (Square/Rectangle)</option>
                        <option value="CNC Simple">CNC (Simple Shape)</option>
                        <option value="CNC Complex">CNC (Complex Shape)</option>
                    </select>
                </div>
            </div>

            <!-- OUTPUTS -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4 shadow-inner">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
                    <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
                </div>
                <div class="flex justify-between items-end">
                    <span class="text-xs font-bold text-blue-800/70">Grand Total</span>
                    <span id="ui-total" class="text-lg font-bold text-blue-800/90">$0.00</span>
                </div>
                
                <div id="ui-min-alert" class="hidden text-[9px] font-bold text-red-500 bg-red-100 border border-red-200 p-1 rounded mt-2 text-center uppercase tracking-widest">
                    Shop Minimum Order Applied
                </div>
            </div>

            <!-- LINE ITEMS -->
            <div class="space-y-1 text-xs text-gray-600 border-t border-dashed border-gray-200 pt-3">
                <div class="flex justify-between"><span>Printed Signs:</span><span id="ui-print" class="font-bold">$0.00</span></div>
                <div class="flex justify-between text-orange-700 hidden" id="row-router"><span>CNC Router Fee:</span><span id="ui-router" class="font-bold">$0.00</span></div>
                <div class="flex justify-between text-slate-700 hidden" id="row-setup"><span>Setup Fee:</span><span id="ui-setup" class="font-bold">$0.00</span></div>
            </div>
        </div>
    </div>

    <script>
        let backendData = {};

        // 1. SAFE UI CONSTRAINT (Waits for page load)
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof injectHeader === 'function') injectHeader("Acrylic Signs");

            const thickDropdown = document.getElementById('thickness');
            if (thickDropdown) {
                thickDropdown.addEventListener('change', function(e) {
                    const colorDropdown = document.getElementById('color');
                    if (!colorDropdown) return;

                    const isQuarterInch = e.target.value.includes('1/4') || e.target.value.includes('0.25') || e.target.value.includes('.25');
                    
                    for (let i = 0; i < colorDropdown.options.length; i++) {
                        if (colorDropdown.options[i].value === 'Black') {
                            colorDropdown.options[i].disabled = !isQuarterInch;
                        }
                    }
                    
                    if (!isQuarterInch && colorDropdown.value === 'Black') {
                        colorDropdown.value = 'White'; 
                    }
                    
                    if (typeof runCalc === 'function') runCalc(); 
                });
            }
        });

        // 2. EXECUTION ENGINE
        function runCalc() {
            if (!backendData.Retail_Min_Order) return; 
            
            try {
                const inputs = {
                    qty: parseFloat(document.getElementById('qty').value) || 1,
                    w: parseFloat(document.getElementById('w').value) || 24,
                    h: parseFloat(document.getElementById('h').value) || 18,
                    thickness: document.getElementById('thickness').value,
                    color: document.getElementById('color').value,
                    shape: document.getElementById('shape').value
                };

                const result = calculateAcrylic(inputs, backendData);
                const ret = result.retail;
                const fmt = (n) => "$" + n.toFixed(2);

                document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
                document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
                document.getElementById('ui-print').innerText = fmt(ret.printTotal);

                // Reveal Shop Minimum Warning
                if (ret.isMinApplied) {
                    document.getElementById('ui-min-alert').classList.remove('hidden');
                } else {
                    document.getElementById('ui-min-alert').classList.add('hidden');
                }

                // Reveal Router Fee
                if (ret.routerFee > 0) {
                    document.getElementById('row-router').classList.remove('hidden');
                    document.getElementById('ui-router').innerText = fmt(ret.routerFee);
                } else {
                    document.getElementById('row-router').classList.add('hidden');
                }

                // Reveal Setup Fee
                if (ret.setupFee > 0) {
                    document.getElementById('row-setup').classList.remove('hidden');
                    document.getElementById('ui-setup').innerText = fmt(ret.setupFee);
                } else {
                    document.getElementById('row-setup').classList.add('hidden');
                }

                setStatus("ONLINE", "bg-green-500", "text-white");
            } catch(e) {
                setStatus("OFFLINE", "bg-red-500", "text-white");
                console.error(e);
            }
        }

        // 3. UI UTILS
        function setStatus(msg, bgClass, txtClass) {
            const bar = document.getElementById('status-bar');
            bar.className = `text-[10px] font-bold text-center py-1 uppercase tracking-widest ${bgClass} ${txtClass}`;
            bar.innerText = msg;
        }

        // 4. API FETCH
        window.addEventListener('load', async () => {
            try {
                const req = await fetch(`${SCRIPT_URL}?req=view_module&tab=PROD_Acrylic_Signs`);
                backendData = await req.json();
                
                if(backendData.error) throw new Error(backendData.error);
                
                runCalc(); 
            } catch(e) {
                setStatus("CONNECTION FAILED", "bg-red-500", "text-white");
            }
        });
    </script>
</body>
</html>
