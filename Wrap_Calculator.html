<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Wrap Calculator v3.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; background: #eff6ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .warn-pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { background-color: #FECACA; } 50% { background-color: #F87171; } 100% { background-color: #FECACA; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-md mx-auto w-full bg-white shadow-2xl overflow-hidden min-h-screen sm:min-h-0 sm:my-10 sm:rounded-xl border border-gray-200">
        
        <!-- HEADER -->
        <div class="bg-gray-900 px-6 py-4 text-white flex justify-between items-center">
            <a href="#" onclick="goBack()" class="text-gray-400 hover:text-white text-xs font-bold uppercase flex items-center gap-1">MENU</a>
            <div class="text-center">
                <h2 class="text-lg font-bold" id="product-label">Vehicle Wraps</h2>
                <div class="flex items-center justify-center gap-2 text-[10px]">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="status-text" class="text-gray-400">CONNECTING...</span>
                </div>
            </div>
            <button onclick="location.reload()" class="text-gray-400 hover:text-white">↺</button>
        </div>

        <div id="profit-warn" class="hidden bg-red-600 text-white text-center py-2 px-4 text-sm font-bold uppercase border-b-4 border-red-800">🛑 LOSS ALERT</div>

        <!-- INPUTS -->
        <div class="p-6 space-y-4">
            
            <!-- Vehicle Info -->
            <div class="bg-gray-50 p-3 rounded border border-gray-200">
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Vehicle Information</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="veh-year" placeholder="Year" class="w-1/4 border p-1 rounded text-sm font-bold">
                    <input type="text" id="veh-make" placeholder="Make" class="w-3/4 border p-1 rounded text-sm font-bold">
                </div>
                <input type="text" id="veh-model" placeholder="Model" class="w-full border p-1 rounded text-sm font-bold" oninput="calculate()">
            </div>

            <!-- Measurements -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Measurements (Inches)</label>
                <div class="space-y-1">
                    <div class="flex items-center gap-2"><span class="w-24 text-xs font-bold">Front</span><input type="number" id="w-front" placeholder="W" class="w-16 border p-1 rounded" oninput="calculate()"><input type="number" id="h-front" placeholder="H" class="w-16 border p-1 rounded" oninput="calculate()"></div>
                    <div class="flex items-center gap-2"><span class="w-24 text-xs font-bold">Rear</span><input type="number" id="w-rear" placeholder="W" class="w-16 border p-1 rounded" oninput="calculate()"><input type="number" id="h-rear" placeholder="H" class="w-16 border p-1 rounded" oninput="calculate()"></div>
                    <div class="flex items-center gap-2"><span class="w-24 text-xs font-bold">Sides (x2)</span><input type="number" id="w-side" placeholder="W" class="w-16 border p-1 rounded" oninput="calculate()"><input type="number" id="h-side" placeholder="H" class="w-16 border p-1 rounded" oninput="calculate()"></div>
                </div>
                <div class="flex justify-between items-center mt-2 pt-2 border-t border-gray-100">
                    <span class="text-xs font-bold text-blue-600 uppercase">Total Wrap Area</span>
                    <span class="text-sm font-black text-blue-900"><span id="total-sqft">0.0</span> SqFt</span>
                </div>
            </div>

            <!-- Window Perf Add-on -->
            <div class="border-t border-gray-100 my-2 pt-2">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-gray-700">Window Perf (Add-On)</span>
                    <button onclick="addPerfRow()" class="bg-blue-100 text-blue-600 text-[10px] font-bold px-2 py-1 rounded hover:bg-blue-200">+ Add Window</button>
                </div>
                <div id="perf-container" class="space-y-1"></div>
                <input type="hidden" id="perf-total-cost" value="0">
                <input type="hidden" id="perf-total-sqft" value="0">
            </div>

            <!-- Install -->
            <div class="flex items-center justify-between p-3 bg-blue-50 border border-blue-200 rounded">
                <span class="text-sm font-bold text-blue-900">Include Installation?</span>
                <input type="checkbox" id="has-install" class="w-5 h-5" checked onchange="calculate()">
            </div>
        </div>

        <!-- METRICS -->
        <div class="border-t border-gray-200">
            <div class="flex">
                <button onclick="switchTab('retail')" class="flex-1 py-3 text-xs font-bold text-gray-500 hover:bg-gray-50 tab-btn active" id="btn-retail">RETAIL</button>
                <button onclick="switchTab('cost')" class="flex-1 py-3 text-xs font-bold text-gray-500 hover:bg-gray-50 tab-btn" id="btn-cost">IN-HOUSE</button>
            </div>
            
            <div id="tab-retail" class="tab-content active bg-white p-6">
                <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-gray-400 uppercase">Total Quote</span><span class="text-3xl font-black text-blue-600" id="total-price">$0.00</span></div>
            </div>
            
            <div id="tab-cost" class="tab-content bg-yellow-50 p-6">
                <div class="flex justify-between text-yellow-900 font-bold text-sm"><span>Total Cost:</span> <span id="cost-total">$0.00</span></div>
            </div>
        </div>

        <!-- DESCRIPTION -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-20 text-gray-600 font-mono outline-none" readonly></textarea>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypbRuIJmkXqC447Yd1akhlhDrEyRoq0ypfZNHf0dI77KrZWUUeOqvUm5122O2RdzyYEQ/exec";
        const TAB_NAME = "PROD_Vehicle_Wraps";
        let backend = {};
        let currentUser = { name: "Guest", role: "VIEW", mode: "sales" };

        // Perf Logic
        let perfCount = 0;
        function addPerfRow() {
            perfCount++;
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-gray-50 p-1 rounded";
            div.innerHTML = `
                <input type="number" placeholder="W" class="w-12 border p-1 text-xs rounded" id="perf-w-${perfCount}" oninput="calcPerf()">
                <input type="number" placeholder="H" class="w-12 border p-1 text-xs rounded" id="perf-h-${perfCount}" oninput="calcPerf()">
                <input type="number" placeholder="Qty" value="1" class="w-8 border p-1 text-xs rounded text-center" id="perf-q-${perfCount}" oninput="calcPerf()">
                <span class="text-[10px] font-bold text-gray-500 w-12 text-right" id="perf-p-${perfCount}">$0</span>
                <button onclick="this.parentElement.remove(); calcPerf()" class="text-red-400 hover:text-red-600">×</button>
            `;
            document.getElementById('perf-container').appendChild(div);
        }

        function calcPerf() {
            let total = 0;
            let sqft = 0;
            const rate = parseFloat(backend.Retail_Price_Perf || 12.00); 
            for(let i=1; i<=perfCount; i++) {
                if(document.getElementById(`perf-w-${i}`)) {
                    const w = parseFloat(document.getElementById(`perf-w-${i}`).value)||0;
                    const h = parseFloat(document.getElementById(`perf-h-${i}`).value)||0;
                    const q = parseFloat(document.getElementById(`perf-q-${i}`).value)||0;
                    const rowSq = (w*h)/144 * q;
                    const rowPrice = rowSq * rate;
                    document.getElementById(`perf-p-${i}`).innerText = "$" + rowPrice.toFixed(0);
                    total += rowPrice;
                    sqft += rowSq;
                }
            }
            document.getElementById('perf-total-cost').value = total;
            document.getElementById('perf-total-sqft').value = sqft;
            calculate(); 
        }

        function initSession() {
            const params = new URLSearchParams(window.location.search);
            const urlMode = params.get('mode') || 'sales';
            currentUser.mode = urlMode;
            
            const body = document.body;
            body.classList.remove('mode-sales', 'mode-prod', 'mode-admin');
            if(currentUser.mode === 'sales') { body.classList.add('mode-sales'); switchTab('retail'); }
            else if (currentUser.mode === 'production') { body.classList.add('mode-prod'); switchTab('cost'); }
            else { body.classList.add('mode-admin'); }
        }

        function goBack() { window.location.href = `menu.html?mode=${currentUser.mode}`; }
        function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
        function switchTab(id) { document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+id).classList.add('active'); document.getElementById('btn-'+id).classList.add('active'); }

        window.onload = async function() {
            initSession();
            try {
                const response = await fetch(`${SCRIPT_URL}?tab=${TAB_NAME}`);
                const data = await response.json();
                backend = data;
                document.getElementById("status-text").innerText = "ONLINE";
                document.getElementById("status-text").classList.add("text-green-500");
                calculate();
            } catch(e) { console.log(e); }
        };

        function calculate() {
            if(!backend.Item_Name) return;
            const wFront = (parseFloat(document.getElementById('w-front').value)||0)*(parseFloat(document.getElementById('h-front').value)||0)/144;
            const wRear = (parseFloat(document.getElementById('w-rear').value)||0)*(parseFloat(document.getElementById('h-rear').value)||0)/144;
            const wSide = (parseFloat(document.getElementById('w-side').value)||0)*(parseFloat(document.getElementById('h-side').value)||0)/144 * 2;
            
            const wrapSqFt = wFront + wRear + wSide;
            document.getElementById('total-sqft').innerText = wrapSqFt.toFixed(1);

            const perfPrice = parseFloat(document.getElementById('perf-total-cost').value)||0;
            const perfSqFt = parseFloat(document.getElementById('perf-total-sqft').value)||0;

            // Price
            const baseRate = parseFloat(backend.Retail_Price_Wrap_SqFt || 15.00);
            let total = wrapSqFt * baseRate;
            
            if(document.getElementById('has-install').checked) {
                total += (wrapSqFt * parseFloat(backend.Retail_Price_Install_Simple || 5.00));
            }
            
            total += perfPrice;

            document.getElementById('total-price').innerText = "$" + total.toFixed(2);

            // Cost (Simplified)
            const matCost = (wrapSqFt * 3.05) + (perfSqFt * 0.65);
            const laborCost = wrapSqFt * 1.5; 
            const totalCost = matCost + laborCost;
            document.getElementById('cost-total').innerText = "$" + totalCost.toFixed(2);

            const prof = total - totalCost;
            if(prof < 0) document.getElementById('profit-warn').classList.remove('hidden');
            else document.getElementById('profit-warn').classList.add('hidden');

            // Desc
            const veh = `${document.getElementById('veh-year').value} ${document.getElementById('veh-make').value} ${document.getElementById('veh-model').value}`;
            const desc = `${veh}. Full Wrap: ${wrapSqFt.toFixed(1)} SqFt. Window Perf: ${perfSqFt.toFixed(1)} SqFt. ${document.getElementById('has-install').checked ? 'Includes Install.' : 'Supply Only.'}`;
            document.getElementById('job-desc').value = desc;
        }
    </script>
</body>
</html>
