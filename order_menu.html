<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Workflow | SignOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const user = sessionStorage.getItem('signos_user');
        if (!user) window.location.href = 'index.html';
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    
    <!-- AUTH HEADER -->
    <div class="bg-gray-800 text-white px-4 py-2 flex flex-col sm:flex-row justify-between items-center text-xs shadow-md">
        <div class="flex gap-4 mb-2 sm:mb-0">
            <span class="tracking-wide">USER: <span class="font-bold text-gray-200 uppercase" id="auth-user">---</span></span>
            <span class="tracking-wide">ROLE: <span class="font-bold text-blue-400 uppercase" id="auth-role">---</span></span>
        </div>
        <button onclick="sessionStorage.clear(); window.location.href='index.html'" class="font-bold text-red-400 hover:text-white uppercase tracking-wider text-[10px]">Logout</button>
    </div>

    <!-- NAVIGATION -->
    <div class="bg-white border-b sticky top-0 z-20 px-4 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <a href="menu.html" class="text-gray-400 hover:text-gray-600 font-bold text-xs uppercase flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Menu
            </a>
            <h1 class="text-lg font-black text-gray-900 hidden sm:block">Order Workflow</h1>
        </div>
        <a href="Cart_Viewer.html" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition shadow">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span class="text-sm font-bold">Cart</span>
        </a>
    </div>

    <!-- CONTENT -->
    <div class="max-w-5xl mx-auto p-4 sm:p-8">
        <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">Select Product</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            
            <!-- Hybrid Yard Sign -->
            <a href="YardSign_Order.html" class="group block bg-white rounded-xl overflow-hidden border border-gray-200 hover:border-blue-500 hover:shadow-xl transition-all relative">
                <div class="h-32 bg-gray-100 flex items-center justify-center group-hover:bg-blue-50 transition">
                    <svg class="w-12 h-12 text-gray-400 group-hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                </div>
                <div class="p-5">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-900 text-lg">Yard Signs</h3>
                            <p class="text-xs text-gray-500 mt-1">24x18 • Coroplast • 3D Designer</p>
                        </div>
                        <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-1 rounded">HYBRID</span>
                    </div>
                    <div class="mt-4 flex items-center text-xs font-bold text-blue-600">
                        Start Configuration <span class="ml-1 group-hover:translate-x-1 transition">→</span>
                    </div>
                </div>
            </a>

            <!-- Placeholder -->
            <div class="block bg-gray-50 rounded-xl overflow-hidden border border-gray-200 border-dashed opacity-60">
                <div class="h-32 flex items-center justify-center">
                    <span class="text-gray-300 font-bold text-4xl">+</span>
                </div>
                <div class="p-5">
                    <h3 class="font-bold text-gray-400">More Coming Soon</h3>
                    <p class="text-xs text-gray-400 mt-1">Banners & Decals Integration</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('auth-user').innerText = sessionStorage.getItem('signos_user');
        document.getElementById('auth-role').innerText = sessionStorage.getItem('signos_role');
    </script>
</body>
</html>
