<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut Vinyl Calculator v3.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; background: #eff6ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .mode-sales #btn-cost, .mode-sales #btn-vend { display: none !important; }
        .mode-prod #btn-retail, .mode-prod #btn-vend { display: none !important; }
        .warn-pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { background-color: #FECACA; } 50% { background-color: #F87171; } 100% { background-color: #FECACA; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-md mx-auto w-full bg-white shadow-2xl overflow-hidden min-h-screen sm:min-h-0 sm:my-10 sm:rounded-xl border border-gray-200">
        
        <!-- HEADER -->
        <div class="bg-gray-900 px-6 py-4 text-white flex justify-between items-center">
            <a href="#" onclick="goBack()" class="text-gray-400 hover:text-white text-xs font-bold uppercase flex items-center gap-1">MENU</a>
            <div class="text-center">
                <h2 class="text-lg font-bold" id="product-label">Cut Vinyl Lettering</h2>
                <div class="flex items-center justify-center gap-2 text-[10px]">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="status-text" class="text-gray-400">CONNECTING...</span>
                </div>
            </div>
            <button onclick="location.reload()" class="text-gray-400 hover:text-white">↺</button>
        </div>

        <div id="profit-warn" class="hidden bg-red-600 text-white text-center py-3 px-4 text-sm font-bold uppercase border-b-4 border-red-800">🛑 LOSS ALERT</div>

        <!-- INPUTS -->
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Width</label><input type="number" id="width" value="12" class="w-full border p-2 rounded font-bold" oninput="calculate()"></div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Height</label><input type="number" id="height" value="6" class="w-full border p-2 rounded font-bold" oninput="calculate()"></div>
            </div>
            
            <div><label class="block text-xs font-bold text-gray-500 uppercase">Quantity</label><input type="number" id="qty" value="1" class="w-full border p-2 rounded font-bold" oninput="calculate()"></div>

            <!-- COLOR PICKER -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Vinyl Color</label>
                <div class="relative">
                    <input type="text" id="vinyl-color" placeholder="Select Color below..." readonly class="w-full border p-2 pl-10 rounded font-bold text-sm bg-gray-50">
                    <div class="absolute top-2 left-2 w-6 h-6 rounded border border-gray-300" id="selected-swatch" style="background-color: #fff;"></div>
                </div>
                <div id="color-grid" class="grid grid-cols-8 gap-1 mt-2 max-h-32 overflow-y-auto border p-1 rounded bg-gray-50"></div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Series</label>
                <select id="material" class="w-full border p-2 rounded font-bold text-sm" onchange="calculate()">
                    <option value="651">Oracal 651 (Standard)</option>
                    <option value="751">Oracal 751 (Cast)</option>
                </select>
            </div>

            <!-- Complexity -->
            <div class="bg-gray-50 border border-gray-200 rounded p-3">
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Weeding</label>
                <div class="flex gap-2">
                    <label class="flex-1 cursor-pointer"><input type="radio" name="complexity" value="Simple" class="peer sr-only" checked onchange="calculate()"><div class="p-2 rounded border text-center text-xs font-bold text-gray-500 peer-checked:bg-green-500 peer-checked:text-white">Simple</div></label>
                    <label class="flex-1 cursor-pointer"><input type="radio" name="complexity" value="Complex" class="peer sr-only" onchange="calculate()"><div class="p-2 rounded border text-center text-xs font-bold text-gray-500 peer-checked:bg-orange-500 peer-checked:text-white">Complex</div></label>
                </div>
            </div>
        </div>

        <!-- METRICS -->
        <div class="border-t border-gray-200">
            <div class="flex">
                <button onclick="switchTab('retail')" class="flex-1 py-3 text-xs font-bold text-gray-500 hover:bg-gray-50 tab-btn active" id="btn-retail">RETAIL</button>
                <button onclick="switchTab('cost')" class="flex-1 py-3 text-xs font-bold text-gray-500 hover:bg-gray-50 tab-btn" id="btn-cost">IN-HOUSE</button>
            </div>
            
            <div id="tab-retail" class="tab-content active bg-white p-6">
                <div class="flex justify-between items-center mb-4"><span class="text-xs font-bold text-gray-400 uppercase">Unit Price</span><span class="text-2xl font-bold text-gray-900" id="unit-price">$0.00</span></div>
                <div class="flex justify-between items-end border-t pt-4"><div><span class="text-xs font-bold text-gray-400 uppercase">Total</span></div><span class="text-3xl font-black text-blue-600" id="total-price">---</span></div>
            </div>
            
            <div id="tab-cost" class="tab-content bg-yellow-50 p-6">
                <div class="flex justify-between text-yellow-900 font-bold text-sm"><span>Total Cost:</span> <span id="cost-total">$0.00</span></div>
            </div>
        </div>

        <!-- DESCRIPTION -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-20 text-gray-600 font-mono outline-none" readonly></textarea>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypbRuIJmkXqC447Yd1akhlhDrEyRoq0ypfZNHf0dI77KrZWUUeOqvUm5122O2RdzyYEQ/exec";
        const TAB_NAME = "PROD_Cut_Vinyl";
        let backend = {};
        
        // COLOR DB
        const COLORS = [
            {c:"010", n:"White", h:"#FFFFFF"}, {c:"070", n:"Black", h:"#000000"},
            {c:"031", n:"Red", h:"#C0142C"}, {c:"049", n:"King Blue", h:"#002359"},
            {c:"067", n:"Blue", h:"#005697"}, {c:"063", n:"Lime", h:"#81B930"},
            {c:"090", n:"Silver", h:"#8A8D8F"}, {c:"091", n:"Gold", h:"#897238"},
            {c:"021", n:"Yellow", h:"#FED100"}, {c:"034", n:"Orange", h:"#E54909"},
            {c:"041", n:"Pink", h:"#CC4F81"}, {c:"080", n:"Brown", h:"#52341C"}
        ];

        function initColors() {
            const grid = document.getElementById('color-grid');
            COLORS.forEach(col => {
                const div = document.createElement('div');
                div.className = "w-full h-6 rounded cursor-pointer border border-gray-200 hover:border-blue-500 shadow-sm";
                div.style.backgroundColor = col.h;
                div.title = `${col.n} (${col.c})`;
                div.onclick = function() { 
                    document.getElementById('vinyl-color').value = `${col.n} (${col.c})`;
                    document.getElementById('selected-swatch').style.backgroundColor = col.h;
                    calculate();
                };
                grid.appendChild(div);
            });
        }

        let currentUser = { name: "Guest", role: "VIEW", mode: "sales" };
        function initSession() {
            const params = new URLSearchParams(window.location.search);
            const urlMode = params.get('mode') || 'sales';
            currentUser.mode = urlMode;
            const body = document.body;
            body.classList.remove('mode-sales', 'mode-prod', 'mode-admin');
            if(currentUser.mode === 'sales') { body.classList.add('mode-sales'); switchTab('retail'); }
            else if (currentUser.mode === 'production') { body.classList.add('mode-prod'); switchTab('cost'); }
            else { body.classList.add('mode-admin'); }
        }

        function goBack() { window.location.href = `menu.html?mode=${currentUser.mode}`; }
        function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
        function switchTab(id) { document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+id).classList.add('active'); document.getElementById('btn-'+id).classList.add('active'); }

        window.onload = async function() {
            initSession();
            initColors();
            try {
                const response = await fetch(`${SCRIPT_URL}?tab=${TAB_NAME}`);
                const data = await response.json();
                backend = data;
                document.getElementById("status-text").innerText = "ONLINE";
                document.getElementById("status-text").classList.add("text-green-500");
                calculate();
            } catch(e) { console.log(e); }
        };

        function calculate() {
            if(!backend.Item_Name) return;
            const w = parseFloat(document.getElementById('width').value)||0;
            const h = parseFloat(document.getElementById('height').value)||0;
            const qty = parseFloat(document.getElementById('qty').value)||1;
            const mat = document.getElementById('material').value;
            const color = document.getElementById('vinyl-color').value || "White (010)";
            const complexity = document.querySelector('input[name="complexity"]:checked').value;

            const sqft = (w*h)/144;
            const totalSqFt = sqft * qty;

            const baseRate = mat === '651' ? parseFloat(backend.Retail_Price_651_SqFt || 12) : parseFloat(backend.Retail_Price_751_SqFt || 18);
            let retailPrint = baseRate * totalSqFt;
            if(complexity === 'Complex') retailPrint += (totalSqFt * 5.00);
            
            let price = Math.max(retailPrint, parseFloat(backend.Retail_Min_Order || 45));

            document.getElementById('unit-price').innerText = "$" + (price/qty).toFixed(2);
            document.getElementById('total-price').innerText = "$" + price.toFixed(2);

            const costVinyl = totalSqFt * (mat==='651' ? 0.85 : 2.50);
            const costWeed = (totalSqFt * (complexity==='Simple'?2:10)/60) * 20; 
            const totalCost = costVinyl + costWeed;
            document.getElementById('cost-total').innerText = "$" + totalCost.toFixed(2);

            if(price - totalCost < 0) document.getElementById('profit-warn').classList.remove('hidden');
            else document.getElementById('profit-warn').classList.add('hidden');

            const desc = `(x${qty}) ${w}" x ${h}" Cut Vinyl. ${mat} Series: ${color}. Weeding: ${complexity}.`;
            document.getElementById('job-desc').value = desc;
        }
    </script>
</body>
</html>
