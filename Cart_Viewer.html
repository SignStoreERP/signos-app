<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Cart | SignOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-border { border: 1px solid #000; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 no-print">
            <h1 class="text-3xl font-black text-gray-900">Order Cart</h1>
            <div class="flex gap-3">
                <a href="order_menu.html" class="px-4 py-2 bg-white border rounded shadow text-sm font-bold text-gray-600 hover:bg-gray-50">← Add More Items</a>
                <button onclick="window.print()" class="px-6 py-2 bg-blue-600 text-white rounded shadow text-sm font-bold hover:bg-blue-700">Print Work Order</button>
            </div>
        </div>

        <!-- Work Order Layout -->
        <div class="bg-white shadow-xl rounded-xl overflow-hidden print-border print:shadow-none">
            <div class="bg-gray-900 text-white p-6 print:bg-white print:text-black print:border-b-2 print:border-black">
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="text-2xl font-bold">WORK ORDER</h2>
                        <p class="text-sm opacity-70">Order Date: <span id="date-display"></span></p>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-bold">SignOS ERP</div>
                        <div class="text-xs uppercase tracking-widest opacity-60">Production Control</div>
                    </div>
                </div>
            </div>

            <div class="p-6">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b-2 border-gray-200 text-xs uppercase text-gray-500 font-bold">
                            <th class="py-2 w-24">Proof</th>
                            <th class="py-2">Item Details</th>
                            <th class="py-2 text-center">Qty</th>
                            <th class="py-2 text-right">Price</th>
                            <th class="py-2 w-10 no-print"></th>
                        </tr>
                    </thead>
                    <tbody id="cart-body" class="text-sm text-gray-700 font-medium">
                        <!-- Dynamic Rows -->
                    </tbody>
                    <tfoot>
                        <tr class="border-t-2 border-gray-900">
                            <td colspan="3" class="pt-4 text-right font-bold uppercase text-gray-500">Order Total</td>
                            <td class="pt-4 text-right font-black text-2xl text-blue-600 print:text-black" id="cart-total">$0.00</td>
                            <td class="no-print"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            
            <div class="bg-gray-50 p-6 border-t border-gray-200 print:bg-white print:border-t-0">
                <div class="h-24 border-2 border-dashed border-gray-300 rounded flex items-center justify-center text-gray-400 text-xs font-bold uppercase tracking-widest">
                    Approved By / Signature
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            document.getElementById('date-display').innerText = new Date().toLocaleDateString();
            renderCart();
        };

        function renderCart() {
            const cart = JSON.parse(sessionStorage.getItem('signos_cart')) || [];
            const tbody = document.getElementById('cart-body');
            tbody.innerHTML = '';
            
            let total = 0;

            if(cart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-400 italic">Cart is empty.</td></tr>`;
                return;
            }

            cart.forEach((item, index) => {
                const cleanPrice = parseFloat(item.price.replace('$','')) || 0;
                total += cleanPrice;

                const row = document.createElement('tr');
                row.className = "border-b border-gray-100 hover:bg-gray-50";
                row.innerHTML = `
                    <td class="py-3"><img src="${item.proofImage}" class="w-16 h-12 object-contain border bg-white rounded"></td>
                    <td class="py-3">
                        <div class="font-bold text-gray-900">${item.product}</div>
                        <div class="text-xs text-gray-500">${item.desc}</div>
                        <div class="text-[10px] text-gray-400 mt-1 uppercase">${item.stakes ? '+ Stakes' : 'No Hardware'}</div>
                    </td>
                    <td class="py-3 text-center font-bold">${item.qty}</td>
                    <td class="py-3 text-right font-bold text-gray-900">${item.price}</td>
                    <td class="py-3 text-center no-print">
                        <button onclick="removeItem(${index})" class="text-red-400 hover:text-red-600 font-bold">×</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('cart-total').innerText = "$" + total.toFixed(2);
        }

        function removeItem(index) {
            let cart = JSON.parse(sessionStorage.getItem('signos_cart')) || [];
            cart.splice(index, 1);
            sessionStorage.setItem('signos_cart', JSON.stringify(cart));
            renderCart();
        }
    </script>
</body>
</html>
