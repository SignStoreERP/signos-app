<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Etch Nameplates v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="signos-ui.js"></script>
    <script src="signos-canvas.js"></script>
    <script src="logic_nameplate.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .color-scroll::-webkit-scrollbar { width: 6px; }
        .color-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}\n        .color-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .aspect-box { container-type: size; } 
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

    <div id="main-card" class="max-w-xl mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
        
        <div class="p-6 space-y-6">
            <div class="flex items-center justify-between">
                <h1 class="text-lg font-black text-gray-800 tracking-tight uppercase">ADA Etch Nameplates</h1>
                <div id="status-badge" class="flex items-center gap-2">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-orange-400 animate-pulse"></div>
                    <span id="status-text" class="text-[10px] font-bold text-gray-400 uppercase">Connecting...</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Width (in)</label>
                    <input type="number" id="w" value="10" step="0.1" oninput="runCalc()" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Height (in)</label>
                    <input type="number" id="h" value="2" step="0.1" oninput="runCalc()" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div id="sheet-warn" class="hidden p-3 bg-amber-50 border border-amber-200 rounded-lg text-[10px] font-bold text-amber-700">
                ⚠️ Max Parent Sheet Limit (24" x 48") Reached. Dimensions auto-adjusted.
            </div>

            <!-- UI ACCORDION: Layout -->
            <div class="border border-gray-100 rounded-xl overflow-hidden bg-gray-50/30">
                <button onclick="toggleAccordion('layout-content', 'layout-arrow')" class="w-full px-4 py-3 flex items-center justify-between bg-white hover:bg-gray-50 transition">
                    <span class="text-[11px] font-black text-gray-500 uppercase tracking-widest">Sign Text & Layout</span>
                    <span id="layout-arrow" class="text-gray-400 transition-transform">▼</span>
                </button>
                <div id="layout-content" class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Lines:</label>
                        <div class="flex gap-1">
                            <button id="btn-line-1" onclick="setLineCount(1)" class="px-2 py-0.5 text-[10px] rounded border transition">1</button>
                            <button id="btn-line-2" onclick="setLineCount(2)" class="px-2 py-0.5 text-[10px] rounded border transition">2</button>
                            <button id="btn-line-3" onclick="setLineCount(3)" class="px-2 py-0.5 text-[10px] rounded border transition">3</button>
                        </div>
                        <input type="hidden" id="lines-per-sign" value="1">
                    </div>
                    <div id="line-inputs" class="space-y-3"></div>
                </div>
            </div>

            <!-- PREVIEW WINDOW -->
            <div class="space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Ratio & Alignment Preview</h2>
                    <div id="overflow-alert" class="hidden text-[10px] font-black text-red-500 uppercase">⚠️ Layout Overflow</div>
                </div>
                <div id="preview-container" class="w-full aspect-box relative bg-white border border-gray-200 shadow-inner rounded-sm overflow-hidden transition-all duration-300">
                    <div id="preview-inner" class="absolute inset-0 flex items-center justify-center p-4">
                        <span class="text-gray-200 font-black text-xs uppercase tracking-widest">Awaiting Text</span>
                    </div>
                </div>
            </div>

            <!-- MATERIAL & PAINT -->
            <div class="grid grid-cols-2 gap-4">
                <button id="mode-front" onclick="setMode('front')" class="py-2.5 rounded-xl border-2 text-[10px] font-black uppercase transition shadow-sm">Front Engrave</button>
                <button id="mode-reverse" onclick="setMode('reverse')" class="py-2.5 rounded-xl border-2 text-[10px] font-black uppercase transition shadow-sm">Reverse Engraved</button>
            </div>

            <div class="space-y-4">
                <section>
                    <div class="flex items-center justify-between mb-2 px-1">
                        <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Step 1: Face Color</h3>
                        <input type="text" id="mat-search" placeholder="Search..." oninput="SignOS_UI.filterGrid('mat-grid', 'mat-search')" class="text-[10px] px-2 py-1 border border-gray-200 rounded focus:border-blue-500 outline-none">
                    </div>
                    <div id="mat-grid" class="flex flex-wrap gap-2 p-2 max-h-32 overflow-y-auto color-scroll border border-gray-100 rounded-xl bg-gray-50/50"></div>
                </section>

                <section id="paint-section" class="hidden animate-in fade-in duration-300">
                    <div class="flex items-center justify-between mb-2 px-1">
                        <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Step 2: Paint Color</h3>
                        <div class="flex bg-gray-100 p-0.5 rounded text-[9px] font-bold">
                            <button id="tab-pms" onclick="setPaintSystem('PMS')" class="px-2 py-0.5 rounded transition">PMS Match</button>
                            <button id="tab-sw" onclick="setPaintSystem('SW')" class="px-2 py-0.5 rounded transition">Sherwin Williams</button>
                        </div>
                    </div>
                    <div id="paint-grid" class="flex flex-wrap gap-2 p-2 max-h-32 overflow-y-auto color-scroll border border-gray-100 rounded-xl bg-gray-50/50"></div>
                </section>
            </div>

            <!-- PRICING FOOTER -->
            <div class="pt-6 border-t border-gray-100 flex items-end justify-between">
                <div>
                    <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Unit Price</div>
                    <div id="ui-unit-price" class="text-3xl font-black tracking-tighter text-gray-900">$0.00</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Total Quote</div>
                    <div id="ui-total-quote" class="text-xl font-black text-blue-600 tracking-tight">$0.00</div>
                    <div id="ui-min-text" class="text-[9px] font-bold text-gray-400 uppercase mt-1">Shop Min: $35</div>
                </div>
            </div>

            <button onclick="copyTicket()" class="w-full py-3 bg-gray-900 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-black transition shadow-lg">Copy Ticket Details</button>
        </div>

    </div>

    <textarea id="job-desc" class="hidden"></textarea>

    <script>
        let backendData = {};
        let rowmarkData = [];
        let swData = [];
        let pmsData = [];
        let systemFonts = [];
        
        let selectedMat = null;
        let selectedPaint = null;
        let currentMode = 'front';
        let lineSettings = [
            { text: 'SAMPLE', font: '', height: 1.0, caseType: 'upper' },
            { text: '', font: '', height: 0.375, caseType: 'title' },
            { text: '', font: '', height: 0.375, caseType: 'title' }
        ];

        function toggleAccordion(contentId, arrowId) {
            document.getElementById(contentId).classList.toggle('hidden');
            document.getElementById(arrowId).classList.toggle('rotate-180');
        }

        function setLineCount(num) {
            document.getElementById('lines-per-sign').value = num;
            for(let i=1; i<=3; i++) {
                const btn = document.getElementById('btn-line-'+i);
                btn.className = i === num ? "px-2 py-0.5 text-[10px] font-black rounded bg-white text-indigo-700 shadow-sm border-gray-200" : "px-2 py-0.5 text-[10px] font-bold rounded hover:bg-white transition text-gray-400 border-transparent";
            }
            updateLineControls();
        }

        function updateLineControls() {
            const count = parseInt(document.getElementById('lines-per-sign').value);
            const container = document.getElementById('line-inputs');
            container.innerHTML = '';

            for(let i=0; i<count; i++) {
                const div = document.createElement('div');
                div.className = "space-y-2 p-3 bg-white border border-gray-100 rounded-lg";
                div.innerHTML = `
                    <div class="flex gap-2">
                        <input type="text" value="${lineSettings[i].text}" oninput="updateLine(${i}, 'text', this.value)" placeholder="Line ${i+1} Text..." class="flex-1 px-3 py-1.5 bg-gray-50 border border-gray-200 rounded text-xs font-bold outline-none focus:border-blue-500 transition">
                        <select onchange="updateLine(${i}, 'caseType', this.value)" class="w-20 px-1 py-1 bg-white border border-gray-200 rounded text-[10px] font-bold">
                            <option value="upper" ${lineSettings[i].caseType === 'upper' ? 'selected' : ''}>UPPER</option>
                            <option value="title" ${lineSettings[i].caseType === 'title' ? 'selected' : ''}>Title</option>
                            <option value="lower" ${lineSettings[i].caseType === 'lower' ? 'selected' : ''}>lower</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <select onchange="updateLine(${i}, 'font', this.value)" class="flex-1 px-2 py-1 bg-white border border-gray-200 rounded text-[10px] font-bold">
                            ${systemFonts.map(f => `<option value="${f.CSS_Family}" ${lineSettings[i].font === f.CSS_Family ? 'selected' : ''}>${f.Display_Name}</option>`).join('')}
                        </select>
                        <input type="number" step="0.0625" value="${lineSettings[i].height}" oninput="updateLine(${i}, 'height', this.value)" class="w-16 px-2 py-1 bg-white border border-gray-200 rounded text-[10px] font-bold text-center">
                    </div>
                `;
                container.appendChild(div);
            }
            runCalc();
        }

        function updateLine(idx, field, val) {
            lineSettings[idx][field] = (field === 'height') ? parseFloat(val) : val;
            runCalc();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('mode-front').className = m === 'front' ? "py-2.5 rounded-xl border-2 border-indigo-500 bg-indigo-50 text-indigo-700 font-black text-[10px] uppercase shadow-sm" : "py-2.5 rounded-xl border-2 border-gray-100 bg-white text-gray-400 hover:border-gray-200 transition text-[10px] uppercase";
            document.getElementById('mode-reverse').className = m === 'reverse' ? "py-2.5 rounded-xl border-2 border-indigo-500 bg-indigo-50 text-indigo-700 font-black text-[10px] uppercase shadow-sm" : "py-2.5 rounded-xl border-2 border-gray-100 bg-white text-gray-400 hover:border-gray-200 transition text-[10px] uppercase";
            
            document.getElementById('paint-section').classList.toggle('hidden', m === 'front');
            updateSwatches();
            runCalc();
        }

        function updateSwatches() {
            const series = (currentMode === 'front') ? 'Mattes' : 'Ultra-Mattes';
            const filtered = rowmarkData.filter(m => m.Series.includes(series));
            
            SignOS_UI.buildColorGrid({
                containerId: 'mat-grid',
                data: filtered,
                type: 'rowmark',
                onSelect: (mat) => {
                    selectedMat = mat;
                    runCalc();
                }
            });

            if (currentMode === 'reverse') {
                const paintData = document.getElementById('tab-pms').classList.contains('bg-white') ? pmsData : swData;
                SignOS_UI.buildColorGrid({
                    containerId: 'paint-grid',
                    data: paintData,
                    type: 'paint',
                    onSelect: (paint) => {
                        selectedPaint = paint;
                        runCalc();
                    }
                });
            }
        }

        function setPaintSystem(sys) {
            document.getElementById('tab-pms').className = sys === 'PMS' ? "px-2 py-0.5 rounded bg-white text-orange-600 shadow-sm" : "px-2 py-0.5 rounded text-gray-400 hover:text-gray-600";
            document.getElementById('tab-sw').className = sys === 'SW' ? "px-2 py-0.5 rounded bg-white text-orange-600 shadow-sm" : "px-2 py-0.5 rounded text-gray-400 hover:text-gray-600";
            updateSwatches();
        }

        function runCalc() {
            if(!selectedMat) return;
            SignOS_Canvas.enforceSheetLimits('w', 'h', 'sheet-warn', 24, 48);

            try {
                const inputs = {
                    w: parseFloat(document.getElementById('w').value) || 10,
                    h: parseFloat(document.getElementById('h').value) || 2,
                    qty: 1,
                    mat: selectedMat,
                    isReverse: (currentMode === 'reverse')
                };

                const result = calculateNameplate(inputs, backendData);
                if(!result) return;

                updatePreview(inputs);
                updatePricingUI(result.retail);
                updateTicket(inputs, result.retail);

            } catch(e) { console.error(e); }
        }

        function updatePreview(inputs) {
            const container = document.getElementById('preview-container');
            const inner = document.getElementById('preview-inner');
            const ratio = inputs.h / inputs.w;
            
            container.style.paddingBottom = `${ratio * 100}%`;
            container.style.backgroundColor = selectedMat.Cap_Hex;
            
            const lineCount = parseInt(document.getElementById('lines-per-sign').value);
            const coreColor = (currentMode === 'front') ? selectedMat.Core_Hex : (selectedPaint ? selectedPaint.Hex_Code : '#000000');
            
            let html = '';
            const padding = 0.25;
            const availableW = inputs.w - (padding * 2);
            let hasOverflow = false;

            for(let i=0; i<lineCount; i++) {
                const line = lineSettings[i];
                let text = line.text;
                if (line.caseType === 'upper') text = text.toUpperCase();
                else if (line.caseType === 'title') text = text.replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
                
                const maxH = SignOS_Canvas.calcMaxHeightForText(text, line.font, availableW);
                const appliedH = Math.min(line.height, maxH);
                if(maxH < line.height) hasOverflow = true;

                const topPct = (padding / inputs.h) * 100 + (i * (line.height / inputs.h) * 100);
                const heightPct = (appliedH / inputs.h) * 100;

                html += `
                    <div class="absolute left-0 w-full flex items-center justify-center pointer-events-none" 
                         style="top:${topPct}%; height:${heightPct}%; font-family:'${line.font}', sans-serif; color:${coreColor};">
                         <span class="whitespace-nowrap text-center" style="font-size: 100cqh;">${text}</span>
                    </div>
                `;
            }
            
            inner.innerHTML = html;
            document.getElementById('overflow-alert').classList.toggle('hidden', !hasOverflow);
        }

        function updatePricingUI(ret) {
            document.getElementById('ui-unit-price').innerText = `$${ret.unitPrice.toFixed(2)}`;
            document.getElementById('ui-total-quote').innerText = `$${ret.grandTotal.toFixed(2)}`;
            const minOrder = parseFloat(backendData.Retail_Min_Order || 35);
            document.getElementById('ui-min-text').innerText = `Shop Min: $${minOrder}`;
            document.getElementById('ui-min-text').className = ret.isMinApplied ? "text-[9px] font-black text-blue-500 uppercase mt-1" : "text-[9px] font-bold text-gray-400 uppercase mt-1";
        }

        function updateTicket(inputs, ret) {
            const matLabel = `${selectedMat.Item_Code} - ${selectedMat.Cap_Color}/${selectedMat.Core_Color}`;
            const paintLabel = (currentMode === 'reverse' && selectedPaint) ? ` | Paint: ${selectedPaint.Name}` : '';
            const textLines = lineSettings.slice(0, parseInt(document.getElementById('lines-per-sign').value)).map(l => l.text).join(' / ');

            document.getElementById('job-desc').value = `
ADA ETCH NAMEPLATE
Size: ${inputs.w}" x ${inputs.h}"
Material: ${matLabel}${paintLabel}
Mode: ${currentMode.toUpperCase()}
Text: ${textLines}
            `.trim();
        }

        function copyTicket() {
            const el = document.getElementById('job-desc');
            el.select();
            document.execCommand('copy');
            alert("Ticket Details Copied");
        }

        window.addEventListener('load', async () => {
            if (typeof injectHeader === 'function') injectHeader("ADA Etch Nameplates");
            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            try {
                const payload = await SignOS.fetchProductData('PROD_Nameplates', ['REF_Colors_Rowmark', 'REF_Colors_Paint', 'REF_Colors_PMS', 'REF_Fonts']);
                backendData = payload.config;
                rowmarkData = payload.tables['REF_Colors_Rowmark'] || [];

                swData = (payload.tables['REF_Colors_Paint'] || []).map(p => ({
                    Code: p['Color Code'] || p['Code'] || 'Unknown',
                    Name: p['Color Name'] || p['Name'] || 'Unknown',
                    Hex_Code: p['HEX Code'] || p['Hex_Code'] || '#FFFFFF'
                }));

                pmsData = (payload.tables['REF_Colors_PMS'] || []).map(p => ({
                    Code: p['PMS Name / Code'] || 'Unknown',
                    Name: p['PMS Name / Code'] || 'Unknown',
                    Hex_Code: p['HEX Code'] || '#FFFFFF'
                }));

                systemFonts = (payload.tables['REF_Fonts'] || []).filter(f => String(f.Is_Active).toUpperCase() === 'TRUE');
                SignOS_Canvas.loadFonts(systemFonts);
                
                // FIXED: shares the safe font-fallback behavior from the bulk calculator
                let defaultFont = systemFonts.find(f => f.CSS_Family === 'Arimo') || (systemFonts.length > 0 ? systemFonts[0] : null);
                lineSettings.forEach(ls => ls.font = defaultFont ? defaultFont.CSS_Family : 'sans-serif');

                if(statusText) {
                    statusText.innerText = "ONLINE";
                    statusText.className = "font-bold text-green-500";
                    if(statusDot) {
                        statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                        statusDot.classList.remove("animate-pulse");
                    }
                }

                updateLineControls();
                setPaintSystem('PMS'); 
                setMode('front');      
                
            } catch(e) {
                if(statusText) {
                    statusText.innerText = "OFFLINE (API FAILED)";
                    statusText.className = "font-bold text-red-500";
                }
                console.error("API Load Failed:", e);
            }
        });
    </script>
</body>
</html>
