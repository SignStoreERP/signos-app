<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Etch Nameplates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="logic_nameplate.js"></script>
    <style>input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }</style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

    <div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
        
        <!-- INPUTS -->
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-3 gap-3">
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="8" min="0.5" step="0.5" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="2" min="0.5" step="0.5" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none" oninput="runCalc()"></div>
            </div>

            <div class="border-t border-gray-100 pt-3">
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Engraving Style</label>
                <select id="style" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none" onchange="toggleStyle(); runCalc();">
                    <option value="Standard">Standard Front Engrave (Mattes)</option>
                    <option value="Reverse">Reverse Engrave (Ultra-Mattes + Paint Fill)</option>
                </select>
            </div>

            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Background Material Color</label>
                    <select id="materialColor" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none" onchange="runCalc()"></select>
                </div>
                <div id="paint-wrap" class="hidden bg-orange-50 border border-orange-200 p-3 rounded-lg">
                    <label class="block text-[10px] font-bold text-orange-700 uppercase mb-1">Engraved Text Color (Paint Fill)</label>
                    <select id="paintColor" class="w-full border border-orange-300 p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-orange-500 outline-none" onchange="runCalc()"></select>
                </div>
            </div>
        </div>

        <!-- RESULTS -->
        <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
            <div class="flex justify-between items-end mb-2">
                <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
                <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
            </div>
            <div class="border-t border-blue-200/50 my-3"></div>
            
            <div class="space-y-1 text-xs text-blue-900/70 pt-1">
                <div class="flex justify-between"><span>Nameplates (<span id="lbl-sqin">0</span> sq in):</span><span id="ui-print" class="font-bold">$0.00</span></div>
            </div>

            <div class="flex justify-between items-end border-t-2 border-blue-800 my-3 pt-2">
                <div>
                    <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                    <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Minimum: $35</span>
                    <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
                </div>
                <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
            </div>
        </div>

        <!-- DESCRIPTION GENERATOR -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-20 text-gray-600 font-mono outline-none" readonly></textarea>
        </div>
    </div>

    <script>
        let backendData = {};

        // SIMULATED API DATA INJECTIONS
        const matMattes = [
            { id: "2XX-402", text: "Black Face / White Core" },
            { id: "2XX-407", text: "Black Face / Gold Core" },
            { id: "2XX-204", text: "White Face / Black Core" },
            { id: "2XX-602", text: "Red Face / White Core" },
            { id: "2XX-512", text: "Blue Face / White Core" },
            { id: "2XX-324", text: "Light Grey Face / Black Core" }
        ];

        const matUltraMattes = [
            { id: "3X2-401", text: "Black Background / Clear Core" },
            { id: "3X2-201", text: "White Background / Clear Core" },
            { id: "3X2-511", text: "Blue Background / Clear Core" },
            { id: "3X2-731", text: "Vintage Gold Background / Clear Core" },
            { id: "3X2-371", text: "Vintage Silver Background / Clear Core" }
        ];

        const paintColors = [
            { id: "SW0001", text: "Mulberry Silk (SW0001)" },
            { id: "SW0006", text: "Toile Red (SW0006)" },
            { id: "SW0009", text: "Eastlake Gold (SW0009)" },
            { id: "SW0032", text: "Needlepoint Navy (SW0032)" },
            { id: "BLACK", text: "Standard Black" },
            { id: "WHITE", text: "Standard White" }
        ];

        function toggleStyle() {
            const style = document.getElementById('style').value;
            const paintWrap = document.getElementById('paint-wrap');
            const matSelect = document.getElementById('materialColor');
            
            matSelect.innerHTML = '';
            
            if (style === 'Reverse') {
                paintWrap.classList.remove('hidden');
                matUltraMattes.forEach(m => matSelect.innerHTML += `<option value="${m.id}">${m.text}</option>`);
            } else {
                paintWrap.classList.add('hidden');
                matMattes.forEach(m => matSelect.innerHTML += `<option value="${m.id}">${m.text}</option>`);
            }
        }

        function initData() {
            const paintSelect = document.getElementById('paintColor');
            paintSelect.innerHTML = '';
            paintColors.forEach(p => paintSelect.innerHTML += `<option value="${p.id}">${p.text}</option>`);
            toggleStyle();
        }

        function runCalc() {
            try {
                const inputs = {
                    qty: parseFloat(document.getElementById('qty').value) || 1,
                    w: parseFloat(document.getElementById('w').value) || 8,
                    h: parseFloat(document.getElementById('h').value) || 2,
                    style: document.getElementById('style').value,
                    materialColor: document.getElementById('materialColor').options[document.getElementById('materialColor').selectedIndex].text,
                    paintColor: document.getElementById('paintColor').options[document.getElementById('paintColor').selectedIndex]?.text || ''
                };

                const result = calculateNameplate(inputs, backendData);
                if (!result || !result.retail) return;

                const ret = result.retail;
                const fmt = (n) => "$" + (n || 0).toFixed(2);
                
                const totalSqin = (inputs.w * inputs.h) * inputs.qty;
                document.getElementById('lbl-sqin').innerText = totalSqin.toFixed(1);

                document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
                document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
                document.getElementById('ui-print').innerText = fmt(ret.printTotal);

                const minOrder = parseFloat(backendData.Retail_Min_Order || 35);
                document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
                document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

                const pntTxt = inputs.style === 'Reverse' ? `\nPaint Fill: ${inputs.paintColor}` : '';
                document.getElementById('job-desc').value = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" Engraved Nameplates.\nStyle: ${inputs.style}\nMaterial: ${inputs.materialColor}${pntTxt}`;

            } catch(e) { console.error(e); }
        }

        window.addEventListener('load', async () => {
            if (typeof injectHeader === 'function') injectHeader("ADA Etch Nameplates");
            
            initData();

            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            try {
                // Fetching placeholder backend config directly for Dev Sandbox
                backendData = {
                    Retail_Price_SqIn_Base: 0.50,
                    Retail_Adder_Reverse_SqIn: 0.20,
                    Retail_Min_Order: 35,
                    Cost_Sheet_Standard: 65,
                    Cost_Sheet_Reverse: 85,
                    Cost_Paint_SqIn: 0.01,
                    Time_Preflight_Job: 10,
                    Time_Engraver_Load_Per_Item: 2,
                    Time_Engrave_SqIn: 0.25,
                    Time_Paint_Setup: 15,
                    Time_Paint_SqIn: 0.10,
                    Rate_Operator: 25,
                    Rate_Machine_Engraver: 10,
                    Rate_Shop_Labor: 20,
                    Waste_Factor: 1.20,
                    Factor_Risk: 1.05
                };

                if(statusText) {
                    statusText.innerText = "ONLINE (SANDBOX DATA)";
                    statusText.className = "font-bold text-green-500";
                    if(statusDot) {
                        statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                        statusDot.classList.remove("animate-pulse");
                    }
                }
                
                runCalc();
            } catch(e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
