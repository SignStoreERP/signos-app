<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Etch Nameplates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="logic_nameplate.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .color-scroll::-webkit-scrollbar { width: 6px; }
        .color-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .color-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .aspect-box { transition: all 0.3s ease-in-out; }
        @keyframes pulse-warn { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .bright-warning { animation: pulse-warn 2s infinite; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

    <div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
        
        <div class="p-6 space-y-4">
            
            <!-- TOP: Preview Toggle & Canvas -->
            <div class="bg-gray-50 border border-gray-200 p-3 rounded-lg shadow-sm">
                <label class="flex items-center gap-2 text-[10px] font-bold text-gray-500 uppercase cursor-pointer hover:text-blue-600 transition">
                    <input type="checkbox" id="toggle-preview" onchange="togglePreview()" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
                    Show Visual Size Preview
                </label>
                
                <div id="preview-wrapper" class="hidden mt-3">
                    <div class="bg-gray-800 p-4 shadow-inner flex items-center justify-center min-h-[160px] relative rounded-lg">
                        <span class="absolute top-2 right-3 text-[8px] font-black text-gray-500 uppercase tracking-widest">Ratio Preview</span>
                        
                        <!-- The Canvas (Dynamically Sized) -->
                        <div id="preview-canvas" class="aspect-box shadow-2xl rounded-sm flex items-center justify-center relative overflow-hidden border border-black/20" style="background-color: #000;">
                            <span id="preview-text" class="font-black text-center pointer-events-none px-2 leading-tight truncate w-full" style="color: #fff;">SAMPLE</span>
                        </div>
                    </div>
                    
                    <!-- Warning Box for Bright -->
                    <div id="bright-warn-box" class="hidden mt-2 bg-amber-100 border border-amber-300 p-2 px-3 flex items-start gap-2 shadow-inner rounded-lg">
                        <div class="text-amber-600 text-sm">⚠️</div>
                        <div class="text-[10px] text-amber-900 font-medium leading-tight">
                            <strong class="uppercase font-black">Warning:</strong> "Bright" color selected. Most standard signs use standard "White". Verify with artwork.
                        </div>
                    </div>
                </div>
            </div>

            <!-- DIMENSIONS & QTY -->
            <div class="grid grid-cols-3 gap-3 pt-2">
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white shadow-inner focus:border-blue-500 outline-none" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="10" min="0.5" step="0.5" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white shadow-inner focus:border-blue-500 outline-none" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="2" min="0.5" step="0.5" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white shadow-inner focus:border-blue-500 outline-none" oninput="runCalc()"></div>
            </div>

            <!-- ENGRAVE STYLE -->
            <div class="pt-1">
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Engrave Direction</label>
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button id="btn-front" onclick="setMode('front')" class="flex-1 py-2 text-xs font-bold rounded bg-white shadow-sm border border-gray-200 transition-all text-blue-700">FRONT ENGRAVE</button>
                    <button id="btn-reverse" onclick="setMode('reverse')" class="flex-1 py-2 text-xs font-bold rounded text-gray-500 hover:text-gray-800 transition-all border border-transparent">REVERSE (ADA)</button>
                </div>
            </div>

            <div class="space-y-4">
                <!-- MATERIAL SWATCHES -->
                <div>
                    <div class="flex justify-between items-end mb-1">
                        <label id="cap-label" class="block text-[10px] font-bold text-gray-500 uppercase">Surface Material / Cap Color</label>
                    </div>
                    <div id="selected-color-label" class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100 mb-2 truncate">Loading...</div>
                    <div id="rowmark-grid" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-2 color-scroll p-3 border rounded-lg bg-gray-50 shadow-inner">
                        <div class="text-xs text-gray-400 font-bold italic w-full text-center py-4 animate-pulse">Fetching Rowmark Array...</div>
                    </div>
                </div>

                <!-- REVERSE SPECIFIC: PAINT FILL -->
                <div id="reverse-options" class="hidden space-y-3 pt-3 border-t border-gray-200">
                    <div>
                        <div class="flex justify-between items-end mb-1">
                            <label class="block text-[10px] font-bold text-orange-700 uppercase">Engraved Text Color (Paint Fill)</label>
                            
                            <!-- THE NEW BOOK TOGGLE -->
                            <div class="flex bg-orange-200/50 p-0.5 rounded">
                                <button id="btn-pms" onclick="setPaintSystem('PMS')" class="px-2 py-0.5 text-[9px] font-bold rounded bg-white text-orange-700 shadow-sm transition">PMS</button>
                                <button id="btn-sw" onclick="setPaintSystem('SW')" class="px-2 py-0.5 text-[9px] font-bold rounded text-orange-600 hover:text-orange-800 transition">S-W</button>
                            </div>
                        </div>

                        <div id="selected-paint-label" class="text-[10px] font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded border border-orange-100 mb-2 truncate">None Selected</div>
                        
                        <!-- SEARCH BAR -->
                        <div class="relative mb-2">
                            <input type="text" id="paint-search" placeholder="Search PMS Colors..." oninput="filterPaint()" onclick="document.getElementById('paint-list').classList.remove('hidden')" class="w-full bg-white border border-orange-200 rounded p-2 text-xs font-bold text-orange-900 outline-none focus:border-orange-500 shadow-sm">
                            <div id="paint-list" class="absolute z-20 w-full bg-white border border-orange-200 rounded-b shadow-xl max-h-40 overflow-y-auto color-scroll text-xs hidden mt-1"></div>
                        </div>

                        <!-- PAINT GRID -->
                        <div id="paint-grid" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-2 color-scroll p-3 border rounded-lg bg-orange-50 shadow-inner">
                            <!-- Paint Hex Blocks Injected Here -->
                        </div>

                        <!-- CUSTOM MANUAL PMS (Fallback) -->
                        <div id="custom-pms-wrap" class="hidden mt-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Enter Custom Color Manual Name</label>
                            <input type="text" id="pms-code" placeholder="e.g. Custom Match To Sample" oninput="updateCustomPMS()" class="w-full bg-white border border-gray-300 rounded p-2 text-sm font-bold outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- RESULTS -->
        <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
            <div class="flex justify-between items-end mb-2">
                <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
                <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
            </div>
            
            <div class="border-t border-blue-200/50 my-3"></div>
            
            <div class="space-y-1 text-xs text-blue-900/70 pt-1">
                <div class="flex justify-between"><span>Engraved Plates (<span id="lbl-sqin">0</span> sq in):</span><span id="ui-print" class="font-bold">$0.00</span></div>
            </div>

            <div class="flex justify-between items-end border-t-2 border-blue-800 my-3 pt-2">
                <div>
                    <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                    <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Min: $35</span>
                    <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
                </div>
                <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
            </div>
        </div>

        <!-- DESCRIPTION GENERATOR -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Production Ticket Details</label>
            <textarea id="job-desc" class="w-full text-[11px] p-2 border border-gray-300 rounded bg-white h-32 text-gray-600 font-mono outline-none" readonly></textarea>
        </div>
    </div>

    <script>
        let backendData = {};
        let rowmarkData = [];
        
        let pmsData = [];
        let swData = [];
        let activePaintSystem = 'PMS';

        let selectedMat = null;
        let selectedPaint = null;
        let currentMode = 'front';

        function togglePreview() {
            const wrap = document.getElementById('preview-wrapper');
            if (document.getElementById('toggle-preview').checked) {
                wrap.classList.remove('hidden');
                runCalc(); 
            } else {
                wrap.classList.add('hidden');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const btnF = document.getElementById('btn-front');
            const btnR = document.getElementById('btn-reverse');
            const revOpts = document.getElementById('reverse-options');
            const capLab = document.getElementById('cap-label');

            if (mode === 'front') {
                btnF.className = "flex-1 py-2 text-xs font-bold rounded bg-white shadow-sm border border-gray-200 transition-all text-blue-700";
                btnR.className = "flex-1 py-2 text-xs font-bold rounded text-gray-500 hover:text-gray-800 transition-all border border-transparent";
                revOpts.classList.add('hidden');
                capLab.innerText = "Surface Material / Cap Color";
            } else {
                btnR.className = "flex-1 py-2 text-xs font-bold rounded bg-white shadow-sm border border-gray-200 transition-all text-blue-700";
                btnF.className = "flex-1 py-2 text-xs font-bold rounded text-gray-500 hover:text-gray-800 transition-all border border-transparent";
                revOpts.classList.remove('hidden');
                capLab.innerText = "Substrate Color (Faces Outward)";
            }
            
            updateSwatches();
        }

        function setPaintSystem(sys) {
            activePaintSystem = sys;
            document.getElementById('btn-pms').className = sys === 'PMS' ? "px-2 py-0.5 text-[9px] font-bold rounded bg-white text-orange-700 shadow-sm transition" : "px-2 py-0.5 text-[9px] font-bold rounded text-orange-600 hover:text-orange-800 transition";
            document.getElementById('btn-sw').className = sys === 'SW' ? "px-2 py-0.5 text-[9px] font-bold rounded bg-white text-orange-700 shadow-sm transition" : "px-2 py-0.5 text-[9px] font-bold rounded text-orange-600 hover:text-orange-800 transition";
            
            document.getElementById('paint-search').placeholder = sys === 'PMS' ? "Search PMS Colors..." : "Search Sherwin Williams...";
            document.getElementById('paint-search').value = ""; // Clear active search
            
            buildPaintSwatches();
        }

        function updateSwatches() {
            const grid = document.getElementById('rowmark-grid');
            grid.innerHTML = '';
            
            const filtered = rowmarkData.filter(c => {
                const isReverseMat = c.Series.includes('Reverse');
                if (currentMode === 'reverse') return isReverseMat;
                return !isReverseMat;
            });

            filtered.forEach((c, index) => {
                const btn = document.createElement('button');
                btn.className = "w-8 h-8 rounded border border-gray-300 shadow-sm hover:scale-110 transition focus:outline-none relative group overflow-hidden";
                
                let capHex = c.Cap_Hex || '#000000';
                let coreHex = c.Core_Hex || '#FFFFFF';

                if (currentMode === 'reverse') coreHex = '#e2e8f0';

                btn.style.background = `linear-gradient(135deg, ${capHex} 50%, ${coreHex} 50%)`;
                btn.title = `${c.Item_Code} - ${c.Cap_Color}`;

                btn.onclick = () => {
                    Array.from(grid.children).forEach(child => child.classList.remove('ring-2', 'ring-offset-1', 'ring-blue-500', 'border-transparent'));
                    btn.classList.add('ring-2', 'ring-offset-1', 'ring-blue-500', 'border-transparent');
                    
                    selectedMat = c;
                    updateMaterialLabel();
                    runCalc();
                };

                grid.appendChild(btn);
                
                if (currentMode === 'front' && c.Item_Code === '222-402') setTimeout(() => btn.click(), 10);
                if (currentMode === 'reverse' && index === 0) setTimeout(() => btn.click(), 10);
            });
        }

        function buildPaintSwatches() {
            const grid = document.getElementById('paint-grid');
            grid.innerHTML = '';
            
            const listToUse = activePaintSystem === 'PMS' ? pmsData : swData;
            
            listToUse.forEach((p, index) => {
                const btn = document.createElement('button');
                btn.className = "w-8 h-8 rounded-full border border-gray-300 shadow-sm hover:scale-110 transition focus:outline-none flex items-center justify-center relative";
                btn.style.backgroundColor = p.Hex_Code;
                btn.title = `${p.Name} (${p.Code})`;
                
                btn.onclick = () => {
                    Array.from(grid.children).forEach(b => b.classList.remove('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent'));
                    btn.classList.add('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent');
                    
                    selectedPaint = p;
                    document.getElementById('custom-pms-wrap').classList.add('hidden');
                    document.getElementById('pms-code').value = '';
                    document.getElementById('selected-paint-label').innerText = `[${p.Code}] ${p.Name}`;
                    document.getElementById('paint-search').value = `${p.Name} (${p.Code})`;
                    
                    updateMaterialLabel();
                    runCalc();
                };
                grid.appendChild(btn);

                // Auto-select first paint when switching books
                if(index === 0) setTimeout(() => btn.click(), 10);
            });

            // Add Custom Input Button
            const customBtn = document.createElement('button');
            customBtn.className = "w-auto px-2 h-8 rounded border border-gray-300 bg-white text-[9px] font-bold text-gray-600 shadow-sm hover:border-blue-500 transition focus:outline-none uppercase";
            customBtn.innerText = "Manual Color";
            customBtn.onclick = () => {
                Array.from(grid.children).forEach(b => b.classList.remove('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent'));
                customBtn.classList.add('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent');
                
                selectedPaint = null;
                document.getElementById('custom-pms-wrap').classList.remove('hidden');
                document.getElementById('selected-paint-label').innerText = "Manual Color Entry Mode";
                document.getElementById('paint-search').value = "";
                
                updateMaterialLabel();
                runCalc();
            };
            grid.appendChild(customBtn);
            
            filterPaint(); // Refresh search box list
        }

        function filterPaint() {
            const query = document.getElementById('paint-search').value.toLowerCase();
            const list = document.getElementById('paint-list');
            list.innerHTML = '';
            
            const listToUse = activePaintSystem === 'PMS' ? pmsData : swData;
            const matches = listToUse.filter(p => p.Name.toLowerCase().includes(query) || p.Code.toLowerCase().includes(query));
            
            matches.forEach(p => {
                const div = document.createElement('div');
                div.className = "p-2 hover:bg-orange-50 cursor-pointer flex items-center justify-between border-b border-gray-100 last:border-0";
                div.onclick = () => {
                    selectedPaint = p;
                    document.getElementById('paint-search').value = `${p.Name} (${p.Code})`;
                    list.classList.add('hidden');
                    document.getElementById('pms-code').value = ''; // clear custom
                    document.getElementById('selected-paint-label').innerText = `[${p.Code}] ${p.Name}`;
                    
                    // Visually highlight it in the grid if possible, otherwise just update text
                    updateMaterialLabel();
                    runCalc();
                };
                div.innerHTML = `
                    <span class="font-bold text-gray-700">${p.Name} <span class="text-[9px] text-gray-400 ml-1">${p.Code}</span></span>
                    <div class="w-4 h-4 rounded-full border border-black/20 shadow-inner" style="background:${p.Hex_Code}"></div>
                `;
                list.appendChild(div);
            });
        }

        document.addEventListener('click', (e) => {
            if(!e.target.closest('#paint-search') && !e.target.closest('#paint-list')) {
                document.getElementById('paint-list').classList.add('hidden');
            }
        });

        function updateCustomPMS() {
            const val = document.getElementById('pms-code').value.trim();
            document.getElementById('selected-paint-label').innerText = val ? `Custom: ${val}` : "Manual Color Entry Mode";
            updateMaterialLabel();
            runCalc();
        }

        function updateMaterialLabel() {
            if (!selectedMat) return;
            const thickTxt = selectedMat.Thickness ? `(${selectedMat.Thickness})` : "";
            
            if (currentMode === 'front') {
                document.getElementById('selected-color-label').innerText = `[${selectedMat.Item_Code}] ${selectedMat.Cap_Color} Face / ${selectedMat.Core_Color} Text ${thickTxt}`;
            } else {
                let paintName = "TBD";
                if (selectedPaint) paintName = selectedPaint.Name;
                else if (document.getElementById('pms-code').value) paintName = document.getElementById('pms-code').value;
                
                document.getElementById('selected-color-label').innerText = `[${selectedMat.Item_Code}] ${selectedMat.Cap_Color} Back / ${paintName} Text ${thickTxt}`;
            }
        }

        function runCalc() {
            if(!backendData.Retail_Min_Order || !selectedMat) return;

            try {
                const pmsCode = document.getElementById('pms-code').value.trim();
                const isReverse = currentMode === 'reverse';

                let finalPaintName = "";
                let activePaintHex = "#FFFFFF"; 

                if (isReverse) {
                    if (pmsCode !== "") {
                        finalPaintName = `CUSTOM: ${pmsCode}`;
                        activePaintHex = "#e2e8f0"; // Generic light grey for custom text in preview
                    } else if (selectedPaint) {
                        finalPaintName = `[${activePaintSystem}] ${selectedPaint.Name}`;
                        activePaintHex = selectedPaint.Hex_Code;
                    } else {
                        finalPaintName = "TBD / None Selected";
                    }
                }

                const inputs = {
                    qty: parseFloat(document.getElementById('qty').value) || 1,
                    w: parseFloat(document.getElementById('w').value) || 10,
                    h: parseFloat(document.getElementById('h').value) || 2,
                    isReverse: isReverse,
                    mat: selectedMat,
                    paint: finalPaintName
                };

                const result = calculateNameplate(inputs, backendData);
                if (!result || !result.retail) return;

                const ret = result.retail;
                const fmt = (n) => "$" + (n || 0).toFixed(2);
                
                const totalSqin = (inputs.w * inputs.h) * inputs.qty;
                document.getElementById('lbl-sqin').innerText = totalSqin.toFixed(1);

                document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
                document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
                document.getElementById('ui-print').innerText = fmt(ret.printTotal);

                const minOrder = parseFloat(backendData.Retail_Min_Order || 35);
                document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
                document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

                // --- TOP PREVIEW CANVAS MATH ---
                if (document.getElementById('toggle-preview').checked) {
                    const canvas = document.getElementById('preview-canvas');
                    const text = document.getElementById('preview-text');
                    const warn = document.getElementById('bright-warn-box');

                    // Strict Height Limitation Math
                    const maxW = 300;
                    const maxH = 140; // Hard limit to prevent blowouts
                    const ratio = inputs.h / inputs.w;
                    
                    let targetW = maxW;
                    let targetH = targetW * ratio;
                    
                    // If height exceeds limits, scale both down proportionally
                    if (targetH > maxH) {
                        targetH = maxH;
                        targetW = targetH / ratio;
                    }

                    canvas.style.width = `${targetW}px`;
                    canvas.style.height = `${targetH}px`;
                    
                    let fSize = targetH * 0.4;
                    if (fSize > 40) fSize = 40;
                    if (fSize < 12) fSize = 12; // sanity min
                    text.style.fontSize = `${fSize}px`;

                    if (currentMode === 'front') {
                        canvas.style.backgroundColor = selectedMat.Cap_Hex;
                        text.style.color = selectedMat.Core_Hex;
                    } else {
                        canvas.style.backgroundColor = selectedMat.Cap_Hex;
                        text.style.color = activePaintHex;
                    }

                    const isBright = selectedMat.Cap_Color.includes('Bright');
                    warn.classList.toggle('hidden', !isBright);
                }

                // --- DESCRIPTION GENERATION ---
                let brandTxt = `Rowmark ${inputs.mat.Series} (${inputs.mat.Thickness})`;
                let pntTxt = inputs.isReverse ? `\nBackground Color: ${inputs.mat.Cap_Color}\nPaint Fill (Text): ${inputs.paint}` : `\nCap Color (Face): ${inputs.mat.Cap_Color}\nCore Color (Text): ${inputs.mat.Core_Color}`;
                let engTxt = inputs.isReverse ? "Reverse Engraved (Painted Back)" : "Front Engraved";
                
                let explicitNotes = "No backers. No hardware. No installation. No raised copy. No braille.";

                document.getElementById('job-desc').value = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" ADA Nameplates.\nBrand: ${brandTxt}\nStyle: ${engTxt}${pntTxt}\nSKU: ${inputs.mat.Item_Code}\n\n${explicitNotes}`;

            } catch(e) { console.error(e); }
        }

        window.addEventListener('load', async () => {
            if (typeof injectHeader === 'function') injectHeader("ADA Etch Nameplates");
            
            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            try {
                // QUADRUPLE FETCH
                const [reqConfig, reqRowmark, reqSW, reqPMS] = await Promise.all([
                    fetch(`${SCRIPT_URL}?req=view_module&tab=PROD_Nameplates`),
                    fetch(`${SCRIPT_URL}?req=table&tab=REF_Colors_Rowmark`),
                    fetch(`${SCRIPT_URL}?req=table&tab=REF_Colors_Paint`),
                    fetch(`${SCRIPT_URL}?req=table&tab=REF_Colors_PMS`)
                ]);

                backendData = await reqConfig.json();
                rowmarkData = await reqRowmark.json();
                
                // Format SW Array
                const rawSW = await reqSW.json();
                swData = rawSW.map(p => ({
                    Code: p.Code, Name: p.Name, Hex_Code: p.Hex_Code
                }));

                // Format PMS Array
                const rawPMS = await reqPMS.json();
                pmsData = rawPMS.map(p => ({
                    Code: p['PMS Name / Code'] || 'Unknown', 
                    Name: p['PMS Name / Code'] || 'Unknown', 
                    Hex_Code: p['HEX Code'] || '#FFFFFF'
                }));

                if(statusText) {
                    statusText.innerText = "ONLINE";
                    statusText.className = "font-bold text-green-500";
                    if(statusDot) {
                        statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                        statusDot.classList.remove("animate-pulse");
                    }
                }
                
                setPaintSystem('PMS'); // Generates the default paint grid
                setMode('front');      // Kicks off swatch build and first default selection
                
            } catch(e) {
                if(statusText) {
                    statusText.innerText = "OFFLINE (API FAILED)";
                    statusText.className = "font-bold text-red-500";
                }
                console.error("API Load Failed:", e);
            }
        });
    </script>
</body>
</html>
