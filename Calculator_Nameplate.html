<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Etch Nameplates v1.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="logic_nameplate.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .color-scroll::-webkit-scrollbar { width: 6px; }
        .color-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .color-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .aspect-box { transition: all 0.3s ease-in-out; }
        @keyframes pulse-warn { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .bright-warning { animation: pulse-warn 2s infinite; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

    <div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
        
        <div class="p-6 space-y-4">
            
            <!-- DIMENSIONS & QTY -->
            <div class="grid grid-cols-3 gap-3">
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white shadow-inner focus:border-blue-500 outline-none" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="10" min="0.5" step="0.5" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white shadow-inner focus:border-blue-500 outline-none" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="2" min="0.5" step="0.5" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white shadow-inner focus:border-blue-500 outline-none" oninput="runCalc()"></div>
            </div>

            <!-- PREVIEW TOGGLE & CANVAS -->
            <div class="bg-gray-50 border border-gray-200 p-3 rounded-lg shadow-sm">
                <label class="flex items-center gap-2 text-[10px] font-bold text-gray-500 uppercase cursor-pointer hover:text-blue-600 transition">
                    <input type="checkbox" id="toggle-preview" onchange="togglePreview()" checked class="w-4 h-4 text-blue-600 rounded cursor-pointer">
                    <span id="preview-toggle-text">Hide visual size preview</span>
                </label>
                
                <div id="preview-wrapper" class="mt-3 transition-all">
                    <div class="bg-gray-800 p-4 shadow-inner flex items-center justify-center min-h-[160px] relative rounded-lg">
                        <span class="absolute top-2 right-3 text-[8px] font-black text-gray-500 uppercase tracking-widest">Ratio Preview</span>
                        
                        <!-- The Canvas -->
                        <div id="preview-canvas" class="aspect-box shadow-2xl rounded-sm flex items-center justify-center relative overflow-hidden border border-black/20" style="background-color: #000;">
                            <span id="preview-text" class="font-black text-center pointer-events-none px-2 leading-tight truncate w-full" style="color: #fff;">SAMPLE</span>
                        </div>
                    </div>
                    
                    <!-- Warning Box for Bright -->
                    <div id="bright-warn-box" class="hidden mt-2 bg-amber-100 border border-amber-300 p-2 px-3 flex items-start gap-2 shadow-inner rounded-lg">
                        <div class="text-amber-600 text-sm">⚠️</div>
                        <div class="text-[10px] text-amber-900 font-medium leading-tight">
                            <strong class="uppercase font-black">Warning:</strong> "Bright" color selected. Most standard signs use standard "White". Verify with artwork.
                        </div>
                    </div>
                </div>
            </div>

            <!-- ENGRAVE STYLE -->
            <div class="pt-1 border-t border-gray-100 mt-2">
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Engrave Direction</label>
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button id="btn-front" onclick="setMode('front')" class="flex-1 py-2 text-xs font-bold rounded bg-white shadow-sm border border-gray-200 transition-all text-blue-700">FRONT ENGRAVE</button>
                    <button id="btn-reverse" onclick="setMode('reverse')" class="flex-1 py-2 text-xs font-bold rounded text-gray-500 hover:text-gray-800 transition-all border border-transparent">REVERSE ENGRAVED</button>
                </div>
            </div>

            <!-- REVERSE SUB-TABS -->
            <div id="reverse-tabs" class="hidden flex bg-gray-200 p-1 rounded-lg mb-2">
                <button id="btn-tab-mat" onclick="setReverseTab('mat')" class="flex-1 py-2 text-[10px] font-black rounded bg-white shadow-sm text-blue-700 transition uppercase tracking-widest">Step 1: Material Color</button>
                <button id="btn-tab-paint" onclick="setReverseTab('paint')" class="flex-1 py-2 text-[10px] font-black rounded text-gray-500 hover:text-gray-800 transition border border-transparent uppercase tracking-widest">Step 2: Paint Color</button>
            </div>

            <!-- STEP 1: MATERIAL SWATCHES -->
            <div id="mat-container" class="space-y-4">
                <div>
                    <div class="flex justify-between items-end mb-1">
                        <label id="cap-label" class="block text-[10px] font-bold text-gray-500 uppercase">Surface Material / Cap Color</label>
                    </div>
                    <div id="selected-color-label" class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100 mb-2 truncate">Loading...</div>
                    
                    <div id="rowmark-grid" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-2 color-scroll p-3 border rounded-lg bg-gray-50 shadow-inner">
                        <div class="text-xs text-gray-400 font-bold italic w-full text-center py-4 animate-pulse">Fetching Rowmark Array...</div>
                    </div>
                </div>
            </div>

            <!-- STEP 2: PAINT FILL -->
            <div id="paint-container" class="hidden space-y-4 relative z-20">
                <div>
                    <!-- PROMINENT BOOK TOGGLE -->
                    <div class="flex bg-orange-100 p-1 rounded-lg mb-3">
                        <button id="btn-pms" onclick="setPaintSystem('PMS')" class="flex-1 py-2 text-[10px] font-black rounded bg-white shadow-sm text-orange-700 transition uppercase tracking-widest border border-orange-200">PMS Match</button>
                        <button id="btn-sw" onclick="setPaintSystem('SW')" class="flex-1 py-2 text-[10px] font-black rounded text-orange-600 hover:text-orange-800 transition border border-transparent uppercase tracking-widest">Sherwin Williams</button>
                    </div>
                    
                    <!-- SEARCH BAR -->
                    <div class="relative mb-2">
                        <input type="text" id="paint-search" placeholder="Search PMS Colors..." oninput="filterPaint()" class="w-full bg-white border border-gray-300 rounded p-2 text-sm font-bold text-gray-800 outline-none focus:border-orange-500 shadow-sm transition">
                    </div>

                    <!-- SELECTED COLOR LABEL -->
                    <div id="selected-paint-label" class="text-[10px] font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded border border-orange-200 mb-2 truncate">None Selected</div>
                    
                    <!-- HYBRID VISUAL PAINT GRID -->
                    <div id="paint-grid" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto pr-2 color-scroll p-3 border rounded-lg bg-gray-50 shadow-inner">
                        <!-- Paint Hex Blocks Injected Here -->
                    </div>

                    <!-- CUSTOM MANUAL PMS -->
                    <div id="custom-pms-wrap" class="hidden mt-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Enter Custom Color Name / Code</label>
                        <input type="text" id="pms-code" placeholder="e.g. Custom Match To Sample" oninput="updateCustomPMS()" class="w-full bg-white border border-gray-300 rounded p-2 text-sm font-bold outline-none focus:border-blue-500 shadow-inner">
                    </div>
                </div>
            </div>

        </div>

        <!-- RESULTS -->
        <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner relative z-0">
            <div class="flex justify-between items-end mb-2">
                <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
                <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
            </div>
            
            <div class="border-t border-blue-200/50 my-3"></div>
            
            <div class="space-y-1 text-xs text-blue-900/70 pt-1">
                <div class="flex justify-between"><span>Engraved Plates (<span id="lbl-sqin">0</span> sq in):</span><span id="ui-print" class="font-bold">$0.00</span></div>
            </div>

            <div class="flex justify-between items-end border-t-2 border-blue-800 my-3 pt-2">
                <div>
                    <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                    <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Min: $35</span>
                    <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
                </div>
                <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
            </div>
        </div>

        <!-- DESCRIPTION GENERATOR & CLIPBOARD -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Production Ticket Details</label>
            <textarea id="job-desc" class="w-full text-[11px] p-3 border border-gray-300 rounded bg-white h-28 text-gray-700 font-mono outline-none leading-snug" readonly></textarea>
            
            <button onclick="copyTicket(this)" class="w-full mt-3 bg-blue-100 hover:bg-blue-200 text-blue-800 font-black py-2.5 px-4 rounded text-[10px] uppercase tracking-widest transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                Copy Ticket to Clipboard
            </button>
        </div>
    </div>

    <script>
        let backendData = {};
        let rowmarkData = [];
        let pmsData = [];
        let swData = [];
        let activePaintSystem = 'PMS';
        let selectedMat = null;
        let selectedPaint = null;
        let currentMode = 'front';

        function togglePreview() {
            const wrap = document.getElementById('preview-wrapper');
            const isChecked = document.getElementById('toggle-preview').checked;
            document.getElementById('preview-toggle-text').innerText = isChecked ? "Hide visual size preview" : "Show visual size preview";
            
            if (isChecked) {
                wrap.classList.remove('hidden');
                runCalc(); 
            } else {
                wrap.classList.add('hidden');
            }
        }

        function setReverseTab(tab) {
            const btnMat = document.getElementById('btn-tab-mat');
            const btnPaint = document.getElementById('btn-tab-paint');
            const conMat = document.getElementById('mat-container');
            const conPaint = document.getElementById('paint-container');

            if (tab === 'mat') {
                btnMat.className = "flex-1 py-2 text-[10px] font-black rounded bg-white shadow-sm text-blue-700 transition uppercase tracking-widest";
                btnPaint.className = "flex-1 py-2 text-[10px] font-black rounded text-gray-500 hover:text-gray-800 transition border border-transparent uppercase tracking-widest";
                conMat.classList.remove('hidden');
                conPaint.classList.add('hidden');
            } else {
                btnPaint.className = "flex-1 py-2 text-[10px] font-black rounded bg-white shadow-sm text-blue-700 transition uppercase tracking-widest";
                btnMat.className = "flex-1 py-2 text-[10px] font-black rounded text-gray-500 hover:text-gray-800 transition border border-transparent uppercase tracking-widest";
                conPaint.classList.remove('hidden');
                conMat.classList.add('hidden');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const btnF = document.getElementById('btn-front');
            const btnR = document.getElementById('btn-reverse');
            const revTabs = document.getElementById('reverse-tabs');
            const capLab = document.getElementById('cap-label');
            const conMat = document.getElementById('mat-container');
            const conPaint = document.getElementById('paint-container');

            if (mode === 'front') {
                btnF.className = "flex-1 py-2 text-xs font-bold rounded bg-white shadow-sm border border-gray-200 transition-all text-blue-700";
                btnR.className = "flex-1 py-2 text-xs font-bold rounded text-gray-500 hover:text-gray-800 transition-all border border-transparent";
                revTabs.classList.add('hidden');
                conMat.classList.remove('hidden');
                conPaint.classList.add('hidden');
                capLab.innerText = "Surface Material / Cap Color";
            } else {
                btnR.className = "flex-1 py-2 text-xs font-bold rounded bg-white shadow-sm border border-gray-200 transition-all text-blue-700";
                btnF.className = "flex-1 py-2 text-xs font-bold rounded text-gray-500 hover:text-gray-800 transition-all border border-transparent";
                revTabs.classList.remove('hidden');
                capLab.innerText = "Face Color";
                setReverseTab('mat'); 
            }
            
            updateSwatches();
        }

        function setPaintSystem(sys) {
            activePaintSystem = sys;
            document.getElementById('btn-pms').className = sys === 'PMS' ? "flex-1 py-2 text-[10px] font-black rounded bg-white shadow-sm text-orange-700 transition uppercase tracking-widest border border-orange-200" : "flex-1 py-2 text-[10px] font-black rounded text-orange-600 hover:text-orange-800 transition border border-transparent uppercase tracking-widest";
            document.getElementById('btn-sw').className = sys === 'SW' ? "flex-1 py-2 text-[10px] font-black rounded bg-white shadow-sm text-orange-700 transition uppercase tracking-widest border border-orange-200" : "flex-1 py-2 text-[10px] font-black rounded text-orange-600 hover:text-orange-800 transition border border-transparent uppercase tracking-widest";
            
            document.getElementById('paint-search').placeholder = sys === 'PMS' ? "Search PMS Colors..." : "Search SW Colors...";
            document.getElementById('paint-search').value = ""; 
            
            buildPaintSwatches();
        }

        function updateSwatches() {
            const grid = document.getElementById('rowmark-grid');
            grid.innerHTML = '';
            
            const filtered = rowmarkData.filter(c => {
                const isReverseMat = c.Series.includes('Reverse');
                if (currentMode === 'reverse') return isReverseMat;
                return !isReverseMat;
            });

            filtered.forEach((c, index) => {
                const btn = document.createElement('button');
                btn.className = "w-8 h-8 rounded border border-gray-300 shadow-sm hover:scale-110 transition focus:outline-none relative group overflow-hidden";
                
                let capHex = c.Cap_Hex || '#000000';
                let coreHex = c.Core_Hex || '#FFFFFF';

                if (currentMode === 'reverse') {
                    btn.style.background = capHex;
                } else {
                    btn.style.background = `linear-gradient(135deg, ${capHex} 50%, ${coreHex} 50%)`;
                }
                
                btn.title = `${c.Item_Code} - ${c.Cap_Color}`;

                btn.onclick = () => {
                    Array.from(grid.children).forEach(child => child.classList.remove('ring-2', 'ring-offset-1', 'ring-blue-500', 'border-transparent'));
                    btn.classList.add('ring-2', 'ring-offset-1', 'ring-blue-500', 'border-transparent');
                    
                    selectedMat = c;

                    // SMART DEFAULT PAINT LOGIC
                    if (currentMode === 'reverse') {
                        const isBlack = c.Cap_Color.toLowerCase().includes('black');
                        const isWhite = c.Cap_Color.toLowerCase().includes('white');

                        if (isBlack || isWhite) {
                            const targetCode = isBlack ? 'STD-WHT' : 'STD-BLK';
                            const listToUse = activePaintSystem === 'PMS' ? pmsData : swData;
                            const defaultPaint = listToUse.find(p => p.Code === targetCode);
                            
                            if (defaultPaint) {
                                selectedPaint = defaultPaint;
                                document.getElementById('custom-pms-wrap').classList.add('hidden');
                                document.getElementById('pms-code').value = '';
                                document.getElementById('selected-paint-label').innerText = `[${selectedPaint.Code}] ${selectedPaint.Name}`;
                                
                                // Visually highlight it if the grid is rendered
                                Array.from(document.getElementById('paint-grid').children).forEach(b => {
                                    b.classList.remove('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent');
                                    if (b.dataset && b.dataset.code === targetCode.toLowerCase()) {
                                        b.classList.add('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent');
                                    }
                                });
                            }
                        }
                    }

                    updateMaterialLabel();
                    runCalc();
                };

                grid.appendChild(btn);
                
                // Front Default
                if (currentMode === 'front' && c.Item_Code === '222-402') setTimeout(() => btn.click(), 10);
                // Reverse Default (Updated to 322-401 Black Face)
                if (currentMode === 'reverse' && c.Item_Code === '322-401') setTimeout(() => btn.click(), 10);
            });
        }

        function buildPaintSwatches() {
            const grid = document.getElementById('paint-grid');
            grid.innerHTML = '';
            
            const listToUse = activePaintSystem === 'PMS' ? pmsData : swData;
            
            const customBtn = document.createElement('button');
            customBtn.className = "w-full py-1.5 mb-1 rounded border border-gray-300 bg-white text-[10px] font-bold text-gray-600 shadow-sm hover:border-orange-500 transition focus:outline-none uppercase shrink-0";
            customBtn.innerText = "+ Custom / Unlisted Color...";
            customBtn.onclick = () => {
                Array.from(grid.children).forEach(b => b.classList.remove('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent'));
                customBtn.classList.add('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent');
                
                selectedPaint = { Code: 'CUSTOM', Name: 'Custom Manual Color', Hex_Code: '#e2e8f0' };
                document.getElementById('custom-pms-wrap').classList.remove('hidden');
                document.getElementById('selected-paint-label').innerText = "Custom Color Mode Active";
                
                updateMaterialLabel();
                runCalc();
            };
            grid.appendChild(customBtn);
            
            const fragment = document.createDocumentFragment();
            listToUse.forEach((p, index) => {
                const btn = document.createElement('button');
                btn.className = "paint-btn w-8 h-8 rounded-full border border-gray-300 shadow-sm hover:scale-110 transition focus:outline-none shrink-0";
                btn.style.backgroundColor = p.Hex_Code;
                btn.title = `${p.Name} (${p.Code})`;
                
                btn.dataset.name = p.Name.toLowerCase();
                btn.dataset.code = p.Code.toLowerCase();

                // Highlight if this is the currently selected paint (when toggling books)
                if (selectedPaint && selectedPaint.Code === p.Code) {
                    btn.classList.add('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent');
                }
                
                btn.onclick = () => {
                    Array.from(grid.children).forEach(b => b.classList.remove('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent'));
                    btn.classList.add('ring-2', 'ring-offset-1', 'ring-orange-500', 'border-transparent');
                    
                    selectedPaint = p;
                    document.getElementById('custom-pms-wrap').classList.add('hidden');
                    document.getElementById('pms-code').value = '';
                    document.getElementById('selected-paint-label').innerText = `[${p.Code}] ${p.Name}`;
                    
                    updateMaterialLabel();
                    runCalc();
                };
                fragment.appendChild(btn);

            });
            
            grid.appendChild(fragment);
            filterPaint(); 
        }

        function filterPaint() {
            const query = document.getElementById('paint-search').value.toLowerCase();
            const btns = document.querySelectorAll('.paint-btn');
            
            btns.forEach(btn => {
                if (btn.dataset.name.includes(query) || btn.dataset.code.includes(query)) {
                    btn.style.display = 'block';
                } else {
                    btn.style.display = 'none';
                }
            });
        }

        function updateCustomPMS() {
            const val = document.getElementById('pms-code').value.trim();
            document.getElementById('selected-paint-label').innerText = val ? `Custom: ${val}` : "Custom Manual Color";
            updateMaterialLabel();
            runCalc();
        }

        function updateMaterialLabel() {
            if (!selectedMat) return;
            const thickTxt = selectedMat.Thickness ? `(${selectedMat.Thickness})` : "";
            
            if (currentMode === 'front') {
                document.getElementById('selected-color-label').innerText = `[${selectedMat.Item_Code}] ${selectedMat.Cap_Color} Face / ${selectedMat.Core_Color} Text ${thickTxt}`;
            } else {
                let paintName = "TBD";
                if (selectedPaint && selectedPaint.Code !== 'CUSTOM') paintName = selectedPaint.Name;
                else if (document.getElementById('pms-code').value) paintName = document.getElementById('pms-code').value;
                
                document.getElementById('selected-color-label').innerText = `[${selectedMat.Item_Code}] ${selectedMat.Cap_Color} Face / ${paintName} Text ${thickTxt}`;
            }
        }

        function copyTicket(btn) {
            const desc = document.getElementById('job-desc');
            desc.select();
            desc.setSelectionRange(0, 99999); // Mobile compatibility
            navigator.clipboard.writeText(desc.value);
            
            const originalHTML = btn.innerHTML;
            btn.innerHTML = "✅ COPIED TO CLIPBOARD!";
            btn.classList.add('bg-green-500', 'text-white');
            btn.classList.remove('bg-blue-100', 'text-blue-800');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-green-500', 'text-white');
                btn.classList.add('bg-blue-100', 'text-blue-800');
            }, 2000);
        }

        function runCalc() {
            if(!backendData.Retail_Min_Order || !selectedMat) return;

            try {
                const pmsCode = document.getElementById('pms-code').value.trim();
                const isReverse = currentMode === 'reverse';

                let finalPaintName = "";
                let activePaintHex = "#FFFFFF"; 

                if (isReverse) {
                    if (selectedPaint && selectedPaint.Code === 'CUSTOM') {
                        finalPaintName = pmsCode ? `CUSTOM: ${pmsCode}` : "Custom Match TBD";
                        activePaintHex = "#e2e8f0";
                    } else if (selectedPaint) {
                        finalPaintName = `[${selectedPaint.Code}] ${selectedPaint.Name}`;
                        activePaintHex = selectedPaint.Hex_Code;
                    } else {
                        finalPaintName = "TBD / None Selected";
                    }
                }

                const inputs = {
                    qty: parseFloat(document.getElementById('qty').value) || 1,
                    w: parseFloat(document.getElementById('w').value) || 10,
                    h: parseFloat(document.getElementById('h').value) || 2,
                    isReverse: isReverse,
                    mat: selectedMat,
                    paint: finalPaintName
                };

                const result = calculateNameplate(inputs, backendData);
                if (!result || !result.retail) return;

                const ret = result.retail;
                const fmt = (n) => "$" + (n || 0).toFixed(2);
                
                const totalSqin = (inputs.w * inputs.h) * inputs.qty;
                document.getElementById('lbl-sqin').innerText = totalSqin.toFixed(1);

                document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
                document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
                document.getElementById('ui-print').innerText = fmt(ret.printTotal);

                const minOrder = parseFloat(backendData.Retail_Min_Order || 35);
                document.getElementById('ui-min-text').innerText = `Shop Min: $${minOrder}`;
                document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

                // --- TOP PREVIEW CANVAS MATH ---
                if (document.getElementById('toggle-preview').checked) {
                    const canvas = document.getElementById('preview-canvas');
                    const text = document.getElementById('preview-text');
                    const warn = document.getElementById('bright-warn-box');

                    const maxW = 300;
                    const maxH = 140; 
                    const ratio = inputs.h / inputs.w;
                    
                    let targetW = maxW;
                    let targetH = targetW * ratio;
                    
                    if (targetH > maxH) {
                        targetH = maxH;
                        targetW = targetH / ratio;
                    }

                    canvas.style.width = `${targetW}px`;
                    canvas.style.height = `${targetH}px`;
                    
                    let fSize = targetH * 0.4;
                    if (fSize > 40) fSize = 40;
                    if (fSize < 12) fSize = 12; 
                    text.style.fontSize = `${fSize}px`;

                    if (currentMode === 'front') {
                        canvas.style.backgroundColor = selectedMat.Cap_Hex;
                        text.style.color = selectedMat.Core_Hex;
                    } else {
                        canvas.style.backgroundColor = selectedMat.Cap_Hex;
                        text.style.color = activePaintHex;
                    }

                    const isBright = selectedMat.Cap_Color.includes('Bright');
                    warn.classList.toggle('hidden', !isBright);
                }

                // --- SINGLE LINE DESCRIPTION GENERATION ---
                let brandTxt = `Rowmark ${inputs.mat.Series} (${inputs.mat.Thickness})`;
                let explicitNotes = "No backers. No hardware. No installation. No raised copy. No braille.";
                let finalDesc = "";

                if (inputs.isReverse) {
                    finalDesc = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" ADA Nameplates - ${brandTxt} Reverse Engraved [${inputs.mat.Item_Code}] ${inputs.mat.Cap_Color} face with ${inputs.paint} painted text.\n\n${explicitNotes}`;
                } else {
                    finalDesc = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" ADA Nameplates - ${brandTxt} Front Engraved [${inputs.mat.Item_Code}] ${inputs.mat.Cap_Color} face with ${inputs.mat.Core_Color} text.\n\n${explicitNotes}`;
                }

                document.getElementById('job-desc').value = finalDesc;

            } catch(e) { console.error(e); }
        }

        window.addEventListener('load', async () => {
            if (typeof injectHeader === 'function') injectHeader("ADA Etch Nameplates");
            
            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            try {
                const [reqConfig, reqRowmark, reqSW, reqPMS] = await Promise.all([
                    fetch(`${SCRIPT_URL}?req=view_module&tab=PROD_Nameplates`),
                    fetch(`${SCRIPT_URL}?req=table&tab=REF_Colors_Rowmark`),
                    fetch(`${SCRIPT_URL}?req=table&tab=REF_Colors_Paint`),
                    fetch(`${SCRIPT_URL}?req=table&tab=REF_Colors_PMS`)
                ]);

                backendData = await reqConfig.json();
                rowmarkData = await reqRowmark.json();
                
                // Inject Standard Universal Colors
                const stdColors = [
                    { Code: 'STD-WHT', Name: 'Standard White', Hex_Code: '#FFFFFF' },
                    { Code: 'STD-BLK', Name: 'Standard Black', Hex_Code: '#000000' }
                ];

                const rawSW = await reqSW.json();
                let formattedSW = rawSW.map(p => {
                    let hex = p.Hex_Code || p.HEX_Code || p['Hex_Code '] || '#FFFFFF';
                    hex = hex.trim();
                    if (!hex.startsWith('#') && hex !== 'Transparent') hex = '#' + hex;
                    return { Code: p.Code || 'Unknown', Name: p.Name || 'Unknown', Hex_Code: hex };
                });
                swData = [...stdColors, ...formattedSW];

                const rawPMS = await reqPMS.json();
                let formattedPMS = rawPMS.map(p => ({
                    Code: p['PMS Name / Code'] || 'Unknown', 
                    Name: p['PMS Name / Code'] || 'Unknown', 
                    Hex_Code: p['HEX Code'] || '#FFFFFF'
                }));
                pmsData = [...stdColors, ...formattedPMS];

                if(statusText) {
                    statusText.innerText = "ONLINE";
                    statusText.className = "font-bold text-green-500";
                    if(statusDot) {
                        statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                        statusDot.classList.remove("animate-pulse");
                    }
                }
                
                setPaintSystem('PMS'); 
                setMode('front');      
                
            } catch(e) {
                if(statusText) {
                    statusText.innerText = "OFFLINE (API FAILED)";
                    statusText.className = "font-bold text-red-500";
                }
                console.error("API Load Failed:", e);
            }
        });
    </script>
</body>
</html>
