<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Sign Builder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    
    <!-- SignOS Core & Physics Libraries -->
    <script src="signos-core.js"></script>
    <script src="signos-ui.js"></script>
    <script src="signos-canvas.js"></script>
    <script src="cost_architectural.js"></script>
    <script src="signos-builder.js"></script>
    <script src="signos-view-svg.js"></script>
    <script src="signos-export-v2.js"></script>
    
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* 3D Viewfinder Base */
        #preview-wrapper { perspective: 1200px; cursor: grab; }
        #preview-wrapper:active { cursor: grabbing; }
        #svg-preview-container { transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .isometric-view #svg-preview-container { transform: rotateX(60deg) rotateZ(-45deg); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10 overflow-x-hidden">

<div class="w-full max-w-[1400px] mx-auto mt-6 px-4 flex-1 flex flex-col">
    <!-- WRAPPER FIX: main-card is now strictly flex-col so the injected header sits on top -->
    <div id="main-card" class="bg-white shadow-xl rounded-xl border border-gray-200 overflow-hidden flex flex-col flex-1">
        
        <!-- INNER WRAPPER: Handles the two-column horizontal split -->
        <div class="flex flex-col lg:flex-row min-h-[800px] w-full flex-1">
            
            <!-- LEFT COLUMN: WIZARD ACCORDION -->
            <div class="w-full lg:w-5/12 border-r border-gray-200 bg-gray-50 flex flex-col relative z-20">
                <div class="p-4 bg-gray-900 text-white shrink-0 shadow-md z-10 flex justify-between items-center">
                    <div>
                        <h2 class="text-sm font-black tracking-widest uppercase">Configuration Wizard</h2>
                        <span class="text-[9px] text-gray-400 tracking-widest uppercase block mt-0.5">Step-by-Step Architectural Build</span>
                    </div>
                    <button onclick="location.reload()" class="text-xs font-bold bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded transition uppercase tracking-widest">Reset</button>
                </div>

                <div class="p-5 space-y-3 overflow-y-auto custom-scroll flex-1">
                    
                    <!-- DIMENSIONS -->
                    <div class="grid grid-cols-3 gap-3 bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-4">
                        <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border border-gray-300 p-2 rounded font-black text-blue-800 text-lg text-center bg-gray-50 outline-none focus:border-blue-500" oninput="buildState.qty = this.value; runCalc();"></div>
                        <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="8" min="1" step="0.5" class="w-full border border-gray-300 p-2 rounded font-black text-gray-800 text-lg text-center bg-white outline-none focus:border-blue-500" oninput="buildState.w = this.value; runCalc();"></div>
                        <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="8" min="1" step="0.5" class="w-full border border-gray-300 p-2 rounded font-black text-gray-800 text-lg text-center bg-white outline-none focus:border-blue-500" oninput="buildState.h = this.value; runCalc();"></div>
                    </div>

                    <!-- STEP 1: SIGN PURPOSE -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden wizard-step" data-step="1">
                        <div class="p-3 bg-blue-50 border-b border-blue-100 cursor-pointer flex justify-between items-center" onclick="toggleStep(1)">
                            <div class="flex items-center gap-3">
                                <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-black num-badge">1</div>
                                <h3 class="text-xs font-black text-blue-900 uppercase tracking-widest title-text">Sign Purpose</h3>
                            </div>
                            <svg class="w-4 h-4 text-blue-500 transform transition-transform duration-200 chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="step-content max-h-[500px] p-4 bg-white transition-all overflow-hidden">
                            <div class="grid grid-cols-2 gap-2" id="purpose-btns">
                                <button class="p-2 border border-blue-600 bg-blue-50 rounded text-[10px] font-black text-blue-800 uppercase text-left transition active-purpose" onclick="setPurpose(this, 'Restroom / Room ID')">Restroom / Room ID</button>
                                <button class="p-2 border border-gray-200 rounded text-[10px] font-bold text-gray-600 uppercase text-left hover:border-blue-400 transition" onclick="setPurpose(this, 'Directional / Wayfinding')">Directional / Wayfinding</button>
                                <button class="p-2 border border-gray-200 rounded text-[10px] font-bold text-gray-600 uppercase text-left hover:border-blue-400 transition" onclick="setPurpose(this, 'Life Safety / Evac')">Life Safety / Evac</button>
                                <button class="p-2 border border-gray-200 rounded text-[10px] font-bold text-gray-600 uppercase text-left hover:border-blue-400 transition" onclick="setPurpose(this, 'Informational')">Informational</button>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 2: STRUCTURAL CHASSIS -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden wizard-step opacity-50" data-step="2">
                        <div class="p-3 bg-slate-50 border-b border-gray-100 cursor-pointer flex justify-between items-center" onclick="toggleStep(2)">
                            <div class="flex items-center gap-3">
                                <div class="w-6 h-6 rounded-full bg-gray-300 text-gray-600 flex items-center justify-center text-xs font-black num-badge">2</div>
                                <h3 class="text-xs font-black text-gray-600 uppercase tracking-widest title-text">Structural Chassis</h3>
                            </div>
                            <svg class="w-4 h-4 text-gray-400 transform transition-transform duration-200 chevron -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="step-content max-h-0 p-0 bg-white transition-all overflow-hidden">
                            <div class="space-y-3 p-4">
                                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest">Mounting Hardware & Frames</label>
                                <select id="chassis-select" onchange="buildState.chassis = this.value; runCalc();" class="w-full border border-gray-300 p-2 rounded text-xs font-bold text-gray-700 outline-none focus:border-blue-500 shadow-inner">
                                    <option value="Flush">Frameless: Flush Mount (VHB / Tape)</option>
                                    <option value="Projected">Frameless: Projected (MBS Standoffs)</option>
                                    <option value="Frame_Plastic">Framed: Plastic (Johnson Architect)</option>
                                    <option value="Frame_Metal">Framed: Metal (Johnson Euro Series)</option>
                                    <option value="Flag">Projecting: Flag Bracket</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 3: BASE PANEL & FINISHES -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden wizard-step opacity-50" data-step="3">
                        <div class="p-3 bg-slate-50 border-b border-gray-100 cursor-pointer flex justify-between items-center" onclick="toggleStep(3)">
                            <div class="flex items-center gap-3">
                                <div class="w-6 h-6 rounded-full bg-gray-300 text-gray-600 flex items-center justify-center text-xs font-black num-badge">3</div>
                                <h3 class="text-xs font-black text-gray-600 uppercase tracking-widest title-text">Base Panel & Finishes</h3>
                            </div>
                            <svg class="w-4 h-4 text-gray-400 transform transition-transform duration-200 chevron -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="step-content max-h-0 p-0 bg-white transition-all overflow-hidden">
                            <div class="p-4">
                                <div id="selected-color-label" class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100 mb-2 truncate">Loading...</div>
                                <div id="rowmark-grid" class="flex flex-wrap gap-2 max-h-64 overflow-y-auto custom-scroll p-2 border rounded-lg bg-gray-50 shadow-inner"></div>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 4: FUNCTIONAL ADD-ONS -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden wizard-step opacity-50" data-step="4">
                        <div class="p-3 bg-slate-50 border-b border-gray-100 cursor-pointer flex justify-between items-center" onclick="toggleStep(4)">
                            <div class="flex items-center gap-3">
                                <div class="w-6 h-6 rounded-full bg-gray-300 text-gray-600 flex items-center justify-center text-xs font-black num-badge">4</div>
                                <h3 class="text-xs font-black text-gray-600 uppercase tracking-widest title-text">Functional Add-Ons</h3>
                            </div>
                            <svg class="w-4 h-4 text-gray-400 transform transition-transform duration-200 chevron -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="step-content max-h-0 p-0 bg-white transition-all overflow-hidden">
                            <div class="p-4 space-y-2">
                                <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer p-2 hover:bg-gray-50 border border-gray-200 rounded transition"><input type="checkbox" id="addon-window" class="w-4 h-4 text-blue-600"> Routed Window Pocket</label>
                                <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer p-2 hover:bg-gray-50 border border-gray-200 rounded transition"><input type="checkbox" id="addon-slider" class="w-4 h-4 text-blue-600"> Engraved Slider Tab</label>
                                <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer p-2 hover:bg-gray-50 border border-gray-200 rounded transition"><input type="checkbox" id="addon-magnetic" class="w-4 h-4 text-blue-600"> Magnetic Receptacle</label>
                                <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer p-2 hover:bg-gray-50 border border-gray-200 rounded transition"><input type="checkbox" id="addon-accent" class="w-4 h-4 text-blue-600"> Decorative Accent Layer</label>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 5: TACTILE & TEXT -->
                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden wizard-step opacity-50" data-step="5">
                        <div class="p-3 bg-slate-50 border-b border-gray-100 cursor-pointer flex justify-between items-center" onclick="toggleStep(5)">
                            <div class="flex items-center gap-3">
                                <div class="w-6 h-6 rounded-full bg-gray-300 text-gray-600 flex items-center justify-center text-xs font-black num-badge">5</div>
                                <h3 class="text-xs font-black text-gray-600 uppercase tracking-widest title-text">Tactile & Typography</h3>
                            </div>
                            <svg class="w-4 h-4 text-gray-400 transform transition-transform duration-200 chevron -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="step-content max-h-0 p-0 bg-white transition-all overflow-hidden">
                            <div class="p-4 space-y-3">
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Primary Text</label>
                                    <input type="text" id="sign-text" value="ROOM 101" oninput="updateText()" class="w-full border border-gray-300 p-2 rounded text-xs font-bold uppercase text-gray-800 focus:border-blue-500 outline-none shadow-inner">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Font Family</label>
                                    <select id="sign-font" onchange="updateText()" class="w-full border border-gray-300 p-2 rounded text-xs font-bold text-gray-800 bg-white outline-none focus:border-blue-500 shadow-inner">
                                        <!-- Injected via JS -->
                                    </select>
                                </div>
                                <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer pt-2"><input type="checkbox" id="has-braille" onchange="updateText()" checked class="w-4 h-4 text-blue-600"> Include Grade 2 Braille</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: STICKY WYSIWYG & LEDGER -->
            <div class="w-full lg:w-7/12 flex flex-col bg-white relative">
                <div class="flex-1 flex flex-col bg-blue-50/50 relative overflow-hidden" id="loader-wrapper">
                    
                    <!-- Toggle Controls -->
                    <div class="absolute top-4 left-4 z-30 flex gap-2">
                        <button onclick="toggle3D()" id="btn-3d" class="bg-white/90 backdrop-blur hover:bg-gray-50 text-blue-600 border border-blue-200 px-3 py-1.5 rounded shadow-sm text-[9px] font-black uppercase tracking-widest transition focus:outline-none">Flat 2D View</button>
                        <button onclick="SignOS_UI.Camera3D.reset()" class="bg-white/80 backdrop-blur hover:bg-gray-50 text-gray-500 border border-gray-200 px-3 py-1.5 rounded shadow-sm text-[9px] font-black uppercase tracking-widest transition focus:outline-none">Reset Camera</button>
                    </div>

                    <div id="zoom-stage" class="w-full h-full min-h-[400px] flex items-center justify-center relative pb-[120px]">
                        <!-- Isometric Canvas Wrapper -->
                        <div id="preview-wrapper" class="isometric-view w-full h-full flex items-center justify-center cursor-grab active:cursor-grabbing" onwheel="SignOS_UI.Camera3D.handleZoom(event)" onmousedown="SignOS_UI.Camera3D.startPan(event)" onmousemove="SignOS_UI.Camera3D.handlePan(event)" onmouseup="SignOS_UI.Camera3D.endPan()" onmouseleave="SignOS_UI.Camera3D.endPan()">
                            <div id="svg-preview-container" class="w-[300px] h-[200px] border border-dashed border-blue-300 bg-blue-100/50 flex flex-col items-center justify-center rounded shadow-inner transition-all">
                                <span class="text-xs font-black text-blue-400 uppercase tracking-widest">Awaiting Configuration</span>
                            </div>
                        </div>
                    </div>

                    <!-- Sticky Footer Ledger -->
                    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] p-5 flex justify-between items-end z-20">
                        <div class="pb-1">
                            <span class="block text-[10px] font-bold text-blue-500 uppercase tracking-widest mb-0.5"><span id="lbl-w">8</span>" x <span id="lbl-h">8</span>" Architectural Sign</span>
                            <span class="block text-[9px] font-bold text-gray-400 uppercase" id="ledger-desc">Includes: Base Panel, Tactile</span>
                        </div>
                        <div class="text-right">
                            <span class="block text-[10px] font-black text-blue-800 uppercase tracking-widest mb-1">Total Retail Quote</span>
                            <span class="text-4xl font-black text-blue-700 tracking-tight block" id="ui-total">$0.00</span>
                            <button onclick="downloadProductionSVG()" class="mt-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded shadow-sm text-[10px] uppercase tracking-widest transition">
                                Download Production SVG
                            </button>
                        </div>
                    </div>

                </div>
            </div>

        </div> <!-- End Inner Horizontal Wrapper -->
    </div> <!-- End Main Card -->
</div>

<script>
let backendData = {}, coreColors = [], systemFonts = [];

// THE MASTER STATE OBJECT
let buildState = {
    qty: 1, w: 8, h: 8,
    purpose: 'Restroom / Room ID',
    chassis: 'Flush',
    baseColor: null,
    addons: { window: false, slider: false, magnetic: false, accent: false },
    typography: { text: 'ROOM 101', font: 'sans-serif', hasBraille: true }
};

let is3D = true;

function toggle3D() {
    is3D = !is3D;
    SignOS_UI.Camera3D.toggle(is3D);
    document.getElementById('preview-wrapper').classList.toggle('isometric-view', is3D);
    document.getElementById('btn-3d').innerText = is3D ? "Flat 2D View" : "3D Isometric View";
}

// --- ACCORDION WIZARD LOGIC ---
function toggleStep(stepNum) {
    const steps = document.querySelectorAll('.wizard-step');
    steps.forEach(step => {
        const num = parseInt(step.getAttribute('data-step'));
        const content = step.querySelector('.step-content');
        const chevron = step.querySelector('.chevron');
        const header = step.querySelector('.p-3');
        const badge = step.querySelector('.num-badge');
        const title = step.querySelector('.title-text');

        if (num === stepNum) {
            content.style.maxHeight = '500px';
            content.classList.add('p-4'); content.classList.remove('p-0');
            step.classList.remove('opacity-50');
            header.classList.remove('bg-slate-50', 'border-gray-100');
            header.classList.add('bg-blue-50', 'border-blue-100');
            badge.className = "w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-black num-badge";
            title.className = "text-xs font-black text-blue-900 uppercase tracking-widest title-text";
            chevron.classList.remove('-rotate-90'); chevron.classList.add('text-blue-500');
        } else {
            content.style.maxHeight = '0px';
            content.classList.remove('p-4'); content.classList.add('p-0');
            step.classList.add('opacity-50');
            header.classList.remove('bg-blue-50', 'border-blue-100');
            header.classList.add('bg-slate-50', 'border-gray-100');
            badge.className = "w-6 h-6 rounded-full bg-gray-300 text-gray-600 flex items-center justify-center text-xs font-black num-badge";
            title.className = "text-xs font-black text-gray-600 uppercase tracking-widest title-text";
            chevron.classList.add('-rotate-90'); chevron.classList.remove('text-blue-500');
        }
    });
}

// --- STATE UPDATERS & INTERACTIVITY ---
function setPurpose(btn, purpose) {
    document.querySelectorAll('#purpose-btns button').forEach(b => {
        b.className = "p-2 border border-gray-200 rounded text-[10px] font-bold text-gray-600 uppercase text-left hover:border-blue-400 transition";
    });
    btn.className = "p-2 border border-blue-600 bg-blue-50 rounded text-[10px] font-black text-blue-800 uppercase text-left transition active-purpose";
    buildState.purpose = purpose;
    runCalc();
}

function setAddon(type, isChecked) {
    buildState.addons[type] = isChecked;
    runCalc();
}

function updateText() {
    buildState.typography.text = document.getElementById('sign-text').value;
    buildState.typography.font = document.getElementById('sign-font').value;
    buildState.typography.hasBraille = document.getElementById('has-braille').checked;
    runCalc();
}

// --- THE UPDATE LOOP (Physics-First SVG) ---
async function runCalc() {
    // Safely check either ADA variable before aborting so the tool doesn't silently break
    if(!backendData || (!backendData.Retail_Min_Order && !backendData.Retail_Min_Order_Etch)) return;

    document.getElementById('lbl-w').innerText = buildState.w;
    document.getElementById('lbl-h').innerText = buildState.h;

    try {
        // 1. Calculate Pricing
        if (typeof calculateArchitectural === 'function') {
            const result = calculateArchitectural(buildState, backendData);
            document.querySelector('#ui-total').innerText = `$${(result.retail.grandTotal || 0).toFixed(2)}`;
        }

        let activeAddons = Object.entries(buildState.addons).filter(([k,v]) => v).map(([k,v]) => k).join(', ');
        document.getElementById('ledger-desc').innerText = `Includes: ${buildState.chassis}, Base Panel` + (activeAddons ? `, ${activeAddons}` : '');

        // 2. THE PHYSICS-FIRST BRIDGE
        const cont = document.getElementById('svg-preview-container');
        const githubBase = "https://raw.githubusercontent.com/SignStoreERP/signos-app/main/fonts/";
        
        const fontSelect = document.getElementById('sign-font');
        const fontFileName = fontSelect.options[fontSelect.selectedIndex]?.dataset.filename || 'Arimo-Regular.ttf';

        const buildInputs = {
            w: parseFloat(buildState.w),
            h: parseFloat(buildState.h),
            align: 'center',
            textVal: buildState.typography.text,
            hasPicto: false, 
            hasText: !!buildState.typography.text,
            hasBraille: buildState.typography.hasBraille,
            isAutoScale: true,
            fontFileName: fontFileName
        };

        const layout = await SignOS_Builder.buildADA(buildInputs, githubBase);

        // 3. RENDER THE MONITOR
        let bgHex = buildState.baseColor ? buildState.baseColor.Hex_Code : '#e5e7eb';
        let fgHex = buildState.baseColor ? buildState.baseColor.Core_Hex : '#000000';

        cont.className = "w-full h-full flex items-center justify-center p-4 pointer-events-none";
        cont.style.backgroundColor = 'transparent';
        cont.style.border = 'none';

        let windowSVG = '';
        if (buildState.addons.window) {
             windowSVG = `
             <rect x="0.5" y="${buildInputs.h - 2.5}" width="${buildInputs.w - 1}" height="2" fill="#000000" fill-opacity="0.1" stroke="#000000" stroke-width="0.05" stroke-dasharray="0.1,0.1" />
             <text x="${buildInputs.w/2}" y="${buildInputs.h - 1.4}" font-family="sans-serif" font-size="0.25" fill="#000" text-anchor="middle" opacity="0.5">ROUTED WINDOW SLOT</text>`;
        }

        cont.innerHTML = `
        <svg id="live-production-preview" width="100%" height="100%" 
             viewBox="0 0 ${buildInputs.w} ${buildInputs.h}" 
             xmlns="http://www.w3.org/2000/svg"
             data-width-in="${buildInputs.w}" data-height-in="${buildInputs.h}"
             style="max-width: 80%; max-height: 80%; filter: drop-shadow(-3px 3px 5px rgba(0,0,0,0.3));">
             
             <rect width="${buildInputs.w}" height="${buildInputs.h}" fill="${bgHex}" rx="0.125" ry="0.125" />
             ${windowSVG}
             <g fill="${fgHex}">
                 ${layout.svgContent}
             </g>
        </svg>`;

    } catch(e) { console.error("Physics Engine Error:", e); }
}

// --- API FETCH & INITIALIZATION ---
window.addEventListener('load', async () => {
    if (typeof injectHeader === 'function') injectHeader("Architectural Sign Builder");

    if(window.SignOS_UI && SignOS_UI.Camera3D) {
        SignOS_UI.Camera3D.init('zoom-stage');
        SignOS_UI.Camera3D.toggle(true);
    }

    document.getElementById('addon-window').onchange = (e) => setAddon('window', e.target.checked);
    document.getElementById('addon-slider').onchange = (e) => setAddon('slider', e.target.checked);
    document.getElementById('addon-magnetic').onchange = (e) => setAddon('magnetic', e.target.checked);
    document.getElementById('addon-accent').onchange = (e) => setAddon('accent', e.target.checked);

    SignOS_UI.showLoader('loader-wrapper', 'Connecting to Hardware Matrices...');
    
    const statusText = document.getElementById("status-text");
    const statusDot = document.getElementById("status-dot");

    try {
        const payload = await SignOS.fetchProductData('PROD_ADA_Signs', ['REF_Colors_Rowmark', 'REF_Fonts']);
        backendData = payload.config;
        const rawRowmark = payload.tables['REF_Colors_Rowmark'] || [];
        systemFonts = (payload.tables['REF_Fonts'] || []).filter(f => String(f.Is_Active).toUpperCase() === 'TRUE');

        coreColors = rawRowmark.filter(r => r.Series && (r.Series.includes('Ultra-Mattes') || r.Series.includes('Mattes'))).map(c => ({
            Code: c.Item_Code, Name: c.Cap_Color, Hex_Code: (c.Cap_Hex === 'Transparent' || c.Cap_Color.includes('Clear')) ? '#e5e7eb' : c.Cap_Hex, Core_Hex: c.Core_Hex
        }));

        if(window.SignOS_Canvas) SignOS_Canvas.loadFonts(systemFonts);

        SignOS_UI.buildColorGrid({
            containerId: 'rowmark-grid',
            data: coreColors,
            type: 'rowmark',
            onSelect: (item) => {
                buildState.baseColor = item;
                document.getElementById('selected-color-label').innerText = item.Name || item.Cap_Color;
                runCalc();
            }
        });

        const fontSelect = document.getElementById('sign-font');
        systemFonts.forEach(f => {
            fontSelect.innerHTML += `<option value="${f.CSS_Family}" data-filename="${f.File_Name}">${f.Font_Name}</option>`;
        });

        if(statusText) { statusText.innerText = "ONLINE"; statusText.className = "font-bold text-green-500"; if(statusDot) { statusDot.className = "w-2 h-2 rounded-full bg-green-500"; statusDot.classList.remove("animate-pulse"); } }

        SignOS_UI.hideLoader('loader-wrapper');

        setTimeout(() => {
            const firstBtn = document.querySelector('#rowmark-grid button');
            if(firstBtn) firstBtn.click();
            toggleStep(1);
        }, 100);

    } catch(e) {
        console.error("API Error:", e);
        if(statusText) { statusText.innerText = "OFFLINE"; statusText.className = "font-bold text-red-500"; }
        SignOS_UI.hideLoader('loader-wrapper', true);
    }
});
</script>
</body>
</html>
