<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A La Carte CAD Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="signos-ui.js"></script>
    <script src="cost_architectural.js"></script>
    <script src="app_architectural.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px;}
        
        /* CAD Workspace Grid (Fixed Bottom-Left Origin) */
        .workspace-grid {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                linear-gradient(to top, #e2e8f0 1px, transparent 1px),
                linear-gradient(to right, #bfdbfe 2px, transparent 2px),
                linear-gradient(to top, #bfdbfe 2px, transparent 2px);
            background-size: 9px 9px, 9px 9px, 72px 72px, 72px 72px;
            background-position: left bottom;
            transform-origin: bottom left;
        }

        #preview-wrapper { perspective: 1200px; }
        #svg-preview-container { transform-style: preserve-3d; transition: transform 0.1s; }
        .isometric-view #svg-preview-container { transform: rotateX(60deg) rotateZ(-45deg); transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .layer-drop-zone { border: 2px dashed #3b82f6 !important; background-color: #eff6ff !important; }
        
        .cad-layer { position: absolute; transition: box-shadow 0.2s ease, opacity 0.3s ease; border: 1px solid rgba(0,0,0,0.15); border-radius: 2px; }
        .is-2d-mode .cad-layer:hover { border-color: #60a5fa; cursor: grab; }
        .is-2d-mode .cad-layer:active { cursor: grabbing; }
        
        .cad-selected { border-color: #2563eb !important; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4), 0 10px 15px -3px rgba(0,0,0,0.2) !important; }
        
        .anchor-btn { width: 12px; height: 12px; background: white; transition: all 0.1s; }
        .anchor-btn:hover { background: #bfdbfe; }
        .anchor-btn.active { background: #2563eb; transform: scale(1.1); z-index: 10; box-shadow: 0 0 4px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10 overflow-x-hidden">

<div class="w-full max-w-[1500px] mx-auto mt-6 px-4">
    <div id="main-card" class="bg-white shadow-xl rounded-xl border border-gray-200 overflow-hidden flex flex-col">
        <div class="flex flex-col lg:flex-row min-h-[850px] w-full">

            <!-- LEFT COLUMN: CAD LAYERS PANEL -->
            <div class="w-full lg:w-[450px] border-r border-gray-200 bg-gray-50 flex flex-col relative z-20 shrink-0">
                <div class="p-4 bg-gray-900 text-white shrink-0 shadow-md z-10 flex justify-between items-center">
                    <div>
                        <h2 class="text-sm font-black tracking-widest uppercase">A La Carte Builder</h2>
                        <span class="text-[9px] text-gray-400 tracking-widest uppercase block mt-0.5">Layer Ordering System</span>
                    </div>
                    <button onclick="location.reload()" class="text-[10px] font-bold bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded transition uppercase tracking-widest focus:outline-none">Reset</button>
                </div>

                <div class="p-4 border-b border-gray-200 bg-white grid grid-cols-2 gap-4 shrink-0">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Total Qty</label>
                        <input type="number" id="sys-qty" value="1" min="1" class="w-full border border-gray-300 p-2 rounded text-sm font-black focus:border-blue-500 outline-none shadow-inner" oninput="runCalc()">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Universal Hardware</label>
                        <select id="sys-hardware" onchange="runCalc()" class="w-full border border-gray-300 p-2 rounded text-xs font-bold text-gray-700 outline-none focus:border-blue-500 shadow-inner h-[38px]">
                            <option value="None">None / Flush</option>
                            <option value="Foam Tape">Foam Tape (VHB)</option>
                        </select>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4" id="layers-container"></div>
                
                <div class="p-4 bg-white border-t border-gray-200 shrink-0">
                    <button onclick="addLayer()" class="w-full bg-slate-100 hover:bg-blue-50 border border-dashed border-slate-300 hover:border-blue-300 text-slate-600 hover:text-blue-700 font-black py-3 rounded text-[10px] uppercase tracking-widest transition focus:outline-none flex items-center justify-center gap-2 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add New Material Layer
                    </button>
                </div>
            </div>

            <!-- RIGHT COLUMN: VIRTUAL WORKSPACE -->
            <div class="flex-1 flex flex-col bg-white relative min-w-0">
                
                <div class="flex-1 flex flex-col bg-gray-200/50 relative overflow-hidden" id="loader-wrapper">
                    
                    <!-- VIRTUAL WORKSPACE FLOATING TOOLBAR -->
                    <div class="absolute top-4 left-4 right-4 z-40 flex justify-between pointer-events-none">
                        
                        <div class="flex gap-2 pointer-events-auto">
                            <button onclick="setViewMode('2D')" id="btn-view-2d" class="bg-blue-600 text-white border border-blue-700 px-3 py-1.5 rounded shadow-md text-[9px] font-black uppercase tracking-widest transition focus:outline-none">2D Workspace</button>
                            <button onclick="setViewMode('3D')" id="btn-view-3d" class="bg-white/90 text-gray-700 border border-gray-300 px-3 py-1.5 rounded shadow-sm text-[9px] font-black uppercase tracking-widest transition backdrop-blur-sm focus:outline-none">3D Exploded</button>
                            <button onclick="exportCanvasSVG()" class="bg-indigo-600 hover:bg-indigo-700 text-white border border-indigo-700 px-3 py-1.5 rounded shadow-sm text-[9px] font-black uppercase tracking-widest transition focus:outline-none ml-4 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Export SVG
                            </button>
                        </div>

                        <!-- Contextual Design Tools -->
                        <div id="context-toolbar" class="hidden pointer-events-auto bg-white/95 backdrop-blur-sm p-1.5 rounded-lg shadow-xl border border-gray-300 flex gap-4 items-center">
                            
                            <!-- 9-Point Registration Grid -->
                            <div class="flex items-center gap-2 pr-3 border-r border-gray-200">
                                <div class="grid grid-cols-3 gap-[1px] bg-gray-400 border border-gray-500 p-[1px] rounded-sm" id="ui-anchor-grid">
                                    <button onclick="setAnchor('tl')" data-pos="tl" class="anchor-btn rounded-tl-sm"></button>
                                    <button onclick="setAnchor('tc')" data-pos="tc" class="anchor-btn"></button>
                                    <button onclick="setAnchor('tr')" data-pos="tr" class="anchor-btn rounded-tr-sm"></button>
                                    <button onclick="setAnchor('ml')" data-pos="ml" class="anchor-btn"></button>
                                    <button onclick="setAnchor('mc')" data-pos="mc" class="anchor-btn"></button>
                                    <button onclick="setAnchor('mr')" data-pos="mr" class="anchor-btn"></button>
                                    <button onclick="setAnchor('bl')" data-pos="bl" class="anchor-btn rounded-bl-sm"></button>
                                    <button onclick="setAnchor('bc')" data-pos="bc" class="anchor-btn"></button>
                                    <button onclick="setAnchor('br')" data-pos="br" class="anchor-btn rounded-br-sm"></button>
                                </div>
                                <span class="text-[8px] font-black text-gray-400 uppercase tracking-widest" style="writing-mode: vertical-rl; text-orientation: mixed;">Anchor</span>
                            </div>

                            <!-- Alignment Tools -->
                            <div class="flex items-center gap-1 pr-3 border-r border-gray-200">
                                <!-- DYNAMIC ALIGN LABEL -->
                                <span id="ui-align-label" class="text-[8px] font-black text-gray-400 uppercase tracking-widest mr-1 text-center leading-none" style="writing-mode: vertical-rl; text-orientation: mixed;">Align to 0,0</span>
                                
                                <div class="flex flex-col gap-1">
                                    <div class="flex gap-1">
                                        <button onclick="alignSelected('left')" class="w-6 h-6 flex items-center justify-center bg-gray-50 border border-gray-200 rounded hover:border-blue-500 hover:text-blue-600 focus:outline-none" title="Align Left">⇤</button>
                                        <button onclick="alignSelected('center-x')" class="w-6 h-6 flex items-center justify-center bg-gray-50 border border-gray-200 rounded hover:border-blue-500 hover:text-blue-600 focus:outline-none" title="Center Horizontal">⬌</button>
                                        <button onclick="alignSelected('right')" class="w-6 h-6 flex items-center justify-center bg-gray-50 border border-gray-200 rounded hover:border-blue-500 hover:text-blue-600 focus:outline-none" title="Align Right">⇥</button>
                                    </div>
                                    <div class="flex gap-1">
                                        <button onclick="alignSelected('top')" class="w-6 h-6 flex items-center justify-center bg-gray-50 border border-gray-200 rounded hover:border-blue-500 hover:text-blue-600 focus:outline-none" title="Align Top">⇡</button>
                                        <button onclick="alignSelected('center-y')" class="w-6 h-6 flex items-center justify-center bg-gray-50 border border-gray-200 rounded hover:border-blue-500 hover:text-blue-600 focus:outline-none" title="Center Vertical">⬍</button>
                                        <button onclick="alignSelected('bottom')" class="w-6 h-6 flex items-center justify-center bg-gray-50 border border-gray-200 rounded hover:border-blue-500 hover:text-blue-600 focus:outline-none" title="Align Bottom">⇣</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Rotation Tools -->
                            <div class="flex items-center gap-2 pr-1">
                                <button onclick="rotateSelected(-90)" class="w-7 h-7 flex items-center justify-center bg-gray-50 border border-gray-200 rounded hover:border-blue-500 hover:text-blue-600 focus:outline-none font-black text-lg pb-1" title="Rotate 90 CCW">↺</button>
                                <div class="flex flex-col items-center">
                                    <input type="number" id="ui-rot-input" value="0" step="5" onchange="setExplicitRotation(this.value)" class="w-12 h-6 text-center text-[10px] font-black border border-gray-300 rounded outline-none focus:border-blue-500 shadow-inner">
                                    <span class="text-[7px] font-black text-gray-400 uppercase tracking-widest mt-0.5">Deg °</span>
                                </div>
                                <button onclick="rotateSelected(90)" class="w-7 h-7 flex items-center justify-center bg-gray-50 border border-gray-200 rounded hover:border-blue-500 hover:text-blue-600 focus:outline-none font-black text-lg pb-1" title="Rotate 90 CW">↻</button>
                            </div>

                        </div>
                    </div>
                    
                    <div id="preview-wrapper" class="w-full h-full is-2d-mode overflow-hidden cursor-default relative" onwheel="handleCanvasWheel(event)" onmousedown="handleCanvasMouseDown(event)" onmousemove="handleCanvasMouseMove(event)" onmouseup="handleCanvasMouseUp(event)" onmouseleave="handleCanvasMouseUp(event)">
                        
                        <div id="svg-preview-container" class="workspace-grid absolute" style="width: 3456px; height: 3456px; left: 0; bottom: 0;">
                            <div id="grid-axes">
                                <div class="absolute w-full border-b-2 border-blue-600 bottom-0 left-0 pointer-events-none"></div>
                                <div class="absolute h-full border-l-2 border-blue-600 bottom-0 left-0 pointer-events-none"></div>
                                <div class="absolute bottom-1 left-1 bg-white/80 px-1 rounded text-blue-600 font-black text-[10px] pointer-events-none shadow-sm">0,0 ORIGIN</div>
                            </div>
                            <div id="layer-render-target" class="w-full h-full relative" style="transform-style: preserve-3d;"></div>
                        </div>
                    </div>
                </div>

                <!-- STICKY FINANCIAL LEDGER -->
                <div class="bg-white border-t border-gray-200 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20 shrink-0">
                    <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                        <span class="text-[10px] font-black text-gray-600 uppercase tracking-widest">Itemized Physics Build</span>
                        <span class="text-[10px] font-black text-blue-600" id="ui-unit-price">Unit: $0.00</span>
                    </div>
                    <div class="p-4 space-y-1 bg-white max-h-32 overflow-y-auto custom-scroll" id="ledger-items">
                        <div class="text-center text-xs text-gray-400 italic py-2">Awaiting Configuration</div>
                    </div>
                    <div class="p-5 flex justify-between items-end border-t border-gray-200 bg-gray-50">
                        <div>
                            <span class="block text-[10px] font-black text-blue-800 uppercase tracking-widest mb-1">Total Retail Quote</span>
                            <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1.5 py-0.5 rounded shadow-sm inline-block mb-1">MINIMUM APPLIED</div>
                            <span class="text-4xl font-black text-blue-700 tracking-tight block leading-none" id="ui-total">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>

        </div> 
    </div> 
</div> 

<!-- COLOR MODAL -->
<div id="color-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity cursor-pointer" onclick="closeModal()">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[85vh] overflow-hidden border border-gray-200 cursor-auto" onclick="event.stopPropagation()">
        <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center shrink-0">
            <h3 class="font-black text-gray-800 uppercase tracking-widest text-xs" id="modal-title">Select Color</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 font-bold transition focus:outline-none text-lg">✕</button>
        </div>
        <div class="p-3 shrink-0 border-b border-gray-100">
            <input type="text" id="color-search" placeholder="Search colors..." oninput="renderColorGrid()" class="w-full border border-gray-300 rounded p-2 text-xs font-bold outline-none focus:border-blue-500 shadow-inner">
        </div>
        <div id="modal-grid" class="p-4 overflow-y-auto custom-scroll flex flex-wrap gap-2 content-start bg-gray-50 flex-1"></div>
    </div>
</div>

</body>
</html>
