<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Signs v3.0.1 - Physics Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="signos-core.js"></script>
    <script src="signos-ui.js"></script>
    <script src="signos-canvas.js"></script>
    <script src="cost_ada.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .color-scroll::-webkit-scrollbar { width: 6px; }
        .color-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .color-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px;}
        
        /* 3D Exploded View CSS (True Isometric) */
        #preview-wrapper { perspective: 1200px; cursor: grab; }
        #preview-wrapper:active { cursor: grabbing; }
        
        #zoom-stage {
            transform-origin: center;
            transition: transform 0.1s ease-out; 
        }

        #svg-preview-container { 
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative;
        }
        .sign-layer { 
            position: absolute; inset: 0; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.8s ease; 
            transform-style: preserve-3d; 
        }
        
        /* Isometric Angles & Drop Shadows */
        .exploded-view #svg-preview-container { transform: rotateX(60deg) rotateZ(-45deg); }
        .exploded-view .layer-backer { transform: translateZ(-30px); box-shadow: var(--edge-shadow, -10px 10px 15px rgba(0,0,0,0.2)); }
        .exploded-view .layer-core { transform: translateZ(0px); box-shadow: var(--edge-shadow, -5px 5px 10px rgba(0,0,0,0.1)); }
        .exploded-view .layer-tactile { 
            transform: translateZ(30px); 
            filter: drop-shadow(-3px 3px 2px rgba(0,0,0,0.3)); 
        }

        /* Blueprint Callouts */
        .blueprint-callout { opacity: 0; transition: opacity 0.5s ease 0.4s; pointer-events: none; }
        .exploded-view .blueprint-callout { opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

    <div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
        
        <!-- 1. VISUAL PREVIEW (INTERACTIVE) -->
        <div id="preview-wrapper" class="bg-blue-50 relative flex flex-col items-center justify-center h-[320px] shadow-inner"
             onwheel="handleZoom(event)" onmousedown="startPan(event)" onmousemove="handlePan(event)" onmouseup="endPan()" onmouseleave="endPan()">
            
            <!-- Controls Overlay -->
            <div class="absolute top-3 left-3 right-3 z-30 flex justify-between items-start pointer-events-none">
                <!-- Dynamic Auto-Scale Toggle -->
                <label class="flex items-center gap-1.5 cursor-pointer bg-white/90 backdrop-blur px-2 py-1.5 rounded shadow-sm border border-blue-200 hover:bg-white transition pointer-events-auto">
                    <input type="checkbox" id="auto-scale" checked onchange="runCalc()" class="w-3 h-3 text-blue-600 rounded cursor-pointer">
                    <span class="text-[8px] font-black text-blue-700 uppercase tracking-widest">Auto-Scale</span>
                </label>

                <div class="flex flex-col gap-2 pointer-events-auto">
                    <button onclick="toggle3D()" class="bg-white/90 hover:bg-white text-blue-600 border border-blue-200 px-3 py-1.5 rounded shadow-sm text-[8px] font-black uppercase tracking-widest transition backdrop-blur-sm focus:outline-none">
                        Toggle 3D View
                    </button>
                    <button onclick="resetView()" class="bg-white/80 hover:bg-white text-gray-500 border border-gray-200 px-3 py-1 rounded shadow-sm text-[8px] font-black uppercase tracking-widest transition backdrop-blur-sm focus:outline-none self-end">
                        Reset Pan/Zoom
                    </button>
                </div>
            </div>
            
            <!-- Interactive Stage -->
            <div id="zoom-stage" class="w-full h-full flex items-center justify-center">
                <div id="svg-preview-container" class="mt-4" style="width: 100px; height: 100px;"></div>
            </div>
        </div>

        <!-- Dynamic ADA Compliance Warning -->
        <div id="ada-warn-box" class="hidden bg-red-50 border-b border-red-200 p-3 flex items-start gap-2 shadow-inner">
            <span class="text-red-500 text-base leading-none">⚠️</span>
            <div class="flex flex-col">
                <span class="text-[9px] font-black text-red-800 uppercase tracking-widest">ADA Physics Warning</span>
                <span id="ada-warn-text" class="text-[10px] font-bold text-red-600 leading-tight mt-0.5">---</span>
            </div>
        </div>

        <!-- 2. DIMENSIONS -->
        <div class="p-5 bg-white border-b border-gray-200 shadow-sm z-10 relative">
            <div class="grid grid-cols-3 gap-3">
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border border-gray-300 p-2 rounded font-black text-blue-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none shadow-inner" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="8" min="1" class="w-full border border-gray-300 p-2 rounded font-black text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-inner" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="8" min="1" class="w-full border border-gray-300 p-2 rounded font-black text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-inner" oninput="runCalc()"></div>
            </div>
            <div class="flex items-end gap-4 mt-3">
                <div class="flex-1">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Radius (in)</label>
                    <input type="number" id="radius" value="0.5" min="0" step="0.125" oninput="runCalc()" class="w-full border p-2 rounded font-bold text-gray-800 text-sm bg-white focus:border-blue-500 outline-none shadow-sm h-[40px] text-center">
                </div>
                <div class="flex-1">
                    <label class="flex items-center gap-2 text-[10px] font-bold text-gray-600 uppercase tracking-widest cursor-pointer bg-white p-2 rounded border border-gray-200 shadow-sm hover:bg-gray-50 transition h-[40px] px-3">
                        <input type="checkbox" id="bevel" checked onchange="runCalc()" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
                        Bevel Edges
                    </label>
                </div>
            </div>
        </div>

        <!-- 3. COLORS -->
        <div class="grid grid-cols-2 gap-4 p-5 bg-gray-50 border-b border-gray-200">
            <div id="wrap-tactile-color">
                <label class="block text-[10px] font-bold text-purple-800 uppercase tracking-widest mb-1">Tactile Color</label>
                <div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded shadow-sm cursor-pointer hover:border-purple-400 transition" onclick="openModal('tactile')">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <div id="swatch-tactile" class="w-5 h-5 rounded-full border shadow-inner bg-gray-200 shrink-0"></div>
                        <span id="label-tactile" class="text-[10px] font-bold text-gray-700 truncate w-24">Loading...</span>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-blue-800 uppercase tracking-widest mb-1">ADA Core Color</label>
                <div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded shadow-sm cursor-pointer hover:border-blue-400 transition" onclick="openModal('core')">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <div id="swatch-core" class="w-5 h-5 rounded-full border shadow-inner bg-gray-200 shrink-0"></div>
                        <span id="label-core" class="text-[10px] font-bold text-gray-700 truncate w-24">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. ACCORDION: SIGN STRUCTURE -->
        <div class="bg-white border-b border-gray-200">
            <div class="flex justify-between items-center p-4 cursor-pointer hover:bg-gray-50 transition" onclick="toggleAccordion('acc-structure', 'arr-structure')">
                <label class="text-[10px] font-black text-gray-800 uppercase tracking-widest cursor-pointer">Sign Structure & Backers</label>
                <svg id="arr-structure" class="w-4 h-4 text-gray-400 transition-transform duration-200 transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
            <div id="acc-structure" class="hidden p-5 pt-0 space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Core Thickness</label>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button id="btn-thick-18" onclick="setThickness('1/8')" class="flex-1 py-2 text-xs font-bold rounded text-gray-500 hover:text-gray-800 border border-transparent transition-all">1/8" Core</button>
                        <button id="btn-thick-116" onclick="setThickness('1/16')" class="flex-1 py-2 text-xs font-bold rounded bg-white shadow-sm border border-gray-200 text-blue-700 transition-all">1/16" Core</button>
                    </div>
                    <input type="hidden" id="core-thick" value="1/16">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Rigid Backer</label>
                    <div class="flex bg-gray-100 p-1 rounded-lg text-[9px]">
                        <button id="btn-back-none" onclick="setBacker('None')" class="flex-1 py-2 font-bold rounded text-gray-500 transition-all">None</button>
                        <button id="btn-back-blk" onclick="setBacker('Black PVC')" class="flex-1 py-2 font-bold rounded bg-white shadow-sm border border-gray-200 text-blue-700 transition-all truncate">3mm Blk PVC</button>
                        <button id="btn-back-wht" onclick="setBacker('White PVC')" class="flex-1 py-2 font-bold rounded text-gray-500 hover:text-gray-800 transition-all truncate">3mm Wht PVC</button>
                        <button id="btn-back-clr" onclick="setBacker('Clear Acrylic')" class="flex-1 py-2 font-bold rounded text-gray-500 hover:text-gray-800 transition-all truncate">3/16" Clr Acr</button>
                    </div>
                    <input type="hidden" id="backer" value="Black PVC">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Mounting</label>
                    <select id="mounting" class="w-full border p-2 rounded bg-white font-bold text-sm h-[40px] focus:border-blue-500 outline-none shadow-sm" onchange="runCalc()">
                        <option value="Foam Tape" selected>Foam Tape</option>
                        <option value="None">None</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 5. ACCORDION: CONTENT & TYPOGRAPHY -->
        <div class="bg-gray-50 border-b border-gray-200">
            <div class="flex justify-between items-center p-4 cursor-pointer hover:bg-gray-100 transition" onclick="toggleAccordion('acc-content', 'arr-content')">
                <label class="text-[10px] font-black text-gray-800 uppercase tracking-widest cursor-pointer">Sign Content & Typography</label>
                <svg id="arr-content" class="w-4 h-4 text-gray-400 transition-transform duration-200 transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
            
            <div id="acc-content" class="hidden p-5 pt-0 space-y-3">
                <!-- Pictogram Section -->
                <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                    <div class="flex justify-between items-center">
                        <label class="flex items-center gap-2 text-xs font-bold text-blue-800 uppercase tracking-widest cursor-pointer">
                            <input type="checkbox" id="toggle-picto" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> 
                            Pictogram
                        </label>
                        <div id="picto-size-wrap" class="flex items-center gap-2 bg-gray-50 p-1 rounded border border-gray-200 shadow-inner transition-opacity">
                            <label class="text-[9px] font-bold text-gray-500 uppercase">Height (in):</label>
                            <input type="number" id="picto-size" value="4" step="0.25" min="1" oninput="runCalc()" class="w-14 border border-gray-300 p-0.5 rounded text-xs font-bold text-center outline-none">
                        </div>
                    </div>
                    <div id="wrap-picto" class="mt-3 pt-3 border-t border-gray-100">
                        <div id="icon-grid" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto color-scroll p-2 border rounded-lg bg-gray-50 shadow-inner"></div>
                    </div>
                </div>

                <!-- Text Section -->
                <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                    <div class="flex justify-between items-center mb-1">
                        <label class="flex items-center gap-2 text-xs font-bold text-blue-800 uppercase tracking-widest cursor-pointer">
                            <input type="checkbox" id="toggle-text" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> 
                            Tactile Copy
                        </label>
                    </div>
                    <div id="wrap-text" class="grid grid-cols-2 gap-3 pt-3 mt-2 border-t border-gray-100">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Text String</label>
                            <input type="text" id="sign-text" value="RESTROOM" oninput="runCalc()" class="w-full border p-2 rounded text-xs font-bold uppercase text-gray-800 focus:border-blue-500 outline-none shadow-sm h-[38px]">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Alignment</label>
                            <select id="sign-align" onchange="runCalc()" class="w-full border p-2 rounded bg-white font-bold text-xs h-[38px] focus:border-blue-500 outline-none shadow-sm">
                                <option value="left">Left Aligned</option>
                                <option value="center" selected>Center Aligned</option>
                                <option value="right">Right Aligned</option>
                            </select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Font Style</label>
                            <select id="sign-font" onchange="loadActiveFont()" class="w-full border p-2 rounded bg-white font-bold text-xs h-[38px] focus:border-blue-500 outline-none shadow-sm">
                                <!-- Injected -->
                            </select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label>
                            <input type="number" id="text-height" value="0.625" step="0.125" min="0.25" oninput="runCalc()" class="w-full border p-2 rounded text-xs font-bold text-gray-800 focus:border-blue-500 outline-none shadow-sm h-[38px] text-center transition-opacity">
                        </div>
                    </div>
                </div>

                <!-- Braille Section -->
                <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                    <label class="flex items-center gap-2 text-xs font-bold text-blue-800 uppercase tracking-widest cursor-pointer">
                        <input type="checkbox" id="toggle-braille" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> 
                        Grade 2 Braille (Auto-Translated)
                    </label>
                </div>
            </div>
        </div>

        <!-- RESULTS -->
        <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
            <div class="flex justify-between items-end mb-2">
                <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
                <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
            </div>
            <div class="border-t border-blue-200/50 my-3"></div>
            <div class="flex justify-between items-end pt-2">
                <div>
                    <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                    <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Minimum: $50</span>
                    <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
                </div>
                <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
            </div>
        </div>

        <!-- OUTPUTS & NARRATIVE GENERATOR -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-3 border rounded bg-white h-24 text-gray-600 font-mono outline-none shadow-inner leading-relaxed mb-3" readonly></textarea>
            
            <button onclick="downloadProductionSVG()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded shadow-md text-[10px] uppercase tracking-widest transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Export Production SVG (Vectors)
            </button>
        </div>
    </div>

    <!-- COLOR SELECTION MODAL -->
    <div id="color-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity cursor-pointer" onclick="closeModal()">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[85vh] overflow-hidden border border-gray-200 cursor-auto" onclick="event.stopPropagation()">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center shrink-0">
                <h3 class="font-black text-gray-800 uppercase tracking-widest text-xs" id="modal-title">Select Color</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 font-bold transition focus:outline-none">✕</button>
            </div>
            <div class="p-3 shrink-0 border-b border-gray-100">
                <input type="text" id="color-search" placeholder="Search colors..." oninput="SignOS_UI.filterGrid('modal-grid', 'color-search')" class="w-full border border-gray-300 rounded p-2 text-xs font-bold outline-none focus:border-blue-500 shadow-inner">
            </div>
            <div id="modal-grid" class="p-4 overflow-y-auto color-scroll flex flex-wrap gap-2 content-start bg-gray-50 flex-1"></div>
        </div>
    </div>

    <script>
        let backendData = {};
        let coreColors = [], tactileColors = [], pictograms = [], systemFonts = [];
        let selectedCore = null, selectedTactile = null, selectedIcon = null;
        let activeModal = ''; 
        let is3D = false;

        // NEW: OpenType Font Memory Cache
        let cachedFont = null;
        const GITHUB_BASE = "https://raw.githubusercontent.com/SignStoreERP/signos-app/main/fonts/";

        // --- PAN & ZOOM LOGIC ---
        let panX = 0, panY = 0, scaleZ = 1;
        let isDragging = false, startX, startY;

        function handleZoom(e) {
            e.preventDefault();
            scaleZ += e.deltaY * -0.001;
            scaleZ = Math.min(Math.max(0.4, scaleZ), 3); 
            updateTransform();
        }

        function startPan(e) {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        }

        function handlePan(e) {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        }

        function endPan() { isDragging = false; }

        function resetView() {
            panX = 0; panY = 0; scaleZ = 1;
            updateTransform();
        }

        function updateTransform() {
            const stage = document.getElementById('zoom-stage');
            stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scaleZ})`;
            stage.style.transition = isDragging ? 'none' : 'transform 0.2s ease-out'; 
        }

        function toggleAccordion(contentId, arrowId) {
            document.getElementById(contentId).classList.toggle('hidden');
            document.getElementById(arrowId).classList.toggle('rotate-180');
        }

        function toggle3D() {
            is3D = !is3D;
            document.getElementById('preview-wrapper').classList.toggle('exploded-view', is3D);
            runCalc(); 
        }

        function handleContentToggles() {
            const hasPicto = document.getElementById('toggle-picto').checked;
            const hasText = document.getElementById('toggle-text').checked;

            document.getElementById('wrap-picto').classList.toggle('hidden', !hasPicto);
            document.getElementById('picto-size-wrap').classList.toggle('opacity-30', !hasPicto);
            document.getElementById('wrap-text').classList.toggle('hidden', !hasText);
            
            document.getElementById('wrap-tactile-color').style.opacity = (hasPicto || hasText) ? '1' : '0.3';
            document.getElementById('wrap-tactile-color').style.pointerEvents = (hasPicto || hasText) ? 'auto' : 'none';

            runCalc();
        }

        function setThickness(val) {
            document.getElementById('core-thick').value = val;
            const is18 = val === '1/8';
            document.getElementById('btn-thick-18').className = `flex-1 py-2 text-xs font-bold rounded transition-all ${is18 ? 'bg-white shadow-sm border border-gray-200 text-blue-700' : 'text-gray-500 hover:text-gray-800 border border-transparent'}`;
            document.getElementById('btn-thick-116').className = `flex-1 py-2 text-xs font-bold rounded transition-all ${!is18 ? 'bg-white shadow-sm border border-gray-200 text-blue-700' : 'text-gray-500 hover:text-gray-800 border border-transparent'}`;
            
            const btnNone = document.getElementById('btn-back-none');
            if (!is18) {
                btnNone.classList.add('opacity-30', 'cursor-not-allowed');
                btnNone.disabled = true;
                if(document.getElementById('backer').value === 'None') setBacker('Black PVC');
            } else {
                btnNone.classList.remove('opacity-30', 'cursor-not-allowed');
                btnNone.disabled = false;
            }
            runCalc();
        }

        function setBacker(val) {
            if(document.getElementById('core-thick').value === '1/16' && val === 'None') return;
            document.getElementById('backer').value = val;
            
            const btns = ['none', 'blk', 'wht', 'clr'];
            const vals = ['None', 'Black PVC', 'White PVC', 'Clear Acrylic'];
            
            btns.forEach((b, i) => {
                const el = document.getElementById('btn-back-' + b);
                if(vals[i] === val) {
                    el.className = "flex-1 py-2 font-bold rounded bg-white shadow-sm border border-gray-200 text-blue-700 transition-all truncate";
                } else {
                    el.className = "flex-1 py-2 font-bold rounded text-gray-500 hover:text-gray-800 border border-transparent transition-all truncate";
                }
            });
            runCalc();
        }

        function makeEdge(hex, depthPx) {
            if (!hex || hex === 'Transparent' || hex.includes('rgba')) return 'none';
            let c = hex.replace('#', '');
            if(c.length === 3) c = c+c+c+c+c+c; 
            if(c.length !== 6) return 'none';
            
            let r = parseInt(c.substr(0, 2), 16) * 0.6;
            let g = parseInt(c.substr(2, 2), 16) * 0.6;
            let b = parseInt(c.substr(4, 2), 16) * 0.6;
            let rgb = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
            
            let shadow = [];
            // Map down and left for Isometric effect
            for(let i=1; i<=depthPx; i++) {
                shadow.push(`-${i}px ${i}px 0 ${rgb}`);
            }
            shadow.push(`-${depthPx+5}px ${depthPx+5}px 15px rgba(0,0,0,0.3)`);
            return shadow.join(', ');
        }

        // --- NEW: FONT LOADER (Physics Pipeline) ---
        async function loadActiveFont() {
            const fontSelect = document.getElementById('sign-font');
            const fileName = fontSelect.options[fontSelect.selectedIndex].dataset.filename;
            if (!fileName) return;

            try {
                const fontUrl = GITHUB_BASE + encodeURIComponent(fileName);
                cachedFont = await new Promise((res, rej) => {
                    opentype.load(fontUrl, (err, f) => err ? rej(err) : res(f));
                });
                runCalc();
            } catch(e) {
                console.error("Failed to load OpenType font:", e);
            }
        }

        // --- NEW: MATH BRAILLE PLOTTER (FIXED SYNTAX) ---
        function generateBraillePaths(text, startX, startY, align) {
            if (!text) return "";
            
            // Valid Grade 1 mapping with correct JS arrays
            const brailleMap = {
                'a': [1], 'b': [1, 2], 'c': [1, 3], 'd': [1, 3, 4], 'e': [1, 4],
                'f': [1-3], 'g': [1-4], 'h': [1, 2, 4], 'i': [2, 3], 'j': [2-4],
                'k': [1, 5], 'l': [1, 2, 5], 'm': [1, 3, 5], 'n': [1, 3-5], 'o': [1, 4, 5],
                'p': [1-3, 5], 'q': [1-5], 'r': [1, 2, 4, 5], 's': [2, 3, 5], 't': [2-5],
                'u': [1, 5, 6], 'v': [1, 2, 5, 6], 'w': [2-4, 6], 'x': [1, 3, 5, 6], 'y': [1, 3-6], 'z': [1, 4-6],
                ' ': [], '#': [3-6]
            };

            const DOT_PITCH = 0.100; // Federal spacing between dots in a cell
            const CELL_PITCH = 0.250; // Federal spacing between cells
            const DOT_RADIUS = 0.025; 
            
            let str = text.toLowerCase();
            if (/\d/.test(str)) str = "#" + str;

            let totalWidth = str.length * CELL_PITCH;
            
            let cursorX = startX;
            if (align === 'center') cursorX = startX - (totalWidth / 2);
            if (align === 'right') cursorX = startX - totalWidth;

            let paths = "";

            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                let dots = brailleMap[char] || [];

                if (char === '#') dots = brailleMap['#']; // Number sign
                else if (/\d/.test(char)) {
                    const numMap = ['j','a','b','c','d','e','f','g','h','i'];
                    dots = brailleMap[numMap[parseInt(char)]] || [];
                }

                // Draw Dots based on valid arrays
                if(dots.includes(1)) paths += `<circle cx="${cursorX}" cy="${startY}" r="${DOT_RADIUS}" />`;
                if(dots.includes(2)) paths += `<circle cx="${cursorX}" cy="${startY + DOT_PITCH}" r="${DOT_RADIUS}" />`;
                if(dots.includes(3)) paths += `<circle cx="${cursorX}" cy="${startY + (DOT_PITCH*2)}" r="${DOT_RADIUS}" />`;
                if(dots.includes(4)) paths += `<circle cx="${cursorX + DOT_PITCH}" cy="${startY}" r="${DOT_RADIUS}" />`;
                if(dots.includes(5)) paths += `<circle cx="${cursorX + DOT_PITCH}" cy="${startY + DOT_PITCH}" r="${DOT_RADIUS}" />`;
                if(dots.includes(6)) paths += `<circle cx="${cursorX + DOT_PITCH}" cy="${startY + (DOT_PITCH*2)}" r="${DOT_RADIUS}" />`;

                cursorX += CELL_PITCH;
            }

            return paths;
        }

        // --- ASYNC DYNAMIC PREVIEW ---
        async function updatePreview() {
            const w = parseFloat(document.getElementById('w').value) || 8;
            const h = parseFloat(document.getElementById('h').value) || 8;
            const r = parseFloat(document.getElementById('radius').value) || 0;
            const backerType = document.getElementById('backer').value;
            const align = document.getElementById('sign-align').value;
            const textVal = document.getElementById('sign-text').value.toUpperCase() || "";
            const container = document.getElementById('svg-preview-container');

            const hasPicto = document.getElementById('toggle-picto').checked;
            const hasText = document.getElementById('toggle-text').checked;
            const hasBraille = document.getElementById('toggle-braille').checked;
            const isAutoScale = document.getElementById('auto-scale').checked;

            // 1. AUTO-SCALE LOGIC
            const pictoInput = document.getElementById('picto-size');
            const textInput = document.getElementById('text-height');

            pictoInput.disabled = isAutoScale;
            textInput.disabled = isAutoScale;
            pictoInput.classList.toggle('opacity-50', isAutoScale);
            textInput.classList.toggle('opacity-50', isAutoScale);

            if (isAutoScale) {
                let scaledPicto = Math.min(w * 0.6, h * 0.45, 5);
                let scaledText = h * 0.08;
                if(hasPicto) pictoInput.value = scaledPicto.toFixed(2);
                if(hasText) textInput.value = scaledText.toFixed(3);
            }

            let pictoSize = hasPicto ? (parseFloat(pictoInput.value) || 4) : 0;
            let fontSize = hasText ? (parseFloat(textInput.value) || 0.625) : 0;

            // 2. ADA PHYSICS GUARDRAILS
            let reqHeight = 0.375; 
            if (hasPicto) reqHeight += 6.0; 
            if (hasPicto && (hasText || hasBraille)) reqHeight += 0.375; 
            if (hasText) reqHeight += fontSize; 
            if (hasText && hasBraille) reqHeight += 0.375; 
            if (hasBraille) reqHeight += 0.25; 
            reqHeight += 0.375; 

            let warnMsgs = [];
            if (hasText && fontSize < 0.625) warnMsgs.push("Tactile text height is below the 5/8\" ADA minimum.");
            if (h < reqHeight && (hasPicto || hasText || hasBraille)) warnMsgs.push(`Total layout requires ~${reqHeight.toFixed(2)}" of vertical space.`);

            const warnBox = document.getElementById('ada-warn-box');
            if (warnMsgs.length > 0) {
                warnBox.classList.remove('hidden');
                document.getElementById('ada-warn-text').innerText = warnMsgs.join(" ");
            } else {
                warnBox.classList.add('hidden');
            }

            // 3. PHYSICAL LAYOUT CALCULATIONS
            let contentH = 0;
            if(hasPicto) contentH += pictoSize;
            if(hasPicto && (hasText || hasBraille)) contentH += 0.5; 
            if(hasText) contentH += fontSize;
            if(hasText && hasBraille) contentH += 0.375; 
            if(hasBraille) contentH += 0.25; 

            let currentY = (h - contentH) / 2;
            if (currentY < 0.375) currentY = 0.375; 

            let pictoY = 0;
            if (hasPicto) {
                pictoY = currentY;
                currentY += pictoSize;
                if (hasText || hasBraille) currentY += 0.5;
            }

            let textY = 0;
            if (hasText) {
                textY = currentY + fontSize; 
                currentY += fontSize;
                if (hasBraille) currentY += 0.375;
            }

            let brailleY = 0;
            if (hasBraille) {
                brailleY = currentY + 0.15; 
            }

            let xPos = w / 2;
            if (align === 'left') xPos = 0.375; 
            if (align === 'right') xPos = w - 0.375;

            const scale = Math.min(220 / w, 160 / h);
            const pxW = w * scale;
            const pxH = h * scale;
            const pxR = r * scale;

            container.style.width = `${pxW}px`;
            container.style.height = `${pxH}px`;
            
            const coreHex = selectedCore ? selectedCore.Cap_Hex : '#000000';
            const tactileHex = selectedTactile ? selectedTactile.Cap_Hex : '#ffffff';
            let backerHex = '#111827';
            if (backerType === 'White PVC') backerHex = '#ffffff';
            if (backerType === 'Clear Acrylic') backerHex = 'rgba(255,255,255,0.4)';

            const coreDepth = document.getElementById('core-thick').value.includes('1/8') ? 6 : 3;
            const backerDepth = backerType.includes('Acrylic') ? 4 : 6;

            let calloutHtml = (name, index) => `
                <div class="blueprint-callout absolute -right-4 translate-x-full flex items-center gap-1 z-50" style="top: ${index * 25}px;">
                    <div class="w-6 border-b border-blue-400"></div>
                    <span class="text-[8px] font-black text-blue-700 uppercase tracking-widest bg-white/90 backdrop-blur px-1.5 py-0.5 rounded border border-blue-200 shadow-sm">${name}</span>
                </div>`;

            let html = '';
            let layerIndex = 0;

            if (backerType !== 'None') {
                html += `<div class="sign-layer layer-backer border border-black/20" style="background-color: ${backerHex}; border-radius: ${pxR}px; --edge-shadow: ${makeEdge(backerHex, backerDepth)};">
                    ${is3D ? calloutHtml(backerType + ' Backer', layerIndex++) : ''}
                </div>`;
            }

            html += `<div class="sign-layer layer-core border border-black/20" style="background-color: ${coreHex}; border-radius: ${pxR}px; --edge-shadow: ${makeEdge(coreHex, coreDepth)};">
                ${is3D ? calloutHtml(document.getElementById('core-thick').value + '" ADA Core', layerIndex++) : ''}
            </div>`;

            // L3: GENERATE ABSOLUTE VECTORS (Physics Pipeline)
            let svgContent = '';
            
            if (hasPicto && selectedIcon) {
                let pX = (w/2) - (pictoSize/2); 
                let viewB = selectedIcon.ViewBox || "0 0 100 100";
                svgContent += `<svg x="${pX}" y="${pictoY}" width="${pictoSize}" height="${pictoSize}" viewBox="${viewB}" fill="currentColor"><path d="${selectedIcon.SVG_Path}"/></svg>`;
            }

            if (hasText && cachedFont && textVal) {
                // OPENTYPE PATH GENERATION
                const fontScale = fontSize / cachedFont.ascender;
                const pathObj = cachedFont.getPath(textVal, 0, 0, cachedFont.unitsPerEm * fontScale);
                const bbox = pathObj.getBoundingBox();
                
                // Mathematical Alignment adjustments based on generated bounding box
                let alignX = xPos;
                if (align === 'center') alignX = xPos - ((bbox.x2 - bbox.x1) / 2) - bbox.x1;
                if (align === 'right') alignX = xPos - (bbox.x2 - bbox.x1) - bbox.x1;
                
                svgContent += `<path d="${pathObj.toPathData()}" transform="translate(${alignX}, ${textY})" fill="currentColor" />`;
            }

            if (hasBraille) {
                // BRAILLE PLOTTER GENERATION
                svgContent += `<g fill="rgba(180, 180, 180, 0.35)" stroke="rgba(255, 255, 255, 0.7)" stroke-width="0.008">
                    ${generateBraillePaths(textVal, xPos, brailleY, align)}
                </g>`;
            }

            html += `
            <div class="sign-layer layer-tactile" style="color: ${tactileHex};">
                <svg id="live-production-preview" viewBox="0 0 ${w} ${h}" width="100%" height="100%" fill="currentColor" style="overflow: visible;">
                    ${svgContent}
                </svg>
                ${is3D ? calloutHtml('1/32" Tactile & Braille', layerIndex++) : ''}
            </div>
            `;

            container.innerHTML = html;
        }

        // --- SVG EXPORT (SignOS v3.0) ---
        function downloadProductionSVG() {
            const container = document.getElementById('svg-preview-container');
            if (!container) return alert("Preview not ready!");

            const w = parseFloat(document.getElementById('w').value) || 8;
            const h = parseFloat(document.getElementById('h').value) || 8;
            
            const coreHex = selectedCore ? selectedCore.Cap_Hex : '#000000';
            const tactileHex = selectedTactile ? selectedTactile.Cap_Hex : '#ffffff';

            let svgEl = document.getElementById('live-production-preview');
            if(!svgEl) return alert("No tactile layer found to export.");

            let svgData = svgEl.outerHTML;
            svgData = svgData.replace(/currentColor/g, tactileHex);

            // Clean Physics Package using strict inch coordinates
            let finalSVG = `<?xml version="1.0" encoding="UTF-8"?>
            <svg xmlns="http://www.w3.org/2000/svg" width="${w}in" height="${h}in" viewBox="0 0 ${w} ${h}">
                <!-- Substrate Boundary -->
                <rect width="${w}" height="${h}" fill="${coreHex}" />
                <!-- Vector Tactile & Braille Paths -->
                ${svgData.replace(/<svg[^>]*>/, '').replace(/<\/svg>/, '')}
            </svg>`;

            const blob = new Blob([finalSVG], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SignOS_PROD_ADA_${w}x${h}.svg`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function openModal(type) {
            activeModal = type;
            document.getElementById('modal-title').innerText = type === 'tactile' ? 'Select Tactile Applique' : 'Select Core Background';
            document.getElementById('color-search').value = '';
            document.getElementById('color-modal').classList.remove('hidden');

            const data = type === 'tactile' ? tactileColors : coreColors;
            const activeClass = type === 'tactile' ? 'ring-purple-600' : 'ring-blue-600';

            SignOS_UI.buildColorGrid({
                containerId: 'modal-grid',
                data: data,
                type: 'rowmark', 
                btnClass: 'w-10 h-10', 
                activeRingClass: activeClass,
                onSelect: (item) => {
                    if (activeModal === 'tactile') {
                        selectedTactile = item;
                        document.getElementById('swatch-tactile').style.backgroundColor = item.Cap_Hex;
                        document.getElementById('label-tactile').innerText = item.Cap_Color;
                    } else {
                        selectedCore = item;
                        document.getElementById('swatch-core').style.backgroundColor = item.Cap_Hex;
                        document.getElementById('label-core').innerText = item.Cap_Color;
                    }
                    closeModal();
                    runCalc();
                }
            });

            const activeItem = type === 'tactile' ? selectedTactile : selectedCore;
            if(activeItem) {
                setTimeout(() => {
                    const btn = document.querySelector(`#modal-grid button[data-code="${activeItem.Item_Code}"]`);
                    if(btn) btn.classList.add('ring-2', 'ring-offset-1', activeClass);
                }, 50);
            }
        }

        function closeModal() { document.getElementById('color-modal').classList.add('hidden'); }

        async function runCalc() {
            if(!backendData.Retail_Min_Order_Etch || !selectedCore || !selectedTactile) return;
            
            // Generate exact physics paths
            await updatePreview();

            try {
                const inputs = {
                    qty: parseFloat(document.getElementById('qty').value) || 1,
                    w: parseFloat(document.getElementById('w').value) || 8,
                    h: parseFloat(document.getElementById('h').value) || 8,
                    coreThick: document.getElementById('core-thick').value,
                    baseStyle: 'Front',
                    hasPicto: document.getElementById('toggle-picto').checked,
                    hasText: document.getElementById('toggle-text').checked,
                    hasBraille: document.getElementById('toggle-braille').checked,
                    brailleLines: document.getElementById('toggle-braille').checked ? 1 : 0,
                    hasTactile: document.getElementById('toggle-picto').checked || document.getElementById('toggle-text').checked,
                    backer: document.getElementById('backer').value,
                    mounting: document.getElementById('mounting').value,
                    bevel: document.getElementById('bevel').checked ? 'Yes' : 'No',
                    radius: parseFloat(document.getElementById('radius').value) || 0
                };

                const result = calculateADA(inputs, backendData);
                if (!result || !result.retail) return;

                const ret = result.retail;
                const fmt = (n) => "$" + (n || 0).toFixed(2);

                document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
                document.getElementById('ui-total').innerText = fmt(ret.grandTotal);

                const minOrder = inputs.backer !== 'None' ? parseFloat(backendData.Retail_Min_Order_CNC || 75.00) : parseFloat(backendData.Retail_Min_Order_Etch || 50.00);
                document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
                document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

                let qty = inputs.qty;
                let dim = `${inputs.w}" x ${inputs.h}"`;
                
                let tactileArr = [];
                if(inputs.hasPicto) tactileArr.push("pictogram");
                if(inputs.hasText) tactileArr.push("text");
                if(inputs.hasBraille) tactileArr.push("braille");

                let tactStr = "";
                if (tactileArr.length > 0) {
                    let tactList = tactileArr.join(", ").replace(/,([^,]*)$/, ' and$1');
                    if (inputs.hasTactile) {
                        tactStr = `with 1/32" [${selectedTactile.Item_Code}] ${selectedTactile.Cap_Color} tactile ${tactList}`;
                    } else {
                        tactStr = `with clear raster ${tactList}`; 
                    }
                }

                let coreStr = `on ${inputs.coreThick} [${selectedCore.Item_Code}] ${selectedCore.Cap_Color} ADA core`;
                let edgeStr = inputs.bevel === 'Yes' ? "with beveled edges" : "with straight cut edges";
                let backerStr = inputs.backer !== 'None' ? `with ${inputs.backer === 'Black PVC' || inputs.backer === 'White PVC' ? '3mm ' + inputs.backer : '3/16" Clear Acrylic'} backer` : "";
                let radStr = inputs.radius > 0 ? `with ${inputs.radius}" radius corners` : "with square corners";
                let mountStr = inputs.mounting !== 'None' ? `with ${inputs.mounting.toLowerCase()}` : "without mounting hardware";

                let narrative = `(x${qty}) ${dim} ADA signs ${tactStr} ${coreStr} ${edgeStr} ${backerStr} ${radStr} ${mountStr}.`.replace(/\s+/g, ' ');

                document.getElementById('job-desc').value = narrative;

            } catch(e) { console.error("Math Engine Error:", e); }
        }

        window.addEventListener('load', async () => {
            if (typeof injectHeader === 'function') injectHeader("ADA Compliant Signs");
            if (SignOS_UI && SignOS_UI.showLoader) SignOS_UI.showLoader('preview-wrapper', 'Connecting to Source Data...');

            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            try {
                // Fetch Data including Pictograms!
                const payload = await SignOS.fetchProductData('PROD_ADA_Signs', ['REF_Colors_Rowmark', 'REF_Pictograms', 'REF_Fonts']);
                
                backendData = payload.config;
                const rawRowmark = payload.tables['REF_Colors_Rowmark'] || [];
                pictograms = payload.tables['REF_Pictograms'] || [];
                systemFonts = payload.tables['REF_Fonts'] || [];

                if (SignOS_Canvas && SignOS_Canvas.loadFonts) {
                    SignOS_Canvas.loadFonts(systemFonts.filter(f => String(f.Is_Active).toUpperCase() === 'TRUE'));
                }

                const fontSelect = document.getElementById('sign-font');
                let fontHtml = '';
                systemFonts.forEach(f => {
                    if(String(f.Is_Active).toUpperCase() === 'TRUE') {
                        fontHtml += `<option value="${f.CSS_Family}" data-filename="${f.File_Name}">${f.Font_Name}</option>`;
                    }
                });
                fontSelect.innerHTML = fontHtml;

                coreColors = rawRowmark.filter(r => r.Series && (r.Series.includes('Ultra-Mattes') || r.Series.includes('Mattes')));
                
                if (!coreColors.find(c => c.Cap_Color && c.Cap_Color.includes('Clear'))) {
                    coreColors.push({ Item_Code: '322-101', Cap_Color: 'Clear', Cap_Hex: '#e5e7eb' });
                }

                tactileColors = rawRowmark.filter(r => r.Series && r.Series.includes('ADA Alternative'));

                selectedCore = coreColors.find(c => c.Cap_Color && c.Cap_Color.includes('Black')) || coreColors;
                selectedTactile = tactileColors.find(c => c.Cap_Color && c.Cap_Color.includes('White')) || tactileColors;
                
                document.getElementById('swatch-core').style.backgroundColor = selectedCore.Cap_Hex;
                document.getElementById('label-core').innerText = selectedCore.Cap_Color;
                document.getElementById('swatch-tactile').style.backgroundColor = selectedTactile.Cap_Hex;
                document.getElementById('label-tactile').innerText = selectedTactile.Cap_Color;

                const activeIcons = pictograms.filter(p => String(p.Is_Active).toUpperCase() === 'TRUE');
                if (activeIcons.length > 0) {
                    selectedIcon = activeIcons.find(p => p.Name.toLowerCase().includes('restroom') || p.Name.toLowerCase().includes('men') || p.Name.toLowerCase().includes('women')) || activeIcons; 
                }

                if (SignOS_UI.buildIconGrid) {
                    SignOS_UI.buildIconGrid({
                        containerId: 'icon-grid',
                        data: activeIcons,
                        activeRingClass: 'ring-blue-500',
                        onSelect: (item) => {
                            selectedIcon = item;
                            runCalc();
                        }
                    });
                }

                if(statusText) {
                    statusText.innerText = "ONLINE";
                    statusText.className = "font-bold text-green-500";
                    if(statusDot) {
                        statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                        statusDot.classList.remove("animate-pulse");
                    }
                }

                // Initial Font Load
                await loadActiveFont();

                if (SignOS_UI && SignOS_UI.hideLoader) SignOS_UI.hideLoader('preview-wrapper');
                
                setThickness('1/16'); 
                setBacker('Black PVC');

                setTimeout(() => {
                    if (selectedIcon) {
                        const btn = document.querySelector(`#icon-grid button[data-code="${selectedIcon.Item_Code}"]`);
                        if (btn) btn.classList.add('ring-2', 'ring-offset-1', 'ring-blue-500', 'border-transparent');
                    }
                }, 100);

            } catch(e) {
                console.error("API Error:", e);
                if (SignOS_UI && SignOS_UI.hideLoader) SignOS_UI.hideLoader('preview-wrapper', true, 'Connection Failed');
                if(statusText) {
                    statusText.innerText = "OFFLINE";
                    statusText.className = "font-bold text-red-500";
                }
            }
        });
    </script>
