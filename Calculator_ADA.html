<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Signs v3.6 - Production Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="signos-core.js"></script>
    <script src="signos-ui.js"></script>
    <!-- Dual-Track Logic mapping -->
    <script src="logic_ada.js"></script>
    <script src="signos-builder.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .color-scroll::-webkit-scrollbar { width: 6px; }
        .color-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .color-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px;}
        #preview-wrapper { perspective: 1200px; cursor: grab; }
        #preview-wrapper:active { cursor: grabbing; }
        #svg-preview-container { transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .sign-layer { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.8s ease; transform-style: preserve-3d; }
        .exploded-view #svg-preview-container { transform: rotateX(60deg) rotateZ(-45deg); }
        .exploded-view .layer-backer { transform: translateZ(-30px); box-shadow: var(--edge-shadow, -10px 10px 15px rgba(0,0,0,0.2)); }
        .exploded-view .layer-core { transform: translateZ(0px); box-shadow: var(--edge-shadow, -5px 5px 10px rgba(0,0,0,0.1)); }
        .exploded-view .layer-tactile { transform: translateZ(30px); filter: drop-shadow(-3px 3px 2px rgba(0,0,0,0.3)); }
        .blueprint-callout { opacity: 0; transition: opacity 0.5s ease 0.4s; pointer-events: none; }
        .exploded-view .blueprint-callout { opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

<div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
    <!-- 1. VISUAL PREVIEW -->
    <div id="preview-wrapper" class="bg-blue-50 overflow-hidden relative flex flex-col items-center justify-center h-[320px] shadow-inner border-b border-blue-100" onwheel="SignOS_UI.Camera3D.handleZoom(event)" onmousedown="SignOS_UI.Camera3D.startPan(event)" onmousemove="SignOS_UI.Camera3D.handlePan(event)" onmouseup="SignOS_UI.Camera3D.endPan()" onmouseleave="SignOS_UI.Camera3D.endPan()">
        <div class="absolute top-3 left-3 right-3 z-30 flex justify-between items-start pointer-events-none">
            <label class="flex items-center gap-1.5 cursor-pointer bg-white/90 backdrop-blur px-2 py-1.5 rounded shadow-sm border border-blue-200 hover:bg-white transition pointer-events-auto">
                <input type="checkbox" id="auto-scale" checked onchange="runCalc()" class="w-3 h-3 text-blue-600 rounded cursor-pointer">
                <span class="text-[8px] font-black text-blue-700 uppercase tracking-widest">Auto-Scale</span>
            </label>
            <div class="flex flex-col gap-2 pointer-events-auto">
                <button onclick="toggle3D()" class="bg-white/90 hover:bg-white text-blue-600 border border-blue-200 px-3 py-1.5 rounded shadow-sm text-[8px] font-black uppercase tracking-widest transition backdrop-blur-sm focus:outline-none">Toggle 3D View</button>
                <button onclick="SignOS_UI.Camera3D.reset()" class="bg-white/80 hover:bg-white text-gray-500 border border-gray-200 px-3 py-1 rounded shadow-sm text-[8px] font-black uppercase tracking-widest transition backdrop-blur-sm focus:outline-none self-end">Reset View</button>
            </div>
        </div>
        <div id="zoom-stage" class="w-full h-full flex items-center justify-center">
            <div id="svg-preview-container" class="mt-4 relative" style="width: 100px; height: 100px;"></div>
        </div>
    </div>

    <div id="ada-warn-box" class="hidden bg-red-50 border-b border-red-200 p-3 flex items-start gap-2 shadow-inner">
        <span class="text-red-500 text-base leading-none">⚠️</span>
        <div class="flex flex-col">
            <span class="text-[9px] font-black text-red-800 uppercase tracking-widest">ADA Physics Warning</span>
            <span id="ada-warn-text" class="text-[10px] font-bold text-red-600 leading-tight mt-0.5">---</span>
        </div>
    </div>

    <!-- 2. DIMENSIONS -->
    <div class="p-5 bg-white border-b border-gray-200 shadow-sm z-10 relative">
        <div class="grid grid-cols-3 gap-3">
            <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border border-gray-300 p-2 rounded font-black text-blue-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none shadow-inner" oninput="runCalc()"></div>
            <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="8" min="1" class="w-full border border-gray-300 p-2 rounded font-black text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-inner" oninput="runCalc()"></div>
            <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="8" min="1" class="w-full border border-gray-300 p-2 rounded font-black text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-inner" oninput="runCalc()"></div>
        </div>
        <div class="flex items-end gap-4 mt-3">
            <div class="flex-1">
                <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Radius (in)</label>
                <input type="number" id="radius" value="0.5" min="0" step="0.125" oninput="runCalc()" class="w-full border p-2 rounded font-bold text-gray-800 text-sm bg-white focus:border-blue-500 outline-none shadow-sm h-[40px] text-center">
            </div>
            <div class="flex-1">
                <label class="flex items-center gap-2 text-[10px] font-bold text-gray-600 uppercase tracking-widest cursor-pointer bg-white p-2 rounded border border-gray-200 shadow-sm hover:bg-gray-50 transition h-[40px] px-3">
                    <input type="checkbox" id="bevel" checked onchange="runCalc()" class="w-4 h-4 text-blue-600 rounded cursor-pointer"> Bevel Edges
                </label>
            </div>
        </div>
    </div>

    <!-- 3. COLORS -->
    <div class="grid grid-cols-2 gap-4 p-5 bg-gray-50 border-b border-gray-200">
        <div id="wrap-tactile-color">
            <label class="block text-[10px] font-bold text-purple-800 uppercase tracking-widest mb-1">Tactile Color</label>
            <div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded shadow-sm cursor-pointer hover:border-purple-400 transition" onclick="openModal('tactile')">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div id="swatch-tactile" class="w-5 h-5 rounded-full border shadow-inner bg-gray-200 shrink-0"></div>
                    <span id="label-tactile" class="text-[10px] font-bold text-gray-700 truncate w-24">Loading...</span>
                </div>
            </div>
        </div>
        <div>
            <label class="block text-[10px] font-bold text-blue-800 uppercase tracking-widest mb-1">ADA Core Color</label>
            <div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded shadow-sm cursor-pointer hover:border-blue-400 transition" onclick="openModal('core')">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div id="swatch-core" class="w-5 h-5 rounded-full border shadow-inner bg-gray-200 shrink-0"></div>
                    <span id="label-core" class="text-[10px] font-bold text-gray-700 truncate w-24">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. ACCORDION: SIGN STRUCTURE -->
    <div class="bg-white border-b border-gray-200">
        <div class="flex justify-between items-center p-4 cursor-pointer hover:bg-gray-50 transition" onclick="toggleAccordion('acc-structure', 'arr-structure')">
            <label class="text-[10px] font-black text-gray-800 uppercase tracking-widest cursor-pointer">Sign Structure & Specs</label>
            <svg id="arr-structure" class="w-4 h-4 text-gray-400 transition-transform duration-200 transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <div id="acc-structure" class="hidden p-5 pt-0 space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-blue-800 uppercase tracking-widest mb-1">ADA Sign Type</label>
                <select id="sign-type" class="w-full border p-2 rounded bg-white font-bold text-xs h-[40px] focus:border-blue-500 outline-none shadow-sm cursor-pointer" onchange="runCalc()">
                    <option value="Standard">Standard (1/32" Tactile on 1/8" Core)</option>
                    <option value="Layered_PVC" selected>Layered (1/32" on 1/16" Core + PVC Backer)</option>
                    <option value="Layered_Acrylic">Premium Layered (1/32" on 1/16" Core + Clear Acrylic)</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Mounting Hardware</label>
                <select id="mounting" class="w-full border p-2 rounded bg-white font-bold text-xs h-[40px] focus:border-blue-500 outline-none shadow-sm" onchange="runCalc()">
                    <option value="Foam Tape" selected>Double Sided Foam Tape</option>
                    <option value="None">None</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 5. ACCORDION: CONTENT & TYPOGRAPHY -->
    <div class="bg-gray-50 border-b border-gray-200">
        <div class="flex justify-between items-center p-4 cursor-pointer hover:bg-gray-100 transition" onclick="toggleAccordion('acc-content', 'arr-content')">
            <label class="text-[10px] font-black text-gray-800 uppercase tracking-widest cursor-pointer">Sign Content & Typography</label>
            <svg id="arr-content" class="w-4 h-4 text-gray-400 transition-transform duration-200 transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <div id="acc-content" class="hidden p-5 pt-0 space-y-3">
            <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                <div class="flex justify-between items-center">
                    <label class="flex items-center gap-2 text-xs font-bold text-blue-800 uppercase tracking-widest cursor-pointer">
                        <input type="checkbox" id="toggle-picto" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> Pictogram
                    </label>
                    <div id="picto-size-wrap" class="flex items-center gap-2 bg-gray-50 p-1 rounded border border-gray-200 shadow-inner transition-opacity">
                        <label class="text-[9px] font-bold text-gray-500 uppercase">Height (in):</label>
                        <input type="number" id="picto-size" value="4" step="0.25" min="1" oninput="runCalc()" class="w-14 border border-gray-300 p-0.5 rounded text-xs font-bold text-center outline-none">
                    </div>
                </div>
                <div id="wrap-picto" class="mt-3 pt-3 border-t border-gray-100">
                    <div id="icon-grid" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto color-scroll p-2 border rounded-lg bg-gray-50 shadow-inner"></div>
                </div>
            </div>

            <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                <div class="flex justify-between items-center mb-1">
                    <label class="flex items-center gap-2 text-xs font-bold text-blue-800 uppercase tracking-widest cursor-pointer">
                        <input type="checkbox" id="toggle-text" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> Tactile Copy
                    </label>
                </div>
                <div id="wrap-text" class="grid grid-cols-2 gap-3 pt-3 mt-2 border-t border-gray-100">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Text String</label>
                        <input type="text" id="sign-text" value="RESTROOM" oninput="runCalc()" class="w-full border p-2 rounded text-xs font-bold uppercase text-gray-800 focus:border-blue-500 outline-none shadow-sm h-[38px]">
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Alignment</label>
                        <select id="sign-align" onchange="runCalc()" class="w-full border p-2 rounded bg-white font-bold text-xs h-[38px] focus:border-blue-500 outline-none shadow-sm">
                            <option value="left">Left Aligned</option>
                            <option value="center" selected>Center Aligned</option>
                            <option value="right">Right Aligned</option>
                        </select>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Font Style</label>
                        <select id="sign-font" onchange="runCalc()" class="w-full border p-2 rounded bg-white font-bold text-xs h-[38px] focus:border-blue-500 outline-none shadow-sm"></select>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label>
                        <input type="number" id="text-height" value="0.625" step="0.125" min="0.25" oninput="runCalc()" class="w-full border p-2 rounded text-xs font-bold text-gray-800 focus:border-blue-500 outline-none shadow-sm h-[38px] text-center transition-opacity">
                    </div>
                </div>
            </div>

            <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                <label class="flex items-center gap-2 text-xs font-bold text-blue-800 uppercase tracking-widest cursor-pointer">
                    <input type="checkbox" id="toggle-braille" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> Grade 2 Braille (Auto-Translated)
                </label>
            </div>
        </div>
    </div>

    <!-- RESULTS -->
    <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
        <div class="flex justify-between items-end mb-2">
            <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
            <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
        </div>
        <div class="border-t border-blue-200/50 my-3"></div>
        <div class="flex justify-between items-end pt-2">
            <div>
                <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Minimum: $50</span>
                <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
            </div>
            <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
        </div>
    </div>

    <!-- OUTPUTS & EXPORT MODULE -->
    <div class="bg-gray-50 p-4 border-t border-gray-200">
        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
        <textarea id="job-desc" class="w-full text-xs p-3 border rounded bg-white h-24 text-gray-600 font-mono outline-none shadow-inner leading-relaxed mb-3" readonly></textarea>
        <button onclick="triggerExport()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded shadow-md text-[10px] uppercase tracking-widest transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Export Production SVG (Vectors)
        </button>
    </div>
</div>

<!-- COLOR MODAL -->
<div id="color-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity cursor-pointer" onclick="closeModal()">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[85vh] overflow-hidden border border-gray-200 cursor-auto" onclick="event.stopPropagation()">
        <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center shrink-0">
            <h3 class="font-black text-gray-800 uppercase tracking-widest text-xs" id="modal-title">Select Color</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 font-bold transition focus:outline-none">✕</button>
        </div>
        <div class="p-3 shrink-0 border-b border-gray-100">
            <input type="text" id="color-search" placeholder="Search colors..." oninput="SignOS_UI.filterGrid('modal-grid', 'color-search')" class="w-full border border-gray-300 rounded p-2 text-xs font-bold outline-none focus:border-blue-500 shadow-inner">
        </div>
        <div id="modal-grid" class="p-4 overflow-y-auto color-scroll flex flex-wrap gap-2 content-start bg-gray-50 flex-1"></div>
    </div>
</div>

<script>
    let backendData = {}, coreColors = [], tactileColors = [], pictograms = [], systemFonts = [];
    let selectedCore = null, selectedTactile = null, selectedIcon = null, activeModal = '';
    let currentManifest = null;
    const GITHUB_BASE = "https://raw.githubusercontent.com/SignStoreERP/signos-app/main/fonts/";

    function toggleAccordion(cId, aId) { document.getElementById(cId).classList.toggle('hidden'); document.getElementById(aId).classList.toggle('rotate-180'); }

    function toggle3D() {
        SignOS_UI.Camera3D.toggle(!SignOS_UI.Camera3D.is3D);
        document.getElementById('preview-wrapper').classList.toggle('exploded-view', SignOS_UI.Camera3D.is3D);
        runCalc();
    }

    function handleContentToggles() {
        const hasPicto = document.getElementById('toggle-picto').checked;
        const hasText = document.getElementById('toggle-text').checked;
        document.getElementById('wrap-picto').classList.toggle('hidden', !hasPicto);
        document.getElementById('picto-size-wrap').classList.toggle('opacity-30', !hasPicto);
        document.getElementById('wrap-text').classList.toggle('hidden', !hasText);
        document.getElementById('wrap-tactile-color').style.opacity = (hasPicto || hasText) ? '1' : '0.3';
        document.getElementById('wrap-tactile-color').style.pointerEvents = (hasPicto || hasText) ? 'auto' : 'none';
        runCalc();
    }

    function makeEdge(hex, depthPx) {
        if (!hex || hex === 'Transparent' || hex.includes('rgba')) return 'none';
        let c = hex.replace('#', '');
        if(c.length === 3) c = c+c+c+c+c+c;
        if(c.length !== 6) return 'none';
        let r = parseInt(c.substr(0, 2), 16) * 0.6, g = parseInt(c.substr(2, 2), 16) * 0.6, b = parseInt(c.substr(4, 2), 16) * 0.6;
        let shadow = [];
        for(let i=1; i<=depthPx; i++) shadow.push(`-${i}px ${i}px 0 rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`);
        shadow.push(`-${depthPx+5}px ${depthPx+5}px 15px rgba(0,0,0,0.3)`);
        return shadow.join(', ');
    }

    async function updatePreview() {
        const w = parseFloat(document.getElementById('w').value) || 8;
        const h = parseFloat(document.getElementById('h').value) || 8;
        const r = parseFloat(document.getElementById('radius').value) || 0;
        const container = document.getElementById('svg-preview-container');
        const fontSelect = document.getElementById('sign-font');
        
        const buildInputs = {
            w: w, h: h, align: document.getElementById('sign-align').value,
            textVal: document.getElementById('sign-text').value.toUpperCase() || "",
            hasPicto: document.getElementById('toggle-picto').checked,
            hasText: document.getElementById('toggle-text').checked,
            hasBraille: document.getElementById('toggle-braille').checked,
            isAutoScale: document.getElementById('auto-scale').checked,
            selectedIcon: selectedIcon,
            fontFileName: fontSelect.options[fontSelect.selectedIndex]?.dataset.filename || 'Arimo-Regular.ttf',
            pictoSize: parseFloat(document.getElementById('picto-size').value) || 4,
            fontSize: parseFloat(document.getElementById('text-height').value) || 0.625
        };

        const layout = await SignOS_Builder.buildADA(buildInputs, GITHUB_BASE);

        document.getElementById('picto-size').value = layout.pictoSize;
        document.getElementById('text-height').value = layout.fontSize;
        document.getElementById('picto-size').disabled = buildInputs.isAutoScale;
        document.getElementById('text-height').disabled = buildInputs.isAutoScale;
        document.getElementById('picto-size').classList.toggle('opacity-50', buildInputs.isAutoScale);
        document.getElementById('text-height').classList.toggle('opacity-50', buildInputs.isAutoScale);

        const warnBox = document.getElementById('ada-warn-box');
        if (layout.warnMsgs.length > 0) {
            warnBox.classList.remove('hidden');
            document.getElementById('ada-warn-text').innerText = layout.warnMsgs.join(" ");
        } else warnBox.classList.add('hidden');

        // Extract mapped physics data from runCalc inputs rather than independent IDs
        const st = document.getElementById('sign-type').value;
        const backerType = st === 'Standard' ? 'None' : (st === 'Layered_PVC' ? 'Black PVC' : 'Clear Acrylic');
        const coreThickStr = st === 'Standard' ? '1/8' : '1/16';
        
        const coreHex = selectedCore ? selectedCore.Hex_Code : '#000000'; 
        const tactileHex = selectedTactile ? selectedTactile.Hex_Code : '#ffffff';
        let backerHex = backerType === 'White PVC' ? '#ffffff' : (backerType === 'Clear Acrylic' ? 'rgba(255,255,255,0.4)' : '#111827');

        const scale = Math.min((SignOS_UI.Camera3D.is3D ? 160 : 220) / w, (SignOS_UI.Camera3D.is3D ? 100 : 160) / h);
        container.style.width = `${w * scale}px`;
        container.style.height = `${h * scale}px`;

        let callout = (name) => `
            <div class="blueprint-callout absolute left-0 top-1/2 -translate-x-full -translate-y-1/2 flex items-center gap-1.5 z-50 pr-2">
                <span class="text-[8px] font-black text-blue-700 uppercase tracking-widest bg-white/90 backdrop-blur px-1.5 py-0.5 rounded border border-blue-200 shadow-sm whitespace-nowrap">${name}</span>
                <div class="w-8 border-b-[1.5px] border-blue-500 shadow-sm"></div>
            </div>`;

        let html = '';
        if (backerType !== 'None') {
            html += `<div class="sign-layer layer-backer border border-black/20" style="background-color: ${backerHex}; border-radius: ${r*scale}px; --edge-shadow: ${makeEdge(backerHex, backerType.includes('Acrylic') ? 4 : 6)};">${SignOS_UI.Camera3D.is3D ? callout(backerType + ' Backer') : ''}</div>`;
        }
        
        html += `<div class="sign-layer layer-core border border-black/20" style="background-color: ${coreHex}; border-radius: ${r*scale}px; --edge-shadow: ${makeEdge(coreHex, coreThickStr.includes('1/8') ? 6 : 3)};">${SignOS_UI.Camera3D.is3D ? callout(coreThickStr + '" ADA Core') : ''}</div>`;
        
        html += `<div class="sign-layer layer-tactile" style="color: ${tactileHex};">
            <svg id="live-production-preview" viewBox="0 0 ${w} ${h}" width="100%" height="100%" fill="currentColor" style="overflow: visible;">${layout.svgContent}</svg>
            ${SignOS_UI.Camera3D.is3D ? callout('1/32" Tactile & Braille') : ''}
        </div>`;

        container.innerHTML = html;
        currentManifest = { w: w, h: h, coreHex: coreHex, tactileHex: tactileHex, radius: r, svgContent: layout.svgContent };
    }

    function triggerExport() {
        if(!currentManifest || !currentManifest.svgContent) return alert("Preview not ready!");
        let finalSVG = `<?xml version="1.0" encoding="UTF-8"?>
        <svg xmlns="http://www.w3.org/2000/svg" width="${currentManifest.w}in" height="${currentManifest.h}in" viewBox="0 0 ${currentManifest.w} ${currentManifest.h}">
            <rect width="${currentManifest.w}" height="${currentManifest.h}" fill="${currentManifest.coreHex}" rx="${currentManifest.radius}" ry="${currentManifest.radius}" />
            <g fill="${currentManifest.tactileHex}">
                ${currentManifest.svgContent.replace(/currentColor/g, currentManifest.tactileHex)}
            </g>
        </svg>`;
        
        const blob = new Blob([finalSVG], {type: 'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SignOS_PROD_ADA_${currentManifest.w}x${currentManifest.h}.svg`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function openModal(type) {
        activeModal = type;
        document.getElementById('modal-title').innerText = type === 'tactile' ? 'Select Tactile Applique' : 'Select Core Background';
        document.getElementById('color-search').value = '';
        document.getElementById('color-modal').classList.remove('hidden');
        const activeClass = type === 'tactile' ? 'ring-purple-600' : 'ring-blue-600';
        
        SignOS_UI.buildColorGrid({
            containerId: 'modal-grid', data: type === 'tactile' ? tactileColors : coreColors, type: 'rowmark', btnClass: 'w-10 h-10', activeRingClass: activeClass,
            onSelect: (item) => {
                if (type === 'tactile') { selectedTactile = item; document.getElementById('swatch-tactile').style.backgroundColor = item.Hex_Code; document.getElementById('label-tactile').innerText = item.Name; }
                else { selectedCore = item; document.getElementById('swatch-core').style.backgroundColor = item.Hex_Code; document.getElementById('label-core').innerText = item.Name; }
                closeModal(); runCalc();
            }
        });

        const actItem = type === 'tactile' ? selectedTactile : selectedCore;
        if(actItem) setTimeout(() => { const btn = document.querySelector(`#modal-grid button[data-code="${actItem.Code}"]`); if(btn) btn.classList.add('ring-2', 'ring-offset-1', activeClass); }, 50);
    }

    function closeModal() { document.getElementById('color-modal').classList.add('hidden'); }

    async function runCalc() {
        if(!backendData.Retail_Min_Order || !selectedCore || !selectedTactile) return;
        await updatePreview();

        try {
            const st = document.getElementById('sign-type').value;
            const inputs = {
                qty: parseFloat(document.getElementById('qty').value) || 1,
                w: parseFloat(document.getElementById('w').value) || 8,
                h: parseFloat(document.getElementById('h').value) || 8,
                signType: st,
                coreThick: st === 'Standard' ? '1/8' : '1/16',
                backer: st === 'Standard' ? 'None' : (st === 'Layered_PVC' ? 'Black PVC' : 'Clear Acrylic'),
                hasTactile: document.getElementById('toggle-picto').checked || document.getElementById('toggle-text').checked,
                hasBraille: document.getElementById('toggle-braille').checked,
                brailleLines: document.getElementById('toggle-braille').checked ? 1 : 0
            };

            const result = calculateADA(inputs, backendData);
            if (!result || !result.retail) return;

            const ret = result.retail;
            const fmt = (n) => "$" + (n || 0).toFixed(2);

            document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
            document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
            document.getElementById('ui-min-text').innerText = `Shop Minimum: $${parseFloat(backendData.Retail_Min_Order || 50)}`;
            document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

            let tactArr = [];
            if(document.getElementById('toggle-picto').checked) tactArr.push("pictogram");
            if(document.getElementById('toggle-text').checked) tactArr.push("text");
            if(document.getElementById('toggle-braille').checked) tactArr.push("braille");

            let tactStr = tactArr.length > 0 ? (inputs.hasTactile ? `with 1/32" [${selectedTactile.Code}] ${selectedTactile.Name} tactile ${tactArr.join(", ").replace(/,([^,]*)$/, ' and$1')}` : `with clear raster braille`) : "";
            let coreStr = `on ${inputs.coreThick} [${selectedCore.Code}] ${selectedCore.Name} ADA core`;
            let edgeStr = document.getElementById('bevel').checked ? "with beveled edges" : "with straight cut edges";
            let bType = inputs.backer;
            let backerStr = bType !== 'None' ? `with ${bType === 'Black PVC' || bType === 'White PVC' ? '3mm ' + bType : '3/16" Clear Acrylic'} backer` : "";
            let radStr = parseFloat(document.getElementById('radius').value) > 0 ? `with ${document.getElementById('radius').value}" radius corners` : "with square corners";
            let mountStr = document.getElementById('mounting').value !== 'None' ? `with foam tape` : "without mounting hardware";

            document.getElementById('job-desc').value = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" ADA signs ${tactStr} ${coreStr} ${edgeStr} ${backerStr} ${radStr} ${mountStr}.`.replace(/\s+/g, ' ');

        } catch(e) { console.error("Math Engine Error:", e); }
    }

    window.addEventListener('load', async () => {
        if (typeof injectHeader === 'function') injectHeader("ADA Compliant Signs");
        if (SignOS_UI && SignOS_UI.showLoader) SignOS_UI.showLoader('preview-wrapper', 'Connecting to Source Data...');
        SignOS_UI.Camera3D.init('zoom-stage');

        const statusText = document.getElementById("status-text");
        const statusDot = document.getElementById("status-dot");

        try {
            // Fetches the dedicated ADA Data Profile
            const payload = await SignOS.fetchProductData('PROD_ADA_Signs', ['REF_Colors_Rowmark', 'REF_Pictograms', 'REF_Fonts']);
            backendData = payload.config;
            const rawRowmark = payload.tables['REF_Colors_Rowmark'] || [];
            pictograms = payload.tables['REF_Pictograms'] || [];
            systemFonts = payload.tables['REF_Fonts'] || [];

            const fontSelect = document.getElementById('sign-font');
            let fontHtml = '';
            systemFonts.forEach(f => { if(String(f.Is_Active).toUpperCase() === 'TRUE') fontHtml += `<option value="${f.CSS_Family}" data-filename="${f.File_Name}">${f.Font_Name}</option>`; });
            fontSelect.innerHTML = fontHtml;

            coreColors = rawRowmark.filter(r => r.Series && (r.Series.includes('Ultra-Mattes') || r.Series.includes('Mattes'))).map(c => ({
                Code: c.Item_Code, Name: c.Cap_Color, Hex_Code: (c.Cap_Hex === 'Transparent' || c.Cap_Color.includes('Clear')) ? '#e5e7eb' : c.Cap_Hex
            }));
            
            if (!coreColors.find(c => c.Name.includes('Clear'))) coreColors.push({ Code: '322-101', Name: 'Clear', Hex_Code: '#e5e7eb' });

            tactileColors = rawRowmark.filter(r => r.Series && r.Series.includes('ADA Alternative')).map(c => ({
                Code: c.Item_Code, Name: c.Cap_Color, Hex_Code: c.Cap_Hex
            }));

            selectedCore = coreColors.find(c => c.Name.includes('Black')) || coreColors;
            selectedTactile = tactileColors.find(c => c.Name.includes('White')) || tactileColors;

            document.getElementById('swatch-core').style.backgroundColor = selectedCore.Hex_Code;
            document.getElementById('label-core').innerText = selectedCore.Name;
            document.getElementById('swatch-tactile').style.backgroundColor = selectedTactile.Hex_Code;
            document.getElementById('label-tactile').innerText = selectedTactile.Name;

            const activeIcons = pictograms.filter(p => String(p.Is_Active).toUpperCase() === 'TRUE');
            if (activeIcons.length > 0) selectedIcon = activeIcons.find(p => p.Name.toLowerCase().includes('restroom') || p.Name.toLowerCase().includes('men') || p.Name.toLowerCase().includes('women')) || activeIcons;
            
            if (SignOS_UI.buildIconGrid) SignOS_UI.buildIconGrid({ containerId: 'icon-grid', data: activeIcons, activeRingClass: 'ring-blue-500', onSelect: (item) => { selectedIcon = item; runCalc(); } });

            if(statusText) { statusText.innerText = "ONLINE"; statusText.className = "font-bold text-green-500"; if(statusDot) { statusDot.className = "w-2 h-2 rounded-full bg-green-500"; statusDot.classList.remove("animate-pulse"); } }
            if (SignOS_UI && SignOS_UI.hideLoader) SignOS_UI.hideLoader('preview-wrapper');

            setTimeout(() => { if (selectedIcon) { const btn = document.querySelector(`#icon-grid button[data-code="${selectedIcon.Item_Code}"]`); if (btn) btn.classList.add('ring-2', 'ring-offset-1', 'ring-blue-500', 'border-transparent'); } }, 100);
            
            runCalc();

        } catch(e) {
            console.error("API Error:", e);
            if (SignOS_UI && SignOS_UI.hideLoader) SignOS_UI.hideLoader('preview-wrapper', true, 'Connection Failed');
            if(statusText) { statusText.innerText = "OFFLINE"; statusText.className = "font-bold text-red-500"; }
        }
    });
</script>
</body>
</html>
