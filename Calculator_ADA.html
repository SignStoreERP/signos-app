<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Signs v2.2 - Layout & Content Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="signos-ui.js"></script>
    <script src="logic_ada.js"></script>
    <style>
        /* Load custom Braille Font */
        @font-face {
            font-family: 'Swell Braille';
            src: url('fonts/Swell-Braille.ttf') format('truetype');
        }

        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .color-scroll::-webkit-scrollbar { width: 6px; }
        .color-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .color-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px;}

        /* Clear Braille Bead Styling (Frosted Glass Effect) */
        .braille-bead {
            fill: rgba(180, 180, 180, 0.35);
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 0.008;
        }

        /* 3D Exploded View CSS */
        #preview-wrapper { perspective: 1200px; }
        #svg-preview-container { 
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative;
        }
        
        .sign-layer { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.8s ease; 
            transform-style: preserve-3d; 
        }

        /* The 3D Trigger Classes (Tape Layer Removed!) */
        .exploded-view #svg-preview-container { transform: rotateX(60deg) rotateZ(-40deg); }
        .exploded-view .layer-backer { transform: translateZ(-30px); box-shadow: -20px 20px 30px rgba(0,0,0,0.2); }
        .exploded-view .layer-core { transform: translateZ(0px); box-shadow: -10px 10px 20px rgba(0,0,0,0.1); }
        .exploded-view .layer-tactile { transform: translateZ(30px); filter: drop-shadow(-5px 5px 5px rgba(0,0,0,0.3)); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

    <div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
        
        <!-- 1. VISUAL PREVIEW (3D Environment) -->
        <div id="preview-wrapper" class="bg-blue-50 p-6 border-b border-blue-100 relative flex flex-col items-center justify-center min-h-[260px] shadow-inner overflow-hidden">
            <span class="absolute top-2 left-3 text-[8px] font-black text-blue-400 uppercase tracking-widest">Dynamic Batch Preview</span>
            
            <button onclick="toggle3D()" class="absolute top-2 right-3 z-20 bg-white/80 hover:bg-white text-blue-600 border border-blue-200 px-2 py-1 rounded shadow-sm text-[8px] font-black uppercase tracking-widest transition backdrop-blur-sm focus:outline-none">
                Toggle 3D Layers
            </button>
            
            <!-- 3D Stage -->
            <div id="svg-preview-container" class="mt-4" style="width: 100px; height: 100px;">
                <!-- Layers Injected Here Dynamically via updatePreview() -->
            </div>

            <!-- ADA Physics Guardrails -->
            <div id="ada-warn-box" class="hidden absolute bottom-2 left-2 right-2 bg-red-100 border border-red-300 p-2 rounded shadow-md z-20 flex items-start gap-2">
                <span class="text-red-600 text-lg leading-none">⚠️</span>
                <div class="flex flex-col">
                    <span class="text-[9px] font-black text-red-800 uppercase tracking-widest">ADA Compliance Warning</span>
                    <span id="ada-warn-text" class="text-[10px] font-bold text-red-700 leading-tight mt-0.5">Height is too small.</span>
                </div>
            </div>
        </div>

        <!-- 2. CONTENT & LAYOUT BUILDER -->
        <div class="p-5 bg-white border-b border-gray-200">
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3 text-center">Sign Content & Layout</label>
            
            <!-- Component Toggles -->
            <div class="flex justify-center gap-4 mb-4 pb-4 border-b border-gray-100">
                <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer">
                    <input type="checkbox" id="toggle-picto" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> Pictogram
                </label>
                <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer">
                    <input type="checkbox" id="toggle-text" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> Text
                </label>
                <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer">
                    <input type="checkbox" id="toggle-braille" checked onchange="handleContentToggles()" class="w-4 h-4 text-blue-600 rounded"> Braille
                </label>
            </div>

            <!-- Pictogram Section -->
            <div id="wrap-picto" class="mb-4">
                <div class="flex justify-between items-end mb-1">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase">Select Symbol</label>
                    <span id="selected-icon-label" class="text-[9px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-100">Loading...</span>
                </div>
                <div id="icon-grid" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto color-scroll p-2 border rounded-lg bg-gray-50 shadow-inner"></div>
            </div>

            <!-- Text Section -->
            <div id="wrap-text" class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Tactile Copy</label>
                    <input type="text" id="sign-text" value="RESTROOM" oninput="runCalc()" class="w-full border p-2 rounded text-xs font-bold uppercase text-gray-800 focus:border-blue-500 outline-none shadow-sm h-[38px]">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Alignment</label>
                    <select id="sign-align" onchange="runCalc()" class="w-full border p-2 rounded bg-white font-bold text-xs h-[38px] focus:border-blue-500 outline-none shadow-sm">
                        <option value="left">Left Aligned</option>
                        <option value="center" selected>Center Aligned</option>
                        <option value="right">Right Aligned</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. COLORS -->
        <div class="grid grid-cols-2 gap-4 p-4 bg-gray-50 border-b border-gray-200">
            <div>
                <label class="block text-[10px] font-bold text-blue-800 uppercase tracking-widest mb-1">ADA Core Color</label>
                <div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded shadow-sm cursor-pointer hover:border-blue-400 transition" onclick="openModal('core')">
                    <div class="flex items-center gap-2">
                        <div id="swatch-core" class="w-5 h-5 rounded-full border shadow-inner bg-gray-200 shrink-0"></div>
                        <span id="label-core" class="text-[10px] font-bold text-gray-700 truncate w-20">Loading...</span>
                    </div>
                </div>
            </div>
            <div id="wrap-tactile-color">
                <label class="block text-[10px] font-bold text-purple-800 uppercase tracking-widest mb-1">Tactile Color</label>
                <div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded shadow-sm cursor-pointer hover:border-purple-400 transition" onclick="openModal('tactile')">
                    <div class="flex items-center gap-2">
                        <div id="swatch-tactile" class="w-5 h-5 rounded-full border shadow-inner bg-gray-200 shrink-0"></div>
                        <span id="label-tactile" class="text-[10px] font-bold text-gray-700 truncate w-20">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. BUILDER INPUTS -->
        <div class="p-6 space-y-4">
            
            <!-- THICKNESS SLIDER -->
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Core Thickness</label>
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button id="btn-thick-18" onclick="setThickness('1/8')" class="flex-1 py-2 text-xs font-bold rounded text-gray-500 hover:text-gray-800 border border-transparent transition-all">1/8" Core</button>
                    <button id="btn-thick-116" onclick="setThickness('1/16')" class="flex-1 py-2 text-xs font-bold rounded bg-white shadow-sm border border-gray-200 text-blue-700 transition-all">1/16" Core</button>
                </div>
                <input type="hidden" id="core-thick" value="1/16">
            </div>

            <!-- BACKER SLIDER -->
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Rigid Backer</label>
                <div class="flex bg-gray-100 p-1 rounded-lg text-[9px]">
                    <button id="btn-back-none" onclick="setBacker('None')" class="flex-1 py-2 font-bold rounded text-gray-500 transition-all">None</button>
                    <button id="btn-back-blk" onclick="setBacker('Black PVC')" class="flex-1 py-2 font-bold rounded bg-white shadow-sm border border-gray-200 text-blue-700 transition-all truncate">3mm Blk PVC</button>
                    <button id="btn-back-wht" onclick="setBacker('White PVC')" class="flex-1 py-2 font-bold rounded text-gray-500 hover:text-gray-800 transition-all truncate">3mm Wht PVC</button>
                    <button id="btn-back-clr" onclick="setBacker('Clear Acrylic')" class="flex-1 py-2 font-bold rounded text-gray-500 hover:text-gray-800 transition-all truncate">3/16" Clr Acr</button>
                </div>
                <input type="hidden" id="backer" value="Black PVC">
            </div>

            <div class="grid grid-cols-3 gap-3 border-t border-gray-100 pt-4 mt-2">
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-sm" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="8" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-sm" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="8" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-sm" oninput="runCalc()"></div>
            </div>

            <div class="flex items-end gap-4">
                <div class="flex-1">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Corner Radius (in)</label>
                    <input type="number" id="radius" value="0.5" min="0" step="0.125" oninput="runCalc()" class="w-full border p-2 rounded font-bold text-gray-800 text-sm bg-white focus:border-blue-500 outline-none shadow-sm h-[42px] text-center">
                </div>
                <div class="flex-1">
                    <label class="flex items-center gap-2 text-[10px] font-bold text-gray-600 uppercase tracking-widest cursor-pointer bg-white p-2 rounded border border-gray-200 shadow-sm hover:bg-gray-50 transition h-[42px] px-3">
                        <input type="checkbox" id="bevel" checked onchange="runCalc()" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
                        Beveled Edges
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4 border-t border-gray-100 pt-4 mt-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Mounting</label>
                    <select id="mounting" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none shadow-sm" onchange="runCalc()">
                        <option value="Foam Tape" selected>Foam Tape</option>
                        <option value="None">None</option>
                    </select>
                </div>
            </div>

        </div>

        <!-- RESULTS -->
        <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
            <div class="flex justify-between items-end mb-2">
                <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
                <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
            </div>
            <div class="border-t border-blue-200/50 my-3"></div>
            <div class="flex justify-between items-end pt-2">
                <div>
                    <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                    <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Minimum: $50</span>
                    <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
                </div>
                <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
            </div>
        </div>

        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-3 border rounded bg-white h-24 text-gray-600 font-mono outline-none shadow-inner leading-relaxed" readonly></textarea>
        </div>
    </div>

    <!-- COLOR SELECTION MODAL -->
    <div id="color-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity cursor-pointer" onclick="closeModal()">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[85vh] overflow-hidden border border-gray-200 cursor-auto" onclick="event.stopPropagation()">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center shrink-0">
                <h3 class="font-black text-gray-800 uppercase tracking-widest text-xs" id="modal-title">Select Color</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 font-bold transition focus:outline-none">✕</button>
            </div>
            <div class="p-3 shrink-0 border-b border-gray-100">
                <input type="text" id="color-search" placeholder="Search colors..." oninput="SignOS_UI.filterGrid('modal-grid', 'color-search')" class="w-full border border-gray-300 rounded p-2 text-xs font-bold outline-none focus:border-blue-500 shadow-inner">
            </div>
            <div id="modal-grid" class="p-4 overflow-y-auto color-scroll flex flex-wrap gap-2 content-start bg-gray-50 flex-1"></div>
        </div>
    </div>

    <script>
        let backendData = {};
        let coreColors = [], tactileColors = [], pictograms = [];
        let selectedCore = null, selectedTactile = null, selectedIcon = null;
        let activeModal = ''; 
        let is3D = false;

        function toggle3D() {
            is3D = !is3D;
            document.getElementById('preview-wrapper').classList.toggle('exploded-view', is3D);
        }

        // Handle Content Section Toggles
        function handleContentToggles() {
            const hasPicto = document.getElementById('toggle-picto').checked;
            const hasText = document.getElementById('toggle-text').checked;

            document.getElementById('wrap-picto').classList.toggle('hidden', !hasPicto);
            document.getElementById('wrap-text').classList.toggle('hidden', !hasText);
            
            // Hide tactile color box entirely if neither text nor picto is active
            document.getElementById('wrap-tactile-color').style.opacity = (hasPicto || hasText) ? '1' : '0.3';
            document.getElementById('wrap-tactile-color').style.pointerEvents = (hasPicto || hasText) ? 'auto' : 'none';

            runCalc();
        }

        function setThickness(val) {
            document.getElementById('core-thick').value = val;
            const is18 = val === '1/8';
            document.getElementById('btn-thick-18').className = `flex-1 py-2 text-xs font-bold rounded transition-all ${is18 ? 'bg-white shadow-sm border border-gray-200 text-blue-700' : 'text-gray-500 hover:text-gray-800 border border-transparent'}`;
            document.getElementById('btn-thick-116').className = `flex-1 py-2 text-xs font-bold rounded transition-all ${!is18 ? 'bg-white shadow-sm border border-gray-200 text-blue-700' : 'text-gray-500 hover:text-gray-800 border border-transparent'}`;
            
            const btnNone = document.getElementById('btn-back-none');
            if (!is18) {
                btnNone.classList.add('opacity-30', 'cursor-not-allowed');
                btnNone.disabled = true;
                if(document.getElementById('backer').value === 'None') setBacker('Black PVC');
            } else {
                btnNone.classList.remove('opacity-30', 'cursor-not-allowed');
                btnNone.disabled = false;
            }
            runCalc();
        }

        function setBacker(val) {
            if(document.getElementById('core-thick').value === '1/16' && val === 'None') return;
            document.getElementById('backer').value = val;
            
            const btns = ['none', 'blk', 'wht', 'clr'];
            const vals = ['None', 'Black PVC', 'White PVC', 'Clear Acrylic'];
            
            btns.forEach((b, i) => {
                const el = document.getElementById('btn-back-' + b);
                if(vals[i] === val) {
                    el.className = "flex-1 py-2 font-bold rounded bg-white shadow-sm border border-gray-200 text-blue-700 transition-all truncate";
                } else {
                    el.className = "flex-1 py-2 font-bold rounded text-gray-500 hover:text-gray-800 border border-transparent transition-all truncate";
                }
            });
            runCalc();
        }

        // --- 3D DYNAMIC ADA PREVIEW ---
        function updatePreview() {
            const w = parseFloat(document.getElementById('w').value) || 8;
            const h = parseFloat(document.getElementById('h').value) || 8;
            const r = parseFloat(document.getElementById('radius').value) || 0;
            const backerType = document.getElementById('backer').value;
            const align = document.getElementById('sign-align').value;
            const textVal = document.getElementById('sign-text').value.toUpperCase() || "";
            const container = document.getElementById('svg-preview-container');

            const hasPicto = document.getElementById('toggle-picto').checked;
            const hasText = document.getElementById('toggle-text').checked;
            const hasBraille = document.getElementById('toggle-braille').checked;

            // 1. ADA Math Guardrails (Dynamic based on toggles)
            let reqHeight = 0.375; // Top margin
            if (hasPicto) reqHeight += 6.0; // Icon field
            if (hasPicto && (hasText || hasBraille)) reqHeight += 0.375; // Gap below field
            let fontSize = 0;
            if (hasText) {
                fontSize = Math.max(0.625, Math.min(2, h * 0.08)); 
                reqHeight += fontSize; // Text height
            }
            if (hasText && hasBraille) reqHeight += 0.375; // Gap below text
            if (hasBraille) reqHeight += 0.25; // Braille height
            reqHeight += 0.375; // Bottom margin

            // If nothing is active, minimum is 1 inch
            if(!hasPicto && !hasText && !hasBraille) reqHeight = 1;

            let isInvalid = h < reqHeight;
            document.getElementById('ada-warn-box').classList.toggle('hidden', !isInvalid);
            if(isInvalid) {
                document.getElementById('ada-warn-text').innerText = `Selected elements require ~${reqHeight.toFixed(2)}" minimum height.`;
            }

            // 2. Physical Layout Calculations
            let currentY = 0.375;
            let pictoY = 0;
            let pictoSize = hasPicto ? Math.min(w * 0.6, 4.5) : 0; // Icon scale
            
            if (hasPicto) {
                // Center icon vertically within its 6" (or proportional) field
                let fieldH = (h - reqHeight) > 0 ? 6.0 + ((h - reqHeight)/2) : 6.0; 
                pictoY = currentY + (fieldH/2) - (pictoSize/2);
                currentY += fieldH;
                if (hasText || hasBraille) currentY += 0.375;
            }

            let textY = currentY + fontSize; // Y is the baseline for text
            if (hasText) {
                currentY += fontSize;
                if (hasBraille) currentY += 0.375;
            }

            let brailleY = currentY + 0.15; // Y is baseline for braille text element

            // Alignment Logic
            let textAnchor = "middle";
            let xPos = w / 2;
            if (align === 'left') {
                textAnchor = "start";
                xPos = 0.375; // Strict ADA min margin
            } else if (align === 'right') {
                textAnchor = "end";
                xPos = w - 0.375;
            }

            // Scale UI div to fit 280x280 area to allow for 3D rotation space
            const scale = Math.min(260 / w, 200 / h);
            const pxW = w * scale;
            const pxH = h * scale;
            const pxR = r * scale;

            container.style.width = `${pxW}px`;
            container.style.height = `${pxH}px`;
            
            const coreHex = selectedCore ? selectedCore.Hex_Code : '#000';
            const tactileHex = selectedTactile ? selectedTactile.Hex_Code : '#fff';
            let backerHex = '#111827';
            if (backerType === 'White PVC') backerHex = '#ffffff';
            if (backerType === 'Clear Acrylic') backerHex = 'rgba(255,255,255,0.4)';

            let html = '';

            // L1: Backer Plate (No tape layer)
            if (backerType !== 'None') {
                html += `<div class="sign-layer layer-backer border border-black/20" style="background-color: ${backerHex}; border-radius: ${pxR}px;"></div>`;
            }

            // L2: ADA Core Substrate
            html += `<div class="sign-layer layer-core shadow-sm border border-black/20" style="background-color: ${coreHex}; border-radius: ${pxR}px;"></div>`;

            // L3: Applique & Braille
            let svgContent = '';
            
            if (hasPicto && selectedIcon) {
                let pX = (w/2) - (pictoSize/2); // Icon always centered for now
                let viewB = selectedIcon.ViewBox || "0 0 100 100";
                svgContent += `<svg x="${pX}" y="${pictoY}" width="${pictoSize}" height="${pictoSize}" viewBox="${viewB}" fill="currentColor"><path d="${selectedIcon.SVG_Path}"/></svg>`;
            }

            if (hasText) {
                svgContent += `<text x="${xPos}" y="${textY}" font-family="sans-serif" font-size="${fontSize}" font-weight="900" text-anchor="${textAnchor}" letter-spacing="0.05">${textVal}</text>`;
            }

            if (hasBraille) {
                // Using a visual placeholder for Liblouis translation for now
                let brailleStr = "," + textVal.toLowerCase(); 
                svgContent += `<text x="${xPos}" y="${brailleY}" class="braille-bead" font-family="'Swell Braille', sans-serif" font-size="0.28" text-anchor="${textAnchor}" letter-spacing="0.08">${brailleStr}</text>`;
            }

            html += `
            <div class="sign-layer layer-tactile drop-shadow-sm" style="color: ${tactileHex};">
                <svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" fill="currentColor">
                    ${svgContent}
                </svg>
            </div>
            `;

            container.innerHTML = html;
        }

        // --- MODAL LOGIC ---
        function openModal(type) {
            activeModal = type;
            document.getElementById('modal-title').innerText = type === 'tactile' ? 'Select Tactile Applique' : 'Select Core Background';
            document.getElementById('color-search').value = '';
            document.getElementById('color-modal').classList.remove('hidden');

            const data = type === 'tactile' ? tactileColors : coreColors;
            const activeClass = type === 'tactile' ? 'ring-purple-600' : 'ring-blue-600';

            SignOS_UI.buildColorGrid({
                containerId: 'modal-grid',
                data: data,
                type: 'paint', 
                btnClass: 'w-10 h-10', 
                activeRingClass: activeClass,
                onSelect: (item) => {
                    if (activeModal === 'tactile') {
                        selectedTactile = item;
                        document.getElementById('swatch-tactile').style.backgroundColor = item.Hex_Code;
                        document.getElementById('label-tactile').innerText = item.Name;
                    } else {
                        selectedCore = item;
                        document.getElementById('swatch-core').style.backgroundColor = item.Hex_Code;
                        document.getElementById('label-core').innerText = item.Name;
                    }
                    closeModal();
                    runCalc();
                }
            });

            const activeItem = type === 'tactile' ? selectedTactile : selectedCore;
            if(activeItem) {
                setTimeout(() => {
                    const btn = document.querySelector(`#modal-grid button[data-code="${activeItem.Code}"]`);
                    if(btn) btn.classList.add('ring-2', 'ring-offset-1', activeClass);
                }, 50);
            }
        }

        function closeModal() { document.getElementById('color-modal').classList.add('hidden'); }

        function runCalc() {
            if(!backendData.Retail_Min_Order_Etch || !selectedCore || !selectedTactile) return;
            updatePreview();

            try {
                const inputs = {
                    qty: parseFloat(document.getElementById('qty').value) || 1,
                    w: parseFloat(document.getElementById('w').value) || 8,
                    h: parseFloat(document.getElementById('h').value) || 8,
                    structure: document.getElementById('core-thick').value,
                    hasTactile: document.getElementById('toggle-picto').checked || document.getElementById('toggle-text').checked,
                    hasBraille: document.getElementById('toggle-braille').checked,
                    backer: document.getElementById('backer').value,
                    mounting: document.getElementById('mounting').value,
                    bevel: document.getElementById('bevel').checked,
                    radius: document.getElementById('radius').value
                };

                const result = calculateADA(inputs, backendData);
                if (!result || !result.retail) return;

                const ret = result.retail;
                const fmt = (n) => "$" + (n || 0).toFixed(2);

                document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
                document.getElementById('ui-total').innerText = fmt(ret.grandTotal);

                const minOrder = inputs.backer !== 'None' ? parseFloat(backendData.Retail_Min_Order_CNC || 75.00) : parseFloat(backendData.Retail_Min_Order_Etch || 50.00);
                document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
                document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

                let desc = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" ADA Compliant Sign.\n`;
                desc += `Structure: ${inputs.structure === '1/8' ? '1/8" Core' : '1/16" Core + Backer'}.\n`;
                desc += `Core: [${selectedCore.Code}] ${selectedCore.Name}.\n`;
                if(inputs.hasTactile) desc += `Tactile 1/32": [${selectedTactile.Code}] ${selectedTactile.Name}.\n`;
                if(inputs.hasBraille) desc += `Includes Clear Raster Braille.\n`;
                if (inputs.backer !== 'None') desc += `Mounted to ${inputs.backer}.\n`;
                
                let finishes = [];
                if (inputs.bevel) finishes.push('Beveled Edges');
                if (parseFloat(inputs.radius) > 0) finishes.push(`${inputs.radius}" Radius Corners`);
                if (finishes.length > 0) desc += `Edge Finish: ${finishes.join(' | ')}.\n`;
                if (inputs.mounting !== 'None') desc += `Supplied with ${inputs.mounting}.`;
                
                document.getElementById('job-desc').value = desc;

            } catch(e) { console.error("Math Engine Error:", e); }
        }

        window.addEventListener('load', async () => {
            if (typeof injectHeader === 'function') injectHeader("ADA Compliant Signs");
            if (SignOS_UI && SignOS_UI.showLoader) SignOS_UI.showLoader('preview-wrapper', 'Connecting to Source Data...');

            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            try {
                // Fetch Rowmark Colors & Pictograms from DB
                const payload = await SignOS.fetchProductData('PROD_ADA_Signs', ['REF_Colors_Rowmark', 'REF_Pictograms']);
                backendData = payload.config;
                const rawRowmark = payload.tables['REF_Colors_Rowmark'] || [];
                pictograms = payload.tables['REF_Pictograms'] || [];

                coreColors = rawRowmark.filter(r => r.Series && (r.Series.includes('Ultra-Mattes') || r.Series.includes('Mattes'))).map(c => {
                    let hex = c.Cap_Hex;
                    if(hex === 'Transparent' || c.Cap_Color.includes('Clear')) hex = '#e5e7eb';
                    return { Code: c.Item_Code, Name: c.Cap_Color, Hex_Code: hex };
                });

                if (!coreColors.find(c => c.Name.includes('Clear'))) {
                    coreColors.push({ Code: '322-101', Name: 'Clear', Hex_Code: '#e5e7eb' });
                }

                tactileColors = rawRowmark.filter(r => r.Series && r.Series.includes('ADA Alternative')).map(c => {
                    return { Code: c.Item_Code, Name: c.Cap_Color, Hex_Code: c.Cap_Hex };
                });

                selectedCore = coreColors.find(c => c.Name.includes('Black')) || coreColors;
                selectedTactile = tactileColors.find(c => c.Name.includes('White')) || tactileColors;
                
                document.getElementById('swatch-core').style.backgroundColor = selectedCore.Hex_Code;
                document.getElementById('label-core').innerText = selectedCore.Name;
                document.getElementById('swatch-tactile').style.backgroundColor = selectedTactile.Hex_Code;
                document.getElementById('label-tactile').innerText = selectedTactile.Name;

                // Build Pictogram Grid
                if (SignOS_UI.buildIconGrid) {
                    SignOS_UI.buildIconGrid({
                        containerId: 'icon-grid',
                        data: pictograms.filter(p => String(p.Is_Active).toUpperCase() === 'TRUE'),
                        activeRingClass: 'ring-blue-500',
                        onSelect: (item) => {
                            selectedIcon = item;
                            document.getElementById('selected-icon-label').innerText = item.Name;
                            runCalc();
                        }
                    });
                }

                if(statusText) {
                    statusText.innerText = "ONLINE";
                    statusText.className = "font-bold text-green-500";
                    if(statusDot) {
                        statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                        statusDot.classList.remove("animate-pulse");
                    }
                }

                if (SignOS_UI && SignOS_UI.hideLoader) SignOS_UI.hideLoader('preview-wrapper');
                
                setThickness('1/16'); 
                setBacker('Black PVC');

                // Select first icon by default
                setTimeout(() => {
                    const firstIcon = document.querySelector('#icon-grid button');
                    if (firstIcon) firstIcon.click();
                }, 100);

            } catch(e) {
                console.error("API Error:", e);
                if (SignOS_UI && SignOS_UI.hideLoader) SignOS_UI.hideLoader('preview-wrapper', true, 'Connection Failed');
                if(statusText) {
                    statusText.innerText = "OFFLINE";
                    statusText.className = "font-bold text-red-500";
                }
            }
        });
    </script>
</body>
</html>
