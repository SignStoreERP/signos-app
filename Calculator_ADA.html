<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Signs v1.5 - Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="signos-ui.js"></script>
    <!-- SECURE LOGIC ENGINE SCRIPT LOADED HERE -->
    <script src="logic_ada.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .color-scroll::-webkit-scrollbar { width: 6px; }
        .color-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .color-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px;}
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

    <div id="main-card" class="max-w-md mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
        
        <!-- VISUAL PREVIEW (Light Blue Background) -->
        <div class="bg-blue-50 p-6 border-b border-blue-100 relative flex items-center justify-center min-h-[160px] overflow-hidden shadow-inner">
            <span class="absolute top-2 left-3 text-[8px] font-black text-blue-400 uppercase tracking-widest">Sign Proportion Preview</span>
            
            <div id="svg-preview-rect" class="shadow-xl flex flex-col items-center justify-center transition-all duration-300 relative border border-black/10" style="width: 100px; height: 100px; background-color: #575753;">
                
                <!-- Simple Braille/Tactile Representation -->
                <div id="svg-tactile-text" class="text-white font-black text-xs uppercase tracking-widest flex flex-col items-center mt-2">
                    <span class="text-[10px]">TACTILE</span>
                    <div class="flex gap-0.5 mt-1 opacity-70">
                        <div class="w-1 h-1 rounded-full bg-current"></div><div class="w-1 h-1 rounded-full bg-current"></div>
                        <div class="w-1 h-1 rounded-full bg-current"></div><div class="w-1 h-1 rounded-full bg-current"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- INPUTS -->
        <div class="p-6 space-y-4">
            
            <!-- CORE STRUCTURE TOGGLE -->
            <div class="bg-gray-50 border border-gray-200 p-2 rounded-lg space-y-2">
                <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1 px-1">Sign Structure</label>
                <div class="flex flex-col gap-2">
                    <label class="flex items-center gap-3 cursor-pointer bg-white p-2 border border-gray-200 rounded shadow-sm hover:border-blue-400 transition">
                        <input type="radio" name="struct" value="1/8" checked class="w-4 h-4 text-blue-600" onchange="handleRules()">
                        <span class="text-xs font-bold text-gray-700">(A) 1/8" Core with Tactile & Braille</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer bg-white p-2 border border-gray-200 rounded shadow-sm hover:border-blue-400 transition">
                        <input type="radio" name="struct" value="1/16" class="w-4 h-4 text-blue-600" onchange="handleRules()">
                        <span class="text-xs font-bold text-gray-700">(B) 1/16" Core + Backer + Tactile & Braille</span>
                    </label>
                </div>
            </div>

            <!-- DIMENSIONS -->
            <div class="grid grid-cols-3 gap-3 pt-2">
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-sm" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="8" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-sm" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="8" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-white focus:border-blue-500 outline-none shadow-sm" oninput="runCalc()"></div>
            </div>

            <!-- SHAPE / EDGES -->
            <div class="grid grid-cols-2 gap-4">
                <div class="flex items-center justify-between bg-white p-2 rounded border border-gray-200 shadow-sm h-[42px]">
                    <label class="text-[10px] font-bold text-gray-600 uppercase tracking-widest cursor-pointer" for="bevel">Beveled Edges</label>
                    <input type="checkbox" id="bevel" onchange="runCalc()" class="w-5 h-5 text-blue-600 rounded cursor-pointer">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Corner Radius (in)</label>
                    <select id="radius" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none shadow-sm" onchange="runCalc()"></select>
                </div>
            </div>

            <div class="border-t border-gray-100 my-2"></div>

            <!-- POPUP COLOR SELECTORS -->
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] font-bold text-purple-800 uppercase tracking-widest mb-1">Tactile Color</label>
                    <div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded shadow-sm cursor-pointer hover:border-purple-400 transition" onclick="openModal('tactile')">
                        <div class="flex items-center gap-3">
                            <div id="swatch-tactile" class="w-6 h-6 rounded-full border shadow-inner bg-gray-200"></div>
                            <span id="label-tactile" class="text-xs font-bold text-gray-700">Loading...</span>
                        </div>
                        <span class="text-[10px] font-bold text-purple-500 uppercase bg-purple-50 px-2 py-1 rounded">Change</span>
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-blue-800 uppercase tracking-widest mb-1">ADA Core Color</label>
                    <div class="flex justify-between items-center bg-white p-2 border border-gray-200 rounded shadow-sm cursor-pointer hover:border-blue-400 transition" onclick="openModal('core')">
                        <div class="flex items-center gap-3">
                            <div id="swatch-core" class="w-6 h-6 rounded-full border shadow-inner bg-gray-200"></div>
                            <span id="label-core" class="text-xs font-bold text-gray-700">Loading...</span>
                        </div>
                        <span class="text-[10px] font-bold text-blue-500 uppercase bg-blue-50 px-2 py-1 rounded">Change</span>
                    </div>
                </div>
            </div>

            <!-- MOUNTING & BACKERS -->
            <div class="grid grid-cols-2 gap-4 border-t border-gray-100 pt-4 mt-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Backer Option</label>
                    <select id="backer" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none shadow-sm disabled:bg-gray-100 disabled:text-gray-400" onchange="runCalc()">
                        <option value="None">None</option>
                        <option value="Clear Acrylic">Clear Acrylic</option>
                        <option value="White PVC">White PVC</option>
                        <option value="Black PVC">Black PVC</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Mounting</label>
                    <select id="mounting" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none shadow-sm" onchange="runCalc()">
                        <option value="Foam Tape" selected>Foam Tape</option>
                        <option value="None">None</option>
                    </select>
                </div>
            </div>

        </div>

        <!-- RESULTS -->
        <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
            <div class="flex justify-between items-end mb-2">
                <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
                <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
            </div>
            
            <div class="border-t border-blue-200/50 my-3"></div>

            <div class="flex justify-between items-end pt-2">
                <div>
                    <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                    <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Minimum: $50</span>
                    <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
                </div>
                <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
            </div>
        </div>

        <!-- DESCRIPTION GENERATOR -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-3 border rounded bg-white h-24 text-gray-600 font-mono outline-none shadow-inner leading-relaxed" readonly></textarea>
        </div>
    </div>

    <!-- COLOR SELECTION MODAL -->
    <div id="color-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[85vh] overflow-hidden border border-gray-200">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center shrink-0">
                <h3 class="font-black text-gray-800 uppercase tracking-widest text-xs" id="modal-title">Select Color</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 font-bold transition">✕</button>
            </div>
            <div class="p-3 shrink-0 border-b border-gray-100">
                <input type="text" id="color-search" placeholder="Search colors..." oninput="SignOS_UI.filterGrid('modal-grid', 'color-search')" class="w-full border border-gray-300 rounded p-2 text-xs font-bold outline-none focus:border-blue-500 shadow-inner">
            </div>
            <div id="modal-grid" class="p-4 overflow-y-auto color-scroll flex flex-wrap gap-2 content-start bg-gray-50 flex-1"></div>
        </div>
    </div>

    <script>
        let backendData = {};
        let coreColors = [], tactileColors = [];
        let selectedCore = null;
        let selectedTactile = null;
        let activeModal = ''; // 'core' or 'tactile'

        // Generate Radius Options
        let radHtml = '';
        for(let i=0; i<=3; i+=0.125) radHtml += `<option value="${i}">${i === 0 ? '0" (Square)' : i + '"'}</option>`;
        document.getElementById('radius').innerHTML = radHtml;

        function handleRules() {
            const struct = document.querySelector('input[name="struct"]:checked').value;
            const backer = document.getElementById('backer');
            
            if (struct === '1/8') {
                backer.value = 'None'; 
                backer.options.disabled = true;
            } else {
                backer.options.disabled = false;
                if(backer.value === 'None') backer.value = 'Black PVC'; // Smart default for 1/16
            }
            runCalc();
        }

        function updatePreview() {
            const w = parseFloat(document.getElementById('w').value) || 8;
            const h = parseFloat(document.getElementById('h').value) || 8;
            const r = parseFloat(document.getElementById('radius').value) || 0;
            const rect = document.getElementById('svg-preview-rect');
            const tText = document.getElementById('svg-tactile-text');

            // Scale to fit max 280x140 area
            const scale = Math.min(280 / w, 140 / h);
            rect.style.width = `${w * scale}px`;
            rect.style.height = `${h * scale}px`;
            
            // Visual Radius (scaled)
            rect.style.borderRadius = `${r * scale}px`;

            if(selectedCore) rect.style.backgroundColor = selectedCore.Cap_Hex;
            if(selectedTactile) tText.style.color = selectedTactile.Cap_Hex;
        }

        // --- MODAL LOGIC ---
        function openModal(type) {
            activeModal = type;
            document.getElementById('modal-title').innerText = type === 'tactile' ? 'Select Tactile Applique' : 'Select Core Background';
            document.getElementById('color-search').value = '';
            document.getElementById('color-modal').classList.remove('hidden');

            const data = type === 'tactile' ? tactileColors : coreColors;
            const activeClass = type === 'tactile' ? 'ring-purple-600' : 'ring-blue-600';

            SignOS_UI.buildColorGrid({
                containerId: 'modal-grid',
                data: data,
                type: 'rowmark',
                btnClass: 'w-10 h-10', // Make buttons slightly bigger for the modal
                activeRingClass: activeClass,
                onSelect: (item) => {
                    if (activeModal === 'tactile') {
                        selectedTactile = item;
                        document.getElementById('swatch-tactile').style.backgroundColor = item.Cap_Hex;
                        document.getElementById('label-tactile').innerText = item.Cap_Color;
                    } else {
                        selectedCore = item;
                        document.getElementById('swatch-core').style.backgroundColor = item.Cap_Hex;
                        document.getElementById('label-core').innerText = item.Cap_Color;
                    }
                    closeModal();
                    runCalc();
                }
            });

            // Highlight currently selected if reopening
            const activeItem = type === 'tactile' ? selectedTactile : selectedCore;
            if(activeItem) {
                setTimeout(() => {
                    const btn = document.querySelector(`#modal-grid button[data-code="${activeItem.Item_Code}"]`);
                    if(btn) btn.classList.add('ring-2', 'ring-offset-1', activeClass);
                }, 50);
            }
        }

        function closeModal() {
            document.getElementById('color-modal').classList.add('hidden');
        }

        function runCalc() {
            if(!backendData.Retail_Min_Order_Etch || !selectedCore || !selectedTactile) return;

            updatePreview();

            try {
                const inputs = {
                    qty: parseFloat(document.getElementById('qty').value) || 1,
                    w: parseFloat(document.getElementById('w').value) || 8,
                    h: parseFloat(document.getElementById('h').value) || 8,
                    structure: document.querySelector('input[name="struct"]:checked').value,
                    hasTactile: true, 
                    hasBraille: true,
                    backer: document.getElementById('backer').value,
                    mounting: document.getElementById('mounting').value,
                    bevel: document.getElementById('bevel').checked,
                    radius: document.getElementById('radius').value
                };

                const result = calculateADA(inputs, backendData);
                if (!result || !result.retail) return;

                const ret = result.retail;
                const fmt = (n) => "$" + (n || 0).toFixed(2);

                document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
                document.getElementById('ui-total').innerText = fmt(ret.grandTotal);

                const minOrder = inputs.backer !== 'None' ? parseFloat(backendData.Retail_Min_Order_CNC || 75.00) : parseFloat(backendData.Retail_Min_Order_Etch || 50.00);
                document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
                document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

                // Build Description
                let desc = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" ADA Compliant Sign.\n`;
                desc += `Structure: ${inputs.structure === '1/8' ? '1/8" Core' : '1/16" Core + Backer'}.\n`;
                desc += `Core: [${selectedCore.Cap_Color}].\n`;
                desc += `Tactile & Braille: 1/32" [${selectedTactile.Cap_Color}].\n`;
                if (inputs.backer !== 'None') desc += `Mounted to ${inputs.backer}.\n`;
                
                let finishes = [];
                if (inputs.bevel) finishes.push('Beveled Edges');
                if (parseFloat(inputs.radius) > 0) finishes.push(`${inputs.radius}" Radius Corners`);
                if (finishes.length > 0) desc += `Edge Finish: ${finishes.join(' | ')}.\n`;
                
                if (inputs.mounting !== 'None') desc += `Supplied with ${inputs.mounting}.`;
                
                document.getElementById('job-desc').value = desc;

            } catch(e) { console.error("Math Engine Error:", e); }
        }

        // INIT FETCH
        window.addEventListener('load', async () => {
            if (typeof injectHeader === 'function') injectHeader("ADA Compliant Signs");

            try {
                const payload = await SignOS.fetchProductData('PROD_ADA_Signs', ['REF_Colors_Rowmark']);
                backendData = payload.config;
                const rowmarkData = payload.tables['REF_Colors_Rowmark'] || [];

                // Filter Core Colors & Strip Core_Hex to force Solid Swatches
                coreColors = rowmarkData.filter(r => r.Series && r.Series.includes('Ultra-Mattes')).map(c => ({...c, Core_Hex: null}));
                // Filter Tactile Colors
                tactileColors = rowmarkData.filter(r => r.Series && r.Series.includes('ADA Alternative'));

                // Set defaults invisibly
                selectedCore = coreColors.find(c => c.Cap_Color.includes('Blue')) || coreColors;
                selectedTactile = tactileColors.find(c => c.Cap_Color.includes('White')) || tactileColors;
                
                document.getElementById('swatch-core').style.backgroundColor = selectedCore.Cap_Hex;
                document.getElementById('label-core').innerText = selectedCore.Cap_Color;
                document.getElementById('swatch-tactile').style.backgroundColor = selectedTactile.Cap_Hex;
                document.getElementById('label-tactile').innerText = selectedTactile.Cap_Color;

                handleRules(); // Inits toggles and fires runCalc

            } catch(e) {
                console.error("API Error:", e);
            }
        });
    </script>
</body>
</html>
