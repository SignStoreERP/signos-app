<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA & Multi-Layer Signs v1.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <script src="signos-ui.js"></script>
    <script src="cost_ada.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .color-scroll::-webkit-scrollbar { width: 6px; }
        .color-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px;}
        .color-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px;}
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col pb-10">

    <div id="main-card" class="max-w-xl mx-auto mt-6 w-[calc(100%-2rem)] sm:w-full bg-white shadow-lg overflow-hidden rounded-xl border border-gray-200">
        
        <!-- VISUAL DIAGRAM (Based on ADA Guidelines Pg 7 & 20) -->
        <div class="bg-gray-900 p-4 border-b border-gray-800 relative select-none">
            <span class="absolute top-2 left-3 text-[8px] font-black text-gray-500 uppercase tracking-widest">Compliance & Layer Preview</span>
            
            <div class="w-full h-40 mt-3 relative flex items-center justify-center">
                <svg viewBox="0 0 400 150" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                    <!-- FRONT VIEW -->
                    <g transform="translate(10, 10)">
                        <!-- Core Sign Base -->
                        <rect id="svg-core-front" x="0" y="0" width="180" height="130" rx="4" fill="#575753" stroke="#000" stroke-width="1"/>
                        
                        <!-- Tactile Elements -->
                        <g id="svg-tactile-group" fill="#FFFFFF">
                            <!-- Pictogram Area (Pg 20) -->
                            <circle cx="90" cy="40" r="12" />
                            <path d="M80,55 h20 v30 h-6 v25 h-8 v-25 h-6 z" />
                            <!-- Tactile Text (Pg 7) -->
                            <text x="90" y="105" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="inherit">RESTROOM</text>
                            <!-- Braille Dots -->
                            <circle cx="50" cy="120" r="1.5" /><circle cx="55" cy="120" r="1.5" />
                            <circle cx="50" cy="124" r="1.5" /><circle cx="55" cy="124" r="1.5" />
                            <circle cx="65" cy="120" r="1.5" /><circle cx="70" cy="124" r="1.5" />
                            <circle cx="80" cy="120" r="1.5" /><circle cx="85" cy="124" r="1.5" />
                            <circle cx="95" cy="124" r="1.5" /><circle cx="100" cy="124" r="1.5" />
                        </g>

                        <!-- Guideline Callouts -->
                        <path d="M185,105 l10,0 m-5,-50 v50 m-5,0 l10,0" stroke="#ef4444" stroke-width="1" fill="none"/>
                        <text x="200" y="85" font-size="8" fill="#ef4444" font-weight="bold">5/8" Min</text>
                        
                        <path d="M0,135 v10 m0,-5 h180 m0,-5 v10" stroke="#3b82f6" stroke-width="1" fill="none"/>
                        <text x="90" y="143" font-size="8" fill="#3b82f6" font-weight="bold" text-anchor="middle">Non-Glare / High Contrast</text>
                    </g>

                    <!-- SIDE PROFILE CROSS-SECTION -->
                    <g transform="translate(260, 20)">
                        <text x="30" y="-5" font-size="8" fill="#9ca3af" font-weight="bold" text-anchor="middle" letter-spacing="1">PROFILE VIEW</text>
                        
                        <!-- Tape Layer -->
                        <rect x="0" y="10" width="8" height="110" fill="#374151" />
                        <text x="70" y="20" font-size="8" fill="#9ca3af">Foam Tape</text>
                        <path d="M10,18 l15,0" stroke="#4b5563" stroke-width="1"/>

                        <!-- Rigid Backer (Toggled by JS) -->
                        <g id="svg-backer-group" class="hidden">
                            <rect id="svg-backer-color" x="10" y="5" width="10" height="120" fill="#ffffff" stroke="#111827" stroke-width="0.5"/>
                            <text x="70" y="35" font-size="8" fill="#9ca3af">Rigid Backer</text>
                            <path d="M22,33 l15,0" stroke="#4b5563" stroke-width="1"/>
                        </g>

                        <!-- ADA Core Layer -->
                        <rect id="svg-core-side" x="22" y="10" width="6" height="110" fill="#575753" />
                        <text x="70" y="55" font-size="8" fill="#9ca3af">ADA Core</text>
                        <path d="M30,53 l15,0" stroke="#4b5563" stroke-width="1"/>

                        <!-- Tactile Applique Layer -->
                        <rect id="svg-tactile-side" x="30" y="30" width="4" height="20" fill="#FFFFFF" />
                        <rect id="svg-tactile-side2" x="30" y="80" width="4" height="20" fill="#FFFFFF" />
                        <text x="70" y="75" font-size="8" fill="#ef4444" font-weight="bold">1/32" Depth</text>
                        <path d="M36,73 l15,0" stroke="#ef4444" stroke-width="1"/>
                        
                        <!-- Braille Raster Dome -->
                        <path d="M28,105 a2,2 0 0,1 4,0" fill="#FFFFFF" id="svg-braille-dome" />
                    </g>
                </svg>
            </div>
        </div>

        <div class="p-6 space-y-4">
            
            <!-- 1. TACTILE LAYER (TOP DOWN) -->
            <div class="space-y-2">
                <div class="flex justify-between items-end">
                    <label class="block text-[10px] font-bold text-purple-800 uppercase tracking-widest">1/32" Tactile Applique</label>
                    <span id="selected-tactile-label" class="text-[9px] font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded border border-purple-100">Loading...</span>
                </div>
                <div id="tactile-grid" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto color-scroll p-2 border rounded-lg bg-white shadow-inner"></div>
                
                <div class="flex items-center justify-between bg-purple-50 p-2 rounded border border-purple-100">
                    <label class="text-[10px] font-bold text-purple-800 uppercase tracking-widest cursor-pointer" for="hasBraille">Include Grade 2 Braille</label>
                    <input type="checkbox" id="hasBraille" checked onchange="runCalc()" class="w-5 h-5 text-purple-600 rounded cursor-pointer">
                </div>
            </div>

            <div class="border-t border-gray-200 my-2"></div>

            <!-- 2. CORE LAYER -->
            <div class="space-y-2">
                <div class="flex justify-between items-end">
                    <label class="block text-[10px] font-bold text-blue-800 uppercase tracking-widest">ADA Core Background</label>
                    <span id="selected-core-label" class="text-[9px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-100">Loading...</span>
                </div>
                
                <select id="core-thick" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none" onchange="handleCoreRules()">
                    <option value="1/8">1/8" Thick Core</option>
                    <option value="1/16 Color">1/16" Thick Core (Requires Backer)</option>
                    <option value="1/16 Clear">1/16" Clear Lens (Requires Backer)</option>
                </select>

                <div id="core-color-wrap" class="pt-1">
                    <input type="text" id="core-search" placeholder="Search Core Colors..." oninput="SignOS_UI.filterGrid('core-grid', 'core-search')" class="w-full bg-white border border-gray-300 rounded p-1.5 text-xs font-bold text-gray-800 outline-none focus:border-blue-800 shadow-sm mb-2">
                    <div id="core-grid" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto color-scroll p-2 border rounded-lg bg-white shadow-inner"></div>
                </div>
            </div>

            <div class="border-t border-gray-200 my-2"></div>

            <!-- 3. RIGID BACKER LAYER -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Optional Rigid Backer</label>
                    <select id="backer" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none disabled:bg-gray-100 disabled:text-gray-400" onchange="handleCoreRules()">
                        <option value="None">None (Standard)</option>
                        <option value="PVC">3mm PVC Backer</option>
                        <option value="Acrylic">3/16" Acrylic Backer</option>
                    </select>
                </div>
                <div id="pvc-color-wrap" class="hidden">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">PVC Color</label>
                    <select id="pvc-color" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none" onchange="runCalc()">
                        <option value="Black">Black</option>
                        <option value="White">White</option>
                    </select>
                </div>
            </div>
            
            <div id="backer-warn" class="hidden text-[9px] font-bold text-orange-600 bg-orange-50 p-1.5 border border-orange-200 rounded text-center">
                1/16" Core requires a rigid backer.
            </div>

            <!-- 4. MOUNTING & FINISHING -->
            <div class="grid grid-cols-2 gap-4 pt-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Mounting</label>
                    <select id="mounting" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none" onchange="runCalc()">
                        <option value="Foam Tape" selected>Foam Tape</option>
                        <option value="None">None</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Edge Bevels</label>
                    <select id="bevel" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px] focus:border-blue-500 outline-none" onchange="runCalc()">
                        <option value="Yes" selected>Beveled Edges</option>
                        <option value="No">Straight Cut</option>
                    </select>
                </div>
            </div>

            <!-- DIMENSIONS -->
            <div class="grid grid-cols-3 gap-3 border-t border-gray-100 pt-4 mt-2">
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="1" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width (in)</label><input type="number" id="w" value="8" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none" oninput="runCalc()"></div>
                <div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height (in)</label><input type="number" id="h" value="8" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center bg-gray-50 focus:border-blue-500 outline-none" oninput="runCalc()"></div>
            </div>

        </div>

        <!-- RESULTS -->
        <div class="bg-blue-50 p-6 border-t border-blue-100 shadow-inner">
            <div class="flex justify-between items-end mb-2">
                <span class="text-[10px] font-black text-blue-800 uppercase tracking-widest">Unit Price</span>
                <span id="ui-unit" class="text-2xl font-black text-blue-900 tracking-tight">$0.00</span>
            </div>
            
            <div class="border-t border-blue-200/50 my-3"></div>

            <div class="flex justify-between items-end pt-2">
                <div>
                    <span class="text-xs font-bold text-blue-800 uppercase block">Total Quote</span>
                    <span class="text-[9px] font-bold text-blue-600 uppercase block mt-1" id="ui-min-text">Shop Minimum: $50</span>
                    <div id="min-badge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
                </div>
                <span class="text-3xl font-black text-blue-700" id="ui-total">---</span>
            </div>
        </div>

        <!-- DESCRIPTION GENERATOR -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-3 border rounded bg-white h-24 text-gray-600 font-mono outline-none shadow-inner leading-relaxed" readonly></textarea>
        </div>
    </div>

    <script>
        let backendData = {};
        let selectedCore = null;
        let selectedTactile = null;

        function handleCoreRules() {
            const thick = document.getElementById('core-thick').value;
            const backer = document.getElementById('backer');
            const pvcColorWrap = document.getElementById('pvc-color-wrap');
            const coreWrap = document.getElementById('core-color-wrap');
            
            // 1. Enforce Backers for 1/16
            if (thick.includes('1/16')) {
                if (backer.value === 'None') backer.value = 'PVC'; 
                backer.options.disabled = true;
                document.getElementById('backer-warn').classList.remove('hidden');
            } else {
                backer.options.disabled = false;
                document.getElementById('backer-warn').classList.add('hidden');
            }

            // 2. Hide/Show PVC Color option
            if (backer.value === 'PVC') {
                pvcColorWrap.classList.remove('hidden');
            } else {
                pvcColorWrap.classList.add('hidden');
            }

            // 3. Hide Core Colors if Clear Lens is chosen
            if (thick === '1/16 Clear') {
                coreWrap.classList.add('hidden');
                selectedCore = { Cap_Color: 'Clear Lens', Cap_Hex: '#e5e7eb' };
            } else {
                coreWrap.classList.remove('hidden');
                if(selectedCore && selectedCore.Cap_Color === 'Clear Lens') {
                    const firstBtn = document.querySelector('#core-grid button');
                    if(firstBtn) firstBtn.click();
                }
            }
            
            runCalc();
        }

        function updateSVGDiagram(backerVal, pvcColor) {
            if (selectedCore && selectedCore.Cap_Hex) {
                document.getElementById('svg-core-front').setAttribute('fill', selectedCore.Cap_Hex);
                document.getElementById('svg-core-side').setAttribute('fill', selectedCore.Cap_Hex);
            }
            if (selectedTactile && selectedTactile.Cap_Hex) {
                document.getElementById('svg-tactile-group').setAttribute('fill', selectedTactile.Cap_Hex);
                document.getElementById('svg-tactile-side').setAttribute('fill', selectedTactile.Cap_Hex);
                document.getElementById('svg-tactile-side2').setAttribute('fill', selectedTactile.Cap_Hex);
                document.getElementById('svg-braille-dome').setAttribute('fill', selectedTactile.Cap_Hex);
            }

            const backerGrp = document.getElementById('svg-backer-group');
            if (backerVal !== 'None') {
                backerGrp.classList.remove('hidden');
                const bColor = backerVal === 'PVC' && pvcColor === 'Black' ? '#111827' : '#ffffff';
                document.getElementById('svg-backer-color').setAttribute('fill', bColor);
            } else {
                backerGrp.classList.add('hidden');
            }
        }

        function runCalc() {
            if(!backendData.Retail_Min_Order_Etch || (!selectedCore && document.getElementById('core-thick').value !== '1/16 Clear') || !selectedTactile) return;

            try {
                const inputs = {
                    qty: parseFloat(document.getElementById('qty').value) || 1,
                    w: parseFloat(document.getElementById('w').value) || 8,
                    h: parseFloat(document.getElementById('h').value) || 8,
                    coreThick: document.getElementById('core-thick').value,
                    hasTactile: true, // Hardcoded to true for this tool per requirements
                    hasBraille: document.getElementById('hasBraille').checked,
                    brailleLines: document.getElementById('hasBraille').checked ? 1 : 0,
                    backer: document.getElementById('backer').value,
                    pvcColor: document.getElementById('pvc-color').value,
                    mounting: document.getElementById('mounting').value,
                    bevel: document.getElementById('bevel').value
                };

                // Update Visual Diagram
                updateSVGDiagram(inputs.backer, inputs.pvcColor);

                const result = calculateADA(inputs, backendData);
                if (!result || !result.retail) return;

                const ret = result.retail;
                const fmt = (n) => "$" + (n || 0).toFixed(2);

                document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
                document.getElementById('ui-total').innerText = fmt(ret.grandTotal);

                // Dynamic Minimum Badge
                const minOrder = inputs.backer !== 'None' 
                    ? parseFloat(backendData.Retail_Min_Order_CNC || 75.00) 
                    : parseFloat(backendData.Retail_Min_Order_Etch || 50.00);

                document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
                document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

                // Build Description
                let desc = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" ADA Sign.\n`;
                desc += `Core: ${inputs.coreThick} [${selectedCore.Cap_Color}].\n`;
                desc += `Tactile: 1/32" ADA Alternative [${selectedTactile.Cap_Color}].\n`;
                if (inputs.hasBraille) desc += `Includes Grade 2 Braille.\n`;
                if (inputs.backer === 'PVC') desc += `Mounted to 3mm PVC Backer (${inputs.pvcColor}).\n`;
                else if (inputs.backer === 'Acrylic') desc += `Mounted to 3/16" Acrylic Backer.\n`;
                if (inputs.bevel === 'Yes') desc += `Beveled Edges.\n`;
                if (inputs.mounting !== 'None') desc += `Supplied with ${inputs.mounting} for installation.`;
                
                document.getElementById('job-desc').value = desc;

            } catch(e) {
                console.error("Math Engine Error:", e);
            }
        }

        // INIT FETCH
        window.addEventListener('load', async () => {
            if (typeof injectHeader === 'function') injectHeader("ADA Compliant Signs");

            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            try {
                const payload = await SignOS.fetchProductData('PROD_ADA_Signs', ['REF_Colors_Rowmark']);
                backendData = payload.config;
                const rowmarkData = payload.tables['REF_Colors_Rowmark'] || [];

                // Filter Core Colors (Ultra-Mattes) & NULL the Core_Hex so they render as Solid Swatches!
                const coreColors = rowmarkData.filter(r => r.Series && r.Series.includes('Ultra-Mattes')).map(c => ({...c, Core_Hex: null}));
                SignOS_UI.buildColorGrid({
                    containerId: 'core-grid',
                    data: coreColors,
                    type: 'rowmark',
                    activeRingClass: 'ring-blue-600',
                    onSelect: (item) => {
                        selectedCore = item;
                        document.getElementById('selected-core-label').innerText = item.Cap_Color;
                        runCalc();
                    }
                });

                // Filter Tactile Colors (ADA Alternative)
                const tactileColors = rowmarkData.filter(r => r.Series && r.Series.includes('ADA Alternative'));
                SignOS_UI.buildColorGrid({
                    containerId: 'tactile-grid',
                    data: tactileColors,
                    type: 'rowmark',
                    activeRingClass: 'ring-purple-600',
                    onSelect: (item) => {
                        selectedTactile = item;
                        document.getElementById('selected-tactile-label').innerText = item.Cap_Color;
                        runCalc();
                    }
                });

                // Set Status to Online
                if(statusText) {
                    statusText.innerText = "ONLINE";
                    statusText.className = "font-bold text-green-500";
                    if(statusDot) {
                        statusDot.className = "w-2 h-2 rounded-full bg-green-500";
                        statusDot.classList.remove("animate-pulse");
                    }
                }

                // Trigger defaults
                setTimeout(() => {
                    const cBtn = document.querySelector('#core-grid button');
                    const tBtn = document.querySelector('#tactile-grid button[data-code="311-2048"]') || document.querySelector('#tactile-grid button'); 
                    if (cBtn) cBtn.click();
                    if (tBtn) tBtn.click();
                    handleCoreRules(); // Initialize thickness rules
                }, 100);

            } catch(e) {
                console.error("API Error:", e);
                if(statusText) {
                    statusText.innerText = "OFFLINE";
                    statusText.className = "font-bold text-red-500";
                }
            }
        });
    </script>
</body>
</html>
