<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACM Calculator v4.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; background: #eff6ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .toggle-checkbox:checked { right: 0; border-color: #68D391; }
        .toggle-checkbox:checked + .toggle-label { background-color: #68D391; }
        .side-btn.selected { background-color: #2563eb; color: white; border-color: #2563eb; }
        .mode-sales #btn-cost, .mode-sales #btn-vend { display: none !important; }
        .mode-prod #btn-retail, .mode-prod #btn-vend { display: none !important; }
        .mode-prod .prod-hidden { display: none !important; }
        .warn-pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { background-color: #FECACA; } 50% { background-color: #F87171; } 100% { background-color: #FECACA; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-md mx-auto w-full bg-white shadow-2xl overflow-hidden min-h-screen sm:min-h-0 sm:my-10 sm:rounded-xl border border-gray-200">
        
        <!-- HEADER -->
        <div class="bg-gray-800 text-white px-4 py-2 flex justify-between items-center text-xs border-b border-gray-700">
            <div class="flex gap-3">
                <span class="tracking-wide">USER: <span class="font-bold text-gray-200 uppercase" id="auth-user">---</span></span>
                <span class="tracking-wide">ROLE: <span class="font-bold text-blue-400 uppercase" id="auth-role">---</span></span>
            </div>
            <button onclick="logout()" class="font-bold text-red-400 hover:text-white uppercase tracking-wider text-[10px] border border-red-900/50 hover:bg-red-900/50 px-2 py-1 rounded transition">Logout</button>
        </div>

        <div class="bg-gray-900 px-6 py-4 text-white flex justify-between items-center">
            <a href="#" onclick="goBack()" class="text-gray-400 hover:text-white text-xs font-bold uppercase flex items-center gap-1">MENU</a>
            <div class="text-center">
                <h2 class="text-lg font-bold" id="product-label">ACM Signs</h2>
                <div class="flex items-center justify-center gap-2 text-[10px]">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="status-text" class="text-gray-400">CONNECTING...</span>
                </div>
            </div>
            <button onclick="location.reload()" class="text-gray-400 hover:text-white">↺</button>
        </div>

        <div id="size-warn" class="hidden bg-orange-500 text-white text-center py-2 px-4 text-xs font-bold uppercase">⚠️ Exceeds 60" x 120"</div>
        <div id="profit-warn" class="hidden bg-red-600 text-white text-center py-3 px-4 text-sm font-bold uppercase border-b-4 border-red-800">🛑 LOSS ALERT</div>

        <!-- INPUTS -->
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Width</label><input type="number" id="width" value="24" class="w-full border p-2 rounded font-bold text-gray-800" oninput="calculate()"></div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Height</label><input type="number" id="height" value="18" class="w-full border p-2 rounded font-bold text-gray-800" oninput="calculate()"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Qty</label><input type="number" id="qty" value="1" class="w-full border p-2 rounded font-bold text-gray-800" oninput="calculate()"></div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase">Sides</label>
                    <div class="grid grid-cols-2 gap-1 h-[42px]">
                        <button type="button" id="btn-side-1" class="side-btn selected border rounded text-xs font-bold" onclick="setSides(1)">1</button>
                        <button type="button" id="btn-side-2" class="side-btn border rounded text-xs font-bold" onclick="setSides(2)">2</button>
                    </div>
                    <input type="hidden" id="sides" value="1">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Material</label>
                <select id="material" class="w-full border p-2 rounded font-bold text-sm" onchange="calculate()">
                    <option value="3mm">3mm ACM (Standard)</option>
                    <option value="6mm">6mm ACM (Heavy Duty)</option>
                </select>
            </div>
            <!-- NEW: LAMINATE TOGGLE -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Laminate Finish</label>
                <select id="lam-finish" class="w-full border p-2 rounded font-bold text-sm" onchange="calculate()">
                    <option value="Gloss">Gloss (Standard)</option>
                    <option value="Matte">Matte (Anti-Glare)</option>
                </select>
            </div>
            
            <div class="border-t border-gray-100 my-2"></div>
            
            <!-- Shape -->
            <div class="flex items-center justify-between p-2 bg-gray-50 border border-gray-200 rounded">
                <span class="text-xs font-bold text-gray-700">Shape</span>
                <select id="cut-type" class="bg-white border text-xs p-1 rounded" onchange="calculate()">
                    <option value="Square">Square/Rect</option>
                    <option value="Contour">Contour (+35%)</option>
                </select>
            </div>
        </div>

        <!-- METRICS -->
        <div class="border-t border-gray-200">
            <div class="flex">
                <button onclick="switchTab('retail')" class="flex-1 py-3 text-xs font-bold text-gray-500 hover:bg-gray-50 tab-btn active" id="btn-retail">RETAIL</button>
                <button onclick="switchTab('cost')" class="flex-1 py-3 text-xs font-bold text-gray-500 hover:bg-gray-50 tab-btn" id="btn-cost">IN-HOUSE</button>
                <button onclick="switchTab('vend')" class="flex-1 py-3 text-xs font-bold text-gray-500 hover:bg-gray-50 tab-btn" id="btn-vend">VENDED</button>
            </div>
            
            <div id="tab-retail" class="tab-content active bg-white p-6">
                <div class="flex justify-between items-center mb-4"><span class="text-xs font-bold text-gray-400 uppercase">Unit Price</span><span class="text-2xl font-bold text-gray-900" id="unit-price">$0.00</span></div>
                <div class="flex justify-between items-end border-t pt-4"><div><span class="text-xs font-bold text-gray-400 uppercase">Total</span></div><span class="text-3xl font-black text-blue-600" id="total-price">---</span></div>
            </div>
            
            <div id="tab-cost" class="tab-content bg-yellow-50 p-6">
                <div class="flex justify-between text-yellow-900 font-bold text-sm"><span>Total Cost:</span> <span id="cost-total">$0.00</span></div>
                <div class="mt-2 text-xs text-gray-500 flex justify-between"><span>Sheet Used:</span> <span id="sheet-used" class="font-bold text-gray-800">4x8</span></div>
            </div>
            
            <div id="tab-vend" class="tab-content bg-indigo-50 p-6">
                <div class="flex justify-between text-indigo-900 font-bold text-sm"><span>Vended:</span> <span id="vend-total">$0.00</span></div>
            </div>
        </div>

        <!-- DESCRIPTION -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
            <textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-20 text-gray-600 font-mono outline-none" readonly></textarea>
        </div>
        
        <div id="error-msg" class="hidden text-[10px] text-red-500 p-4 text-center bg-red-50"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypbRuIJmkXqC447Yd1akhlhDrEyRoq0ypfZNHf0dI77KrZWUUeOqvUm5122O2RdzyYEQ/exec";
        const TAB_NAME = "PROD_ACM_Signs";
        let backend = {};
        let currentUser = { name: "Guest", role: "VIEW", mode: "sales" };

        function initSession() {
            const params = new URLSearchParams(window.location.search);
            const urlMode = params.get('mode');
            const storeUser = sessionStorage.getItem('signos_user');
            const storeRole = sessionStorage.getItem('signos_role');
            if(storeUser) currentUser.name = storeUser;
            if(storeRole) currentUser.role = storeRole;
            if(urlMode) currentUser.mode = urlMode;
            else if(currentUser.role === 'ADMIN') currentUser.mode = 'admin';
            else if(currentUser.role === 'PROD') currentUser.mode = 'production';
            else currentUser.mode = 'sales';
            document.getElementById('auth-user').innerText = currentUser.name;
            document.getElementById('auth-role').innerText = currentUser.role;
            const body = document.body;
            body.classList.remove('mode-sales', 'mode-prod', 'mode-admin');
            if(currentUser.mode === 'sales') { body.classList.add('mode-sales'); switchTab('retail'); }
            else if (currentUser.mode === 'production') { body.classList.add('mode-prod'); switchTab('cost'); }
            else { body.classList.add('mode-admin'); }
        }

        function goBack() { window.location.href = `menu.html?mode=${currentUser.mode}`; }
        function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
        function setSides(n) { document.getElementById('sides').value = n; document.querySelectorAll('.side-btn').forEach(b=>b.classList.remove('selected')); document.getElementById('btn-side-'+n).classList.add('selected'); calculate(); }
        function switchTab(id) { document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+id).classList.add('active'); document.getElementById('btn-'+id).classList.add('active'); }

        window.onload = async function() {
            initSession();
            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");
            try {
                const response = await fetch(`${SCRIPT_URL}?tab=${TAB_NAME}`);
                const data = await response.json();
                if(data.error) throw new Error(data.error);
                backend = data;
                statusText.innerText = "ONLINE";
                statusText.classList.replace("text-gray-400", "text-green-500");
                statusDot.classList.replace("bg-red-500", "bg-green-500");
                statusDot.classList.remove("animate-pulse");
                if(backend.Item_Name) document.getElementById("product-label").innerText = backend.Item_Name;
                calculate();
            } catch(e) { 
                statusText.innerText = "OFFLINE"; statusText.classList.replace("text-gray-400", "text-red-500");
                document.getElementById("error-msg").innerText = e.message; document.getElementById("error-msg").classList.remove("hidden");
            }
        };

        function calculate() {
            if(!backend.Item_Name) return;
            const w = parseFloat(document.getElementById('width').value)||0;
            const h = parseFloat(document.getElementById('height').value)||0;
            const qty = parseFloat(document.getElementById('qty').value)||1;
            const mat = document.getElementById('material').value;
            const cutType = document.getElementById('cut-type').value;
            const lamFinish = document.getElementById('lam-finish').value;
            const sides = parseInt(document.getElementById('sides').value);

            const sqft = (w*h)/144;
            const totalSqFt = sqft * qty;

            // RETAIL
            let baseRate = mat === '6mm' ? 16.50 : 14.00;
            if(backend.Retail_Price_3mm_Base) baseRate = (mat==='6mm' ? backend.Retail_Price_6mm_Base : backend.Retail_Price_3mm_Base);
            if(sides===2) baseRate += 7.00;

            let price = baseRate * totalSqFt;
            if(cutType === 'Contour') price *= 1.35;
            
            if(price < 50) price = 50;

            document.getElementById('unit-price').innerText = "$" + (price/qty).toFixed(2);
            document.getElementById('total-price').innerText = "$" + price.toFixed(2);

            // COST LOGIC (SHEET SELECTION)
            const dim1 = Math.min(w,h);
            const dim2 = Math.max(w,h);
            let selectedSheet = "4x8";
            let sheetCost = parseFloat(backend.Cost_Sheet_3mm || 63.24);
            let valid = true;

            if (dim1 <= 48 && dim2 <= 96) { selectedSheet = "4x8"; }
            else if (dim1 <= 48 && dim2 <= 120) { selectedSheet = "4x10"; sheetCost = parseFloat(backend.Cost_Sheet_4x10 || 90.74); }
            else if (dim1 <= 60 && dim2 <= 120) { selectedSheet = "5x10"; sheetCost = parseFloat(backend.Cost_Sheet_5x10 || 107.76); }
            else { valid = false; document.getElementById('size-warn').classList.remove('hidden'); }

            if(valid) {
                document.getElementById('size-warn').classList.add('hidden');
                document.getElementById('sheet-used').innerText = selectedSheet;
                
                const sheetsNeeded = Math.ceil(totalSqFt / (selectedSheet === "4x8" ? 32 : (selectedSheet === "4x10" ? 40 : 50)));
                const matCost = sheetsNeeded * sheetCost;
                const inkCost = totalSqFt * 0.16;
                const laborCost = 30 + (qty * 5); // Sim
                const totalCost = matCost + inkCost + laborCost;
                
                document.getElementById('cost-total').innerText = "$" + totalCost.toFixed(2);
                const prof = price - totalCost;
                
                const profitWarn = document.getElementById('profit-warn');
                if(prof < 0) { profitWarn.classList.remove('hidden'); profitWarn.classList.add('warn-pulse'); }
                else { profitWarn.classList.add('hidden'); profitWarn.classList.remove('warn-pulse'); }
            }

            // Desc
            const desc = `(x${qty}) ${w}" x ${h}" ${mat} ACM. Direct Print + ${lamFinish} Laminate. ${cutType} Cut. (Req: ${selectedSheet} Sheet).`;
            document.getElementById('job-desc').value = desc;
        }
    </script>
</body>
</html>
