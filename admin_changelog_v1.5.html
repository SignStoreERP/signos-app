<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Activity v1.5 | SignOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signos-core.js"></script>
    <style>
        .timeline-line::before { content: ''; position: absolute; left: 23px; top: 40px; bottom: -20px; width: 2px; background: #e5e7eb; z-index: 0; }
        .timeline-item:last-child .timeline-line::before { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* Smooth transitions for filtering */
        .timeline-item { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col text-slate-800">

    <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md z-30 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 w-8 h-8 rounded flex items-center justify-center font-black text-lg">S</div>
            <div>
                <h1 class="text-lg font-bold tracking-tight leading-none">System Activity Log</h1>
                <div class="text-[10px] text-gray-400 font-mono uppercase">v1.5 • Live Feed</div>
            </div>
        </div>
        <div class="flex gap-4 text-xs font-bold items-center">
            <span class="text-gray-400">USER: <span class="text-white uppercase" id="auth-user">---</span></span>
            <span class="text-gray-600">|</span>
            <a href="#" onclick="goBack()" class="text-gray-300 hover:text-white uppercase transition">Exit to Menu</a>
        </div>
    </div>

    <div class="max-w-5xl mx-auto w-full p-6 flex-1">

        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 mb-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6 border-b border-gray-100 pb-6">
                <div>
                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Total Commits</div>
                    <div class="text-3xl font-black text-slate-800" id="stat-total">0</div>
                </div>
                <div>
                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Last Update</div>
                    <div class="text-sm font-bold text-blue-600 mt-2" id="stat-last">---</div>
                </div>
                <div>
                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Contributors</div>
                    <div class="text-sm font-medium text-slate-600 mt-2 truncate" id="stat-authors">---</div>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4 items-end md:items-center justify-between">
                
                <div class="flex gap-3 flex-1 w-full md:w-auto">
                    <div class="relative flex-1">
                        <input type="text" id="filter-search" onkeyup="applyFilters()" placeholder="Search commits..." 
                            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm font-medium focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <select id="filter-author" onchange="applyFilters()" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold text-slate-700 focus:outline-none focus:border-blue-500 cursor-pointer">
                        <option value="ALL">All Authors</option>
                        </select>
                </div>

                <div class="flex gap-4 items-center flex-wrap">
                    <div class="flex bg-gray-100 rounded-lg p-1">
                        <label class="flex items-center gap-1.5 px-3 py-1.5 rounded-md cursor-pointer select-none transition hover:bg-white">
                            <input type="checkbox" id="check-live" checked onchange="applyFilters()" class="accent-green-500 w-3 h-3">
                            <span class="text-xs font-bold text-green-700">LIVE</span>
                        </label>
                        <label class="flex items-center gap-1.5 px-3 py-1.5 rounded-md cursor-pointer select-none transition hover:bg-white">
                            <input type="checkbox" id="check-dev" checked onchange="applyFilters()" class="accent-orange-500 w-3 h-3">
                            <span class="text-xs font-bold text-orange-700">DEV</span>
                        </label>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="date" id="date-start" onchange="applyFilters()" class="bg-transparent border-b border-gray-300 text-xs font-mono text-gray-500 focus:outline-none focus:border-blue-500 w-24">
                        <span class="text-gray-300 text-xs">to</span>
                        <input type="date" id="date-end" onchange="applyFilters()" class="bg-transparent border-b border-gray-300 text-xs font-mono text-gray-500 focus:outline-none focus:border-blue-500 w-24">
                    </div>
                </div>
            </div>
        </div>

        <div id="feed-container" class="space-y-0 pb-10">
            <div class="text-center py-12">
                <div class="inline-block w-8 h-8 border-4 border-gray-200 border-t-blue-500 rounded-full animate-spin mb-2"></div>
                <p class="text-gray-400 text-xs font-bold uppercase">Syncing with GitHub...</p>
            </div>
        </div>

    </div>

    <script>
        // Global State
        let allLogs = [];
        let uniqueAuthors = [];

        window.onload = function() {
            const u = sessionStorage.getItem('signos_user') || 'Guest';
            document.getElementById('auth-user').innerText = u;
            
            // Set default date range (optional, currently left open)
            loadHistory();
        };

        function goBack() { window.history.back(); }

        // SAFETY VALVE
        function val(obj, key) {
            if (!obj) return "";
            // Enhanced lookup to catch "Env", "Environment", "env", etc.
            return obj[key] || obj[key.toUpperCase()] || obj[key.toLowerCase()] || 
                   obj[key.charAt(0).toUpperCase() + key.slice(1)] || "";
        }

        async function loadHistory() {
            try {
                // Ensure this URL is correct in your config
                const response = await fetch(`${SCRIPT_URL}?req=table&tab=SYS_Changelog&ip=${clientIP}`); 
                const data = await response.json();

                if (!data || data.length === 0) {
                    document.getElementById('feed-container').innerHTML = '<div class="text-center text-gray-400 py-10">No records found.</div>';
                    return;
                }

                // Sort: Newest First
                data.sort((a, b) => new Date(val(b, 'Timestamp')) - new Date(val(a, 'Timestamp')));
                
                // Store globally for filtering
                allLogs = data;

                // --- 1. Stats Logic ---
                document.getElementById('stat-total').innerText = data.length;

                // Extract Authors for Dropdown
                const rawAuthors = data.map(i => val(i, 'Author')).filter(a => a);
                uniqueAuthors = [...new Set(rawAuthors)];
                
                // Populate Author Dropdown
                const authSelect = document.getElementById('filter-author');
                uniqueAuthors.forEach(auth => {
                    const opt = document.createElement('option');
                    opt.value = auth;
                    opt.innerText = auth;
                    authSelect.appendChild(opt);
                });
                
                // Display Authors in Header (Truncated)
                document.getElementById('stat-authors').innerText = uniqueAuthors.join(", ");

                // --- 2. Fix "Invalid Date" Bug ---
                // We use data[0] because the array is sorted Newest First
                const latest = data[0]; 
                if (latest) {
                    const ts = val(latest, 'Timestamp');
                    if (ts) {
                        const d = new Date(ts);
                        const niceDate = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        document.getElementById('stat-last').innerText = niceDate;
                    }
                }

                // Initial Render
                applyFilters();

            } catch (e) {
                document.getElementById('feed-container').innerHTML = `<div class="bg-red-50 text-red-500 p-4 rounded text-center text-xs font-bold border border-red-100">Error loading data: ${e.message}</div>`;
                console.error(e);
            }
        }

        function applyFilters() {
            const search = document.getElementById('filter-search').value.toLowerCase();
            const author = document.getElementById('filter-author').value;
            const showLive = document.getElementById('check-live').checked;
            const showDev = document.getElementById('check-dev').checked;
            const dateStart = document.getElementById('date-start').valueAsDate;
            const dateEnd = document.getElementById('date-end').valueAsDate;

            // Adjust date end to cover the full day
            if (dateEnd) dateEnd.setHours(23, 59, 59, 999);

            const filtered = allLogs.filter(row => {
                const env = val(row, 'Environment') || "DEV"; // Default to DEV if missing
                const msg = val(row, 'Message').toLowerCase();
                const auth = val(row, 'Author');
                const hash = val(row, 'Commit Hash').toLowerCase();
                const ts = new Date(val(row, 'Timestamp'));

                // 1. Environment Toggle
                const isLive = (env === 'LIVE');
                if (isLive && !showLive) return false;
                if (!isLive && !showDev) return false;

                // 2. Author Dropdown
                if (author !== "ALL" && auth !== author) return false;

                // 3. Search Text (Message, Author, or Hash)
                if (search && !msg.includes(search) && !auth.toLowerCase().includes(search) && !hash.includes(search)) return false;

                // 4. Date Range
                if (dateStart && ts < dateStart) return false;
                if (dateEnd && ts > dateEnd) return false;

                return true;
            });

            renderTimeline(filtered);
        }

        function renderTimeline(rows) {
            const container = document.getElementById('feed-container');
            container.innerHTML = "";

            if (rows.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm font-medium bg-white rounded-xl border border-dashed border-gray-300">No commits match your filters.</div>`;
                return;
            }

            rows.forEach(row => {
                // DATA EXTRACTION
                const ts = val(row, 'Timestamp');
                const author = val(row, 'Author');
                const msg = val(row, 'Message');
                const hash = val(row, 'Commit Hash');
                const link = val(row, 'GitHub Link');
                const env = val(row, 'Environment') || "DEV"; // Fallback

                const d = new Date(ts);
                const dateStr = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Badge Logic
                const isLive = env === 'LIVE';
                const badgeColor = isLive ? "bg-green-100 text-green-800 border-green-200" : "bg-orange-100 text-orange-800 border-orange-200";
                const icon = isLive ? "🚀" : "🛠️";
                const borderColor = isLive ? "border-green-500 shadow-green-100" : "border-blue-100";

                // Highlight Ticket IDs (e.g., RMP_OPS_01)
                const fmtMsg = msg.replace(/(RMP_[A-Za-z0-9_]+)/g, '<span class="bg-yellow-100 text-yellow-800 px-1 rounded font-bold border border-yellow-200 text-[10px] ml-1 select-all">$1</span>');

                const item = document.createElement('div');
                item.className = "timeline-item relative pl-12 py-2";

                item.innerHTML = `
                    <div class="timeline-line"></div>

                    <div class="absolute left-0 top-3 w-12 flex justify-center z-10">
                        <div class="w-10 h-10 bg-white border-2 ${borderColor} rounded-full flex items-center justify-center shadow-sm">
                            <span class="text-lg select-none">${icon}</span>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition group">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-black text-gray-900 uppercase tracking-wide">${author}</span>
                                <span class="text-[9px] font-bold px-2 py-0.5 rounded border ${badgeColor}">${env}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] font-bold text-gray-400 block">${dateStr} • ${timeStr}</span>
                            </div>
                        </div>

                        <p class="text-sm text-gray-700 font-medium leading-relaxed">${fmtMsg}</p>

                        <div class="mt-3 flex justify-between items-center border-t border-gray-50 pt-2">
                            <span class="text-[9px] font-mono text-gray-400 bg-gray-50 px-1 rounded select-all">#${hash}</span>
                            ${link ? `<a href="${link}" target="_blank" class="text-[9px] font-bold text-blue-400 hover:text-blue-600 uppercase hover:underline">View Code ↗</a>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
