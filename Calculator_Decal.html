<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decal Calculator v4.2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="signos-core.js"></script>

<!-- UNIFIED DUAL-TRACK LOGIC ENGINE -->
<script src="logic_decal.js"></script>

<style>
.toggle-checkbox:checked { right: 0; border-color: #2563EB; }
.toggle-checkbox:checked + .toggle-label { background-color: #2563EB; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col">

<!-- Main Card: Island Mode -->
<div id="main-card" class="max-w-md mx-auto my-4 sm:my-10 w-[calc(100%-2rem)] sm:w-full bg-white shadow-2xl overflow-hidden rounded-xl border border-gray-200">

<!-- INPUTS -->
<div class="p-6 space-y-4">
<div class="grid grid-cols-3 gap-3">
<div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Qty</label><input type="number" id="qty" value="50" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center" oninput="runCalc()"></div>
<div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Width</label><input type="number" id="w" value="4" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center" oninput="runCalc()"></div>
<div><label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Height</label><input type="number" id="h" value="4" min="1" class="w-full border p-2 rounded font-bold text-gray-800 text-lg text-center" oninput="runCalc()"></div>
</div>

<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Material</label>
<select id="material" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px]" onchange="runCalc()">
<option value="Cal">Standard (IJ35C)</option>
<option value="Cast">Premium (IJ180)</option>
</select>
</div>
<div>
<label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Cutting Method</label>
<select id="shape" class="w-full border p-2 rounded bg-white font-bold text-sm h-[42px]" onchange="runCalc()">
<option value="Square">Square / Hand Cut</option>
<option value="Contour Simple">Kiss Cut (Simple)</option>
<option value="Contour Complex">Kiss Cut (Complex)</option>
</select>
</div>
</div>

<div class="space-y-2 border-t border-gray-100 pt-2">
<div class="grid grid-cols-2 gap-4">
  <div class="flex items-center justify-between p-2 bg-blue-50 border border-blue-200 rounded">
    <span class="text-[10px] font-bold text-blue-900 uppercase">Laminate?</span>
    <div class="relative inline-block w-9 align-middle select-none">
      <input type="checkbox" id="has-lam" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300" checked onchange="runCalc()"/>
      <label for="has-lam" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
    </div>
  </div>
  <div class="flex items-center justify-between p-2 bg-teal-50 border border-teal-200 rounded">
    <span class="text-[10px] font-bold text-teal-900 uppercase">Pre-Mask?</span>
    <div class="relative inline-block w-9 align-middle select-none">
      <input type="checkbox" id="has-mask" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300" onchange="runCalc()"/>
      <label for="has-mask" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
    </div>
  </div>
</div>

<div class="grid grid-cols-2 gap-2 mt-2">
<label class="flex items-center gap-2 text-[10px] font-bold text-gray-700 cursor-pointer bg-gray-50 p-2 rounded border border-gray-200 hover:bg-gray-100 transition"><input type="checkbox" id="setup-per-file" onchange="runCalc()" class="w-4 h-4 text-blue-600 rounded"> Charge Setup/File</label>
<label class="flex items-center gap-2 text-[10px] font-bold text-purple-800 cursor-pointer bg-purple-50 p-2 rounded border border-purple-200 hover:bg-purple-100 transition"><input type="checkbox" id="inc-design" onchange="runCalc()" class="w-4 h-4 text-purple-600 rounded"> Add Design Fee</label>
</div>
<div class="flex items-center gap-2 mt-2"><label class="block text-[10px] font-bold text-gray-400 uppercase">Total Files:</label><input type="number" id="files" value="1" min="1" class="w-16 border rounded p-1 text-center text-sm font-bold" oninput="runCalc()"></div>
</div>
</div>

<!-- RESULTS -->
<div class="bg-white p-6 border-t border-gray-200">
<div class="flex justify-between items-center mb-1">
<span class="text-xs font-bold text-gray-400 uppercase tracking-wide">Base Unit Price</span>
<span class="text-2xl font-bold text-gray-900" id="ui-unit">---</span>
</div>

<!-- DISCOUNT TABLE -->
<div class="mb-4 text-right">
<button onclick="toggleDiscounts()" class="text-[10px] font-bold text-blue-600 hover:text-blue-800 uppercase tracking-wide inline-flex items-center gap-1 ml-auto">
Show Volume Discounts
<svg id="disc-arrow" class="w-3 h-3 transition-transform duration-200 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
</button>
<div id="disc-table" class="hidden mt-2 bg-blue-50 rounded p-2 text-xs border border-blue-100">
<table class="w-full text-right">
<thead class="text-gray-400 text-[9px] uppercase border-b border-blue-200"><tr><th class="pr-4 pb-1">Qty</th><th class="pr-4 pb-1">Base Sign</th><th class="pb-1 text-blue-600">You Pay</th></tr></thead>
<tbody id="tier-rows" class="font-bold text-gray-700"></tbody>
</table>
</div>
</div>

<div class="border-t border-gray-100 my-3"></div>

<!-- LINE ITEMS -->
<div class="space-y-1 text-xs text-gray-600 border-t border-dashed border-gray-200 pt-3">
<div class="flex justify-between"><span>Base Print:</span><span id="ui-print" class="font-bold">$0.00</span></div>
<div class="flex justify-between text-blue-700 hidden" id="row-contour"><span>Contour Cut Adder:</span><span id="ui-contour" class="font-bold">$0.00</span></div>
<div class="flex justify-between text-pink-700 hidden" id="row-weed"><span>Complex Weeding Adder:</span><span id="ui-weed" class="font-bold">$0.00</span></div>
<div class="flex justify-between text-teal-700 hidden" id="row-mask"><span>Pre-Mask Adder:</span><span id="ui-mask" class="font-bold">$0.00</span></div>
<div class="flex justify-between text-gray-700"><span>Job Setup:</span><span id="ui-setup" class="font-bold">$0.00</span></div>
<div class="flex justify-between text-purple-700 hidden" id="row-design"><span>Design Fee:</span><span id="ui-design" class="font-bold">$0.00</span></div>
</div>

<div class="flex justify-between items-end border-t-2 border-gray-800 my-3 pt-2">
<div>
<span class="text-xs font-bold text-gray-400 uppercase block">Total Quote</span>
<span class="text-[9px] font-bold text-gray-400 uppercase block mt-1" id="ui-min-text">Shop Minimum: $35</span>
<div id="min-badge" class="hidden bg-red-100 text-red-600 text-[9px] font-bold px-1 rounded inline-block mt-1">MINIMUM APPLIED</div>
</div>
<span class="text-3xl font-black text-blue-600" id="ui-total">---</span>
</div>
</div>

<!-- DESCRIPTION GENERATOR -->
<div class="bg-gray-50 p-4 border-t border-gray-200">
<label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Job Description</label>
<textarea id="job-desc" class="w-full text-xs p-2 border rounded bg-white h-16 text-gray-600 font-mono outline-none" readonly></textarea>
</div>
</div>

<script>
let backendData = {};

window.onload = async function() {
  injectHeader("Decals & Stickers");
  
  const u = sessionStorage.getItem('signos_user') || 'Guest';
  const r = sessionStorage.getItem('signos_role') || 'VIEW';

  try {
    const res = await fetch(`${SCRIPT_URL}?tab=PROD_Decals&ip=${clientIP}&user=${u}&role=${r}&req=view_module`);
    const data = await res.json();
    
    if(data.error) throw new Error(data.error);
    backendData = data;
    
    runCalc();
    
  } catch(e) {
    console.error("Backend fetch failed:", e);
  }
};

function toggleDiscounts() {
  const table = document.getElementById('disc-table');
  const arrow = document.getElementById('disc-arrow');
  table.classList.toggle('hidden');
  if (table.classList.contains('hidden')) arrow.classList.add('rotate-90');
  else arrow.classList.remove('rotate-90');
}

function runCalc() {
  if(!backendData.Item_Name) return;

  const inputs = {
    qty: parseFloat(document.getElementById('qty').value) || 1,
    w: parseFloat(document.getElementById('w').value) || 4,
    h: parseFloat(document.getElementById('h').value) || 4,
    material: document.getElementById('material').value,
    shape: document.getElementById('shape').value,
    lam: document.getElementById('has-lam').checked,
    mask: document.getElementById('has-mask').checked,
    files: parseFloat(document.getElementById('files').value) || 1,
    setupPerFile: document.getElementById('setup-per-file').checked,
    incDesign: document.getElementById('inc-design').checked
  };

  const result = calculateDecal(inputs, backendData);
  const ret = result.retail;
  const fmt = (n) => "$" + n.toFixed(2);

  document.getElementById('ui-unit').innerText = fmt(ret.unitPrice);
  document.getElementById('ui-total').innerText = fmt(ret.grandTotal);
  document.getElementById('ui-print').innerText = fmt(ret.printTotal);

  if (ret.contourFee > 0) { document.getElementById('row-contour').classList.remove('hidden'); document.getElementById('ui-contour').innerText = fmt(ret.contourFee); }
  else document.getElementById('row-contour').classList.add('hidden');

  if (ret.weedFee > 0) { document.getElementById('row-weed').classList.remove('hidden'); document.getElementById('ui-weed').innerText = fmt(ret.weedFee); }
  else document.getElementById('row-weed').classList.add('hidden');

  if (ret.maskFee > 0) { document.getElementById('row-mask').classList.remove('hidden'); document.getElementById('ui-mask').innerText = fmt(ret.maskFee); }
  else document.getElementById('row-mask').classList.add('hidden');

  document.getElementById('ui-setup').innerText = fmt(ret.setupFee || 0);
  if (ret.designFee > 0) { document.getElementById('row-design').classList.remove('hidden'); document.getElementById('ui-design').innerText = fmt(ret.designFee); }
  else document.getElementById('row-design').classList.add('hidden');

  const minOrder = parseFloat(backendData.Retail_Min_Order || 35);
  document.getElementById('ui-min-text').innerText = `Shop Minimum: $${minOrder}`;
  document.getElementById('min-badge').classList.toggle('hidden', !ret.isMinApplied);

  let rowsHtml = "";
  ret.tiers.forEach(tier => {
      const trPct = (ret.printTotal / ((inputs.w * inputs.h / 144) * inputs.qty) - tier.base) / (ret.printTotal / ((inputs.w * inputs.h / 144) * inputs.qty));
      const pctDisplay = trPct > 0 ? `<span class="text-[9px] bg-green-100 text-green-700 px-1 rounded ml-1">-${(trPct*100).toFixed(0)}%</span>` : "";
      rowsHtml += `<tr><td class="pr-4 py-1 text-gray-500">${tier.q}+ ${pctDisplay}</td><td class="pr-4 py-1 text-gray-400">$${(ret.printTotal/inputs.qty).toFixed(2)}</td><td class="py-1 text-blue-600 font-bold">$${tier.unit.toFixed(2)}</td></tr>`;
  });
  document.getElementById('tier-rows').innerHTML = rowsHtml;

  const desc = `(x${inputs.qty}) ${inputs.w}" x ${inputs.h}" Custom Decals. Material: ${inputs.material === 'Cast' ? '3M Cast Air Release' : 'Standard Calendered'}. Cut: ${inputs.shape}. ${inputs.lam ? 'Laminated.' : ''} ${inputs.mask ? 'Pre-Mask Applied.' : ''}`;
  document.getElementById('job-desc').value = desc;
}
</script>
</body>
</html>
